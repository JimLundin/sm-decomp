[package]
name = "game"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Session, its State and the Tick: every gameplay domain"

[dependencies]
canonical = { path = "../canonical" }
clean_model_blocks = { path = "../clean_model/blocks" }
clean_model_camera = { path = "../clean_model/camera" }
clean_model_hud = { path = "../clean_model/hud" }
clean_model_progress = { path = "../clean_model/progress" }
clean_model_samus_looks = { path = "../clean_model/samus-looks" }
clean_model_samus_motion = { path = "../clean_model/samus-motion" }
clean_types = { path = "../clean_types" }
data = { path = "../data" }
enum-map = "=3.1.0"

[lints]
workspace = true

[dev-dependencies]
toml = { version = "0.8", default-features = false, features = ["parse"] }
