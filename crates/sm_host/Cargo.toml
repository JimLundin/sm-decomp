[package]
name = "sm_host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The engine host with no CPU emulator: the Session's lease, its display and sound devices"

[dependencies]
sm_data = { path = "../sm_data" }
sm_runtime = { path = "../sm_runtime" }
sm_game = { path = "../sm_game" }

[lints.rust]
warnings = { level = "allow", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sm_verify_dll)", "cfg(sm_source_inventory)", "cfg(sm_host)"] }
