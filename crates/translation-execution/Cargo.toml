[package]
name = "translation-execution"
description = "Deterministic, bounded Translation scope execution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
libc = "0.2"
reqwest = { version = "=0.12.12", default-features = false, features = ["blocking", "rustls-tls"] }

[[bin]]
name = "sm-translation-sandbox"
path = "src/bin/sandbox_helper.rs"

[[bin]]
name = "sm-translation-recorded-rewrite"
path = "src/bin/recorded_rewrite.rs"
