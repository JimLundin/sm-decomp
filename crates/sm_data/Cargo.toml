[package]
name = "sm_data"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Super Metroid content: validated definitions imported from prepared data or the original ROM"

# Content records only: no dependencies on sm, sm_game, the backend or devices.
[dependencies]

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
# Expression and signature shapes kept from the original C routines.
precedence = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
# `[(); N][index];` deliberately reproduces the original's bounds-failure order.
no_effect = "allow"
unnecessary_operation = "allow"
