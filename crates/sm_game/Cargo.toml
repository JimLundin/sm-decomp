[package]
name = "sm_game"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Super Metroid gameplay: owned, deterministic rules with no emulator, RAM or device access"

# No dependencies on the sm crate, its backend, native code or devices.
# CI checks that this package's dependency tree stays empty except sm_data.
[dependencies]
sm_data = { path = "../sm_data" }

[features]
# Mirrors sm's frontend feature: checkpoint layout descriptions for the save UI.
frontend = []

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
# Verifier builds of sm pass the same configuration to this package.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sm_verify_dll)"] }

[lints.clippy]
# Complex types still mirror the original routines.
type_complexity = "allow"
