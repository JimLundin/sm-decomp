[package]
name = "sm_game"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Super Metroid gameplay: owned, deterministic rules with no emulator, RAM or device access"

# No dependencies on the sm crate, its backend, native code or devices.
# CI checks that this package's dependency tree stays empty except sm_data.
[dependencies]
sm_data = { path = "../sm_data" }

[features]
# Mirrors sm's frontend feature: checkpoint layout descriptions for the save UI.
frontend = []

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
# Verifier builds of sm pass the same configuration to this package.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sm_verify_dll)"] }

[lints.clippy]
# Expression and signature shapes kept from the original C routines.
precedence = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
# `[(); N][index];` deliberately reproduces the original's bounds-failure order.
no_effect = "allow"
unnecessary_operation = "allow"
# Fixed-size tables indexed alongside RAM offsets read more plainly as index loops.
needless_range_loop = "allow"
