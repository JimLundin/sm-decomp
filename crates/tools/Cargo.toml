[package]
name = "tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Commands for indexed production replay, record caches and project reports"

[features]
default = ["engine-cli"]
engine-cli = ["dep:runtime", "dep:verify", "dep:serde", "dep:toml"]

[[bin]]
name = "tools"
path = "src/main.rs"
required-features = ["engine-cli"]

[dependencies]
runtime = { path = "../runtime", optional = true }
verify = { path = "../verify", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
toml = { version = "=1.2.1", optional = true }

[lints]
workspace = true
