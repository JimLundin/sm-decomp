[package]
name = "tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Commands for indexed production replay, record caches and project reports"

[features]
default = ["engine-cli"]
engine-cli = ["dep:runtime", "dep:verify", "dep:oracle", "dep:rustc-demangle"]

[[bin]]
name = "tools"
path = "src/main.rs"
required-features = ["engine-cli"]

[dependencies]
runtime = { path = "../runtime", optional = true }
verify = { path = "../verify", optional = true }
oracle = { path = "../oracle", optional = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
rustc-demangle = { workspace = true, optional = true }

[lints]
workspace = true
