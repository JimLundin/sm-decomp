[package]
name = "oracle"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The oracle harness: the unmodified ROM on an emulator, recorded per video frame"

# The digest is the only shared code (`data::digest`): no dependency on the old engine (git tag `archive/old-engine`).
[dependencies]
data = { path = "../data" }
oracle_record = { path = "../oracle_record" }

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"
test = false

[lints.rust]
warnings = { level = "deny", priority = -1 }
