[package]
name = "oracle"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The oracle harness: the unmodified ROM on an emulator, recorded per video frame"

# The digest is the only shared code: no dependency on sm, sm_host or sm_game.
[dependencies]
sm_data = { path = "../sm_data" }

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"
test = false

[lints.rust]
warnings = { level = "deny", priority = -1 }
