[package]
name = "oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The oracle harness: the unmodified ROM on an emulator, recorded per video frame"

# The digest is the only shared code (`data::digest`): no dependency on the old engine (commit `09486a2fd`).
[dependencies]
data = { path = "../data" }
oracle_record = { path = "../oracle_record" }

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"
test = false

[lints.rust]
warnings = { level = "deny", priority = -1 }
