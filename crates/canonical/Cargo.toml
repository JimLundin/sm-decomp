[package]
name = "canonical"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Canonical derive: one encode, decode and diff for every State type (K6)"

[lib]
proc-macro = true

# Deliberately none: see the crate docs.
[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
