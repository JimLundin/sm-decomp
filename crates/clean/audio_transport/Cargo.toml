[package]
name = "audio_transport"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The audio-transport model, built from its behaviour spec"

[dependencies]
num-bigint = { version = "=0.4.6", features = ["serde"] }
num-rational = { version = "=0.4.2", features = ["serde"] }
num-traits = "=0.2.19"
types = { path = "../types" }
enum-map = "=3.1.0"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"

[lints]
workspace = true
