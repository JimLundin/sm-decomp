# Clean crates and isolated exports use these test allowances and structural limits.
# Tests may unwrap, expect, panic and index (the project's testing principle). These only loosen
# lints that the new crates deny through [workspace.lints].
allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
# G5: the clean room's ceilings, stated as coding rules in docs/cleanroom/DESIGN.md. At most one
# bool parameter (fn_params_excessive_bools, pedantic): a second flag wants an enum. A block
# nested 5 deep is refused (excessive_nesting, denied in [workspace.lints]; off where no threshold
# is set). Cognitive complexity at most 15 (cognitive_complexity, nursery). The argument count
# stays at clippy's 7: a lower one would make a struct of the arguments a compliance tool.
max-fn-params-bools = 1
excessive-nesting-threshold = 5
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 7

# The clean room's capability rule (MODEL §5): a model computes, and reaches nothing outside its
# own process. Files, the network, other processes, the environment and the terminal are
# refused here by path, as the compiler resolves it, so a renamed import or a macro reaches no
# further; the workspace forbids these three lints, so no attribute lifts them.
disallowed-types = [
  { path = "std::fs::File", reason = "a model reads no files" },
  { path = "std::fs::OpenOptions", reason = "a model reads no files" },
  { path = "std::fs::DirBuilder", reason = "a model reads no files" },
  { path = "std::fs::ReadDir", reason = "a model reads no files" },
  { path = "std::fs::DirEntry", reason = "a model reads no files" },
  { path = "std::net::TcpStream", reason = "a model uses no network" },
  { path = "std::net::TcpListener", reason = "a model uses no network" },
  { path = "std::net::UdpSocket", reason = "a model uses no network" },
  { path = "std::os::unix::net::UnixStream", reason = "a model uses no socket" },
  { path = "std::os::unix::net::UnixListener", reason = "a model uses no socket" },
  { path = "std::os::unix::net::UnixDatagram", reason = "a model uses no socket" },
  { path = "std::os::fd::FromRawFd", reason = "a model opens no descriptor" },
  { path = "std::process::Command", reason = "a model starts no process" },
  { path = "std::process::Child", reason = "a model starts no process" },
  { path = "std::process::Stdio", reason = "a model starts no process" },
  { path = "std::env::Args", reason = "a model reads no environment" },
  { path = "std::env::ArgsOs", reason = "a model reads no environment" },
  { path = "std::env::Vars", reason = "a model reads no environment" },
  { path = "std::env::VarsOs", reason = "a model reads no environment" },
  { path = "std::io::Stdin", reason = "a model reads no terminal" },
  { path = "std::io::Stdout", reason = "a model writes no terminal" },
  { path = "std::io::Stderr", reason = "a model writes no terminal" },
]
