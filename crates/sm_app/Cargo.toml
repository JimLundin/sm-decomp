[package]
name = "sm_app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Super Metroid desktop application: window, input, configuration and the run loop"
autobins = false

# The desktop binary keeps its name and command line. Its shared replay checks
# (sm/src/verify.rs) need the verifier build's `sm_verify_dll` cfg, so they run
# through tools/verify_dll.py, not as cargo tests or benches.
[[bin]]
name = "sm"
path = "src/main.rs"
required-features = ["frontend"]
test = false
bench = false

[features]
default = ["frontend"]
frontend = ["dep:sm", "dep:gl", "dep:sdl2-sys"]
slice = ["dep:sm_host", "dep:sdl2-sys"]

# The Gate 1 slice: one window, one sound device, no compatibility runtime.
[[bin]]
name = "sm_slice"
path = "src/slice/main.rs"
required-features = ["slice"]

# The compatibility runtime stays a dependency until it is replaced.
[dependencies]
sm = { path = "../../sm", features = ["frontend"], optional = true }
sm_host = { path = "../sm_host", optional = true }
sm_game = { path = "../sm_game" }
sm_runtime = { path = "../sm_runtime" }
sm_data = { path = "../sm_data" }
gl = { version = "0.14.0", optional = true }
sdl2-sys = { version = "0.38.0", optional = true }

[lints.rust]
warnings = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sm_verify_dll)"] }
