decimal_states = [
    false,
    true,
]
exclusions = [
    "emulation execution: compiled domain is native",
    "inactive pin-level outputs: abstract corpus bus exposes active accesses and total cycles only",
    "ADC: known overflow failures block support",
]
execution_modes = ["native"]
hardware_conditions = [
    "6/8/12 access clocks",
    "IRQ old-I and NMI phase",
    "DMA/HDMA pending pause",
    "refresh",
    "frame/input rollover and resume",
]
schema_version = 2
timing_oracles = [
    "crates/snes/tests/hdma_oracle.csv",
    "crates/snes/tests/irq_mask_timing.rs",
    "crates/snes/tests/interrupt_timing.rs",
    "crates/snes/tests/dma_timing.rs",
]
timing_sources = [
    "https://wiki.superfamicom.org/timing",
    "Original rr2-beta23 / bsnes085Compatibility black-box fixtures",
]
timing_tests = [
    "integration",
    "irq_mask_timing",
    "interrupt_timing",
    "dma_timing",
    "hdma_timing",
    "generated_bus_timing",
]

[[patterns]]
addressing = "immediate M width"
corpus = "a9.n.json"
inapplicable = [
    "decimal ALU: this pattern performs no arithmetic",
    "branch/direct-page/indexed penalties: this addressing mode has none",
    "control/stack substitution: this pattern performs no control or stack operation",
]
independent_fixtures = [
    "boundary LDA8 preserves A high across FFFF",
    "boundary LDA16 wraps operand bank at FFFE",
]
mnemonic = "LDA"
mode = "ImmM"
mx = [
    0,
    1,
    2,
    3,
]
opcode = "a9"
required_conditions = [
    "native-mx-0",
    "native-mx-1",
    "native-mx-2",
    "native-mx-3",
    "binary",
    "decimal",
    "program-bank-wrap",
    "accumulator-high-preservation",
]
timing_branches = [
    "m8",
    "m16",
]

