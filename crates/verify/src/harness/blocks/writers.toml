# The other parts' cell writers: every PLM of bank $84 outside the blocks that writes a cell other
# than its own, with the cells it writes, the single source of the blocks harness's masks
# (docs/behaviours/world-blocks.decode.md, "The other parts' cell writers", says how it was read). Every
# other PLM, the items' included, writes only its own cell, or none.
#
# Each writer:
# - `plms`: its PLM header ids (`$1C37,x`);
# - `cells`: what it writes from its own cell (`$1C87,x`) at that frame, x rightward and y
#   downward, negative offsets allowed: a point `[dx, dy]`, or a box `{ x = [from, to], y = [from,
#   to] }`, both ends included;
# - `reached`: what the 44 cached rows do with it: `writes` (a cell of its reach other than its
#   own changes while it is live), `live` (a row holds it, but no other cell of its reach changes
#   there) or `no`;
# - `left_out`: for a writer whose cells aren't all relative to a cell it keeps, why:
#   `room-absolute` (it writes a cell of the room wherever it sits), `moves` (it moves between its
#   draws) or `frees-its-slot` (its setup writes and frees its slot in one call, so no record
#   shows it). The harness masks only its own cell, so a cell it writes past that fails loudly as
#   a mismatch; no cached row reaches one, and the harness refuses a table where one `writes`.
#
# Each comment gives the writer, the notes' account of its cells, and the rows that hold it.

