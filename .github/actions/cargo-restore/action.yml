name: Restore the cargo build
description: >-
  Installs the repository toolchain and restores the cargo registry and a build cache family,
  then dates the sources so Cargo rebuilds only what changed since the build's recorded commit.
  Scheduled and dispatched main runs with no single target stay cold, so the build they save is clean.
inputs:
  cache:
    description: The cache family, which the job's cargo-save names too
    required: true
  path:
    description: The build folder the family holds
    default: target
runs:
  using: composite
  steps:
    - name: Install the repository toolchain
      shell: bash
      run: rustup toolchain install
    - name: Restore the cargo registry and the build
      if: github.ref != 'refs/heads/main' || github.event_name == 'push' || github.event.inputs.target
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.path }}
        key: cargo-${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
          cargo-${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
    - name: Date the sources the restored build compiled
      if: steps.cache.outputs.cache-matched-key != ''
      shell: bash
      run: python3 tools/ci/mtimes.py restore
