name: Mutations

# Builds each deliberately broken variant of the detached cores and requires
# the named check to kill it: projectile, room mechanism, visual, sprite,
# flag, actor contract and collision contract suites
# (sm/src/verification/player_detached/mutations.py). A surviving mutant, a
# compile error or an unrelated panic fails the run. Pull requests only check
# that every mutation anchor still exists (ci.yml); the mutants themselves run
# nightly and on demand. Each mutant rebuilds sm_game and the harness, so a
# full run is expected to take hours (the job logs it): too slow to gate
# pull requests until measured.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.passed.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: passed
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: mutations.yml
        run: python3 .github/scripts/already_passed.py

  mutations:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository toolchain
        run: rustup show
      - name: Kill every detached-core mutant
        # Each fault is built in its own copy; the baseline must pass first.
        run: |
          started=$SECONDS
          python3 sm/src/verification/player_detached/mutations.py
          echo "mutation run took $(( (SECONDS - started) / 60 )) minutes"
      - name: Kill every Session mapping mutant
        # Each perturbed RAM mapping must fail its named sm_game unit test.
        run: |
          started=$SECONDS
          python3 sm/src/verification/session_mutations.py
          echo "session mutation run took $(( (SECONDS - started) / 60 )) minutes"
