name: Profile trial
# Throwaway (#244): where the engine's tick time goes now. Prints symbol names and times only.
on:
  push:
    branches: ['profile/**']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      RUSTFLAGS: '-D warnings -C force-frame-pointers=yes'
      ROWS: chain-any-0012-91F8 chain-any-0063-A59F chain-any-0097-B32E
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-native
      - run: python3 tools/verify_dll.py --build-only --direct
      - uses: actions/checkout@v4
        with:
          repository: JimLundin/ci-data
          ssh-key: ${{ secrets.SM_ROM_DEPLOY_KEY }}
          path: .ci-data
          persist-credentials: false
      - name: Decrypt the ROM and restore the route
        env:
          SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
          FULL_ROUTE: any
        run: |
          mkdir -p rom
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SM_ROM_KEY -in .ci-data/payload.enc -out rom/sm.smc
          echo "da957f0d63d14cb441d215462904c4fa8519c613  rom/sm.smc" | sha1sum --check
          rm -rf .ci-data
          row=chain-any-0063-A59F
          asset=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import pathlib, scenario; print(scenario.read_lock(pathlib.Path('.')).pins['$row']['bundle'])")
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/JimLundin/sm-decomp/releases/download/ci-data/$asset"
          python3 -B .github/scripts/full_route.py restore "$RUNNER_TEMP/$asset" >/dev/null
      - name: Install perf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" >/dev/null || true
          sudo sysctl kernel.perf_event_paranoid=1
          sudo sysctl kernel.kptr_restrict=0
          perf --version
      - name: Time and profile
        run: |
          for row in $ROWS; do
            start=$(date +%s.%N)
            perf record -F 499 -g -o "$RUNNER_TEMP/$row.data" -- python3 tools/verify_dll.py rom/sm.smc --corpus scenarios --no-build --direct --segment "$row" --mode check-lock --lock scenarios/lock.toml > "$RUNNER_TEMP/$row.log" 2>&1 || echo "exit $?"
            secs=$(echo "$(date +%s.%N) - $start" | bc)
            echo "=== $row seconds=$secs $(grep -E 'lock matches|lease counters|^FAIL' "$RUNNER_TEMP/$row.log" | cut -c1-140 | tr '\n' ' ')"
            echo "--- self"
            perf report -i "$RUNNER_TEMP/$row.data" --stdio --no-children --sort symbol -g none --percent-limit 0.7 2>/dev/null | grep -vE '^#|^$' | cut -c1-110 | head -30
            echo "--- inclusive"
            perf report -i "$RUNNER_TEMP/$row.data" --stdio --children --sort symbol -g none --percent-limit 4 2>/dev/null | grep -vE '^#|^$' | cut -c1-110 | head -45
          done
