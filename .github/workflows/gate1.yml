name: Gate 1 slice
# The Morph room slice with no CPU emulator: the oracle-side importer prepares
# the start, the headless replay runs from it, and its digests meet the oracle lock.
on:
  push:
    branches: ['gate1/**']
permissions:
  contents: read
jobs:
  absent:
    # The slice builds with the sm/ directory deleted: no ROM, no native toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository toolchain and SDL
        run: |
          rustup toolchain install
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libsdl2-dev
          cargo fetch --locked
      - name: Build sm_replay and sm_slice without sm/
        run: bash .github/scripts/gate1_absent.sh "$RUNNER_TEMP/sm-absent"
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      # The Morph room row first, then every locked corpus row, split over the shards.
      ROWS: item-morph-ball all
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-native
      - name: Build the importer and the replay
        run: |
          python3 tools/verify_dll.py --build-only --direct
          # The replay links nothing the native toolchain built.
          env -u LIBRARY_PATH cargo build --locked --release -p sm_tools --features replay --bin sm_replay
          # A record of the edge: the replay may not reach sm.
          ! cargo tree --locked -p sm_tools --features replay -e normal | grep -E '^[^a-z]*sm v'
      - name: Build the windowed slice
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libsdl2-dev xvfb xauth
          env -u LIBRARY_PATH cargo build --locked --release -p sm_app --no-default-features --features slice --bin sm_slice
          ldd target/release/sm_slice | grep -E 'libSDL2'
          # The windowed slice may not reach sm either.
          ! cargo tree --locked -p sm_app --no-default-features --features slice -e normal | grep -E '^[^a-z]*sm v'
      - uses: actions/checkout@v4
        with:
          repository: JimLundin/ci-data
          ssh-key: ${{ secrets.SM_ROM_DEPLOY_KEY }}
          path: .ci-data
          persist-credentials: false
      - name: Decrypt the ROM
        env:
          SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
        run: |
          mkdir -p rom
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SM_ROM_KEY -in .ci-data/payload.enc -out rom/sm.smc
          echo "da957f0d63d14cb441d215462904c4fa8519c613  rom/sm.smc" | sha1sum --check
          rm -rf .ci-data
      - name: The slice against the oracle
        run: >-
          python3 tools/gate1.py --shard ${{ matrix.shard }}/8
          --slice item-morph-ball --slice door-transition --slice save-memory $ROWS
