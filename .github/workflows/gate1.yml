name: Gate 1 slice
# The Morph room slice with no CPU emulator: the oracle-side importer prepares
# the start, the headless replay runs from it, and its digests meet the oracle lock.
on:
  push:
    branches: ['gate1/**']
permissions:
  contents: read
jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      ROW: item-morph-ball
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-native
      - name: Build the importer and the replay
        run: |
          python3 tools/verify_dll.py --build-only --direct
          # The replay links nothing the native toolchain built.
          env -u LIBRARY_PATH cargo build --locked --release -p sm_tools --features replay --bin sm_replay
      - uses: actions/checkout@v4
        with:
          repository: JimLundin/ci-data
          ssh-key: ${{ secrets.SM_ROM_DEPLOY_KEY }}
          path: .ci-data
          persist-credentials: false
      - name: Decrypt the ROM and restore the row's bundle
        env:
          SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
        run: |
          mkdir -p rom
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SM_ROM_KEY -in .ci-data/payload.enc -out rom/sm.smc
          echo "da957f0d63d14cb441d215462904c4fa8519c613  rom/sm.smc" | sha1sum --check
          rm -rf .ci-data
          asset=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import pathlib, scenario; print(scenario.read_lock(pathlib.Path('.')).pins['$ROW']['bundle'])")
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/JimLundin/sm-decomp/releases/download/ci-data/$asset"
          sha=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import pathlib, scenario; print(scenario.read_lock(pathlib.Path('.')).bundles['$asset'])")
          python3 tools/ci_seed_data.py restore "$RUNNER_TEMP/$asset" --sha256 "$sha" --runtime-only --segment "$ROW" >/dev/null
      - name: The row still meets its lock through the verifier
        run: python3 tools/verify_dll.py rom/sm.smc --corpus scenarios --no-build --direct --segment "$ROW" --mode check-lock --lock scenarios/lock.toml
      - name: Prepare the start with the oracle-side importer
        run: |
          code=0
          SM_EXPORT_START="$RUNNER_TEMP/start.bin" python3 tools/verify_dll.py rom/sm.smc --corpus scenarios --no-build --direct --segment "$ROW" --mode check-lock --lock scenarios/lock.toml >/dev/null 2>&1 || code=$?
          ls -la "$RUNNER_TEMP/start.bin"
      - name: Replay the slice headless and meet the oracle lock
        run: |
          inputs=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import pathlib, scenario; print(scenario.read_lock(pathlib.Path('.')).pins['$ROW']['inputs'])")
          target/release/sm_replay rom/sm.smc "$RUNNER_TEMP/start.bin" "movies/$inputs" 1200 "$RUNNER_TEMP/entry.toml"
          python3 tools/gate1_check.py "$ROW" "$RUNNER_TEMP/entry.toml"
