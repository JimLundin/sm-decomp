name: Corpus replay

# Runs the corpus scenarios (every scenario but the route rooms)
# against the oracle on hosted Windows runners.
# The ROM comes from repository secrets; ROM-derived files (inputs, checkpoints)
# stay private; the seed release asset is encrypted with a ROM-derived key.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      segments:
        description: Space-separated row ids (empty = full corpus / review waypoint)
        required: false
        default: ''
      oracle:
        description: Oracle ROM (patched = snesrev compatibility patches, faithful = original game logic)
        type: choice
        options: [patched, faithful]
        default: patched
      audio_trace:
        description: Check each row's ordered Cue/port trace against the physical-audio oracle
        type: boolean
        default: false
      oracle_sample:
        description: Also re-record a rotating sample of at least 30 faithful locks and fail on drift
        type: boolean
        default: false

permissions:
  contents: read

# Finish the running corpus; retain the newest queued request.
concurrency:
  group: corpus-replay-${{ github.ref }}-${{ inputs.oracle || 'patched' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      movie_file: ${{ steps.plan.outputs.movie_file }}
      movie_sha256: ${{ steps.plan.outputs.movie_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          SELECTED: ${{ github.event.inputs.segments }}
          ORACLE_SAMPLE: ${{ (github.event_name == 'schedule' || inputs.oracle_sample) && '1' || '' }}
        run: |
          python3 .github/scripts/plan_corpus.py

  build:
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-native
      - name: Reuse a verifier built from the same sources
        # verify_dll.py still rebuilds unless the DLL's stamp matches these sources,
        # the compiler and its options; the native archives count by their sources.
        uses: actions/cache@v4
        with:
          path: target/verify-dll
          key: verifier-direct-${{ hashFiles('crates/**', 'sm/**', 'Cargo.lock', 'rust-toolchain.toml', 'tools/verify_dll.py', 'tools/install_lakesnes.py', 'tools/install_native_*.py', '.github/actions/windows-native/action.yml') }}
      - name: Build the verifier DLL (direct, as the local Fast loop does)
        env:
          # Every native archive is rebuilt here from these pinned sources.
          SM_NATIVE_IDENTITY: ${{ hashFiles('crates/**', 'sm/**', 'tools/install_lakesnes.py', 'tools/install_native_*.py', '.github/actions/windows-native/action.yml') }}
        run: |
          python tools/verify_dll.py --build-only --direct
          if ($LASTEXITCODE -ne 0) { throw 'Verifier DLL build failed' }
          New-Item -ItemType Directory -Force -Path verifier | Out-Null
          Copy-Item target/verify-dll/sm_verify.dll verifier/
          Copy-Item -Recurse (Split-Path -Parent $env:LIBRARY_PATH) verifier/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: verifier
          path: verifier
          retention-days: 1

  segments:
    needs: [plan, build]
    runs-on: windows-2022
    env:
      SM_ORACLE: ${{ inputs.oracle || 'patched' }}
      AUDIO_TRACE: ${{ inputs.audio_trace && '1' || '' }}
    timeout-minutes: ${{ (inputs.audio_trace || matrix.record_oracle) && 125 || (matrix.kind == 'checkpoint' && 65 || 120) }}
    strategy:
      fail-fast: false
      # The route and the corpus at eight each, with PR CI's four jobs, fill the
      # account's twenty hosted runners when a batch lands.
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: verifier
          path: verifier
      - name: Place the verifier
        run: |
          New-Item -ItemType Directory -Force -Path target/verify-dll | Out-Null
          Copy-Item verifier/sm_verify.dll target/verify-dll/
          "LIBRARY_PATH=$((Resolve-Path verifier/sdk/lib).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cache the pinned movie download
        if: matrix.kind == 'route'
        uses: actions/cache@v4
        with:
          path: movies/${{ needs.plan.outputs.movie_file }}
          key: ${{ runner.os }}-movie-${{ needs.plan.outputs.movie_sha256 }}
      - name: Prepare ROM and selected corpus inputs
        env:
          KIND: ${{ matrix.kind }}
          SEED_ASSET: ${{ matrix.seed_asset }}
          SEED_SHA256: ${{ matrix.seed_sha256 }}
          SEGMENTS: ${{ matrix.segments }}
          ROUTE: ${{ matrix.route }}
          INPUTS: ${{ matrix.inputs }}
          ROM_00: ${{ secrets.SM_ROM_00 }}
          ROM_01: ${{ secrets.SM_ROM_01 }}
          ROM_02: ${{ secrets.SM_ROM_02 }}
          ROM_03: ${{ secrets.SM_ROM_03 }}
          ROM_04: ${{ secrets.SM_ROM_04 }}
          ROM_05: ${{ secrets.SM_ROM_05 }}
          ROM_06: ${{ secrets.SM_ROM_06 }}
          ROM_07: ${{ secrets.SM_ROM_07 }}
          ROM_08: ${{ secrets.SM_ROM_08 }}
          ROM_09: ${{ secrets.SM_ROM_09 }}
          ROM_10: ${{ secrets.SM_ROM_10 }}
          ROM_11: ${{ secrets.SM_ROM_11 }}
          ROM_12: ${{ secrets.SM_ROM_12 }}
          ROM_13: ${{ secrets.SM_ROM_13 }}
          ROM_14: ${{ secrets.SM_ROM_14 }}
          ROM_15: ${{ secrets.SM_ROM_15 }}
          ROM_16: ${{ secrets.SM_ROM_16 }}
          ROM_17: ${{ secrets.SM_ROM_17 }}
          ROM_18: ${{ secrets.SM_ROM_18 }}
          ROM_19: ${{ secrets.SM_ROM_19 }}
          ROM_20: ${{ secrets.SM_ROM_20 }}
          ROM_21: ${{ secrets.SM_ROM_21 }}
          ROM_22: ${{ secrets.SM_ROM_22 }}
          ROM_23: ${{ secrets.SM_ROM_23 }}
          ROM_24: ${{ secrets.SM_ROM_24 }}
          ROM_25: ${{ secrets.SM_ROM_25 }}
          ROM_26: ${{ secrets.SM_ROM_26 }}
          ROM_27: ${{ secrets.SM_ROM_27 }}
          ROM_28: ${{ secrets.SM_ROM_28 }}
          ROM_29: ${{ secrets.SM_ROM_29 }}
          ROM_30: ${{ secrets.SM_ROM_30 }}
          ROM_31: ${{ secrets.SM_ROM_31 }}
          ROM_32: ${{ secrets.SM_ROM_32 }}
          ROM_33: ${{ secrets.SM_ROM_33 }}
          ROM_34: ${{ secrets.SM_ROM_34 }}
          ROM_35: ${{ secrets.SM_ROM_35 }}
          ROM_36: ${{ secrets.SM_ROM_36 }}
          ROM_37: ${{ secrets.SM_ROM_37 }}
          ROM_38: ${{ secrets.SM_ROM_38 }}
          ROM_39: ${{ secrets.SM_ROM_39 }}
          ROM_40: ${{ secrets.SM_ROM_40 }}
          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
          ROM_44: ${{ secrets.SM_ROM_44 }}
        run: |
          python -B .github/scripts/prepare_corpus_inputs.py
          if ($LASTEXITCODE -ne 0) { throw 'Input preparation failed' }
      - name: Run rows
        if: '!matrix.record_oracle'
        timeout-minutes: ${{ inputs.audio_trace && 120 || (matrix.kind == 'checkpoint' && 60 || 120) }}
        env:
          SEGMENTS: ${{ matrix.segments }}
        run: |
          $rows = @()
          foreach ($id in $env:SEGMENTS.Split(' ')) { $rows += @('--segment', $id) }
          if ($env:AUDIO_TRACE) { $rows += @('--audio-trace-directory', 'audio-traces') }
          $rawLog = Join-Path $env:RUNNER_TEMP 'corpus-raw.log'
          $currentRow = ''
          # Only fixed diagnostic categories survive; raw exception text stays private.
          $diagnostic = '^DIAGNOSTIC stage=(post-replay|audio-trace-validation|post-replay-provenance|corpus-post-replay) category=(required-probes|required-facts|probe-follow-up|fact-follow-up|credits-fact|audio-output-completion|audio-footer-write|audio-footer-flush|checkpoint-origin-read|checkpoint-origin-changed|checkpoint-save|trace-read|trace-format|header-missing|header-provenance|footer-duplicate|output-stream|output-kind|footer-incomplete|output-counts|source-read|source-changed|rom-input-read|rom-input-changed|dll-read|dll-changed|inputs-changed|checkpoint-read|checkpoint-frame) tick=(unknown|[0-9]+)$'
          python tools/verify_dll.py rom/sm.smc --corpus scenarios --no-build --direct @rows 2>&1 | Tee-Object -FilePath $rawLog | ForEach-Object {
            if (-not $env:AUDIO_TRACE) { $_ }
            elseif ($_ -match '^SEGMENT ([A-Za-z0-9-]+)') { $currentRow = $Matches[1] }
            elseif ($_ -match $diagnostic) { "DIAGNOSTIC row=${currentRow} stage=$($Matches[1]) category=$($Matches[2]) tick=$($Matches[3])" }
            elseif ($_ -match '^FAIL ([A-Za-z0-9-]+): verifier exit ([0-9]+)$') { "FAIL $($Matches[1])"; "EXIT row=$($Matches[1]) code=$($Matches[2])" }
            elseif ($_ -match '^(PASS|FAIL) ([A-Za-z0-9-]+)') { "$($Matches[1]) $($Matches[2])" }
            elseif ($_ -match '^Verified ([0-9]+) frames: ([0-9]+) failing frames') { "RESULT ${currentRow}: $($Matches[1]) frames, $($Matches[2]) failing frames" }
            elseif ($_ -match '^@([0-9]+): (?:Observation|Free-run) divergence in ([A-Za-z0-9_.\[\]-]+)') { "DOMAIN ${currentRow}: tick $($Matches[1]), field $($Matches[2])" }
            elseif ($_ -match '^Corpus') { $_ }
          } | Tee-Object -FilePath corpus.log
          $code = $LASTEXITCODE
          "### $env:SEGMENTS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path corpus.log -Pattern '^(PASS|FAIL|Corpus|RESULT|DOMAIN|DIAGNOSTIC|EXIT)' | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "Rows failed ($code)" }
      - name: Compare fresh faithful oracle digests with the committed lock
        if: matrix.record_oracle
        timeout-minutes: 120
        env:
          SEGMENTS: ${{ matrix.segments }}
        run: |
          # Only ids, ticks, domains and hashes reach the console or summary.
          python -B .github/scripts/lock_gate.py record-oracle 2>&1 | Tee-Object -FilePath oracle-sample.log
          $code = $LASTEXITCODE
          Get-Content oracle-sample.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "Faithful oracle sample failed ($code)" }
