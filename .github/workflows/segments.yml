name: Segments

# Runs movies/segments.toml rows against the oracle on hosted Windows runners.
# The ROM comes from repository secrets; ROM-derived files (inputs, checkpoints)
# stay private; the seed release asset is encrypted with a ROM-derived key.
on:
  push:
    branches: [main, 'ci/**']
    paths: ['sm/**', 'tools/**', 'movies/segments.toml', '.github/workflows/segments.yml']
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      segments:
        description: Space-separated row ids (empty = full corpus / review waypoint)
        required: false
        default: ''
      linux:
        description: Also run the smoke set on the Linux verifier (L1 spike)
        type: boolean
        default: false

permissions:
  contents: read

# On main, let the running corpus finish and keep only the newest queued run;
# on ci/** branches, a new push replaces the running one.
concurrency:
  # Main-push detection must not replace a queued full run.
  group: segments-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.sha || 'verify' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      should_run: ${{ steps.plan.outputs.should_run }}
      movie_file: ${{ steps.plan.outputs.movie_file }}
      movie_sha256: ${{ steps.plan.outputs.movie_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          SELECTED: ${{ github.event.inputs.segments }}
          CI_BRANCH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          rows = tomllib.load(open('movies/segments.toml', 'rb'))['segment']
          movie = next(m for m in tomllib.load(open('movies/manifest.toml', 'rb'))['movies'] if m['category'] == 'any%')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"movie_file={movie['file']}\nmovie_sha256={movie['sha256']}\n")
          if os.environ.get('MAIN_PUSH') == 'true':
              before = os.environ['BEFORE']
              # Main already exists: an unavailable base fails rather than skipping a deletion.
              deleted = subprocess.check_output(['git', 'diff', '--no-renames', '--diff-filter=D',
                                                 '--name-only', before, 'HEAD', '--', 'sm/src/game/sm_*.rs'], text=True)
              if deleted.strip():
                  # Dispatch shares the schedule/waypoint concurrency group.
                  subprocess.run(['gh', 'workflow', 'run', 'segments.yml', '--repo', os.environ['GITHUB_REPOSITORY'], '--ref', 'main'], check=True)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('should_run=false\nmatrix={"include":[]}\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('Bank deletion: dispatched full corpus on main.\n' if deleted.strip() else
                            'Routine main push: full corpus runs every 3h and at waypoints.\n')
              raise SystemExit(0)
          known = {r['id'] for r in rows}
          wanted = os.environ.get('SELECTED', '').split()
          source = 'dispatch input' if wanted else 'every row'
          if os.environ.get('CI_BRANCH') == 'true':
              messages = subprocess.check_output(['git', 'log', '--format=%B%x00', 'origin/main..HEAD'], text=True)
              named, found = [], False
              for message in messages.split('\0'):
                  lines = message.splitlines()
                  n = 0
                  while n < len(lines):
                      line = lines[n]
                      n += 1
                      if not line.startswith('Rows:'):
                          continue
                      found = True
                      text = line[5:]
                      # A wrapped list continues after a trailing comma; results follow a colon.
                      while text.rstrip().endswith(',') and n < len(lines):
                          text += ' ' + lines[n]
                          n += 1
                      named.extend(t for t in re.split(r'[\s,]+', text.split(':')[0]) if t)
              if found:
                  smoke = ['door-loading-lag-nmi', 'tas-ceres-four-doors', 'area-crateria', 'item-morph-ball']
                  wanted = list(dict.fromkeys(named + smoke))
                  source = f"Rows: union across origin/main..HEAD ({len(set(named))} named) plus smoke set"
          if wanted:
              unknown = set(wanted) - known
              if unknown:
                  raise SystemExit(f'unknown rows: {sorted(unknown)}')
          def seed_bundle(row):
              if row['id'] == 'xray-activate-release':
                  return ('seeds-v1-xray-activation-9c5ad92da3d5d2dc.tar.gz.enc', '9c5ad92da3d5d2dc13cfae2e2a0906ca915b2329767f121183190d2ab96c25bc')
              if 'checkpoint' in row:
                  return ('checkpoints-v1-final-fdf74bcab62e16fc.tar.gz.enc', 'fdf74bcab62e16fccdd7590bf9b112846c50d8aa00a6773f200d27ba6883eed1')
              # Match exact seed identities, not capture prefixes: pickups and the
              # general bundle contain different subsets of 100-input-phase.
              seed = row.get('seed')
              if seed in ('100-input-phase:1', '100-input-phase:5', '100-input-phase:6', '100-input-phase:12', '100-input-phase:16',
                          '100-input-phase:17', '100-input-phase:19', '100-input-phase:27', '100-input-phase:37',
                          '100-input-phase:55', '100-input-phase:73', '100-input-phase:74', '100-input-phase:80',
                          '100-input-phase:85', '100-input-phase:92', '100-input-phase:98', '100-input-phase:104',
                          '100-input-phase:142', '100-input-phase:163', '100-input-phase:170', '100-input-phase:173',
                          '100-input-phase:179', '100-input-phase:294'):
                  return ('seeds-v1-six-3a87864fbffb215a.tar.gz.enc', '3a87864fbffb215aa87ba3901c57b542abae1e907d105be4ee44bbb9921db793')
              if seed == 'golden-input-phase:1':
                  return ('seeds-v1-golden-3b895ada4be8fcb4.tar.gz.enc', '3b895ada4be8fcb4e1b77941f0f4c4530150c626588b53d2e8cf5c2dc2cbeb0e')
              if seed == '100-credits:336':
                  return ('seeds-v1-credits-42b93bf0bf83aba1.tar.gz.enc', '42b93bf0bf83aba1dd10fc24ca7d5f5b639c65e501e06ce2239c7c638c2a0ce8')
              return ('seeds-v1-spore-6b6b2c8fd70bc713.tar.gz.enc', '6b6b2c8fd70bc7139410cd576f015dfcb361360ae74cf2196a62d7edfbda7835')

          groups, skipped = {}, []
          for r in rows:
              if wanted and r['id'] not in wanted:
                  continue
              if 'pending' in r:
                  skipped.append((r['id'], 'pending'))
              else:
                  kind = 'checkpoint' if 'checkpoint' in r else ('seed' if 'seed' in r else ('route' if r['inputs'].startswith('corpus-') else 'captured'))
                  identity = seed_bundle(r)[0] if kind in ('seed', 'checkpoint') else r['inputs']
                  groups.setdefault((kind, identity), []).append(r)
          shards = []
          for (kind, identity), members in sorted(groups.items()):
              members.sort(key=lambda r: r.get('start_frame', 0))
              width = len(members) if kind in ('seed', 'checkpoint') else 9
              for i in range(0, len(members), width):
                  chunk = members[i:i + width]
                  inputs = chunk[0]['inputs']
                  asset, digest = seed_bundle(chunk[0]) if kind != 'route' else ('', '')
                  name = identity.removeprefix('seeds-v1-').split('-')[0] if kind in ('seed', 'checkpoint') else identity.removesuffix('.inputs')
                  shards.append({'name': f"{kind}-{name}-{i // width}",
                                 'kind': kind, 'inputs': inputs,
                                 'seed_asset': asset, 'seed_sha256': digest,
                                 'route': inputs.removeprefix('corpus-').removesuffix('.inputs') if kind == 'route' else '',
                                 'segments': ' '.join(r['id'] for r in chunk)})
          if not shards:
              raise SystemExit('no runnable rows selected')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Selection: {source}\n\n")
              out.write(f"{sum(len(s['segments'].split()) for s in shards)} rows in {len(shards)} shards\n\n")
              out.write('Skipped:\n\n' + ''.join(f'- {i}: {why}\n' for i, why in skipped))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('should_run=true\n')
              out.write('matrix=' + json.dumps({'include': shards}) + '\n')
          PY

  build:
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Install the GNU Rust toolchain and linker
        env:
          MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $linker = Join-Path $env:MSYS_LOCATION 'mingw64/bin'
          if (!(Test-Path -LiteralPath "$linker/gcc.exe")) { throw 'MinGW GCC is missing' }
          $linker | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$linker/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install pinned Zig and SDL2 SDK
        run: |
          $native = Join-Path $env:RUNNER_TEMP 'sm-native'
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          $zigArchive = Join-Path $native 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $zigArchive
          if ((Get-FileHash -LiteralPath $zigArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'Zig checksum mismatch' }
          Expand-Archive -LiteralPath $zigArchive -DestinationPath $native
          $sdlArchive = Join-Path $native 'sdl.zip'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.zip' -OutFile $sdlArchive
          if ((Get-FileHash -LiteralPath $sdlArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f15cff5fca62ec9381a016ef1d42a95c638cd72d2f226ba5781c76fe43dbd1ac') { throw 'SDL2 checksum mismatch' }
          Expand-Archive -LiteralPath $sdlArchive -DestinationPath $native
          $sdl = Join-Path $native 'SDL2-2.32.10/x86_64-w64-mingw32'
          "SM_NATIVE=$native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SM_ZIG=$native/zig-x86_64-windows-0.15.2/zig.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SM_SDL_INCLUDE=$sdl/include/SDL2" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBRARY_PATH=$sdl/lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build pinned native dependencies
        # Rebuild stamped archives from this checkout; never cache these objects.
        run: |
          python tools/install_native_dependencies.py --zig $env:SM_ZIG --target x86_64-windows-gnu --prefix $env:SM_NATIVE --library-directory $env:LIBRARY_PATH --sdl-include $env:SM_SDL_INCLUDE
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency installation failed' }
      - name: Build pinned PNG decoder
        run: |
          $codec = Join-Path $env:SM_NATIVE 'stb-image'
          New-Item -ItemType Directory -Force -Path $codec | Out-Null
          $package = Join-Path $codec 'stb-sys-0.6.0.crate'
          Invoke-WebRequest 'https://crates.io/api/v1/crates/stb-sys/0.6.0/download' -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fedcddefe320931b97fea7c9bc9168567eadaf71c87a74a3491d5b46b5c573de') { throw 'PNG package checksum mismatch' }
          tar -xf $package -C $codec 'stb-sys-0.6.0/vendor/stb/stb_image.h'
          if ($LASTEXITCODE -ne 0) { throw 'PNG header extraction failed' }
          $header = Join-Path $codec 'stb-sys-0.6.0/vendor/stb/stb_image.h'
          if ((Get-FileHash -LiteralPath $header -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8e5b0d717dfc8a834c97ef202d20e78d083d009586e1731c985817d0155d568c') { throw 'PNG header checksum mismatch' }
          & $env:SM_ZIG cc -target x86_64-windows-gnu -O2 -std=c11 -ftrivial-auto-var-init=zero -I (Split-Path -Parent $header) -c sm/native/stb_image.c -o "$codec/stb_image.o"
          if ($LASTEXITCODE -ne 0) { throw 'PNG compilation failed' }
          & $env:SM_ZIG ar rcs "$env:LIBRARY_PATH/libsm_stb_image.a" "$codec/stb_image.o"
          if ($LASTEXITCODE -ne 0) { throw 'PNG archive creation failed' }
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination "$env:LIBRARY_PATH/THIRD_PARTY_NOTICES.md"
      - name: Build the verifier DLL (direct, as the local Fast loop does)
        run: |
          python tools/verify_dll.py --build-only --direct
          if ($LASTEXITCODE -ne 0) { throw 'Verifier DLL build failed' }
          New-Item -ItemType Directory -Force -Path verifier | Out-Null
          Copy-Item target/verify-dll/sm_verify.dll verifier/
          Copy-Item -Recurse (Split-Path -Parent $env:LIBRARY_PATH) verifier/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: verifier
          path: verifier
          retention-days: 1

  segments:
    needs: [plan, build]
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: verifier
          path: verifier
      - name: Place the verifier
        run: |
          New-Item -ItemType Directory -Force -Path target/verify-dll | Out-Null
          Copy-Item verifier/sm_verify.dll target/verify-dll/
          "LIBRARY_PATH=$((Resolve-Path verifier/sdk/lib).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cache the pinned movie download
        if: matrix.kind == 'route'
        uses: actions/cache@v4
        with:
          path: movies/${{ needs.plan.outputs.movie_file }}
          key: ${{ runner.os }}-movie-${{ needs.plan.outputs.movie_sha256 }}
      - name: Prepare ROM and selected corpus inputs
        env:
          KIND: ${{ matrix.kind }}
          SEED_ASSET: ${{ matrix.seed_asset }}
          SEED_SHA256: ${{ matrix.seed_sha256 }}
          SEGMENTS: ${{ matrix.segments }}
          ROUTE: ${{ matrix.route }}
          INPUTS: ${{ matrix.inputs }}
          ROM_00: ${{ secrets.SM_ROM_00 }}
          ROM_01: ${{ secrets.SM_ROM_01 }}
          ROM_02: ${{ secrets.SM_ROM_02 }}
          ROM_03: ${{ secrets.SM_ROM_03 }}
          ROM_04: ${{ secrets.SM_ROM_04 }}
          ROM_05: ${{ secrets.SM_ROM_05 }}
          ROM_06: ${{ secrets.SM_ROM_06 }}
          ROM_07: ${{ secrets.SM_ROM_07 }}
          ROM_08: ${{ secrets.SM_ROM_08 }}
          ROM_09: ${{ secrets.SM_ROM_09 }}
          ROM_10: ${{ secrets.SM_ROM_10 }}
          ROM_11: ${{ secrets.SM_ROM_11 }}
          ROM_12: ${{ secrets.SM_ROM_12 }}
          ROM_13: ${{ secrets.SM_ROM_13 }}
          ROM_14: ${{ secrets.SM_ROM_14 }}
          ROM_15: ${{ secrets.SM_ROM_15 }}
          ROM_16: ${{ secrets.SM_ROM_16 }}
          ROM_17: ${{ secrets.SM_ROM_17 }}
          ROM_18: ${{ secrets.SM_ROM_18 }}
          ROM_19: ${{ secrets.SM_ROM_19 }}
          ROM_20: ${{ secrets.SM_ROM_20 }}
          ROM_21: ${{ secrets.SM_ROM_21 }}
          ROM_22: ${{ secrets.SM_ROM_22 }}
          ROM_23: ${{ secrets.SM_ROM_23 }}
          ROM_24: ${{ secrets.SM_ROM_24 }}
          ROM_25: ${{ secrets.SM_ROM_25 }}
          ROM_26: ${{ secrets.SM_ROM_26 }}
          ROM_27: ${{ secrets.SM_ROM_27 }}
          ROM_28: ${{ secrets.SM_ROM_28 }}
          ROM_29: ${{ secrets.SM_ROM_29 }}
          ROM_30: ${{ secrets.SM_ROM_30 }}
          ROM_31: ${{ secrets.SM_ROM_31 }}
          ROM_32: ${{ secrets.SM_ROM_32 }}
          ROM_33: ${{ secrets.SM_ROM_33 }}
          ROM_34: ${{ secrets.SM_ROM_34 }}
          ROM_35: ${{ secrets.SM_ROM_35 }}
          ROM_36: ${{ secrets.SM_ROM_36 }}
          ROM_37: ${{ secrets.SM_ROM_37 }}
          ROM_38: ${{ secrets.SM_ROM_38 }}
          ROM_39: ${{ secrets.SM_ROM_39 }}
          ROM_40: ${{ secrets.SM_ROM_40 }}
          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
          ROM_44: ${{ secrets.SM_ROM_44 }}
        run: |
          @'
          import base64, gzip, hashlib, io, os, pathlib, subprocess, sys, time, tomllib, urllib.error, urllib.request, zipfile
          encoded = "".join(os.environ[f"ROM_{i:02d}"] for i in range(45))
          if not encoded:
              raise SystemExit("ROM secrets are missing")
          rom = gzip.decompress(base64.b64decode(encoded))
          if hashlib.sha1(rom).hexdigest() != 'da957f0d63d14cb441d215462904c4fa8519c613':
              raise SystemExit('wrong ROM')
          pathlib.Path('rom').mkdir(exist_ok=True)
          pathlib.Path('rom/sm.smc').write_bytes(rom)
          if os.environ['KIND'] != 'route':
              bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'seeds-v1.tar.gz.enc'
              asset, digest = os.environ['SEED_ASSET'], os.environ['SEED_SHA256']
              url = 'https://github.com/JimLundin/sm-decomp/releases/download/ci-data/' + asset
              urllib.request.urlretrieve(url, bundle)
              command = [sys.executable, 'tools/ci_seed_data.py', 'restore', str(bundle),
                         '--sha256', digest, '--runtime-only']
              for row in os.environ['SEGMENTS'].split():
                  command += ['--segment', row]
              subprocess.run(command, check=True)
              sys.exit(0)
          movies = tomllib.loads(pathlib.Path('movies/manifest.toml').read_text())['movies']
          movie = next(m for m in movies if m['category'] == 'any%')
          path = pathlib.Path('movies', movie['file'])
          if path.exists():
              data = path.read_bytes()
          else:
              request = urllib.request.Request(movie['download'], headers={'User-Agent': 'sm-decomp-ci'})
              # Four total attempts; checksum validation below is never retried.
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request, timeout=120) as response:
                          data = response.read()
                      break
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise
                      print(f'Movie download HTTP {error.code}; attempt {attempt + 1}/4 failed, retrying', file=sys.stderr)
                      time.sleep(2 ** attempt)
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  if 'input' not in archive.namelist():
                      data = archive.read(next(n for n in archive.namelist() if n.lower().endswith('.lsmv')))
          # Cache hits and fresh downloads must pass the same manifest checksum.
          if hashlib.sha256(data).hexdigest() != movie['sha256']:
              raise SystemExit('wrong movie')
          path.write_bytes(data)
          subprocess.run([sys.executable, 'tools/movie_inputs.py', str(path), 'movies/' + os.environ['INPUTS'],
                          '--rom', 'rom/sm.smc', '--route', os.environ['ROUTE']], check=True)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Input preparation failed' }
      - name: Run rows
        env:
          SEGMENTS: ${{ matrix.segments }}
        run: |
          $rows = @()
          foreach ($id in $env:SEGMENTS.Split(' ')) { $rows += @('--segment', $id) }
          python tools/verify_dll.py rom/sm.smc --corpus movies/segments.toml --no-build --direct @rows 2>&1 | Tee-Object -FilePath corpus.log
          $code = $LASTEXITCODE
          "### $env:SEGMENTS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path corpus.log -Pattern '^(PASS|FAIL|Corpus)' | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "Rows failed ($code)" }

  # A green ci/** run lands the branch: rebase onto current main, fast-forward
  # main, delete the branch. A conflict or a lost race retries once after a
  # fresh fetch, then fails and leaves the branch for its author to rebase.
  # Only pushes to this repository land (fork runs and dispatches never do).
  land:
    needs: [plan, build, segments]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') &&
      github.repository == 'JimLundin/sm-decomp' && !github.event.repository.fork
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Rebase onto main and fast-forward it
        env:
          BRANCH: ${{ github.ref_name }}
          TESTED: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          land() {
            git fetch --quiet origin main "$BRANCH" || return 1
            if [ "$(git rev-parse "origin/$BRANCH")" != "$TESTED" ]; then
              echo "::error::$BRANCH moved past the tested commit $TESTED; its own run lands it"
              exit 1
            fi
            git checkout --quiet --detach "$TESTED"
            if ! git rebase --quiet origin/main; then
              git rebase --abort
              echo "::warning::rebase of $BRANCH onto main conflicts"
              return 1
            fi
            # GITHUB_TOKEN cannot push workflow edits; those land by hand.
            if [ -n "$(git diff --name-only origin/main HEAD -- .github/workflows)" ]; then
              echo "::error::$BRANCH changes .github/workflows; land it by hand"
              exit 1
            fi
            bank_deleted=$(git diff --no-renames --diff-filter=D --name-only origin/main HEAD -- 'sm/src/game/sm_*.rs')
            git push --quiet origin "HEAD:refs/heads/main" || return 1
          }
          if ! land; then
            echo 'Retrying once after a fresh fetch'
            land || { echo "::error::could not land $BRANCH; rebase it onto main and push again"; exit 1; }
          fi
          landed=$(git rev-parse HEAD)
          echo "Landed $BRANCH ($TESTED) on main as $landed" >> "$GITHUB_STEP_SUMMARY"
          git push --quiet --force-with-lease="refs/heads/$BRANCH:$TESTED" origin ":refs/heads/$BRANCH" ||
            echo "::warning::left $BRANCH in place (it moved)"
          if [ -n "$bank_deleted" ]; then echo 'BANK_RETIRED=true' >> "$GITHUB_ENV"; fi
      - name: Run the full corpus after bank retirement
        if: env.BANK_RETIRED == 'true'
        # Bot pushes start no workflows; only bank deletion needs an immediate main run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run segments.yml --repo "$GITHUB_REPOSITORY" --ref main

  # L1 spike: the same verifier as a Linux shared object. Dispatch (or ci/l1-*
  # pushes) only until its results match the Windows shards; ROM-derived files
  # stay on the runner.
  linux:
    needs: plan
    if: inputs.linux || startsWith(github.ref, 'refs/heads/ci/l1-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      SEGMENTS: area-crateria item-morph-ball
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust, pinned Zig and the SDL2 headers
        run: |
          rustup toolchain install stable --profile minimal
          native="$RUNNER_TEMP/sm-native"
          mkdir -p "$native/lib"
          curl -sSfL -o "$native/zig.tar.xz" https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $native/zig.tar.xz" | sha256sum -c -
          tar -xf "$native/zig.tar.xz" -C "$native"
          curl -sSfL -o "$native/sdl.zip" https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.zip
          echo "f15cff5fca62ec9381a016ef1d42a95c638cd72d2f226ba5781c76fe43dbd1ac  $native/sdl.zip" | sha256sum -c -
          unzip -q "$native/sdl.zip" -d "$native"
          echo "SM_NATIVE=$native" >> "$GITHUB_ENV"
          echo "SM_ZIG=$native/zig-x86_64-linux-0.15.2/zig" >> "$GITHUB_ENV"
          echo "SM_SDL_INCLUDE=$native/SDL2-2.32.10/x86_64-w64-mingw32/include/SDL2" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$native/lib" >> "$GITHUB_ENV"
      - name: Build pinned native dependencies
        run: |
          python tools/install_native_dependencies.py --zig "$SM_ZIG" --target x86_64-linux-gnu --prefix "$SM_NATIVE" --library-directory "$LIBRARY_PATH" --sdl-include "$SM_SDL_INCLUDE"
          codec="$SM_NATIVE/stb-image"
          mkdir -p "$codec"
          curl -sSfL -o "$codec/stb-sys-0.6.0.crate" https://crates.io/api/v1/crates/stb-sys/0.6.0/download
          echo "fedcddefe320931b97fea7c9bc9168567eadaf71c87a74a3491d5b46b5c573de  $codec/stb-sys-0.6.0.crate" | sha256sum -c -
          tar -xf "$codec/stb-sys-0.6.0.crate" -C "$codec" stb-sys-0.6.0/vendor/stb/stb_image.h
          echo "8e5b0d717dfc8a834c97ef202d20e78d083d009586e1731c985817d0155d568c  $codec/stb-sys-0.6.0/vendor/stb/stb_image.h" | sha256sum -c -
          "$SM_ZIG" cc -target x86_64-linux-gnu -O2 -std=c11 -fPIC -D_DEFAULT_SOURCE -ftrivial-auto-var-init=zero -I "$codec/stb-sys-0.6.0/vendor/stb" -c sm/native/stb_image.c -o "$codec/stb_image.o"
          "$SM_ZIG" ar rcs "$LIBRARY_PATH/libsm_stb_image.a" "$codec/stb_image.o"
      - name: Build the verifier shared object
        run: python tools/verify_dll.py --build-only --direct
      - name: Unit tests through the shared object
        run: python tools/verify_dll.py --unit-tests --no-build
      - name: Cache the pinned movie download
        uses: actions/cache@v4
        with:
          path: movies/${{ needs.plan.outputs.movie_file }}
          key: ${{ runner.os }}-movie-${{ needs.plan.outputs.movie_sha256 }}
      - name: Prepare ROM, movie and route inputs
        env:
          ROUTE: speed-booster
          INPUTS: corpus-speed-booster.inputs
          ROM_00: ${{ secrets.SM_ROM_00 }}
          ROM_01: ${{ secrets.SM_ROM_01 }}
          ROM_02: ${{ secrets.SM_ROM_02 }}
          ROM_03: ${{ secrets.SM_ROM_03 }}
          ROM_04: ${{ secrets.SM_ROM_04 }}
          ROM_05: ${{ secrets.SM_ROM_05 }}
          ROM_06: ${{ secrets.SM_ROM_06 }}
          ROM_07: ${{ secrets.SM_ROM_07 }}
          ROM_08: ${{ secrets.SM_ROM_08 }}
          ROM_09: ${{ secrets.SM_ROM_09 }}
          ROM_10: ${{ secrets.SM_ROM_10 }}
          ROM_11: ${{ secrets.SM_ROM_11 }}
          ROM_12: ${{ secrets.SM_ROM_12 }}
          ROM_13: ${{ secrets.SM_ROM_13 }}
          ROM_14: ${{ secrets.SM_ROM_14 }}
          ROM_15: ${{ secrets.SM_ROM_15 }}
          ROM_16: ${{ secrets.SM_ROM_16 }}
          ROM_17: ${{ secrets.SM_ROM_17 }}
          ROM_18: ${{ secrets.SM_ROM_18 }}
          ROM_19: ${{ secrets.SM_ROM_19 }}
          ROM_20: ${{ secrets.SM_ROM_20 }}
          ROM_21: ${{ secrets.SM_ROM_21 }}
          ROM_22: ${{ secrets.SM_ROM_22 }}
          ROM_23: ${{ secrets.SM_ROM_23 }}
          ROM_24: ${{ secrets.SM_ROM_24 }}
          ROM_25: ${{ secrets.SM_ROM_25 }}
          ROM_26: ${{ secrets.SM_ROM_26 }}
          ROM_27: ${{ secrets.SM_ROM_27 }}
          ROM_28: ${{ secrets.SM_ROM_28 }}
          ROM_29: ${{ secrets.SM_ROM_29 }}
          ROM_30: ${{ secrets.SM_ROM_30 }}
          ROM_31: ${{ secrets.SM_ROM_31 }}
          ROM_32: ${{ secrets.SM_ROM_32 }}
          ROM_33: ${{ secrets.SM_ROM_33 }}
          ROM_34: ${{ secrets.SM_ROM_34 }}
          ROM_35: ${{ secrets.SM_ROM_35 }}
          ROM_36: ${{ secrets.SM_ROM_36 }}
          ROM_37: ${{ secrets.SM_ROM_37 }}
          ROM_38: ${{ secrets.SM_ROM_38 }}
          ROM_39: ${{ secrets.SM_ROM_39 }}
          ROM_40: ${{ secrets.SM_ROM_40 }}
          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
          ROM_44: ${{ secrets.SM_ROM_44 }}
        run: |
          python -B - <<'PY'
          import base64, gzip, hashlib, io, os, pathlib, subprocess, sys, time, tomllib, urllib.error, urllib.request, zipfile
          encoded = "".join(os.environ[f"ROM_{i:02d}"] for i in range(45))
          if not encoded:
              raise SystemExit("ROM secrets are missing")
          rom = gzip.decompress(base64.b64decode(encoded))
          if hashlib.sha1(rom).hexdigest() != 'da957f0d63d14cb441d215462904c4fa8519c613':
              raise SystemExit('wrong ROM')
          pathlib.Path('rom').mkdir(exist_ok=True)
          pathlib.Path('rom/sm.smc').write_bytes(rom)
          movies = tomllib.loads(pathlib.Path('movies/manifest.toml').read_text())['movies']
          movie = next(m for m in movies if m['category'] == 'any%')
          path = pathlib.Path('movies', movie['file'])
          if path.exists():
              data = path.read_bytes()
          else:
              request = urllib.request.Request(movie['download'], headers={'User-Agent': 'sm-decomp-ci'})
              # Four total attempts; checksum validation below is never retried.
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request, timeout=120) as response:
                          data = response.read()
                      break
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise
                      print(f'Movie download HTTP {error.code}; attempt {attempt + 1}/4 failed, retrying', file=sys.stderr)
                      time.sleep(2 ** attempt)
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  if 'input' not in archive.namelist():
                      data = archive.read(next(n for n in archive.namelist() if n.lower().endswith('.lsmv')))
          # Cache hits and fresh downloads must pass the same manifest checksum.
          if hashlib.sha256(data).hexdigest() != movie['sha256']:
              raise SystemExit('wrong movie')
          path.write_bytes(data)
          subprocess.run([sys.executable, 'tools/movie_inputs.py', str(path), 'movies/' + os.environ['INPUTS'],
                          '--rom', 'rom/sm.smc', '--route', os.environ['ROUTE']], check=True)
          PY
      - name: Run the smoke rows
        run: |
          rows=""
          for id in $SEGMENTS; do rows="$rows --segment $id"; done
          set -o pipefail
          code=0
          python tools/verify_dll.py rom/sm.smc --corpus movies/segments.toml --no-build --direct $rows 2>&1 | tee corpus.log || code=$?
          { echo "### Linux: $SEGMENTS"; echo '```'; grep -E '^(PASS|FAIL|Corpus)' corpus.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
