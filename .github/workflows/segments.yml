name: Corpus replay

# Runs the corpus scenarios (every scenario but the route rooms)
# against the oracle on hosted Windows runners.
# The ROM comes from repository secrets; ROM-derived files (inputs, checkpoints)
# stay private; the seed release asset is encrypted with a ROM-derived key.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      segments:
        description: Space-separated row ids (empty = full corpus / review waypoint)
        required: false
        default: ''
      oracle:
        description: Oracle ROM (patched = snesrev compatibility patches, faithful = original game logic)
        type: choice
        options: [patched, faithful]
        default: patched
      audio_trace:
        description: Check each row's ordered Cue/port trace against the physical-audio oracle
        type: boolean
        default: false
      oracle_sample:
        description: Also re-record a rotating sample of at least 30 faithful locks and fail on drift
        type: boolean
        default: false

permissions:
  contents: read

# Finish the running corpus; retain the newest queued request.
concurrency:
  group: corpus-replay-${{ github.ref }}-${{ inputs.oracle || 'patched' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      prefix_matrices: ${{ steps.plan.outputs.prefix_matrices }}
      prefix_stages: ${{ steps.plan.outputs.prefix_stages }}
      ready_matrix: ${{ steps.plan.outputs.ready_matrix }}
      checkpoint_matrix: ${{ steps.plan.outputs.checkpoint_matrix }}
      ready_count: ${{ steps.plan.outputs.ready_count }}
      checkpoint_count: ${{ steps.plan.outputs.checkpoint_count }}
      movie_file: ${{ steps.plan.outputs.movie_file }}
      movie_sha256: ${{ steps.plan.outputs.movie_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          ORACLE: ${{ inputs.oracle || 'patched' }}
          SELECTED: ${{ github.event.inputs.segments }}
          ORACLE_SAMPLE: ${{ (github.event_name == 'schedule' || inputs.oracle_sample) && '1' || '' }}
        run: |
          python3 .github/scripts/plan_corpus.py

  build:
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-native
      - name: Reuse a verifier built from the same sources
        # verify_dll.py still rebuilds unless the executable's stamp matches these sources,
        # the compiler and its options; the native archives count by their sources.
        uses: actions/cache@v4
        with:
          path: target/verify-host
          key: verifier-executable-direct-${{ hashFiles('crates/**', 'sm/**', 'Cargo.lock', 'rust-toolchain.toml', 'tools/verify_dll.py', 'tools/install_lakesnes.py', 'tools/install_native_*.py', '.github/actions/windows-native/action.yml') }}
      - name: Build the verifier executable (direct, as the local Fast loop does)
        env:
          # Every native archive is rebuilt here from these pinned sources.
          SM_NATIVE_IDENTITY: ${{ hashFiles('crates/**', 'sm/**', 'tools/install_lakesnes.py', 'tools/install_native_*.py', '.github/actions/windows-native/action.yml') }}
        run: |
          python tools/verify_dll.py --build-only --direct
          if ($LASTEXITCODE -ne 0) { throw 'Verifier executable build failed' }
          New-Item -ItemType Directory -Force -Path verifier | Out-Null
          Copy-Item target/verify-host/sm_verify.exe verifier/
          Copy-Item -Recurse (Split-Path -Parent $env:LIBRARY_PATH) verifier/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: verifier
          path: verifier
          retention-days: 1

  prefix_00:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' && fromJSON(needs.plan.outputs.prefix_stages) > 0 }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.prefix_matrices).stage_00 }}
    name: verified-prefix-${{ matrix.prefix_chain }}-0
    env:
      SM_ORACLE: ${{ matrix.oracle }}
      AUDIO_TRACE: ${{ inputs.audio_trace && '1' || '' }}
      PREFIX_STAGE: '0'
      PREFIX_PREVIOUS: '-1'
    defaults:
      run:
        shell: pwsh
    steps: &verified_prefix_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: verifier
          path: verifier
      - name: Place the verifier
        run: |
          New-Item -ItemType Directory -Force -Path target/verify-host | Out-Null
          Copy-Item verifier/sm_verify.exe target/verify-host/
          "LIBRARY_PATH=$((Resolve-Path verifier/sdk/lib).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cache the pinned movie download
        if: matrix.kind == 'route'
        uses: actions/cache@v4
        with:
          path: movies/${{ needs.plan.outputs.movie_file }}
          key: ${{ runner.os }}-movie-${{ needs.plan.outputs.movie_sha256 }}
      - name: Prepare ROM and selected corpus inputs
        env:
          KIND: ${{ matrix.kind }}
          SEED_ASSET: ${{ matrix.seed_asset }}
          SEED_SHA256: ${{ matrix.seed_sha256 }}
          SEGMENTS: ${{ matrix.segments }}
          ROUTE: ${{ matrix.route }}
          INPUTS: ${{ matrix.inputs }}
          ROM_00: ${{ secrets.SM_ROM_00 }}
          ROM_01: ${{ secrets.SM_ROM_01 }}
          ROM_02: ${{ secrets.SM_ROM_02 }}
          ROM_03: ${{ secrets.SM_ROM_03 }}
          ROM_04: ${{ secrets.SM_ROM_04 }}
          ROM_05: ${{ secrets.SM_ROM_05 }}
          ROM_06: ${{ secrets.SM_ROM_06 }}
          ROM_07: ${{ secrets.SM_ROM_07 }}
          ROM_08: ${{ secrets.SM_ROM_08 }}
          ROM_09: ${{ secrets.SM_ROM_09 }}
          ROM_10: ${{ secrets.SM_ROM_10 }}
          ROM_11: ${{ secrets.SM_ROM_11 }}
          ROM_12: ${{ secrets.SM_ROM_12 }}
          ROM_13: ${{ secrets.SM_ROM_13 }}
          ROM_14: ${{ secrets.SM_ROM_14 }}
          ROM_15: ${{ secrets.SM_ROM_15 }}
          ROM_16: ${{ secrets.SM_ROM_16 }}
          ROM_17: ${{ secrets.SM_ROM_17 }}
          ROM_18: ${{ secrets.SM_ROM_18 }}
          ROM_19: ${{ secrets.SM_ROM_19 }}
          ROM_20: ${{ secrets.SM_ROM_20 }}
          ROM_21: ${{ secrets.SM_ROM_21 }}
          ROM_22: ${{ secrets.SM_ROM_22 }}
          ROM_23: ${{ secrets.SM_ROM_23 }}
          ROM_24: ${{ secrets.SM_ROM_24 }}
          ROM_25: ${{ secrets.SM_ROM_25 }}
          ROM_26: ${{ secrets.SM_ROM_26 }}
          ROM_27: ${{ secrets.SM_ROM_27 }}
          ROM_28: ${{ secrets.SM_ROM_28 }}
          ROM_29: ${{ secrets.SM_ROM_29 }}
          ROM_30: ${{ secrets.SM_ROM_30 }}
          ROM_31: ${{ secrets.SM_ROM_31 }}
          ROM_32: ${{ secrets.SM_ROM_32 }}
          ROM_33: ${{ secrets.SM_ROM_33 }}
          ROM_34: ${{ secrets.SM_ROM_34 }}
          ROM_35: ${{ secrets.SM_ROM_35 }}
          ROM_36: ${{ secrets.SM_ROM_36 }}
          ROM_37: ${{ secrets.SM_ROM_37 }}
          ROM_38: ${{ secrets.SM_ROM_38 }}
          ROM_39: ${{ secrets.SM_ROM_39 }}
          ROM_40: ${{ secrets.SM_ROM_40 }}
          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
          ROM_44: ${{ secrets.SM_ROM_44 }}
        run: |
          python -B .github/scripts/prepare_corpus_inputs.py
          if ($LASTEXITCODE -ne 0) { throw 'Input preparation failed' }
      - name: Restore successful predecessor capture
        if: env.PREFIX_STAGE != '0'
        uses: actions/download-artifact@v4
        with:
          name: verified-prefix-${{ matrix.prefix_chain }}-${{ env.PREFIX_PREVIOUS }}
          path: prefix-import
      - name: Verify the complete next bounded prefix interval
        timeout-minutes: 55
        env:
          SEGMENTS: ${{ matrix.segments }}
        run: |
          $rows = @()
          foreach ($id in $env:SEGMENTS.Split(' ')) { $rows += @('--segment', $id) }
          $stage = @('--prefix-stage', $env:PREFIX_STAGE, '--prefix-out', 'prefix-transfer/checkpoint.tar.gz.enc')
          if ($env:PREFIX_STAGE -ne '0') { $stage += @('--prefix-in', 'prefix-import/checkpoint.tar.gz.enc') }
          python -B tools/verify_dll.py rom/sm.smc --corpus scenarios --no-build --direct @rows @stage
          if ($LASTEXITCODE -ne 0) { throw 'Verified prefix capture failed' }
      - name: Publish only the successful encrypted capture
        uses: actions/upload-artifact@v4
        with:
          name: verified-prefix-${{ matrix.prefix_chain }}-${{ env.PREFIX_STAGE }}
          path: |
            prefix-transfer/checkpoint.tar.gz.enc
            prefix-transfer/checkpoint.tar.gz.enc.sha256
          retention-days: 1
      - name: Encrypt the actual failed or timed-out prefix log
        if: failure()
        run: |
          if ((Test-Path prefix-transfer/active.log) -and -not (Test-Path prefix-transfer/failure.log.enc.sha256)) {
            if (Test-Path prefix-transfer/failure.log.enc) { Remove-Item -LiteralPath prefix-transfer/failure.log.enc }
            python -B -c "import sys; sys.path.insert(0, 'tools'); from pathlib import Path; from types import SimpleNamespace; import verify_dll; verify_dll.prefix_failure_log(SimpleNamespace(rom=Path('rom/sm.smc'), prefix_out=Path('prefix-transfer/checkpoint.tar.gz.enc')), Path('prefix-transfer/active.log'))"
            if ($LASTEXITCODE -ne 0) { throw 'Failed-prefix log encryption failed' }
          }
      - name: Retain the encrypted failed-prefix log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verified-prefix-failure-${{ matrix.prefix_chain }}-${{ env.PREFIX_STAGE }}
          path: |
            prefix-transfer/failure.log.enc
            prefix-transfer/failure.log.enc.sha256
          if-no-files-found: ignore
          retention-days: 1

