name: Gate sender offer lane at the reviewed source revision
on:
  push:
    branches: [lane/sender-fifo-481-gate]
permissions:
  contents: read
env:
  RUSTC_BOOTSTRAP: "1"
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 003e48ec6a6ca4db127118a77942aa35e6da32db
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-quality-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-003e48ec6a6ca4db127118a77942aa35e6da32db
          restore-keys: |
            cargo-quality-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
      - name: Run the source gate on the exact lane head
        run: |
          git switch -c lane/sender-fifo-481
          bash tools/lane/gate.sh

