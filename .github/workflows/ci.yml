name: CI

# The only entry point. Events call reusable proof workflows, then trusted main producers
# retain recent clean caches after both workflows pass.
#   quality.yml  formatting, lints, tests, the crate rules and the doc links (no ROM).
#   verify.yml   the ROM-reading checks: content decoders and indexed production replay.
# Full runs start Quality and verification independently. Manual runs can select one check.
# Main pushes run both to refresh clean build caches; verify/** runs verification only.
# Each verification job reruns only when a file it reads changed: it reuses the passing verdict of a
# run that did its work on the same inputs (tools/ci/verdict.sh). Quality always runs.
# Called jobs report as "<caller job> / <job>", for example "verify / content".
on:
  pull_request:
  push:
    branches: [main, 'verify/**']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Indexed case ID, exact verify library test name, or played for the M0 played-alone run (empty runs full CI)
        type: string
        required: false

permissions:
  contents: read

# A new commit replaces its branch's run; nightly and dispatched runs finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.target && github.run_id || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  quality:
    if: inputs.target == '' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/'))
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  verify:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/verify/')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify.yml
    with:
      target: ${{ inputs.target || '' }}
    secrets:
      SM_ROM_DEPLOY_KEY: ${{ secrets.SM_ROM_DEPLOY_KEY }}
      SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}

  retain-caches:
    # Only trusted main producers receive cache deletion permission, after all proof passes.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [quality, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    concurrency:
      group: cargo-cache-retention-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Retain recent clean main builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/retain_cargo_caches.py
