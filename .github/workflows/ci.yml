name: CI

# The only entry point. It holds the triggers and no steps: each event calls the reusable
# workflows that own one responsibility each.
#   quality.yml  formatting, lints, tests, the crate rules and the doc links (no ROM).
#   verify.yml   the ROM-reading checks: content decoders and indexed production replay.
# Pull requests, nightly runs and manual runs start Quality and verification independently.
# Main pushes run Quality only; verify/** pushes run verification only.
# Called jobs report as "<caller job> / <job>", for example "verify / content".
on:
  pull_request:
  push:
    branches: [main, 'verify/**']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new commit replaces its branch's run; nightly and dispatched runs finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  quality:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/')
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  verify:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/verify/')
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    secrets:
      SM_ROM_DEPLOY_KEY: ${{ secrets.SM_ROM_DEPLOY_KEY }}
      SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
