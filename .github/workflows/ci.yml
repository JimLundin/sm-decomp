name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/PLAN.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the repository toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Keep committed text files on LF line endings
        run: |
          crlf=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" { print $NF }')
          if [ -n "$crlf" ]; then echo "Committed with CRLF line endings:"; echo "$crlf"; exit 1; fi
      - name: Lint target packages
        run: cargo clippy --locked -p sm_data -p sm_game -p sm_runtime --all-targets --no-deps
      - name: Progress
        run: |
          sh tools/progress.sh
          python3 tools/cycle_report.py
      - name: Hold the Phase 2 ratchets (RAM coupling and production lines)
        run: python3 tools/ram_ratchet.py
      - name: Keep the oracle patch policy in step with its inventory
        run: python3 tools/oracle_patch_policy.py --check
      - name: Keep every mutation anchor present (the mutants run nightly)
        run: |
          python3 sm/src/verification/player_detached/mutations.py --check-anchors
          python3 sm/src/verification/session_mutations.py --check-anchors
      - name: Keep target packages independent of the emulator crate
        # sm_game and sm_runtime may depend only on sm_data, never on sm.
        run: |
          for package in sm_game sm_runtime; do
            deps=$(cargo tree -p $package -e normal --prefix none --format '{p}' | tail -n +2 | grep -v '^sm_data ' || true)
            if [ -n "$deps" ]; then echo "$package has forbidden dependencies:"; echo "$deps"; exit 1; fi
          done
          # sm_data holds content records only and depends on nothing.
          deps=$(cargo tree -p sm_data -e normal --prefix none --format '{p}' | tail -n +2 || true)
          if [ -n "$deps" ]; then echo "sm_data has forbidden dependencies:"; echo "$deps"; exit 1; fi
      - name: Test target packages
        # Unit, integration (tests/*.rs) and doc tests of all three packages.
        # The summary lists every test binary and fails if one expected from
        # the packages' sources did not run, so an unbuilt test file shows up.
        run: |
          if cargo test --locked -p sm_data -p sm_game -p sm_runtime --no-fail-fast > test.log 2>&1; then status=0; else status=$?; fi
          cat test.log
          python3 .github/scripts/test_summary.py test.log crates/sm_data crates/sm_game crates/sm_runtime || status=1
          exit $status
      - name: Check every sm_data record imports from the original ROM
        # A record that rejects the cartridge leaves the game on its original ROM
        # reads, so replays would pass without exercising it. The log can hold
        # ROM-derived values, so only pass/fail, the rejected record names and
        # error kinds, and the failing assertion's source location are printed.
        env:
          ROM_00: ${{ secrets.SM_ROM_00 }}
          ROM_01: ${{ secrets.SM_ROM_01 }}
          ROM_02: ${{ secrets.SM_ROM_02 }}
          ROM_03: ${{ secrets.SM_ROM_03 }}
          ROM_04: ${{ secrets.SM_ROM_04 }}
          ROM_05: ${{ secrets.SM_ROM_05 }}
          ROM_06: ${{ secrets.SM_ROM_06 }}
          ROM_07: ${{ secrets.SM_ROM_07 }}
          ROM_08: ${{ secrets.SM_ROM_08 }}
          ROM_09: ${{ secrets.SM_ROM_09 }}
          ROM_10: ${{ secrets.SM_ROM_10 }}
          ROM_11: ${{ secrets.SM_ROM_11 }}
          ROM_12: ${{ secrets.SM_ROM_12 }}
          ROM_13: ${{ secrets.SM_ROM_13 }}
          ROM_14: ${{ secrets.SM_ROM_14 }}
          ROM_15: ${{ secrets.SM_ROM_15 }}
          ROM_16: ${{ secrets.SM_ROM_16 }}
          ROM_17: ${{ secrets.SM_ROM_17 }}
          ROM_18: ${{ secrets.SM_ROM_18 }}
          ROM_19: ${{ secrets.SM_ROM_19 }}
          ROM_20: ${{ secrets.SM_ROM_20 }}
          ROM_21: ${{ secrets.SM_ROM_21 }}
          ROM_22: ${{ secrets.SM_ROM_22 }}
          ROM_23: ${{ secrets.SM_ROM_23 }}
          ROM_24: ${{ secrets.SM_ROM_24 }}
          ROM_25: ${{ secrets.SM_ROM_25 }}
          ROM_26: ${{ secrets.SM_ROM_26 }}
          ROM_27: ${{ secrets.SM_ROM_27 }}
          ROM_28: ${{ secrets.SM_ROM_28 }}
          ROM_29: ${{ secrets.SM_ROM_29 }}
          ROM_30: ${{ secrets.SM_ROM_30 }}
          ROM_31: ${{ secrets.SM_ROM_31 }}
          ROM_32: ${{ secrets.SM_ROM_32 }}
          ROM_33: ${{ secrets.SM_ROM_33 }}
          ROM_34: ${{ secrets.SM_ROM_34 }}
          ROM_35: ${{ secrets.SM_ROM_35 }}
          ROM_36: ${{ secrets.SM_ROM_36 }}
          ROM_37: ${{ secrets.SM_ROM_37 }}
          ROM_38: ${{ secrets.SM_ROM_38 }}
          ROM_39: ${{ secrets.SM_ROM_39 }}
          ROM_40: ${{ secrets.SM_ROM_40 }}
          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
          ROM_44: ${{ secrets.SM_ROM_44 }}
        run: |
          python3 -B .github/scripts/prepare_rom.py
          if SM_ROM="$PWD/rom/sm.smc" cargo test --locked -p sm_data --test rom_import > rom_import.log 2>&1; then status=0; else status=$?; fi
          grep -E 'rejected the original ROM|panicked at' rom_import.log > rom_import.failures || true
          rm -rf rom rom_import.log
          if [ "$status" -ne 0 ]; then
            echo 'sm_data ROM import check: FAIL'
            grep -oE 'rejected the original ROM: \[[^]]*\]' rom_import.failures | head -5 || true
            grep -oE 'panicked at [^ ]+:[0-9]+:[0-9]+' rom_import.failures | head -5 || true
            rm -f rom_import.failures
            exit 1
          fi
          echo 'sm_data ROM import check: PASS'
      - name: Run the full corpus after bank retirement
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deleted=$(git diff --no-renames --diff-filter=D --name-only "$BEFORE" HEAD -- 'sm/src/game/sm_*.rs')
          if [ -n "$deleted" ]; then
            gh workflow run segments.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

  detached:
    # Independent hosted machine: detached checks run alongside the native build.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_BUILD_JOBS: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Install the GNU Rust toolchain and linker
        env:
          MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $linker = Join-Path $env:MSYS_LOCATION 'mingw64/bin'
          if (!(Test-Path -LiteralPath "$linker/gcc.exe")) { throw 'MinGW GCC is missing' }
          $linker | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$linker/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify composed projectile, animation and palette cores without the game backend
        run: |
          $playerDetached = Join-Path $env:RUNNER_TEMP 'player-detached.exe'
          $smData = Join-Path $env:RUNNER_TEMP 'libsm_data.rlib'
          rustc --edition=2024 -D warnings -O --crate-name sm_data --crate-type rlib crates/sm_data/src/lib.rs -o $smData
          if ($LASTEXITCODE -ne 0) { throw 'sm_data compilation failed' }
          $smGame = Join-Path $env:RUNNER_TEMP 'libsm_game.rlib'
          rustc --edition=2024 -D warnings -O --crate-name sm_game --crate-type rlib crates/sm_game/src/lib.rs --extern "sm_data=$smData" -L "dependency=$env:RUNNER_TEMP" -o $smGame
          if ($LASTEXITCODE -ne 0) { throw 'sm_game compilation failed' }
          $smRuntime = Join-Path $env:RUNNER_TEMP 'libsm_runtime.rlib'
          rustc --edition=2024 -D warnings -O --crate-name sm_runtime --crate-type rlib crates/sm_runtime/src/lib.rs --extern "sm_data=$smData" -L "dependency=$env:RUNNER_TEMP" -o $smRuntime
          if ($LASTEXITCODE -ne 0) { throw 'sm_runtime compilation failed' }
          rustc --edition=2024 -D warnings -O sm/src/verification/player_detached/main.rs --extern "sm_data=$smData" --extern "sm_game=$smGame" --extern "sm_runtime=$smRuntime" -L "dependency=$env:RUNNER_TEMP" -o $playerDetached
          if ($LASTEXITCODE -ne 0) { throw 'Detached projectile compilation failed' }
          & $playerDetached
          if ($LASTEXITCODE -ne 0) { throw 'Detached projectile checks failed' }

  build:
    # Native desktop/utilities currently require the Windows GNU ABI.
    # Build every real dependency and the frontend; public CI needs no ROM.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_BUILD_JOBS: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Install the GNU Rust toolchain and linker
        env:
          MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $linker = Join-Path $env:MSYS_LOCATION 'mingw64/bin'
          if (!(Test-Path -LiteralPath "$linker/gcc.exe")) { throw 'MinGW GCC is missing' }
          $linker | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$linker/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install pinned Zig and SDL2 SDK
        run: |
          $native = Join-Path $env:RUNNER_TEMP 'sm-native'
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          $zigArchive = Join-Path $native 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $zigArchive
          if ((Get-FileHash -LiteralPath $zigArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'Zig checksum mismatch' }
          Expand-Archive -LiteralPath $zigArchive -DestinationPath $native
          $sdlArchive = Join-Path $native 'sdl.zip'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.zip' -OutFile $sdlArchive
          if ((Get-FileHash -LiteralPath $sdlArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f15cff5fca62ec9381a016ef1d42a95c638cd72d2f226ba5781c76fe43dbd1ac') { throw 'SDL2 checksum mismatch' }
          Expand-Archive -LiteralPath $sdlArchive -DestinationPath $native
          $sdl = Join-Path $native 'SDL2-2.32.10/x86_64-w64-mingw32'
          "SM_NATIVE=$native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SM_ZIG=$native/zig-x86_64-windows-0.15.2/zig.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SM_SDL_INCLUDE=$sdl/include/SDL2" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBRARY_PATH=$sdl/lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build pinned native dependencies
        # Rebuild stamped archives from this checkout; never cache these objects.
        run: |
          python tools/install_native_dependencies.py --zig $env:SM_ZIG --target x86_64-windows-gnu --prefix $env:SM_NATIVE --library-directory $env:LIBRARY_PATH --sdl-include $env:SM_SDL_INCLUDE
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency installation failed' }
      - name: Build pinned PNG decoder
        run: |
          $codec = Join-Path $env:SM_NATIVE 'stb-image'
          New-Item -ItemType Directory -Force -Path $codec | Out-Null
          $package = Join-Path $codec 'stb-sys-0.6.0.crate'
          Invoke-WebRequest 'https://crates.io/api/v1/crates/stb-sys/0.6.0/download' -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fedcddefe320931b97fea7c9bc9168567eadaf71c87a74a3491d5b46b5c573de') { throw 'PNG package checksum mismatch' }
          tar -xf $package -C $codec 'stb-sys-0.6.0/vendor/stb/stb_image.h'
          if ($LASTEXITCODE -ne 0) { throw 'PNG header extraction failed' }
          $header = Join-Path $codec 'stb-sys-0.6.0/vendor/stb/stb_image.h'
          if ((Get-FileHash -LiteralPath $header -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8e5b0d717dfc8a834c97ef202d20e78d083d009586e1731c985817d0155d568c') { throw 'PNG header checksum mismatch' }
          & $env:SM_ZIG cc -target x86_64-windows-gnu -O2 -std=c11 -ftrivial-auto-var-init=zero -I (Split-Path -Parent $header) -c sm/native/stb_image.c -o "$codec/stb_image.o"
          if ($LASTEXITCODE -ne 0) { throw 'PNG compilation failed' }
          & $env:SM_ZIG ar rcs "$env:LIBRARY_PATH/libsm_stb_image.a" "$codec/stb_image.o"
          if ($LASTEXITCODE -ne 0) { throw 'PNG archive creation failed' }
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination "$env:LIBRARY_PATH/THIRD_PARTY_NOTICES.md"
      - name: Build
        run: |
          foreach ($archive in @('sm_desktop', 'lakesnes_cpu', 'lakesnes_backend', 'sm_config', 'sm_stb_image')) {
            if (!(Test-Path -LiteralPath "$env:LIBRARY_PATH/lib$archive.a")) { throw "Missing native archive: $archive" }
          }
          cargo build --release --locked -p sm --lib --example sm_verify
          if ($LASTEXITCODE -ne 0) { throw 'Cargo build failed' }
          cargo build --release --locked -p sm_app --bin sm
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Check Cargo verifier configuration and actor exports
        run: |
          python tools/verify_dll.py --build-only --cargo
          if ($LASTEXITCODE -ne 0) { throw 'Cargo verifier configuration build failed' }
          python -B .github/scripts/check_actor_exports.py
          if ($LASTEXITCODE -ne 0) { throw 'Cargo verifier actor export check failed' }
      - name: Run verifier units through the built DLL
        run: |
          python tools/verify_dll.py --unit-tests --no-build --cargo
          if ($LASTEXITCODE -ne 0) { throw 'Verifier DLL unit tests failed' }
