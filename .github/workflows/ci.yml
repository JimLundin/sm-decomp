name: CI

# The only entry point. Events call reusable proof workflows, then trusted main producers
# retain recent clean caches after both workflows pass.
#   quality.yml  formatting, lints, tests, the crate rules and the doc links (no ROM).
#   verify.yml   the ROM-reading checks: content decoders and indexed production replay.
# Full runs start Quality and verification independently. Manual runs can select one check.
# Main pushes run Quality only, to refresh its clean build cache: tools/lane/land.py fast-forwards
# main to a pull request head whose verification passed. verify/** runs verification only.
# The nightly run does every job cold.
# Called jobs report as "<caller job> / <job>", for example "verify / content".
on:
  pull_request:
  push:
    branches: [main, 'verify/**']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Indexed case ID, exact verify library test name, played for the M0 room alone, or replay::played::tests::reviewed_runs_hold to hold every reviewed played run (empty runs full CI)
        type: string
        required: false

permissions:
  contents: read

# A new commit replaces its pull request's run; every other run finishes, so main keeps its cache saves.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.target && github.run_id || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: inputs.target == '' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/'))
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  verify:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/verify/')
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      target: ${{ inputs.target || '' }}
    secrets:
      SM_ROM_DEPLOY_KEY: ${{ secrets.SM_ROM_DEPLOY_KEY }}
      SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}

  retain-caches:
    # Only main runs receive cache deletion permission, after all proof passes. A failure here
    # leaves old caches in place and does not fail the run.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.quality.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.verify.result) }}
    needs: [quality, verify]
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    concurrency:
      group: cargo-cache-retention-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Retain recent clean main builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/retain_cargo_caches.py
