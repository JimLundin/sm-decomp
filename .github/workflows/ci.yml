name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the project toolchain
        run: rustup show
      - name: Prepare pinned hardware source and timing patch
        run: python3 tools/prepare_rustysnes.py
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Test without ROM or generated inputs
        run: cargo test --workspace --locked --offline
      - name: Test synchronization comparison
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Test clocked APU timing
        run: python3 tools/test_hardware.py
