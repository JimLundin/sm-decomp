name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Public CI checks build/format. Manual verify.yml obtains the ROM from
    # encrypted Actions secrets without publishing ROM data or save states.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --release --locked
      - name: Progress
        run: sh tools/progress.sh
