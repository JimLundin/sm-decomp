name: CI

# The only entry point. It holds the triggers and no steps: each event calls the reusable
# workflows that own one responsibility each.
#   quality.yml  formatting, lints, tests, the crate rules and the doc links (no ROM).
#   verify.yml   the ROM-reading checks: content decoders, free-run gate, lockstep ratchet.
# Pull requests and pushes to main run quality; pull requests and verify/** pushes run verify.
# Called jobs report as "<caller job> / <job>", for example "verify / content".
on:
  pull_request:
  push:
    branches: [main, 'verify/**']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new commit replaces its branch's run; nightly and dispatched runs finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  verify:
    # Replays are most of the runner time, so a Quality failure stops them before they start.
    # Scheduled and dispatched runs skip Quality, which doesn't block them.
    needs: quality
    if: >-
      !cancelled()
      && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
      && (github.event_name != 'push' || startsWith(github.ref, 'refs/heads/verify/'))
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    secrets:
      SM_ROM_DEPLOY_KEY: ${{ secrets.SM_ROM_DEPLOY_KEY }}
      SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
