name: Codebase atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the current source map
        run: python docs/codebase-map/generate_atlas.py --root . --revision HEAD
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - name: Package the standalone page
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p atlas-site
          cp docs/codebase-map/index.html atlas-site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: atlas-site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish atlas
        id: deployment
        uses: actions/deploy-pages@v4
