name: Atlas browser checks
on:
  push:
    branches: [verify/codebase-atlas-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python docs/codebase-map/check_atlas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-results
          path: atlas-browser-results
