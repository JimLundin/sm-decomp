name: Bench

# Bench: replay speed (check-lock) of the calling ref against `base` on one runner, so the
# runners' speed spread cancels out. Each row runs base, then head. It decides nothing; the
# step summary holds a ticks-per-second table.
on:
  workflow_call:
    inputs:
      base:
        description: The ref to time against (default main)
        type: string
        default: ''
      segments:
        description: Space-separated row ids (default four chain-any rooms)
        type: string
        default: ''
    secrets:
      SM_ROM_DEPLOY_KEY:
        required: false
      SM_ROM_KEY:
        required: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      ROWS: ${{ inputs.segments || 'chain-any-0001-DF45 chain-any-0012-91F8 chain-any-0063-A59F chain-any-0097-B32E' }}
      BASE: ${{ inputs.base || 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || 'main' }}
          path: .bench-base
      - uses: ./.github/actions/linux-native
      - name: Build both verifiers
        run: |
          python3 tools/verify_dll.py --build-only --direct
          (cd .bench-base && python3 tools/verify_dll.py --build-only --direct)
      - uses: actions/checkout@v4
        with:
          repository: JimLundin/ci-data
          ssh-key: ${{ secrets.SM_ROM_DEPLOY_KEY }}
          path: .ci-data
          persist-credentials: false
      - name: Decrypt the ROM and restore the rows' bundles on both sides
        env:
          SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
          FULL_ROUTE: any
        run: |
          # prepare_rom.py removes the ci-data checkout, so decrypt once and copy.
          python3 -B .github/scripts/prepare_rom.py
          mkdir -p .bench-base/rom
          cp rom/sm.smc .bench-base/rom/sm.smc
          base_url=https://github.com/JimLundin/sm-decomp/releases/download/ci-data
          # Rows can share one bundle (every chain room is in its route's); restore each once.
          restored=" "
          for row in $ROWS; do
            asset=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import pathlib, scenario; print(scenario.read_lock(pathlib.Path('.')).pins['$row']['bundle'])")
            case "$restored" in *" $asset "*) continue ;; esac
            restored="$restored$asset "
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/$asset" "$base_url/$asset"
            for dir in . .bench-base; do
              case "$row" in
                chain-*) (cd "$dir" && python3 -B .github/scripts/full_route.py restore "$RUNNER_TEMP/$asset" >/dev/null) ;;
                *) (cd "$dir" && python3 tools/ci_seed_data.py restore "$RUNNER_TEMP/$asset" >/dev/null) ;;
              esac
            done
          done
      - name: Time check-lock per row, base then head
        run: |
          for row in $ROWS; do
            for side in base head; do
              dir=.
              if [ "$side" = base ]; then dir=.bench-base; fi
              log="$RUNNER_TEMP/$side-$row.log"
              start=$(date +%s.%N)
              # The step shell stops on errors; a failing row reports its exit code instead.
              code=0
              (cd "$dir" && timeout 1800 python3 tools/verify_dll.py rom/sm.smc --corpus scenarios --no-build --direct --segment "$row" --mode check-lock --lock scenarios/lock.toml) >"$log" 2>&1 || code=$?
              secs=$(echo "$(date +%s.%N) - $start" | bc)
              ticks=$(grep -oE '\(([0-9]+) ticks' "$log" | grep -oE '[0-9]+' | tail -1)
              rate="?"
              if [ -n "$ticks" ]; then rate=$(echo "scale=1; $ticks / $secs" | bc); fi
              echo "BENCH side=$side row=$row exit=$code seconds=$secs ticks=${ticks:-?} ticks_per_s=$rate"
            done
          done | tee "$RUNNER_TEMP/bench.txt"
          {
            echo "## Replay speed (check-lock), base \`$BASE\` vs head"
            echo
            echo '| row | base ticks/s | head ticks/s |'
            echo '| --- | ---: | ---: |'
            for row in $ROWS; do
              b=$(grep "side=base row=$row " "$RUNNER_TEMP/bench.txt" | grep -oE 'ticks_per_s=[^ ]+' | cut -d= -f2)
              h=$(grep "side=head row=$row " "$RUNNER_TEMP/bench.txt" | grep -oE 'ticks_per_s=[^ ]+' | cut -d= -f2)
              echo "| $row | $b | $h |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
