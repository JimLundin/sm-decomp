name: Quality

# Quality: formatting, line endings, lints, tests, the crate plan's rules, the tools' self-tests and
# the doc links. Adjusted vectors, beside it on its own runner: each Parameter entry's adjusted
# vector, run at the reference rules (its own job because it is the longest step, so the two
# finish together rather than one after the other).
# It needs no ROM.
# ci.yml calls it on pull requests, main pushes, schedules and dispatched runs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Type-check the Python tooling
        # pyproject.toml's [tool.mypy] sets strict mode and the files.
        run: |
          python3 -m venv "$RUNNER_TEMP/fault-tools"
          "$RUNNER_TEMP/fault-tools/bin/pip" install --only-binary=:all: mypy==2.4.1 -r tools/fault-requirements.txt
          "$RUNNER_TEMP/fault-tools/bin/mypy"
      - name: Install the repository toolchain
        run: rustup toolchain install
      # Main pushes restore recent compatible builds and publish this clean revision.
      # Scheduled and manual-main producers stay cold. Other refs only restore.
      - name: Restore the cargo registry and the build
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - &refresh_sources
        name: Refresh source timestamps after restoring a build
        if: steps.cargo_cache.outputs.cache-matched-key != ''
        # Stable Cargo compares source mtimes to the previous build's dep-info.
        run: git ls-files -z | xargs -0r touch -ch --
      - name: Format
        run: cargo fmt --check
      - name: Keep committed text files on LF line endings
        run: |
          crlf=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" { print $NF }')
          if [ -n "$crlf" ]; then echo "Committed with CRLF line endings:"; echo "$crlf"; exit 1; fi
      - name: Lint the rebuild's crates
        run: cargo clippy --locked --workspace --all-targets --no-deps
      - name: Test the rebuild's crates
        run: cargo test --locked --workspace --no-fail-fast
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0
      - name: Hold the crate plan's dependency rules and build scripts
        # ARCHITECTURE §4.2 and D1: deny.toml, from crates/README.md's table.
        run: cargo deny --locked check bans
      - name: Hold the crate plan's source rules
        run: bash tools/check_crate_rules.sh
      - name: Test the clean-room and lane tools
        # Main pushes, scheduled and dispatched main runs test them all; any other ref only those
        # whose subject it changes since main (tools/lane/self_tests.sh).
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then bash tools/lane/self_tests.sh
          else bash tools/lane/self_tests.sh origin/main; fi
      - name: Keep every relative Markdown link and anchor valid
        run: sh tools/check_doc_links.sh
      - name: Keep README.md what tools report --write generates
        run: cargo run --locked -q -p tools --bin tools -- report --check
      - name: Test the shared and parallel replay entrypoints
        run: bash tools/ci/replay_test.sh && bash tools/ci/replay_parallel_test.sh
      - name: Test exact historical replay claim accounting
        run: python3 tools/check_replay_transition_test.py
      - name: Test the planted-fault runner
        run: '"$RUNNER_TEMP/fault-tools/bin/python" -m unittest discover -s tools -p "test_*mutants.py"'
      - name: Test the movie input import
        run: python3 -m unittest discover -s tools -p test_movie_inputs.py
      - name: Test native fixture qualification and publication
        run: python3 -m unittest discover -s tools/ci -p test_publish_native_fixture.py
      - name: Test the oracle capture tools
        run: SM_TOOLS="$PWD/target/debug/tools" python3 -m unittest discover -s tools/oracle -p "test_*.py"
      - name: Test clean cargo cache retention
        run: python3 -m unittest discover -s tools/ci -p test_retain_cargo_caches.py
      - name: Test the landing tool
        run: python3 -m unittest discover -s tools/lane -p test_land.py
      - name: Save the cargo registry and the build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

  adjusted:
    name: Adjusted vectors
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pull requests and pushes run it only when one of its inputs changed since main: the specs,
      # the vectors, the rule owners, the prover and its fixtures, the clean crates it builds and
      # their build inputs. A main push's head passed it as a pull request.
      - name: Find whether an input of the adjusted vectors changed
        id: inputs
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          . tools/lane/changes.sh
          if ! changed_since origin/main docs/behaviours scenarios/vectors crates/clean Cargo.toml Cargo.lock \
            rust-toolchain.toml 'tools/cleanroom/adjusted_*' tools/cleanroom/test_adjusted_vectors_run.py \
            tools/lane/changes.sh .github/workflows/quality.yml; then
            echo unchanged=true >>"$GITHUB_OUTPUT"
          fi
      - name: Install the repository toolchain
        if: steps.inputs.outputs.unchanged != 'true'
        run: rustup toolchain install
      # Restores the Quality job's build, which holds the clean crates' tests; saves nothing.
      - name: Restore the cargo registry and the build
        if: steps.inputs.outputs.unchanged != 'true' && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-quality-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-quality-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-quality-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - *refresh_sources
      - name: Test the adjusted-vector prover
        if: steps.inputs.outputs.unchanged != 'true'
        run: python3 -m unittest discover -s tools/cleanroom -p test_adjusted_vectors_run.py
      - name: Require each adjusted vector to fail at the reference rules
        # MODEL §1 decision 16: a Parameter entry's adjusted vector proves nothing unless its
        # answer depends on the value it changes.
        if: steps.inputs.outputs.unchanged != 'true'
        run: python3 tools/cleanroom/adjusted_vectors_run.py
