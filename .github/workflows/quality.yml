name: Quality

# Quality: formatting, line endings, lints, tests, the crate plan's rules and the doc links.
# It needs no ROM.
# ci.yml calls it on every pull request and push to main.
on:
  workflow_call:

permissions:
  contents: read

# Cargo's checksum freshness is unstable, so the pinned stable toolchain needs RUSTC_BOOTSTRAP
# to accept it. It changes how cargo decides to rebuild, not what is built: no package the
# workspace builds runs a build script, which is what could read RUSTC_BOOTSTRAP and turn
# something on, because vendor/ bakes their outputs in (see the vendor step).
env:
  RUSTC_BOOTSTRAP: "1"
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the repository toolchain
        run: rustup toolchain install
      # The registry and the build, per job (github.job). The nightly and dispatched runs on main
      # restore nothing, build from an empty target and save it as one entry a job, keyed by its
      # commit: storage grows by one clean build a job a night, and GitHub drops the entries no run
      # has read for a week. Every other run restores the newest entry for its toolchain, its
      # Cargo.lock first. Cargo then judges each crate by the checksums of its sources (the
      # workflow's env), not by file times, which a fresh checkout resets: a pull request compiles
      # its own changes and the day's landings, not the workspace.
      - name: Restore the cargo registry and the build
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Format
        run: cargo fmt --check
      - name: Keep committed text files on LF line endings
        run: |
          crlf=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" { print $NF }')
          if [ -n "$crlf" ]; then echo "Committed with CRLF line endings:"; echo "$crlf"; exit 1; fi
      - name: Lint the rebuild's crates
        # Their lint set is the root Cargo.toml's [workspace.lints] (PRINCIPLES K8).
        run: cargo clippy --locked -p data -p import -p game -p runtime -p app -p verify -p tools -p canonical -p canonical_derive -p oracle_record -p types -p samus_movement -p world_blocks -p world_camera -p interface_hud -p run_progress -p samus_appearance -p boss_ceres_ridley -p world_doors --all-targets --no-deps
      - name: Lint the clean crates under the clean room's ceilings (G5)
        # tools/cleanroom/clippy.toml, which export.sh writes as the export's clippy.toml.
        run: CLIPPY_CONF_DIR="$PWD/tools/cleanroom" cargo clippy --locked -p types -p samus_movement -p world_blocks -p world_camera -p interface_hud -p run_progress -p samus_appearance -p boss_ceres_ridley -p world_doors --all-targets --no-deps
      - name: Test the rebuild's crates
        run: cargo test --locked -p canonical -p canonical_derive -p data -p import -p game -p runtime -p app -p verify -p tools -p oracle_record -p types -p samus_movement -p world_blocks -p world_camera -p interface_hud -p run_progress -p samus_appearance -p boss_ceres_ridley -p world_doors --no-fail-fast
      - name: "Report the empty Tick rate (B1 target: 50k Ticks/s)"
        run: cargo run --locked --profile verify -p game --example empty_ticks
      - name: "Report the compositor time per frame (A5 target: 0.3 ms)"
        run: cargo run --locked --profile verify -p runtime --example compose_bench
      - name: Hold the crate plan's dependency and source rules
        # ARCHITECTURE §4.2 and D1; crates/README.md lists each crate's allowed dependencies.
        run: bash tools/check_crate_rules.sh
      - name: Hold the crates in vendor/ to their real build scripts
        # tools/vendor_nobuild.sh bakes each script's output in, for a machine that can't run it; here it runs.
        # Without the workflow's RUSTC_BOOTSTRAP: a published build script that finds it turns on
        # what the stable toolchain doesn't have, and the copies bake the stable answer.
        run: env -u RUSTC_BOOTSTRAP -u CARGO_UNSTABLE_CHECKSUM_FRESHNESS bash tools/vendor_nobuild_check.sh
      - name: Keep every relative Markdown link and anchor valid
        run: sh tools/check_doc_links.sh
      - name: Keep docs/REPORT.md what tools report generates
        run: bash tools/check_report.sh
      - name: Type-check the Python tooling
        # pyproject.toml's [tool.mypy] sets strict mode and the files.
        run: pipx run --spec mypy==2.4.1 mypy
      - name: Test the planted-fault runner
        run: python3 -m unittest discover -s tools -p test_check_mutants.py
      - name: Save the cargo registry and the build
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Test the adjusted-vector prover
        run: python3 -m unittest discover -s tools/cleanroom -p test_adjusted_vectors_run.py
      - name: Require each adjusted vector to fail at the reference rules
        # MODEL §1 decision 16: a Parameter entry's adjusted vector proves nothing unless its
        # answer depends on the value it changes.
        run: python3 tools/cleanroom/adjusted_vectors_run.py
