name: Desktop link

# The desktop still links only with the Windows GNU ABI (crates/sm_app), so one
# nightly job keeps that link working until sm_app moves to its own platform layer.
# Pull requests type-check the same target from Linux in ci.yml.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.passed.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: passed
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: desktop.yml
        run: python3 .github/scripts/already_passed.py

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_BUILD_JOBS: 4
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-native
      - name: Build
        run: |
          foreach ($archive in @('sm_desktop', 'lakesnes_cpu', 'lakesnes_backend', 'sm_config', 'sm_stb_image')) {
            if (!(Test-Path -LiteralPath "$env:LIBRARY_PATH/lib$archive.a")) { throw "Missing native archive: $archive" }
          }
          cargo build --release --locked -p sm_app --bin sm
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
