name: Repository gate 481 f6728a983
on:
  push:
    branches: [lane/s640-481-f6728a983-gate]
    paths: ['.github/workflows/s640-481-f6728a983.yml']
permissions:
  contents: read
jobs:
  landing-gate:
    runs-on: ubuntu-24.04
    env:
      RUSTC_BOOTSTRAP: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f6728a983d6d55f1791227151329f9d931e8e6dc
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the landing commit
        run: |
          git switch -c land/sender-fifo-481
          test "$(git rev-parse HEAD)" = f6728a983d6d55f1791227151329f9d931e8e6dc
          test "$(git rev-parse HEAD^)" = 810db585881826ccf8cda6c236f2f467157aaa6d
          test "$(git rev-parse HEAD^{tree})" = c225817b8cc80e1283a2ef86e15e349f5cc8f4f8
          test -z "$(git status --porcelain)"
          rustup toolchain install
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-quality-Linux-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-f6728a983d6d55f1791227151329f9d931e8e6dc
          restore-keys: |
            cargo-quality-Linux-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
      - name: Run the repository gate
        run: |
          set -euo pipefail
          bash tools/lane/gate.sh | tee "$RUNNER_TEMP/s640-481-f6728a983.txt"
          grep -Fx "GATE OK $(git rev-parse --short HEAD) land/sender-fifo-481" "$RUNNER_TEMP/s640-481-f6728a983.txt"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: s640-481-f6728a983
          path: ${{ runner.temp }}/s640-481-f6728a983.txt
          retention-days: 7
