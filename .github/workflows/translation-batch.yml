name: Translation batch checks (acceptance pending)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-checks:
    name: Frozen Rust source batch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "restart -> target"
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "true"
      - name: Fetch locked dependencies
        run: cargo fetch --manifest-path restart/Cargo.toml --locked
      - name: Check complete batch formatting
        run: cargo fmt --manifest-path restart/Cargo.toml --all --check
      # All features retain private-input gates. Until their approved input
      # provisioning is configured, missing prerequisites must fail this job.
      # Unit tests alone do not establish actual-C or original-ROM agreement.
      - name: Execute workspace tests and controls
        run: cargo test --manifest-path restart/Cargo.toml --workspace --all-targets --all-features --locked --offline --no-fail-fast
      - name: Execute documentation tests
        run: cargo test --manifest-path restart/Cargo.toml --workspace --doc --all-features --locked --offline

  native-preparation:
    name: Pinned recovered-C preparation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "restart -> target"
          cache-bin: "false"
          cache-workspace-crates: "false"
      - name: Fetch pinned recovered C
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml --locked -- prepare-snesrev
      - name: Fetch locked dependencies
        run: cargo fetch --manifest-path restart/Cargo.toml --locked
      - name: Build frozen runtime
        run: cargo build --manifest-path restart/Cargo.toml --bin sm-restart --locked --offline
      - name: Verify native preparation and authenticated reuse
        run: cargo run --manifest-path restart/Cargo.toml -p sm-native-host --example prepare-control --locked --offline -- deps/downloads/snesrev-sm.tar.gz restart/out/batch-native-prepare restart/target/debug/sm-restart
      - name: Reject changed prepared source and library
        env:
          SM_NATIVE_ARCHIVE: ${{ github.workspace }}/deps/downloads/snesrev-sm.tar.gz
          SM_NATIVE_PREPARED_ROOT: ${{ github.workspace }}/restart/out/batch-native-prepare
        run: cargo test --manifest-path restart/Cargo.toml -p sm-native-host --test prepared_integrity --locked --offline -- --ignored
