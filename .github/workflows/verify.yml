# Content import checks and the indexed production replay acceptance.
# The ROM and the replay data stay encrypted at rest; tools/ci/replay_data.py pins the replay data.

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: ''
    secrets:
      SM_ROM_DEPLOY_KEY:
        required: false
      SM_ROM_KEY:
        required: false

permissions:
  contents: read

jobs:
  # One complete index and baseline hold all currently admitted replay claims.
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Main runs, scheduled or dispatched, build cold and publish this clean revision; a dispatched
      # single target restores. Other refs only restore.
      # Cached paths exclude the ROM and records, which are read only at runtime.
      - name: Restore the cargo registry and the build
        if: inputs.target != '' || github.ref != 'refs/heads/main'
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Refresh source timestamps after restoring a build
        if: steps.cargo_cache.outputs.cache-matched-key != ''
        # Stable Cargo compares source mtimes to the previous build's dep-info.
        run: git ls-files -z | xargs -0r touch -ch --
      - &rom
        name: Fetch the encrypted ROM
        uses: actions/checkout@v4
        with:
          repository: JimLundin/ci-data
          ssh-key: ${{ secrets.SM_ROM_DEPLOY_KEY }}
          path: .ci-data
          persist-credentials: false
      # replay_data.py checks the ROM, then installs the record cache and the native fixtures from
      # their one pinned asset as replay-data/cache and replay-data/native.
      - &replay_data
        name: Decrypt the ROM and install the replay data
        env:
          SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
        run: |
          mkdir -p rom
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SM_ROM_KEY -in .ci-data/payload.enc -out rom/sm.smc
          rm -rf .ci-data
          python3 tools/ci/replay_data.py fetch rom/sm.smc "$RUNNER_TEMP/replay-data"
      - name: Run one verification library test
        if: contains(inputs.target, '::')
        env: &witness_env
          VERIFY_TEST: ${{ inputs.target }}
          SM_ROM: ${{ github.workspace }}/rom/sm.smc
          SM_SEARCH_PACKET: ${{ runner.temp }}/replay-data/native/native-search-inputs-v1
          SM_SEARCH_RECEIPT: ${{ runner.temp }}/search-receipt.toml
          SM_SEARCH_FAULT_RECEIPT: ${{ runner.temp }}/search-fault-control.toml
          SM_TOUCH_PACKET: ${{ runner.temp }}/replay-data/native/native-search-order-v1
          SM_TOUCH_RECEIPT: ${{ runner.temp }}/search-touch-receipt.toml
          SM_CACHE: ${{ runner.temp }}/replay-data/cache
          SM_CONNECTED_SOURCE: ${{ runner.temp }}/replay-data/native
          SM_LOCK: ${{ github.workspace }}/scenarios/locks/lsnes.toml
          SM_AUDIO_NATIVE: ${{ runner.temp }}/replay-data/native
        run: python3 tools/ci/required_witnesses.py "$VERIFY_TEST"
      - name: Build the shared replay command
        if: inputs.target == ''
        run: CARGO_INCREMENTAL=1 cargo build --locked --profile verify -p tools
      - name: Play the M0 room alone from its seed
        # Diagnostic: prints the cuts held and where the run stopped, by cut and field name only.
        if: inputs.target == 'played'
        run: |
          for start in 0 6; do
            cargo run --quiet --locked --profile verify -p tools --bin tools -- replay played \
              chain-any-0003-DFD7 "$start" 344 --cache "$RUNNER_TEMP/replay-data/cache" --rom rom/sm.smc \
              --lock scenarios/locks/lsnes.toml
          done
      - name: Check the required witnesses and indexed replay against the reviewed baseline
        if: inputs.target == ''
        env: *witness_env
        run: python3 tools/ci/replay.py baseline "$RUNNER_TEMP/replay-receipt.toml"
      - name: Check one indexed replay case against the reviewed baseline
        if: inputs.target != '' && inputs.target != 'played' && !contains(inputs.target, '::')
        env:
          CARGO_INCREMENTAL: "1"
          REPLAY_CASE: ${{ inputs.target }}
        run: |
          SM_CACHE="$RUNNER_TEMP/replay-data/cache" SM_ROM=rom/sm.smc \
            SM_AUDIO_NATIVE="$RUNNER_TEMP/replay-data/native" \
            python3 tools/ci/replay.py case "$REPLAY_CASE" --write "$RUNNER_TEMP/replay-receipt.toml"
      # data::room's Morph Ball Room test returns early without the ROM, so the content tests run
      # in this job, after the replay steps so that a replay failure doesn't hide their results
      # and theirs doesn't hide the replay's.
      - name: Test the rebuild's content decoders and importers against the ROM
        if: ${{ !cancelled() && inputs.target == '' }}
        run: cargo test --locked -p data -p import --no-fail-fast
      - name: Reproduce a verification failure on this revision
        if: failure()
        run: echo "Reproduce $GITHUB_SHA with gh run rerun $GITHUB_RUN_ID --failed"
      - name: Save the cargo registry and the build
        if: inputs.target == '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

  faults:
    if: inputs.target == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # As the replay job's build: main publishes, other refs restore. tools/check_mutants.py
      # rewrites only the copied sources that differ, so Cargo rebuilds what changed.
      - name: Restore the cargo registry and the selectable build
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: &selectable_cache |
            ~/.cargo/registry
            ~/.cargo/git
            target/selectable-faults
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - *rom
      - *replay_data
      - name: Install the Rust parser for selectable replay faults
        run: |
          python3 -m venv "$RUNNER_TEMP/fault-tools"
          "$RUNNER_TEMP/fault-tools/bin/pip" install --only-binary=:all: -r tools/fault-requirements.txt
      - name: Build one selectable replay binary and check every fault
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          SM_CACHE="$RUNNER_TEMP/replay-data/cache" SM_ROM=rom/sm.smc \
            SM_AUDIO_NATIVE="$RUNNER_TEMP/replay-data/native" \
            "$RUNNER_TEMP/fault-tools/bin/python" tools/check_mutants.py selectable
      - name: Save the cargo registry and the selectable build
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: *selectable_cache
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
