name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke (3,600 frames)
            movie: any%
            frames: 3600
            timeout: 120
          - name: full any%
            movie: any%
            frames: 0
            timeout: 1200
          - name: full low%
            movie: low% (13%)
            frames: 0
            timeout: 1200
          - name: full 100%
            movie: 100%
            frames: 0
            timeout: 1200
    steps:
      - uses: actions/checkout@v4
        with:
          path: game
          persist-credentials: false
      - name: Install SDL2 and toolchain
        working-directory: game
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game
      - name: Format and build
        working-directory: game
        run: |
          cargo fmt --check
          cargo build --release --locked
          sh tools/progress.sh
      - name: Prepare ROM and movie inputs
        working-directory: game
        env:
          MOVIE_CATEGORY: ${{ matrix.movie }}
          ROM_00: ${{ secrets.SM_ROM_00 }}
          ROM_01: ${{ secrets.SM_ROM_01 }}
          ROM_02: ${{ secrets.SM_ROM_02 }}
          ROM_03: ${{ secrets.SM_ROM_03 }}
          ROM_04: ${{ secrets.SM_ROM_04 }}
          ROM_05: ${{ secrets.SM_ROM_05 }}
          ROM_06: ${{ secrets.SM_ROM_06 }}
          ROM_07: ${{ secrets.SM_ROM_07 }}
          ROM_08: ${{ secrets.SM_ROM_08 }}
          ROM_09: ${{ secrets.SM_ROM_09 }}
          ROM_10: ${{ secrets.SM_ROM_10 }}
          ROM_11: ${{ secrets.SM_ROM_11 }}
          ROM_12: ${{ secrets.SM_ROM_12 }}
          ROM_13: ${{ secrets.SM_ROM_13 }}
          ROM_14: ${{ secrets.SM_ROM_14 }}
          ROM_15: ${{ secrets.SM_ROM_15 }}
          ROM_16: ${{ secrets.SM_ROM_16 }}
          ROM_17: ${{ secrets.SM_ROM_17 }}
          ROM_18: ${{ secrets.SM_ROM_18 }}
          ROM_19: ${{ secrets.SM_ROM_19 }}
          ROM_20: ${{ secrets.SM_ROM_20 }}
          ROM_21: ${{ secrets.SM_ROM_21 }}
          ROM_22: ${{ secrets.SM_ROM_22 }}
          ROM_23: ${{ secrets.SM_ROM_23 }}
          ROM_24: ${{ secrets.SM_ROM_24 }}
          ROM_25: ${{ secrets.SM_ROM_25 }}
          ROM_26: ${{ secrets.SM_ROM_26 }}
          ROM_27: ${{ secrets.SM_ROM_27 }}
          ROM_28: ${{ secrets.SM_ROM_28 }}
          ROM_29: ${{ secrets.SM_ROM_29 }}
          ROM_30: ${{ secrets.SM_ROM_30 }}
          ROM_31: ${{ secrets.SM_ROM_31 }}
          ROM_32: ${{ secrets.SM_ROM_32 }}
          ROM_33: ${{ secrets.SM_ROM_33 }}
          ROM_34: ${{ secrets.SM_ROM_34 }}
          ROM_35: ${{ secrets.SM_ROM_35 }}
          ROM_36: ${{ secrets.SM_ROM_36 }}
          ROM_37: ${{ secrets.SM_ROM_37 }}
          ROM_38: ${{ secrets.SM_ROM_38 }}
          ROM_39: ${{ secrets.SM_ROM_39 }}
          ROM_40: ${{ secrets.SM_ROM_40 }}
          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
          ROM_44: ${{ secrets.SM_ROM_44 }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, os, pathlib, subprocess, sys, tomllib, urllib.request, zipfile
          encoded = "".join(os.environ[f"ROM_{i:02d}"] for i in range(45))
          if not encoded:
              raise SystemExit("ROM secrets are missing")
          pathlib.Path("rom/sm.smc").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          rom = pathlib.Path('rom/sm.smc').read_bytes()
          assert hashlib.sha1(rom).hexdigest() == 'da957f0d63d14cb441d215462904c4fa8519c613', 'wrong ROM'
          movies = tomllib.loads(pathlib.Path('movies/manifest.toml').read_text())['movies']
          movie = next(movie for movie in movies if movie['category'] == os.environ['MOVIE_CATEGORY'])
          data = urllib.request.urlopen(movie['download'], timeout=60).read()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if 'input' not in archive.namelist() and 'Input Log.txt' not in archive.namelist():
                  data = archive.read(next(name for name in archive.namelist() if name.lower().endswith(('.lsmv', '.bk2'))))
          assert hashlib.sha256(data).hexdigest() == movie['sha256'], 'wrong movie'
          movie_path = pathlib.Path('movies', movie['file'])
          movie_path.write_bytes(data)
          subprocess.run([sys.executable, 'tools/movie_inputs.py', str(movie_path),
                          'movies/verify.inputs', '--rom', 'rom/sm.smc'], check=True)
          PY
      - name: Verify movie
        working-directory: game
        env:
          VERIFY_FRAMES: ${{ matrix.frames }}
          VERIFY_TIMEOUT: ${{ matrix.timeout }}
        run: |
          args=()
          if [ "$VERIFY_FRAMES" -gt 0 ]; then
            args+=(--frames "$VERIFY_FRAMES")
          fi
          timeout "$VERIFY_TIMEOUT" target/release/sm verify rom/sm.smc movies/verify.inputs "${args[@]}"
