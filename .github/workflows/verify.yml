name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: game
          persist-credentials: false
      - name: Install SDL2 and toolchain
        working-directory: game
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game
      - name: Format and build
        working-directory: game
        run: |
          cargo fmt --check
          cargo build --release --locked
          sh tools/progress.sh
      - name: Prepare ROM and any% inputs
        working-directory: game
        env:
          ROM_00: ${{ secrets.SM_ROM_00 }}
          ROM_01: ${{ secrets.SM_ROM_01 }}
          ROM_02: ${{ secrets.SM_ROM_02 }}
          ROM_03: ${{ secrets.SM_ROM_03 }}
          ROM_04: ${{ secrets.SM_ROM_04 }}
          ROM_05: ${{ secrets.SM_ROM_05 }}
          ROM_06: ${{ secrets.SM_ROM_06 }}
          ROM_07: ${{ secrets.SM_ROM_07 }}
          ROM_08: ${{ secrets.SM_ROM_08 }}
          ROM_09: ${{ secrets.SM_ROM_09 }}
          ROM_10: ${{ secrets.SM_ROM_10 }}
          ROM_11: ${{ secrets.SM_ROM_11 }}
          ROM_12: ${{ secrets.SM_ROM_12 }}
          ROM_13: ${{ secrets.SM_ROM_13 }}
          ROM_14: ${{ secrets.SM_ROM_14 }}
          ROM_15: ${{ secrets.SM_ROM_15 }}
          ROM_16: ${{ secrets.SM_ROM_16 }}
          ROM_17: ${{ secrets.SM_ROM_17 }}
          ROM_18: ${{ secrets.SM_ROM_18 }}
          ROM_19: ${{ secrets.SM_ROM_19 }}
          ROM_20: ${{ secrets.SM_ROM_20 }}
          ROM_21: ${{ secrets.SM_ROM_21 }}
          ROM_22: ${{ secrets.SM_ROM_22 }}
          ROM_23: ${{ secrets.SM_ROM_23 }}
          ROM_24: ${{ secrets.SM_ROM_24 }}
          ROM_25: ${{ secrets.SM_ROM_25 }}
          ROM_26: ${{ secrets.SM_ROM_26 }}
          ROM_27: ${{ secrets.SM_ROM_27 }}
          ROM_28: ${{ secrets.SM_ROM_28 }}
          ROM_29: ${{ secrets.SM_ROM_29 }}
          ROM_30: ${{ secrets.SM_ROM_30 }}
          ROM_31: ${{ secrets.SM_ROM_31 }}
          ROM_32: ${{ secrets.SM_ROM_32 }}
          ROM_33: ${{ secrets.SM_ROM_33 }}
          ROM_34: ${{ secrets.SM_ROM_34 }}
          ROM_35: ${{ secrets.SM_ROM_35 }}
          ROM_36: ${{ secrets.SM_ROM_36 }}
          ROM_37: ${{ secrets.SM_ROM_37 }}
          ROM_38: ${{ secrets.SM_ROM_38 }}
          ROM_39: ${{ secrets.SM_ROM_39 }}
          ROM_40: ${{ secrets.SM_ROM_40 }}
          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, os, pathlib, tomllib, urllib.request, zipfile
          encoded = "".join(os.environ[f"ROM_{i:02d}"] for i in range(44))
          if not encoded:
              raise SystemExit("ROM secrets are missing")
          pathlib.Path("rom/sm.smc").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          rom = pathlib.Path('rom/sm.smc').read_bytes()
          assert hashlib.sha1(rom).hexdigest() == 'da957f0d63d14cb441d215462904c4fa8519c613', 'wrong ROM'
          movie = tomllib.loads(pathlib.Path('movies/manifest.toml').read_text())['movies'][0]
          data = urllib.request.urlopen(movie['download'], timeout=60).read()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if 'input' not in archive.namelist():
                  data = archive.read(next(name for name in archive.namelist() if name.endswith('.lsmv')))
          assert hashlib.sha256(data).hexdigest() == movie['sha256'], 'wrong movie'
          pathlib.Path('movies', movie['file']).write_bytes(data)
          PY
          python3 tools/movie_inputs.py movies/super-metroid-any-3653.lsmv movies/any.inputs --rom rom/sm.smc
      - name: Verify first minute
        working-directory: game
        run: timeout 120 target/release/sm verify rom/sm.smc movies/any.inputs --frames 3600
      - name: Verify full any% movie
        working-directory: game
        run: timeout 1200 target/release/sm verify rom/sm.smc movies/any.inputs
