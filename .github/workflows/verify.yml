name: Verify

# Verify: the replay pipeline. One plan, one verifier build, the replay matrix, coverage
# when asked, and one result. Scope gate replays every locked scenario engine-only against
# the oracle lock, lockstep for what the lock cannot hold, and the ROM import check; a pull
# request that changes no replay-relevant file skips it (sm_pipeline relevant).
# Scope full adds lockstep of the whole corpus and both routes, and stops if a scheduled run
# already passed this commit. Scope rows runs chosen rows; scope coverage reports what the
# corpus never executes. See crates/sm_tools/src/bin/sm_pipeline/plan.rs.
# The ROM is encrypted in the private ci-data repository. ROM-derived files stay private,
# and fetching it needs secrets, so only in-repo branches run it.
# A called workflow sees its caller's github context: run lookups name ci.yml.
on:
  workflow_call:
    inputs:
      scope:
        description: gate, full, rows or coverage
        type: string
        required: true
      segments:
        description: Space-separated row ids (scope rows)
        type: string
        default: ''
      oracle:
        description: Oracle for lockstep (patched = snesrev compatibility patches, faithful = original game logic)
        type: string
        default: patched
      audio_trace:
        description: Check each lockstep row's ordered Cue/port trace against the physical-audio oracle
        type: boolean
        default: false
      oracle_sample:
        description: With scope full, re-record a rotating sample of at least 30 faithful locks
        type: boolean
        default: false
      cover_routes:
        description: With scope coverage, also replay both routes instrumented
        type: boolean
        default: false
    secrets:
      SM_ROM_DEPLOY_KEY:
        required: false
      SM_ROM_KEY:
        required: false

permissions:
  contents: read

env:
  SCOPE: ${{ inputs.scope }}

jobs:
  verify-plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ (steps.passed.outputs.skip == 'true' || steps.relevant.outputs.skip == 'true') && 'true' || 'false' }}
      matrix: ${{ steps.plan.outputs.matrix }}
      first: ${{ steps.plan.outputs.first }}
      first_count: ${{ steps.plan.outputs.first_count }}
      movie_file: ${{ steps.plan.outputs.movie_file }}
      movie_sha256: ${{ steps.plan.outputs.movie_sha256 }}
    steps:
      - uses: actions/checkout@v4
      # The pipeline tool (crates/sm_tools/src/bin/sm_pipeline) needs only the standard library.
      - name: Build sm_pipeline
        run: rustc --edition=2024 -O -o "$RUNNER_TEMP/sm_pipeline" crates/sm_tools/src/bin/sm_pipeline/main.rs
      # A scheduled run stops when an earlier scheduled run passed this commit.
      - id: passed
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ci.yml
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?event=schedule&status=success&head_sha=$GITHUB_SHA&per_page=1" --jq .total_count)
            if [ "$passed" -gt 0 ]; then skip=true; fi
          fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"
      # A pull request that changes only docs, skills or measurement tools replays nothing:
      # it skips when every file it changes against its base, or against a recent head that
      # passed Verify on its branch, is irrelevant. A comparison that cannot be fetched
      # counts as relevant. Scheduled and dispatched runs never skip here.
      - id: relevant
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ci.yml
        run: |
          skip=false
          reason="not a pull request"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            reason="replay-relevant files changed"
            head=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
            branch=$(jq -r .pull_request.head.ref "$GITHUB_EVENT_PATH")
            base=$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH")
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?event=pull_request&status=success&branch=$branch&per_page=5" --jq '.workflow_runs[].head_sha' || true)
            for since in $base $passed; do
              if git fetch --quiet --depth=1 origin "$since" "$head" \
                && files=$(git diff --name-only "$since" "$head") \
                && "$RUNNER_TEMP/sm_pipeline" relevant <<<"$files"; then
                skip=true
                reason="only non-replay files changed since ${since:0:12}: $(paste -sd ' ' <<<"$files")"
                break
              fi
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip: $reason"
      - id: plan
        env:
          ORACLE: ${{ inputs.oracle }}
          SELECTED: ${{ inputs.segments }}
          ORACLE_SAMPLE: ${{ inputs.oracle_sample && '1' || '' }}
          COVER_ROUTES: ${{ inputs.cover_routes && '1' || '' }}
        # The Rust planner. Its golden plans test (plan_golden.rs) holds it to the plans
        # the deleted plan_verify.py wrote.
        run: |
          "$RUNNER_TEMP/sm_pipeline" plan

  verify-build:
    needs: verify-plan
    if: needs.verify-plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      rust: ${{ steps.rust.outputs.version }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      RUSTFLAGS: ${{ inputs.scope == 'coverage' && '-D warnings -C instrument-coverage -C link-dead-code' || '-D warnings' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verifier
        with:
          flavour: ${{ inputs.scope == 'coverage' && 'coverage' || 'plain' }}
      - id: rust
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Run the verifier's units
        if: inputs.scope != 'coverage'
        run: python3 tools/verify_dll.py --unit-tests --no-build --direct
      # The units step above already checked the verifier's source stamp and library.
      - name: Check the verifier's actor capabilities
        if: inputs.scope != 'coverage'
        run: |
          capabilities=$(target/verify-host/sm_verify --host-capabilities)
          for name in sm_verify_actor_movement_case sm_verify_actor_movement_table_case sm_verify_actor_population_animation_case; do
            if ! grep -qxF "$name" <<<"$capabilities"; then
              echo "Cargo verifier missing required capability: $name"
              exit 1
            fi
          done
          echo "Cargo verifier has all three actor capabilities"
      - name: Run the target packages' tests instrumented
        if: inputs.scope == 'coverage'
        run: python3 -B .github/scripts/coverage_tests.py target/coverage-unit
      - name: Package the verifier
        # A tar keeps the executable bit, and the paths verify_dll.py expects.
        run: |
          test -x target/verify-host/sm_verify
          files="target/verify-host/sm_verify"
          if [ -d target/coverage-unit ]; then files="$files target/coverage-unit"; fi
          tar -cf verifier.tar $files
      - uses: actions/upload-artifact@v4
        with:
          name: verifier
          path: verifier.tar
          retention-days: 1

  verify-replay:
    needs: [verify-plan, verify-build]
    if: needs.verify-plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # Other repositories share the account's 20 jobs; leave two for them and CI.
      max-parallel: 18
      matrix: ${{ fromJson(needs.verify-plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verifier
      - run: tar -xf verifier.tar
      - &movie
        name: Cache the pinned movie download
        if: contains(matrix.kinds, 'route')
        uses: actions/cache@v4
        with:
          path: movies/${{ needs.verify-plan.outputs.movie_file }}
          key: ${{ runner.os }}-movie-${{ needs.verify-plan.outputs.movie_sha256 }}
      - &rom
        name: Fetch the encrypted ROM
        uses: actions/checkout@v4
        with:
          repository: JimLundin/ci-data
          ssh-key: ${{ secrets.SM_ROM_DEPLOY_KEY }}
          path: .ci-data
          persist-credentials: false
      # Decrypt the ROM, check its SHA-1, then remove the ci-data checkout.
      - &decrypt
        name: Decrypt the ROM
        env:
          SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
        run: |
          mkdir -p rom
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SM_ROM_KEY -in .ci-data/payload.enc -out rom/sm.smc
          if ! echo "da957f0d63d14cb441d215462904c4fa8519c613  rom/sm.smc" | sha1sum --check; then
            rm -f rom/sm.smc
            echo "wrong ROM"
            exit 1
          fi
          rm -rf .ci-data
      - &replay
        name: Restore and replay
        env:
          JOB: ${{ toJSON(matrix) }}
          ORACLE: ${{ inputs.oracle }}
          AUDIO_TRACE: ${{ inputs.audio_trace && '1' || '' }}
          LLVM_PROFILE_FILE: ${{ inputs.scope == 'coverage' && format('{0}/profiles/%p-%m.profraw', github.workspace) || '' }}
        run: python3 -B .github/scripts/replay_job.py
      - uses: actions/upload-artifact@v4
        if: always() && inputs.scope == 'coverage'
        with:
          name: profiles-${{ matrix.kinds == 'room' && 'route-' || '' }}${{ strategy.job-index }}
          path: profiles
          retention-days: 2
          if-no-files-found: warn

  # The gate's longest jobs (sm_pipeline plan's floor jobs) set its wall time. Each builds its own
  # verifier, so it queues for a runner alongside verify-build rather than after it.
  verify-replay-first:
    needs: verify-plan
    if: needs.verify-plan.outputs.skip != 'true' && needs.verify-plan.outputs.first_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.verify-plan.outputs.first) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verifier
      - *movie
      - *rom
      - *decrypt
      - *replay

  verify-coverage:
    needs: [verify-build, verify-replay]
    if: always() && inputs.scope == 'coverage' && needs.verify-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verifier
      - run: tar -xf verifier.tar
      - uses: actions/download-artifact@v4
        with:
          pattern: profiles-*
          path: all-profiles
          # One directory per job: jobs reuse process ids, so merged names would collide.
          merge-multiple: false
      - name: Merge the profiles and summarise engine coverage
        env:
          RUST_VERSION: ${{ needs.verify-build.outputs.rust }}
        run: python3 -B .github/scripts/coverage_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.md
          retention-days: 30

  verify:
    name: Verify result
    needs: [verify-plan, verify-build, verify-replay, verify-replay-first, verify-coverage]
    if: always() && needs.verify-plan.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      # A red nightly reopens and comments on its issue.
      issues: write
    steps:
      - name: Require every planned job to pass
        env:
          PLAN: ${{ needs.verify-plan.result }}
          BUILD: ${{ needs.verify-build.result }}
          REPLAY: ${{ needs.verify-replay.result }}
          REPLAY_FIRST: ${{ needs.verify-replay-first.result }}
          COVERAGE: ${{ needs.verify-coverage.result }}
          SKIP: ${{ needs.verify-plan.outputs.skip }}
          FIRST: ${{ needs.verify-plan.outputs.first_count }}
        run: |
          failed=0
          require() {
            echo "$1: $2"
            if [ "$2" != success ]; then failed=1; fi
          }
          require verify-plan "$PLAN"
          if [ "$SKIP" != true ]; then
            require verify-build "$BUILD"
            require verify-replay "$REPLAY"
            if [ "$FIRST" != 0 ]; then require verify-replay-first "$REPLAY_FIRST"; fi
            if [ "$SCOPE" = coverage ]; then require verify-coverage "$COVERAGE"; fi
          fi
          exit "$failed"
      # Nobody watches the nightly, so a red one reopens the issue titled below (or opens
      # it), assigned to the repository owner, and comments with the run.
      - name: Report a red nightly on its issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly Verify is red
        run: |
          body="Nightly Verify failed on ${GITHUB_SHA::9}: $RUN"
          number=$(gh issue list --state all --search "$TITLE in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue reopen "$number" || true
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

  # The rebuild's content tests read the real ROM (data::room's Morph Ball Room test returns
  # early without it), so they run here, where the ROM is decrypted, independent of the old plan.
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - *rom
      - *decrypt
      - name: Test the rebuild's content decoders against the ROM
        run: cargo test --locked -p data --no-fail-fast

  # The free-run gate (ARCHITECTURE D22) on the slice-0 rows: each row runs from its seed's
  # record in the relock bundle on the content read from the ROM, and the job fails when a
  # (row, stream) pair in scenarios/locks/lsnes.green.txt is no longer green. Never --update
  # here: the ratchet grows by a commit. `tools` doesn't link the emulator.
  free-run-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROWS: area-brinstar item-morph-ball
    steps:
      - uses: actions/checkout@v4
      - *rom
      - *decrypt
      - name: Fetch the relock bundle and check its pin
        run: |
          # The lock's one bundles entry: its ci-data name and its ciphertext's SHA-256.
          entry='^bundles = \[\{ name = "([^"]+)", sha256 = "([0-9a-f]{64})" \}\]$'
          line=$(grep -E "$entry" scenarios/locks/lsnes.toml)
          name=$(sed -E "s/$entry/\1/" <<<"$line")
          sha=$(sed -E "s/$entry/\2/" <<<"$line")
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/relock.tar.gz.enc" \
            "https://github.com/JimLundin/sm-decomp/releases/download/ci-data/$name"
          echo "$sha  $RUNNER_TEMP/relock.tar.gz.enc" | sha256sum --check
      - name: Decrypt the relock bundle
        run: |
          # The seed bundles' passphrase: sha256("sm-decomp-seeds-v1" + ROM) (tools/ci_seed_data.py).
          SM_SEED_PASSPHRASE=$({ printf 'sm-decomp-seeds-v1'; cat rom/sm.smc; } | sha256sum | cut -d' ' -f1)
          export SM_SEED_PASSPHRASE
          mkdir -p "$RUNNER_TEMP/relock"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:SM_SEED_PASSPHRASE \
            -in "$RUNNER_TEMP/relock.tar.gz.enc" | tar -xz -C "$RUNNER_TEMP/relock"
          rm "$RUNNER_TEMP/relock.tar.gz.enc"
      - name: Build tools
        run: cargo build --locked --release -p tools
      - name: "Free-run gate: slice-0 rows against the green ratchet"
        run: |
          # shellcheck disable=SC2086 # ROWS is a list of row ids.
          target/release/tools gate scenarios/locks/lsnes.toml "$RUNNER_TEMP/relock/relock-v2-lsnes" \
            rom/sm.smc scenarios/locks/lsnes.green.txt $ROWS

  # The lockstep ratchet (scenarios/locks/lockstep.ratchet.txt): each row's record cache
  # (A2) replays engine-only in lockstep, and the job fails when a row's fully equal Ticks
  # fall or a group's differing Ticks rise. The cache is a ci-data asset packed by
  # tools/ci/pack_lockstep_cache.sh and pinned here by name and ciphertext SHA-256; a new
  # cache is a new asset and a commit that repins it.
  lockstep-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CACHE_ASSET: lockstep-cache-19ca14d51ae1f67e.tar.xz.enc
      CACHE_SHA256: 46e9eeab8e9c1ec61b7c6c056d4a8af27dee2daa31f3cc997fcdd81637d03620
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the record cache and check its pin
        run: |
          if ! grep -qE '^[0-9a-f]{64}$' <<<"$CACHE_SHA256"; then
            echo "::error::CACHE_SHA256 is not pinned: upload $CACHE_ASSET to ci-data and set its SHA-256"
            exit 1
          fi
          if ! curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/cache.tar.xz.enc" \
            "https://github.com/JimLundin/sm-decomp/releases/download/ci-data/$CACHE_ASSET"; then
            echo "::error::$CACHE_ASSET is not on the ci-data release"
            exit 1
          fi
          echo "$CACHE_SHA256  $RUNNER_TEMP/cache.tar.xz.enc" | sha256sum --check
      - *rom
      - *decrypt
      - name: Decrypt and unpack the record cache
        run: |
          # The seed bundles' passphrase: sha256("sm-decomp-seeds-v1" + ROM) (tools/ci_seed_data.py).
          SM_SEED_PASSPHRASE=$({ printf 'sm-decomp-seeds-v1'; cat rom/sm.smc; } | sha256sum | cut -d' ' -f1)
          export SM_SEED_PASSPHRASE
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cache"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:SM_SEED_PASSPHRASE \
            -in "$RUNNER_TEMP/cache.tar.xz.enc" | tar -xJ -C "$RUNNER_TEMP/cache"
          rm "$RUNNER_TEMP/cache.tar.xz.enc"
      - name: "Lockstep ratchet: the record cache against scenarios/locks/lockstep.ratchet.txt"
        run: |
          # A renamed test would filter to nothing and pass, so require its report.
          set -o pipefail
          SM_CACHE="$RUNNER_TEMP/cache" SM_ROM="$PWD/rom/sm.smc" \
            cargo test --locked -p verify --release committed_ratchet_holds_against_the_cache -- --nocapture \
            | tee "$RUNNER_TEMP/ratchet.txt"
          grep -q '^ratchet holds: ' "$RUNNER_TEMP/ratchet.txt"
