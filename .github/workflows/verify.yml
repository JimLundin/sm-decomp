# Content import checks and the indexed production replay acceptance.
# ROM and captured fixture bytes remain encrypted in the pinned CI assets.

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: ''
    secrets:
      SM_ROM_DEPLOY_KEY:
        required: false
      SM_ROM_KEY:
        required: false

permissions:
  contents: read

# Cargo's checksum freshness is unstable, so the pinned stable toolchain needs RUSTC_BOOTSTRAP
# to accept it. It changes how cargo decides to rebuild, not what is built: no package the
# workspace builds runs a build script, which is what could read RUSTC_BOOTSTRAP and turn
# something on, because vendor/ bakes their outputs in (quality.yml's vendor step).
env:
  RUSTC_BOOTSTRAP: "1"
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"

jobs:
  # The rebuild's content tests read the real ROM (data::room's Morph Ball Room test returns
  # early without it), so they run here, where the ROM is decrypted.
  content:
    if: inputs.target == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Main pushes restore recent compatible builds and publish this clean revision.
      # Scheduled and manual-main producers stay cold. Other refs only restore.
      # Cargo checksum freshness rebuilds changed sources; tests always execute.
      # Cached paths exclude the ROM and records, which are read only at runtime.
      - &cache
        name: Restore the cargo registry and the build
        if: inputs.target != '' || (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job == 'faults' && 'replay' || github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ github.job == 'faults' && 'replay' || github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ github.job == 'faults' && 'replay' || github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - &rom
        name: Fetch the encrypted ROM
        uses: actions/checkout@v4
        with:
          repository: JimLundin/ci-data
          ssh-key: ${{ secrets.SM_ROM_DEPLOY_KEY }}
          path: .ci-data
          persist-credentials: false
      # Decrypt the ROM, check its SHA-1, then remove the ci-data checkout.
      - &decrypt
        name: Decrypt the ROM
        env:
          SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
        run: |
          mkdir -p rom
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SM_ROM_KEY -in .ci-data/payload.enc -out rom/sm.smc
          if ! echo "da957f0d63d14cb441d215462904c4fa8519c613  rom/sm.smc" | sha1sum --check; then
            rm -f rom/sm.smc
            echo "wrong ROM"
            exit 1
          fi
          rm -rf .ci-data
      - name: Test the rebuild's content decoders and importers against the ROM
        run: cargo test --locked -p data -p import --no-fail-fast
      - &cache_save
        name: Save the cargo registry and the build
        if: inputs.target == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

  # One complete index and baseline hold all currently admitted replay claims.
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: &replay_fixtures
      CACHE_ASSET: lockstep-cache-5663de2c4b548c68.tar.xz.enc
      CACHE_SHA256: 4101a60be21f26718004c607e7b031a3ac3ac934864c1f22235465e377c41b7f
      # Root pins the validated fixture set after uploading its ciphertext.
      AUDIO_NATIVE_ASSET: "audio-native-4673e83ed4401dc3.tar.xz.enc"
      AUDIO_NATIVE_SHA256: "52d1749f28918506889986434dbc03cbf039afe4d0487f10249f02c95974917a"
    steps:
      - uses: actions/checkout@v4
      - *cache
      - &fetch_cache
        name: Fetch the record cache and check its pin
        run: |
          if ! grep -qE '^[0-9a-f]{64}$' <<<"$CACHE_SHA256"; then
            echo "::error::CACHE_SHA256 is not pinned: upload $CACHE_ASSET to ci-data and set its SHA-256"
            exit 1
          fi
          # The release host answers 504 at times: back off for up to ten minutes.
          if ! curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 15 --retry-all-errors --retry-max-time 600 \
            --output "$RUNNER_TEMP/cache.tar.xz.enc" \
            "https://github.com/JimLundin/sm-decomp/releases/download/ci-data/$CACHE_ASSET"; then
            echo "::error::$CACHE_ASSET could not be fetched from the ci-data release"
            exit 1
          fi
          echo "$CACHE_SHA256  $RUNNER_TEMP/cache.tar.xz.enc" | sha256sum --check
      - *rom
      - *decrypt
      - &unpack_cache
        name: Decrypt and unpack the record cache
        run: |
          # The seed bundles' passphrase: sha256("sm-decomp-seeds-v1" + ROM) (docs/ORACLE.md).
          SM_SEED_PASSPHRASE=$({ printf 'sm-decomp-seeds-v1'; cat rom/sm.smc; } | sha256sum | cut -d' ' -f1)
          export SM_SEED_PASSPHRASE
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cache"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:SM_SEED_PASSPHRASE \
            -in "$RUNNER_TEMP/cache.tar.xz.enc" | tar -xJ -C "$RUNNER_TEMP/cache"
          rm "$RUNNER_TEMP/cache.tar.xz.enc"
      - &audio_native
        name: Fetch and validate the pinned native fixtures and continuation seed
        run: bash tools/ci/fetch_audio_native.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
      - &sender_offers
        name: Fetch observed sender offer windows
        run: bash tools/ci/fetch_sender_offers.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
      - &movement_touchdown
        name: Fetch the native Movement touchdown witnesses
        run: bash tools/ci/fetch_movement_touchdown.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
      - &movement_opportunities
        name: Fetch the reviewed movement opportunity evidence
        run: bash tools/ci/fetch_movement_opportunities.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
      - &connected_ordinary
        name: Fetch the reviewed connected ordinary opportunities
        run: |
          bash tools/ci/fetch_connected_ordinary.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
          bash tools/ci/fetch_connected_run_slope.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
          bash tools/ci/fetch_movement_early_map.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
      - &shot_drawing
        name: Fetch the reviewed scoped power shot witness
        run: bash tools/ci/fetch_shot_contact.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
      - &native_search
        name: Fetch and qualify the pinned native search packets
        run: bash tools/ci/fetch_native_search_packets.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
      - &health_tail
        name: Fetch the scoped Health tail origin and independent witnesses
        run: bash tools/ci/fetch_health_tail.sh rom/sm.smc "$RUNNER_TEMP/audio-native"
      - name: Run one verification library test
        if: contains(inputs.target, '::')
        env: &witness_env
          VERIFY_TEST: ${{ inputs.target }}
          SM_ROM: ${{ github.workspace }}/rom/sm.smc
          SM_SEARCH_PACKET: ${{ runner.temp }}/audio-native/native-search-inputs-v1
          SM_SEARCH_RECEIPT: ${{ runner.temp }}/search-receipt.toml
          SM_SEARCH_FAULT_RECEIPT: ${{ runner.temp }}/search-fault-control.toml
          SM_TOUCH_PACKET: ${{ runner.temp }}/audio-native/native-search-order-v1
          SM_TOUCH_RECEIPT: ${{ runner.temp }}/search-touch-receipt.toml
          SM_CACHE: ${{ runner.temp }}/cache
          SM_CONNECTED_SOURCE: ${{ runner.temp }}/audio-native
          SM_LOCK: ${{ github.workspace }}/scenarios/locks/lsnes.toml
          SM_AUDIO_NATIVE: ${{ runner.temp }}/audio-native
        run: python3 tools/ci/required_witnesses.py "$VERIFY_TEST"
      - name: Build the shared replay command
        if: inputs.target == ''
        # Fault workers can reuse compiler state from a clean main replay build.
        run: CARGO_INCREMENTAL=1 cargo build --locked --profile verify -p tools
      - name: Play the M0 room alone from its seed
        # Diagnostic: prints the cuts held and where the run stopped, by cut and field name only.
        if: inputs.target == 'played'
        run: |
          for start in 0 6; do
            cargo run --quiet --locked --profile verify -p tools --bin tools -- replay played \
              chain-any-0003-DFD7 "$start" 344 --cache "$RUNNER_TEMP/cache" --rom rom/sm.smc \
              --lock scenarios/locks/lsnes.toml
          done
      - name: Check the required witnesses and indexed replay against the reviewed baseline
        if: inputs.target == ''
        env: *witness_env
        run: bash tools/ci/replay_parallel.sh "$RUNNER_TEMP/replay-receipt.toml"
      - name: Check one indexed replay case against the reviewed baseline
        if: inputs.target != '' && inputs.target != 'played' && !contains(inputs.target, '::')
        env:
          CARGO_INCREMENTAL: "1"
          REPLAY_CASE: ${{ inputs.target }}
        run: |
          SM_CACHE="$RUNNER_TEMP/cache" SM_ROM=rom/sm.smc \
            SM_AUDIO_NATIVE="$RUNNER_TEMP/audio-native" \
            bash tools/ci/replay.sh --case "$REPLAY_CASE" --write "$RUNNER_TEMP/replay-receipt.toml"
      - name: Reproduce a verification failure on this revision
        if: failure()
        run: echo "Reproduce $GITHUB_SHA with gh run rerun $GITHUB_RUN_ID --failed"
      - *cache_save

  fault-plan:
    if: inputs.target == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      proven: ${{ steps.pr.outputs.proven }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the pull-request verdict for a main fast-forward
        id: pr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.forced && !github.event.created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs are indexed by PR head, but checkout in PR CI tests the merge tree.
          api="repos/$GITHUB_REPOSITORY"
          tested=$(timeout 15s gh api "$api/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0] | select(.conclusion == "success" and .head_repository.id == .repository.id)
              | .repository.full_name as $repo | .referenced_workflows[]
              | select(.path == ($repo + "/.github/workflows/verify.yml@" + .sha)
                and (.ref // "" | test("^refs/pull/[1-9][0-9]*/merge$"))) | .sha') || exit 0
          [[ "$tested" =~ ^[0-9a-f]{40}$ ]] || exit 0
          tree=$(timeout 15s gh api "$api/git/commits/$tested" --jq .tree.sha) || exit 0
          landed=$(git rev-parse 'HEAD^{tree}')
          if [[ "$tree" == "$landed" ]]; then
            echo "Pull-request CI passed on this tree ($tree)."
            echo "proven=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan the exhaustive fault matrix
        id: plan
        run: |
          matrix=$(python3 tools/check_mutants.py plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each runner owns its checkout and mutable Cargo target. Only replay saves this cache family.
  faults:
    needs: fault-plan
    if: needs.fault-plan.outputs.proven != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fault-plan.outputs.matrix) }}
    env: *replay_fixtures
    steps:
      - uses: actions/checkout@v4
      - *cache
      - *fetch_cache
      - *rom
      - *decrypt
      - *unpack_cache
      - *audio_native
      - *sender_offers
      - *movement_touchdown
      - *movement_opportunities
      - *connected_ordinary
      - *shot_drawing
      - *native_search
      - *health_tail
      - name: Verify recorded bridge fault rejection and exact restoration
        env:
          CARGO_INCREMENTAL: "1"
          WORKER: ${{ matrix.worker }}
        run: |
          SM_CACHE="$RUNNER_TEMP/cache" SM_ROM=rom/sm.smc \
            SM_AUDIO_NATIVE="$RUNNER_TEMP/audio-native" \
            python3 tools/check_mutants.py worker "$WORKER"
