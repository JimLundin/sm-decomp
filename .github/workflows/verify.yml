          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
          ROM_44: ${{ secrets.SM_ROM_44 }}
        run: python3 -B .github/scripts/replay_job.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-prefix-${{ matrix.prefix_chain }}-${{ env.PREFIX_STAGE }}
          path: |
            prefix-transfer/checkpoint.tar.gz.enc
            prefix-transfer/checkpoint.tar.gz.enc.sha256
