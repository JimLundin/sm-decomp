  coverage-report:
    needs: [build, ready-replay, checkpoint-replay]
    if: always() && inputs.scope == 'coverage' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verifier
      - run: |
          tar -xf verifier.tar
          echo "LIBRARY_PATH=$GITHUB_WORKSPACE/target/verify-native/lib" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: profiles-*
          path: all-profiles
          # One directory per job: jobs reuse process ids, so merged names would collide.
          merge-multiple: false
      - name: Merge the profiles and summarise engine coverage
        env:
          RUST_VERSION: ${{ needs.build.outputs.rust }}
        run: python3 -B .github/scripts/coverage_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.md
          retention-days: 30

  result:
    name: ${{ (inputs.scope == 'full' || github.event_name == 'schedule') && needs.plan.outputs.skip != 'true' && 'Verify full result' || 'Verify partial or reused result' }}
    needs: [plan, build, ready-replay, checkpoint-replay, coverage-report, prefix_00, prefix_01, prefix_02, prefix_03, prefix_04, prefix_05, prefix_06, prefix_07, prefix_08, prefix_09, prefix_10, prefix_11, prefix_12, prefix_13, prefix_14, prefix_15, prefix_16, prefix_17, prefix_18, prefix_19, prefix_20, prefix_21, prefix_22, prefix_23, prefix_24, prefix_25, prefix_26, prefix_27]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every planned job and required prefix to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          SKIP: ${{ needs.plan.outputs.skip }}
          PREFIX_STAGES: ${{ needs.plan.outputs.prefix_stages }}
          READY_COUNT: ${{ needs.plan.outputs.ready_count }}
          CHECKPOINT_COUNT: ${{ needs.plan.outputs.checkpoint_count }}
        run: |
          python3 -B - <<'PY'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          assert needs['plan']['result'] == 'success'
          if os.environ['SKIP'] != 'true':
              assert needs['build']['result'] == 'success'
              for key, count in [('ready-replay', 'READY_COUNT'), ('checkpoint-replay', 'CHECKPOINT_COUNT')]:
                  if int(os.environ[count]): assert needs[key]['result'] == 'success', key
              for stage in range(int(os.environ['PREFIX_STAGES'])):
                  assert needs[f'prefix_{stage:02d}']['result'] == 'success', stage
              if os.environ['SCOPE'] == 'coverage': assert needs['coverage-report']['result'] == 'success'
          PY
