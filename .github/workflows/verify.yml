name: Verify

# Verify: the ROM-reading checks of the rebuild. `content` runs the content decoders against
# the real ROM, `free-run-gate` runs the slice rows from the relock bundle against the green
# ratchet, and `lockstep-ratchet` replays the record cache against the lockstep ratchet.
# The ROM is encrypted in the private ci-data repository. ROM-derived files stay private,
# and fetching it needs secrets, so only in-repo branches run it.
on:
  workflow_call:
    secrets:
      SM_ROM_DEPLOY_KEY:
        required: false
      SM_ROM_KEY:
        required: false

permissions:
  contents: read

jobs:
  # The rebuild's content tests read the real ROM (data::room's Morph Ball Room test returns
  # early without it), so they run here, where the ROM is decrypted.
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The registry and the build, one entry per job (github.job): the key moves with the
      # toolchain and Cargo.lock, and a new key starts from the newest entry for the job under
      # the same toolchain. An exact hit saves nothing, which keeps the repository's caches under
      # 10 GB. The build holds no ROM bytes: the ROM and the records are read at run time, from
      # rom/ and $RUNNER_TEMP.
      - &cache
        name: Cache the cargo registry and the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - &rom
        name: Fetch the encrypted ROM
        uses: actions/checkout@v4
        with:
          repository: JimLundin/ci-data
          ssh-key: ${{ secrets.SM_ROM_DEPLOY_KEY }}
          path: .ci-data
          persist-credentials: false
      # Decrypt the ROM, check its SHA-1, then remove the ci-data checkout.
      - &decrypt
        name: Decrypt the ROM
        env:
          SM_ROM_KEY: ${{ secrets.SM_ROM_KEY }}
        run: |
          mkdir -p rom
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SM_ROM_KEY -in .ci-data/payload.enc -out rom/sm.smc
          if ! echo "da957f0d63d14cb441d215462904c4fa8519c613  rom/sm.smc" | sha1sum --check; then
            rm -f rom/sm.smc
            echo "wrong ROM"
            exit 1
          fi
          rm -rf .ci-data
      - name: Test the rebuild's content decoders against the ROM
        run: cargo test --locked -p data --no-fail-fast

  # The free-run gate (ARCHITECTURE D22) on the slice-0 rows: each row runs from its seed's
  # record in the relock bundle on the content read from the ROM, and the job fails when a
  # (row, stream) pair in scenarios/locks/lsnes.green.txt is no longer green. Never --update
  # here: the ratchet grows by a commit. `tools` doesn't link the emulator.
  free-run-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROWS: area-brinstar item-morph-ball
    steps:
      - uses: actions/checkout@v4
      - *cache
      - *rom
      - *decrypt
      - name: Fetch the relock bundle and check its pin
        run: |
          # The lock's one bundles entry: its ci-data name and its ciphertext's SHA-256.
          entry='^bundles = \[\{ name = "([^"]+)", sha256 = "([0-9a-f]{64})" \}\]$'
          line=$(grep -E "$entry" scenarios/locks/lsnes.toml)
          name=$(sed -E "s/$entry/\1/" <<<"$line")
          sha=$(sed -E "s/$entry/\2/" <<<"$line")
          # The release host answers 504 at times: back off for up to ten minutes.
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 15 --retry-all-errors --retry-max-time 600 \
            --output "$RUNNER_TEMP/relock.tar.gz.enc" \
            "https://github.com/JimLundin/sm-decomp/releases/download/ci-data/$name"
          echo "$sha  $RUNNER_TEMP/relock.tar.gz.enc" | sha256sum --check
      - name: Decrypt the relock bundle
        run: |
          # The seed bundles' passphrase: sha256("sm-decomp-seeds-v1" + ROM) (docs/ORACLE.md).
          SM_SEED_PASSPHRASE=$({ printf 'sm-decomp-seeds-v1'; cat rom/sm.smc; } | sha256sum | cut -d' ' -f1)
          export SM_SEED_PASSPHRASE
          mkdir -p "$RUNNER_TEMP/relock"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:SM_SEED_PASSPHRASE \
            -in "$RUNNER_TEMP/relock.tar.gz.enc" | tar -xz -C "$RUNNER_TEMP/relock"
          rm "$RUNNER_TEMP/relock.tar.gz.enc"
      - name: Build tools
        run: cargo build --locked --profile verify -p tools
      - name: "Free-run gate: slice-0 rows against the green ratchet"
        run: |
          # shellcheck disable=SC2086 # ROWS is a list of row ids.
          target/verify/tools gate scenarios/locks/lsnes.toml "$RUNNER_TEMP/relock/relock-v2-lsnes" \
            rom/sm.smc scenarios/locks/lsnes.green.txt $ROWS

  # The lockstep ratchet (scenarios/locks/lockstep.ratchet.txt): each row's record cache
  # (A2) replays engine-only in lockstep, and the job fails when a row's fully equal Ticks
  # fall or a group's differing Ticks rise. The cache is a ci-data asset packed by
  # tools/ci/pack_lockstep_cache.sh and pinned here by name and ciphertext SHA-256; a new
  # cache is a new asset and a commit that repins it. The cache holds every row a harness
  # reads, so the same job holds each domain's harness to its floors and its coverage.
  lockstep-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CACHE_ASSET: lockstep-cache-e59c25d39059593d.tar.xz.enc
      CACHE_SHA256: a77f9800ea881eaa2b3b52477e96132c5e6945e863ad922b1d3fca01b4caacf2
    steps:
      - uses: actions/checkout@v4
      - *cache
      - name: Fetch the record cache and check its pin
        run: |
          if ! grep -qE '^[0-9a-f]{64}$' <<<"$CACHE_SHA256"; then
            echo "::error::CACHE_SHA256 is not pinned: upload $CACHE_ASSET to ci-data and set its SHA-256"
            exit 1
          fi
          # The release host answers 504 at times: back off for up to ten minutes.
          if ! curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 15 --retry-all-errors --retry-max-time 600 \
            --output "$RUNNER_TEMP/cache.tar.xz.enc" \
            "https://github.com/JimLundin/sm-decomp/releases/download/ci-data/$CACHE_ASSET"; then
            echo "::error::$CACHE_ASSET could not be fetched from the ci-data release"
            exit 1
          fi
          echo "$CACHE_SHA256  $RUNNER_TEMP/cache.tar.xz.enc" | sha256sum --check
      - *rom
      - *decrypt
      - name: Decrypt and unpack the record cache
        run: |
          # The seed bundles' passphrase: sha256("sm-decomp-seeds-v1" + ROM) (docs/ORACLE.md).
          SM_SEED_PASSPHRASE=$({ printf 'sm-decomp-seeds-v1'; cat rom/sm.smc; } | sha256sum | cut -d' ' -f1)
          export SM_SEED_PASSPHRASE
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cache"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:SM_SEED_PASSPHRASE \
            -in "$RUNNER_TEMP/cache.tar.xz.enc" | tar -xJ -C "$RUNNER_TEMP/cache"
          rm "$RUNNER_TEMP/cache.tar.xz.enc"
      - name: "Lockstep ratchet: the record cache against scenarios/locks/lockstep.ratchet.txt"
        run: |
          # A renamed test would filter to nothing and pass, so require its report.
          set -o pipefail
          SM_CACHE="$RUNNER_TEMP/cache" SM_ROM="$PWD/rom/sm.smc" \
            cargo test --locked -p verify --profile verify committed_ratchet_holds_against_the_cache -- --nocapture \
            | tee "$RUNNER_TEMP/ratchet.txt"
          grep -q '^ratchet holds: ' "$RUNNER_TEMP/ratchet.txt"
      - name: "Harness floors: every domain over every cached row against floors.txt and coverage.txt"
        run: |
          # A renamed test would filter to nothing and pass, so require each domain's result.
          set -o pipefail
          SM_CACHE="$RUNNER_TEMP/cache" SM_ROM="$PWD/rom/sm.smc" \
            cargo test --locked -p verify --profile verify floors_against_the_cache \
            | tee "$RUNNER_TEMP/floors.txt"
          for test in the_clock_holds_its movement_holds_its the_camera_holds_its \
            progress_holds_its the_hud_holds_its the_blocks_hold_their; do
            grep -q "^test harness::tests::${test}_floors_against_the_cache \.\.\. ok$" \
              "$RUNNER_TEMP/floors.txt"
          done
      - name: "Progress's ROM checks: the harness cases, the rows' standing room states and the full percentage"
        run: |
          # Each test skips and passes only with both SM_CACHE and SM_ROM unset, which this step
          # sets; a renamed test would filter to nothing and pass, so require each one's result.
          set -o pipefail
          SM_CACHE="$RUNNER_TEMP/cache" SM_ROM="$PWD/rom/sm.smc" \
            cargo test --locked -p verify --profile verify -- \
              progress_harness_cases_hold_against_the_cache \
              progress_chooses_each_rows_standing_room_state \
              every_item_the_game_places_counts_a_hundred_percent \
            | tee "$RUNNER_TEMP/progress.txt"
          for test in progress_harness_cases_hold_against_the_cache \
            progress_chooses_each_rows_standing_room_state \
            every_item_the_game_places_counts_a_hundred_percent; do
            grep -q "^test harness::tests::${test} \.\.\. ok$" "$RUNNER_TEMP/progress.txt"
          done
