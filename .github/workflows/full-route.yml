name: Full 100% route

# Verifies the whole 100% TAS route against the original as a chain of room
# segments: each of the 331 rooms starts from its original-emulator seed with
# lag-aligned inputs and must reach the next room. WRAM, VRAM, CGRAM, OAM, PPU
# state and pixels are compared every frame. Seeds and inputs come from an
# encrypted ci-data release asset (see .github/scripts/full_route.py).
# Runs on every pull request (land.sh gates on this workflow's run for the PR
# head), nightly, and on dispatch. Pull requests need the repository secrets,
# so only in-repo branches can run it.
on:
  pull_request:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      oracle:
        description: Oracle ROM (patched = snesrev compatibility patches, faithful = original game logic)
        type: choice
        options: [patched, faithful]
        default: patched

permissions:
  contents: read

concurrency:
  group: full-route-${{ github.ref }}-${{ inputs.oracle || 'patched' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      asset: ${{ steps.plan.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python3 .github/scripts/full_route.py plan

  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Install the GNU Rust toolchain and linker
        env:
          MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $linker = Join-Path $env:MSYS_LOCATION 'mingw64/bin'
          if (!(Test-Path -LiteralPath "$linker/gcc.exe")) { throw 'MinGW GCC is missing' }
          $linker | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$linker/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install pinned Zig and SDL2 SDK
        run: |
          $native = Join-Path $env:RUNNER_TEMP 'sm-native'
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          $zigArchive = Join-Path $native 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $zigArchive
          if ((Get-FileHash -LiteralPath $zigArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'Zig checksum mismatch' }
          Expand-Archive -LiteralPath $zigArchive -DestinationPath $native
          $sdlArchive = Join-Path $native 'sdl.zip'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.zip' -OutFile $sdlArchive
          if ((Get-FileHash -LiteralPath $sdlArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f15cff5fca62ec9381a016ef1d42a95c638cd72d2f226ba5781c76fe43dbd1ac') { throw 'SDL2 checksum mismatch' }
          Expand-Archive -LiteralPath $sdlArchive -DestinationPath $native
          $sdl = Join-Path $native 'SDL2-2.32.10/x86_64-w64-mingw32'
          "SM_NATIVE=$native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SM_ZIG=$native/zig-x86_64-windows-0.15.2/zig.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SM_SDL_INCLUDE=$sdl/include/SDL2" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBRARY_PATH=$sdl/lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build pinned native dependencies
        # Rebuild stamped archives from this checkout; never cache these objects.
        run: |
          python tools/install_native_dependencies.py --zig $env:SM_ZIG --target x86_64-windows-gnu --prefix $env:SM_NATIVE --library-directory $env:LIBRARY_PATH --sdl-include $env:SM_SDL_INCLUDE
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency installation failed' }
      - name: Build pinned PNG decoder
        run: |
          $codec = Join-Path $env:SM_NATIVE 'stb-image'
          New-Item -ItemType Directory -Force -Path $codec | Out-Null
          $package = Join-Path $codec 'stb-sys-0.6.0.crate'
          Invoke-WebRequest 'https://crates.io/api/v1/crates/stb-sys/0.6.0/download' -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fedcddefe320931b97fea7c9bc9168567eadaf71c87a74a3491d5b46b5c573de') { throw 'PNG package checksum mismatch' }
          tar -xf $package -C $codec 'stb-sys-0.6.0/vendor/stb/stb_image.h'
          if ($LASTEXITCODE -ne 0) { throw 'PNG header extraction failed' }
          $header = Join-Path $codec 'stb-sys-0.6.0/vendor/stb/stb_image.h'
          if ((Get-FileHash -LiteralPath $header -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8e5b0d717dfc8a834c97ef202d20e78d083d009586e1731c985817d0155d568c') { throw 'PNG header checksum mismatch' }
          & $env:SM_ZIG cc -target x86_64-windows-gnu -O2 -std=c11 -ftrivial-auto-var-init=zero -I (Split-Path -Parent $header) -c sm/native/stb_image.c -o "$codec/stb_image.o"
          if ($LASTEXITCODE -ne 0) { throw 'PNG compilation failed' }
          & $env:SM_ZIG ar rcs "$env:LIBRARY_PATH/libsm_stb_image.a" "$codec/stb_image.o"
          if ($LASTEXITCODE -ne 0) { throw 'PNG archive creation failed' }
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination "$env:LIBRARY_PATH/THIRD_PARTY_NOTICES.md"
      - name: Build the verifier DLL (direct, as the local Fast loop does)
        run: |
          python tools/verify_dll.py --build-only --direct
          if ($LASTEXITCODE -ne 0) { throw 'Verifier DLL build failed' }
          New-Item -ItemType Directory -Force -Path verifier | Out-Null
          Copy-Item target/verify-dll/sm_verify.dll verifier/
          Copy-Item -Recurse (Split-Path -Parent $env:LIBRARY_PATH) verifier/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: verifier
          path: verifier
          retention-days: 1


  rooms:
    needs: [plan, build]
    runs-on: windows-2022
    env:
      SM_ORACLE: ${{ inputs.oracle || 'patched' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: verifier
          path: verifier
      - name: Place the verifier
        run: |
          New-Item -ItemType Directory -Force -Path target/verify-dll | Out-Null
          Copy-Item verifier/sm_verify.dll target/verify-dll/
          "LIBRARY_PATH=$((Resolve-Path verifier/sdk/lib).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore the ROM and the encrypted room seeds and inputs
        env:
          ASSET: ${{ needs.plan.outputs.asset }}
          ROM_00: ${{ secrets.SM_ROM_00 }}
          ROM_01: ${{ secrets.SM_ROM_01 }}
          ROM_02: ${{ secrets.SM_ROM_02 }}
          ROM_03: ${{ secrets.SM_ROM_03 }}
          ROM_04: ${{ secrets.SM_ROM_04 }}
          ROM_05: ${{ secrets.SM_ROM_05 }}
          ROM_06: ${{ secrets.SM_ROM_06 }}
          ROM_07: ${{ secrets.SM_ROM_07 }}
          ROM_08: ${{ secrets.SM_ROM_08 }}
          ROM_09: ${{ secrets.SM_ROM_09 }}
          ROM_10: ${{ secrets.SM_ROM_10 }}
          ROM_11: ${{ secrets.SM_ROM_11 }}
          ROM_12: ${{ secrets.SM_ROM_12 }}
          ROM_13: ${{ secrets.SM_ROM_13 }}
          ROM_14: ${{ secrets.SM_ROM_14 }}
          ROM_15: ${{ secrets.SM_ROM_15 }}
          ROM_16: ${{ secrets.SM_ROM_16 }}
          ROM_17: ${{ secrets.SM_ROM_17 }}
          ROM_18: ${{ secrets.SM_ROM_18 }}
          ROM_19: ${{ secrets.SM_ROM_19 }}
          ROM_20: ${{ secrets.SM_ROM_20 }}
          ROM_21: ${{ secrets.SM_ROM_21 }}
          ROM_22: ${{ secrets.SM_ROM_22 }}
          ROM_23: ${{ secrets.SM_ROM_23 }}
          ROM_24: ${{ secrets.SM_ROM_24 }}
          ROM_25: ${{ secrets.SM_ROM_25 }}
          ROM_26: ${{ secrets.SM_ROM_26 }}
          ROM_27: ${{ secrets.SM_ROM_27 }}
          ROM_28: ${{ secrets.SM_ROM_28 }}
          ROM_29: ${{ secrets.SM_ROM_29 }}
          ROM_30: ${{ secrets.SM_ROM_30 }}
          ROM_31: ${{ secrets.SM_ROM_31 }}
          ROM_32: ${{ secrets.SM_ROM_32 }}
          ROM_33: ${{ secrets.SM_ROM_33 }}
          ROM_34: ${{ secrets.SM_ROM_34 }}
          ROM_35: ${{ secrets.SM_ROM_35 }}
          ROM_36: ${{ secrets.SM_ROM_36 }}
          ROM_37: ${{ secrets.SM_ROM_37 }}
          ROM_38: ${{ secrets.SM_ROM_38 }}
          ROM_39: ${{ secrets.SM_ROM_39 }}
          ROM_40: ${{ secrets.SM_ROM_40 }}
          ROM_41: ${{ secrets.SM_ROM_41 }}
          ROM_42: ${{ secrets.SM_ROM_42 }}
          ROM_43: ${{ secrets.SM_ROM_43 }}
          ROM_44: ${{ secrets.SM_ROM_44 }}
        run: |
          python -B .github/scripts/prepare_rom.py
          if ($LASTEXITCODE -ne 0) { throw 'ROM preparation failed' }
          $bundle = Join-Path $env:RUNNER_TEMP 'chain.tar.gz.enc'
          Invoke-WebRequest "https://github.com/JimLundin/sm-decomp/releases/download/ci-data/$env:ASSET" -OutFile $bundle
          python -B .github/scripts/full_route.py restore $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Chain restore failed' }
      - name: Replay the rooms in lockstep
        timeout-minutes: 55
        run: |
          python -B .github/scripts/full_route.py run ${{ matrix.index }} 2>&1 | Tee-Object -FilePath rooms.log
          $code = $LASTEXITCODE
          "### ${{ matrix.name }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path rooms.log -Pattern '^(job|PASS|FAIL|Corpus)' | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "Rooms failed ($code)" }

  result:
    name: Full 100% route result
    needs: [plan, build, rooms]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every room job to pass
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          ROOMS: ${{ needs.rooms.result }}
        run: |
          echo "plan $PLAN, build $BUILD, rooms $ROOMS"
          test "$PLAN" = success && test "$BUILD" = success && test "$ROOMS" = success
