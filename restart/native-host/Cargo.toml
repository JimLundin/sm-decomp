[package]
name = "sm-native-host"
version = "0.1.0"
edition = "2024"
publish = false

[features]
private-checks = []
default = ["native-preparation"]
native-preparation = ["dep:flate2", "dep:tar"]
legacy-evidence = ["dep:serde", "dep:serde_json"]

[dependencies]
sm-rio = { path = "../rio" }
flate2 = { version = "1.1.10", optional = true, default-features = false, features = ["zlib-rs"] }
libloading = "0.8.9"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sm-binary-evidence = { path = "../evidence" }
sha2 = { package = "sm-sha256", path = "../sha256" }
tar = { version = "0.4.46", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sm-rio = { path = "../rio", features = ["fixture-support"] }
sm-projectile = { path = "../projectile" }
sm-item-instructions = { path = "../item-instructions", features = ["fixture-support"] }
sm-persistence = { path = "../persistence", features = ["fixture-support"] }
sm-player-motion = { path = "../player-motion", features = ["fixture-support"] }
sm-waver = { path = "../waver", features = ["fixture-support"] }
sm-ripper = { path = "../ripper", features = ["fixture-support"] }

[[example]]
name = "persistence-host-control"
required-features = ["legacy-evidence"]

[[example]]
name = "player-motion-host-control"
required-features = ["legacy-evidence"]

[[example]]
name = "camera-host-control"
required-features = ["native-preparation"]

[[example]]
name = "native-smoke"
required-features = ["native-preparation"]

[[example]]
name = "ripper-host-control"
required-features = ["legacy-evidence"]

[[example]]
name = "room-transition-host-control"
required-features = ["native-preparation"]

[[example]]
name = "prepare-control"
required-features = ["native-preparation"]

[[example]]
name = "door-scrolling-host-control"
required-features = ["native-preparation"]

[[example]]
name = "tank-instruction-host-control"
required-features = ["legacy-evidence"]

[[example]]
name = "waver-host-control"
required-features = ["legacy-evidence"]
