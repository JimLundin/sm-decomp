[workspace]
members = [".", "native-host", "presentation", "trace", "projectile", "room-scroll", "original", "ceres-door", "room-transition", "door-scrolling", "camera", "item-instructions", "persistence", "player-motion", "waver", "ripper", "rio", "dll-host", "evidence", "skree", "beetom", "platform", "rinka", "fireflea", "bouncing-goofball"]
resolver = "3"

[package]
name = "sm-restart"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "sm-restart"

[[bin]]
name = "sm-pilot"
path = "src/bin/sm-pilot.rs"
required-features = ["png-output"]

[features]
default = ["native-preparation", "png-output"]
native-preparation = ["sm-native-host/native-preparation"]
png-output = ["dep:png"]
private-checks = ["sm-item-instructions/private-checks", "sm-binary-evidence/private-checks", "sm-trace/private-checks", "sm-native-host/private-checks", "sha2/private-checks"]

[dependencies]
sha2 = { package = "sm-sha256", path = "sha256" }
sm-binary-evidence = { path = "evidence" }
sm-native-host = { path = "native-host", default-features = false }
sm-presentation = { path = "presentation" }
png = { version = "=0.18.1", optional = true }
sm-trace = { path = "trace" }
sm-projectile = { path = "projectile" }
sm-room-scroll = { path = "room-scroll" }
sm-ceres-door = { path = "ceres-door" }
sm-room-transition = { path = "room-transition" }
sm-door-scrolling = { path = "door-scrolling" }
sm-camera = { path = "camera" }
sm-item-instructions = { path = "item-instructions" }
sm-player-motion = { path = "player-motion" }
sm-persistence = { path = "persistence" }
sm-waver = { path = "waver" }
sm-ripper = { path = "ripper" }

[dev-dependencies]
libloading = "0.8.9"

# The development loop hashes real game state on every step. Compile the small
# hashing dependencies with optimization while keeping candidate builds incremental.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
