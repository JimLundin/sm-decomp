# Ridley's room alone, from its own seed: Ridley waits in the dark with the baby, which cries and
# glows once, then wakes, his eye lighting, until he becomes tangible, where his tail (boss-ceres-
# ridley part 4b) takes over.
[[run]]
row = "chain-any-0006-E0B5"
