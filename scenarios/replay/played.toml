# The reviewed played runs of the milestone's movie: each a lock row of
# scenarios/locks/lsnes.toml played by the engine alone from a seed cut, with the movie's pads and
# nothing fed back, compared at every frame cut (verify::replay::played). `tools report` turns
# them into the README's progress in movie frames (verify::report::readme); its tests fail when a
# run disagrees with the lock. The root changes a run here when a reviewed played run changes it.
#
# [[run]]: `row` the lock row; `start` the seed cut; `end` the last cut asked for; `held` the
# cuts after the seed whose compared fields all matched; `stop` "end" when every cut through
# `end` held, else { failed = "the first difference, missing owner or bad data" } at cut
# start + held + 1.
#
# In movie frames: a row's cut c is movie frame f + c, f its seed's `movie_frame` in
# movies/room-seeds-<capture>.csv, or 0 for a row from power-on, so a row's cut 0 is the frame
# after the previous row's last cut. `seed_frame` is the seed cut's frame, `frames` the first and
# last frame the run held, and `power_on` whether it starts from the console's power-on, frame 0;
# the report's tests check all three against the lock.

movie = "any"

# Ceres's first room from her arrival: the elevator's pad holds her, lowers her to the shaft's
# floor and lets her go, and she leaves by the room's door; played on through the second, third,
# fourth and fifth rooms and into Ridley's with no new seed, the door slamming shut behind her,
# until Ridley wakes, a piece of the station not yet owned.
[[run]]
row = "chain-any-0001-DF45"
start = 0
end = 3000
held = 2136
stop = { failed = "RidleyAwake" }
seed_frame = 8538
frames = [8539, 10674]
power_on = false

# Ceres's first room alone, from her arrival.
