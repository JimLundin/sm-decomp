# The reviewed played runs of the milestone's movie: each a lock row of
# scenarios/locks/lsnes.toml played by the engine alone from a seed cut, with the movie's pads and
# nothing fed back, compared at every frame cut (verify::replay::played). `tools report` turns
# them into the README's progress in movie frames (verify::report::readme); its tests fail when a
# run disagrees with the lock. An integrator whose work moves a run changes it here, and the root
# reviews it at landing.
#
# [[run]]: `row` the lock row; `start` the seed cut; `end` the last cut asked for; `held` the
# cuts after the seed whose compared fields all matched; `stop` "end" when every cut through
# `end` held, else { failed = "the first difference, missing owner or bad data" } at cut
# start + held + 1.
#
# In movie frames: a row's cut c is movie frame f + c, f its seed's `movie_frame` in
# movies/room-seeds-<capture>.csv, or 0 for a row from power-on, so a row's cut 0 is the frame
# after the previous row's last cut. `seed_frame` is the seed cut's frame, `frames` the first and
# last frame the run held, and `power_on` whether it starts from the console's power-on, frame 0;
# the report's tests check all three against the lock.

movie = "any"

# The any% movie from power-on: black, the Nintendo logo brightening, held and dimming, black
# while the sound driver loads and the game settles; the title fading in and counting down,
# file select with a new file chosen in slot A, the options menu with the moonwalk setting
# turned on, and start game fading out, until the options hand on to the intro, a part of the
# front end not yet owned.
[[run]]
row = "any-power-on"
start = 0
end = 568
held = 567
stop = { failed = "HandedOn(IntroBegins)" }
seed_frame = 0
frames = [1, 567]
power_on = true

# The flight to Ceres from its first frame: the gunship rushes in, the view turns away and it
# flies off past the drifting sprites, the station comes into view and its name is typed, and the
# picture darkens, to the frame before the arrival's seed.
[[run]]
row = "any-fly-to-ceres"
start = 0
end = 802
held = 802
stop = "end"
seed_frame = 7512
frames = [7513, 8314]
power_on = false

# A new game's arrival at Ceres, from the intro's last frame: the screen dark while the start is
# made ready, she arrives on the elevator's pad at the top of the shaft, and the picture comes up.
[[run]]
row = "any-ceres-arrival"
start = 0
end = 222
held = 222
stop = "end"
seed_frame = 8315
frames = [8316, 8537]
power_on = false

# The arrival, played on into Ceres's first room and through the second to fifth into Ridley's
# with no new seed, until Ridley's eye has lit and he becomes tangible, where his tail (boss-ceres-
# ridley part 4b) takes over.
[[run]]
row = "any-ceres-arrival"
start = 0
end = 3223
held = 2455
stop = { failed = "RidleyTangible" }
seed_frame = 8315
frames = [8316, 10770]
power_on = false

# Ceres's first room from her arrival: the elevator's pad holds her, lowers her to the shaft's
# floor and lets her go, and she leaves by the room's door; played on through the second, third,
# fourth and fifth rooms and into Ridley's with no new seed, the door slamming shut behind her,
# until Ridley's eye has lit and he becomes tangible, where his tail (boss-ceres-ridley part 4b)
# takes over.
[[run]]
row = "chain-any-0001-DF45"
start = 0
end = 3000
held = 2232
stop = { failed = "RidleyTangible" }
seed_frame = 8538
frames = [8539, 10770]
power_on = false

# Ceres's first room alone, from her arrival.
[[run]]
row = "chain-any-0001-DF45"
start = 0
end = 411
held = 411
stop = "end"
seed_frame = 8538
frames = [8539, 8949]
power_on = false

# Ceres's second room alone, from its own seed: her spins carried on by her choices of pose.
[[run]]
row = "chain-any-0002-DF8D"
start = 0
end = 281
held = 281
stop = "end"
seed_frame = 8950
frames = [8951, 9231]
power_on = false

# Ceres's third room, played on through the fourth and fifth and into Ridley's with no new seed,
# until Ridley's eye has lit and he becomes tangible, where his tail (boss-ceres-ridley part 4b)
# takes over.
[[run]]
row = "chain-any-0003-DFD7"
start = 0
end = 3000
held = 1538
stop = { failed = "RidleyTangible" }
seed_frame = 9232
frames = [9233, 10770]
power_on = false

# Ceres's fourth room alone, from its own seed.
[[run]]
row = "chain-any-0004-E021"
start = 0
end = 263
held = 263
