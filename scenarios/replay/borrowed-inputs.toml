# Input adapters consume these dependencies, fields and phases as one operation.
# Packet-backed operations take the source from the case and verify it against the selected packet.

[native-audio-frame]
readers = ["native-frame-inputs"]
dependency = "audio.offers-and-cadence"
provider = "pinned-native-capture"
fields = ["frame.offers", "frame.cadence"]
phase = "per frame"

[preceding-ceres-neighbours]
readers = ["preceding-cut-ceres-inputs"]
dependency = "ceres.samus-and-stage"
provider = "preceding-cut-independent-observations"
fields = ["samus.position", "station.stage"]
phase = "preceding-record-cut"

[observed-ceres-actor-turn]
readers = ["preceding-cut-ceres-inputs"]
dependency = "ceres.actor-run"
provider = "adjacent-cut-framework-counter-and-identity"
fields = ["actor.identity", "actor.position", "actor.framework_counter"]
phase = "current-record-cut"

[unchanged-camera-neighbours]
readers = ["preceding-cut-camera-inputs"]
dependency = "camera.movement-and-room"
provider = "preceding-cut-unchanged-producer-facts"
fields = ["movement.physical-centre", "movement.facing", "movement.backwards", "movement.rising", "movement.no-placement", "room.screens", "room.heights", "room.lead", "clock.time-stopped"]
phase = "preceding-record-cut"

[watched-progress-reports]
readers = ["observed-fixed-progress-events"]
dependency = "progress.event-reports"
provider = "pinned-record-executed-fixed-event-setter-visits"
fields = ["progress.reports.identity", "progress.reports.order", "progress.reports.count"]
phase = "observed-interval-execution"

[connected-ordinary-opportunity]
readers = ["connected-ordinary-inputs"]
provider = { packet = "connected-directory", prefix = "authenticated-" }
dependency = "unselected current ordinary stimuli"
fields = ["controls", "items", "parity", "energy", "queue occupancy", "the owners active at her stride and her shot's charge", "geometry and current actors", "camera room settings"]
phase = "actual current source opportunity"

[native-sender-ingress]
readers = ["sender-offers"]
selection = "native-offer"
provider = { packet = "sender-inputs" }
dependency = "sender.offer"
fields = ["seed.queue", "seed.progress", "offer.group", "offer.cue", "offer.allowance", "offer.suppression"]
phase = "seed bracket and observed ingress"

[constructed-sender-ingress]
readers = ["sender-offers"]
selection = "constructed-offer"
dependency = "sender.offer"
provider = "constructed-sender-queue"
fields = ["seed.queue", "offer.group", "offer.cue", "offer.allowance", "offer.permission"]
phase = "immediately before selected offer"

[played-boundaries]
readers = ["played-ceres-inputs"]
dependency = "played.platform"
provider = "preceding pinned record and locked NMI boundaries"
fields = ["frame of work finished", "audio readiness"]
phase = "frame boundary"

[fight-picture-boundaries]
readers = ["scoped-ceres-fight-picture"]
dependency = "played.platform"
provider = "preceding pinned record and locked NMI boundaries"
fields = ["frame of work finished", "requested publication", "audio readiness"]
phase = "frame boundary"

[flyby-boundaries]
readers = ["scoped-ceres-flyby"]
dependency = "played.platform"
provider = "preceding pinned record and locked NMI boundaries"
fields = ["frame of work finished", "audio readiness", "initial flyby display memory"]
phase = "frame boundary"

[warning-boundaries]
readers = ["scoped-ceres-warning"]
dependency = "played.platform"
provider = "preceding pinned record and locked NMI boundaries"
fields = ["frame of work finished", "audio readiness", "initial room memory"]
phase = "frame boundary"

# Recorded ordinary inputs and scoped native opportunities.

[recorded-movement-animation]
readers = ["preceding-cut-movement-inputs"]
selection = "movement"
dependency = "movement.animation"
provider = "preceding-cut-appearance-state-and-production-ahead"
fields = ["appearance.playhead", "appearance.figure", "appearance.boost"]
phase = "before-movement"

[recorded-movement-frame]
readers = ["preceding-cut-movement-inputs"]
selection = "movement"
dependency = "movement.world-and-controller"
provider = "preceding-cut-independent-observations"
fields = ["world.blocks", "world.interactive_roster", "world.observed_solid_geometry", "controller.held", "controller.pressed", "progress.equipment", "mode.cinematic", "clock.parity", "elevator.moving"]
phase = "preceding-record-cut"

[preceding-cannon-and-world]
readers = ["preceding-cut-weapons-contact-inputs"]
dependency = "weapons.cannon-and-world"
provider = "preceding-cut-recorded-ordinary-weapons-inputs"
fields = ["controller.held", "controller.pressed", "controller.previous_pressed", "pose.current", "pose.previous", "pose.pending_aim", "muzzle.centre", "movement.directional_travel", "camera.origin", "camera.vertical_fraction", "world.blocks", "world.bts", "world.dimensions", "mode.time_stopped"]
phase = "preceding-record-cut"

[watched-door-opportunities]
readers = ["preceding-cut-weapons-contact-inputs"]
dependency = "contact.actor-opportunities"
provider = "independent-watched-m0-door-membership"
fields = ["actor.processing_order", "actor.permissions", "actor.geometry", "actor.protection", "actor.figure", "actor.tangibility"]
phase = "before-each-door-contact"

[watched-cannon-and-world]
readers = ["scoped-shot-drawing-inputs"]
dependency = "weapons.cannon-and-world"
provider = "preceding-cut-records-and-independent-shot-contact-watch"
fields = ["mapped.controller", "pose.current", "pose.previous", "pose.pending-aim", "muzzle.centre", "movement.directional-travel", "camera.update-origin", "camera.vertical-fraction", "world.terrain", "mode.time-stopped"]
phase = "before-ordinary-power-update"

[watched-shot-contacts]
readers = ["scoped-shot-drawing-inputs"]
dependency = "contact.actor-opportunities"
provider = "independent-shot-contact-watch"
fields = ["actor.identity", "actor.processing-order", "actor.geometry", "actor.permissions"]
phase = "before-each-door-contact"

[watched-drawing-insertion]
readers = ["scoped-shot-drawing-inputs"]
dependency = "weapons.drawing-insertion"
provider = "independent-shot-contact-watch"
fields = ["camera.drawing-origin", "drawing.counter-parity", "drawing.incoming-cursor"]
phase = "before-flying-picture-insertion"

[stationary-hud-neighbours]
readers = ["preceding-cut-hud-inputs"]
dependency = "hud.upstream-status-controls-and-map"
provider = "preceding-cut-independent-observations"
fields = ["frame-counter", "physical-controls", "bindings", "stock-at-start", "equipment", "progress-gauges", "samus-handlers", "samus-pose", "samus-position", "room-map-origin", "room-size", "area", "map-collected", "main-gameplay-countdown"]
phase = "record N for the frame count, controls and stock as the frame begins; record N+1 for the status, handlers, pose, position and room"

[standing-appearance-neighbours]
readers = ["preceding-cut-appearance-inputs"]
dependency = "appearance.movement-equipment-liquid-and-controller"
provider = "preceding-cut-standing-interval"
fields = ["appearance.figure", "movement.standing_restart", "controller.held", "controller.bindings", "progress.equipment", "progress.energy", "liquid.slowdown", "sound.queue_count", "appearance.activities (cinematic, boss, special colour time)", "appearance.charge", "controller.shoot_held"]
phase = "preceding-record-cut"

[native-opportunity-seed]
readers = ["native-search-inputs"]
dependency = "movement seed and ordinary opportunity"
provider = "selected native opportunity packet"
fields = ["inputs/seed.bin", "ordinary opportunity"]
phase = "selected seed before ordinary movement"

[native-opportunity-frame-world]
readers = ["native-search-inputs"]
dependency = "Frame and opportunity-time World"
provider = "selected native opportunity packet and imported movement content"
fields = ["inputs/frame.bin", "inputs/world.bin", "imported content"]
phase = "Frame before normal input and World after actor selection"

[early-map-opportunity]
readers = ["early-map-inputs"]
dependency = "unselected current ordinary and Map producers"
provider = { packet = "fixture-directory", prefix = "authenticated-" }
fields = ["locked controls and bindings", "current equipment, liquid, the owners active at her stride, her shot's charge, energy and queue occupancy", "origin terrain and current eligible actor boxes in search order", "Camera room settings", "Map area, room, clock, power and event predicates"]
phase = "each actual input use from controller through the first Camera carry and second early Map"

[early-map-hud-neighbours]
readers = ["early-map-inputs"]
dependency = "hud.frame-neighbours"
provider = "pinned-record-cache"
fields = ["stock-at-start", "status", "mute", "can-switch", "main-gameplay-countdown"]
phase = "record N for her stock as the frame begins; record N+1 for the rest"

[touchdown-movement-entry]
readers = ["native-touchdown-inputs"]
dependency = "movement.entry"
provider = { packet = "fixture-inputs", prefix = "locked predecessor cut and " }
fields = ["preceding movement state and committed figure", "held and pressed pad", "Ahead", "items", "elevator", "cinematic", "parity", "terrain", "two current solid actors in native order"]
phase = "ordinary Movement entry"

[touchdown-sender-ingress]
readers = ["native-touchdown-inputs"]
dependency = "sender.ingress and appearance.area"
provider = { packet = "sender-inputs", suffix = " and the locked Magnet Stairs area" }
fields = ["Contact queue and progress", "Contact suppression owners", "dry touchdown graphics arm"]
phase = "before the Contact offer and at the later graphics opportunity"

[tail-actor-impact]
readers = ["native-health-tail-inputs"]
dependency = "health.tail-impact"
provider = "independent-scoped-ceres-tail-actor-offer"
fields = ["tail-impact-per-frame"]
phase = "each-frame"

[health-frame-opportunity]
readers = ["native-health-tail-inputs"]
dependency = "health.frame-admission"
provider = "independent-native-health-opportunity"
fields = ["running-time", "equipped-varia", "equipped-gravity"]
phase = "each-frame"

[health-hud-neighbours]
readers = ["native-health-tail-inputs"]
dependency = "hud.tail-neighbours"
provider = "independent-native-hud-tail-opportunities"
fields = ["hud-clock", "quiet-item-controls", "stock-at-start", "powered-off-map-dispatch", "energy-capacity", "reserve", "ammunition", "no-hud-event-writers", "main-gameplay-countdown"]
phase = "each frame, after Health"

# Elevator, station and shaft readers. Native origins qualify the conditional operations.

[elevator-reach]
readers = ["blackout"]
selection = { escape = ["reach"] }
dependency = "shaft.elevator"
provider = "reach at the scoped intake"
fields = ["after-motion elevator reached"]
phase = "end of the ordinary room turn"

[suspended-room-work]
readers = ["blackout"]
selection = { escape = ["reach", "locked", "suspended", "suspended-standing"] }
dependency = "platform.work"
provider = "recorded NMI kind and interrupted work site"
fields = ["end of vblank", "cartridge write completion", "requested commit"]
phase = "suspended work and NMI return"

[station-blackout-seed]
readers = ["station-explosion"]
dependency = "explosion.elevator"
provider = "pinned-elevator-blackout"
fields = ["station.begin", "health", "video.palette", "video.oam", "options.subtitles", "scheduler.finished", "landing.destination"]
phase = "seed"

[station-work-cadence]
readers = ["station-explosion"]
dependency = "explosion.cadence"
provider = "pinned-nmi-work-completion"
fields = ["scheduler.finished"]
phase = "per cut"

[station-music-reply]
readers = ["station-explosion"]
dependency = "explosion.music"
provider = "pinned-post-service-music"
fields = ["music.busy"]
phase = "after audio service"

[flight-work-cadence]
readers = ["zebes-flight-inputs"]
dependency = "zebes.scheduler-cadence"
provider = "pinned-record-nmi-work-completion"
fields = ["scheduler.finished"]
phase = "per cut"

[station-flight-handoff]
readers = ["zebes-flight-inputs"]
dependency = "zebes.entry-and-options"
provider = "pinned-record-station-blackout"
fields = ["flight.pending", "health.energy", "video.palette", "video.oam", "scheduler.landing-context", "options.subtitles"]
phase = "seed cut"

[loader-transfer-progress]
readers = ["landing-site-timing"]
dependency = "platform.work-and-transfer"
provider = "pinned NMI and direct DMA channel receipts"
fields = ["work-open", "accepted-byte-count", "selected-read"]
phase = "work opening through the selected read before NMI-off vblank"

[prior-flight-and-shaft-owners]
readers = ["landing-site-timing"]
dependency = "prior-room-and-video"
provider = "pinned shaft map storage and pinned flight departure OAM, placement, live registers and shadow tilemaps"
fields = ["stored Crateria map", "active map", "physical OAM", "room", "player placement", "live display", "tilemap tails"]
phase = "before opening the receiving load"

[getaway-boss-pass]
readers = ["scoped-getaway-inputs"]
dependency = "ridley.getaway-pass"
provider = "preceding pinned boss mode and flyby picture cursor"
fields = ["side-free pass request"]
phase = "after ordinary movement and pose reaction"

[getaway-room-neighbours]
readers = ["scoped-getaway-inputs"]
dependency = "room.samus-neighbours"
provider = "preceding pinned record and imported pose and terrain content"
fields = ["solid blocks and actor boxes", "front layer view left", "horizontal slowdown and room carry", "held and fresh buttons", "equipment", "frame parity", "appearance neighbours"]
phase = "before movement and appearance"

[station-departure-platform]
readers = ["departure"]
selection = { escape = ["station"] }
dependency = "departure.platform"
provider = "recorded-work-and-source-bus-progress"
fields = ["scheduler.finished", "audio.queue-busy", "dma.accepted-and-selected"]
phase = "per cut"

[shaft-departure-platform]
readers = ["departure"]
selection = { escape = ["shaft-save"] }
dependency = "departure.platform"
provider = "recorded-work-and-source-bus-progress"
fields = ["scheduler.finished", "shaft.vblank-ended", "shaft.save-completed", "audio.queue-busy", "dma.accepted-and-selected"]
phase = "per cut"

[locked-standing-draw]
readers = ["blackout"]
selection = { escape = ["standing"] }
dependency = "shaft.standing-drawing"
provider = "locked room owners at the reach cut and early view from the preceding cut"
fields = ["movement.pose", "appearance.clip-step", "movement.room-centre", "shaft.pivot", "shaft.carried-view", "camera.layer-origin"]
phase = "pose, clip and room positions at reach, view before each late shaft turn"

[standing-room-work]
readers = ["blackout"]
selection = { escape = ["standing"] }
dependency = "platform.work"
provider = "recorded NMI kind and interrupted work site"
fields = ["end of vblank", "cartridge write completion", "requested commit"]
phase = "room preparation, suspended work and NMI return"

[locked-hud-origin]
readers = ["blackout"]
selection = { escape = ["hud"] }
dependency = "shaft.lock"
provider = "post-reach pinned record"
fields = ["movement-handler", "room placement and map", "stock and reserve"]
phase = "sole origin"

[locked-hud-work]
readers = ["blackout"]
selection = { escape = ["hud"] }
dependency = "platform.work"
provider = "recorded NMI kind and interrupted work site"
fields = ["fresh work", "end of vblank", "cartridge write completion", "requested commit"]
phase = "suspended work and NMI return"

[shaft-cpu-acknowledgements]
readers = ["played-shaft-sound"]
dependency = "shaft-sound.reply"
provider = "pinned CPU cue and clear acknowledgement edges"
fields = ["Ambient reply read", "finished work opportunity"]
phase = "CPU sound service after actor turns"

[shaft-sender-room-work]
readers = ["played-shaft-sound"]
dependency = "played.platform"
provider = "locked movie pad and played work boundaries"
fields = ["controller", "actor fetch", "lag and publication", "sound queue and music readiness", "passage random draws outside owned turns"]
phase = "played frame and suspended room work"

[shaft-picture-scheduling]
readers = ["shaft-pictures"]
dependency = "played.platform"
provider = "preceding pinned controller pad and locked NMI boundaries"
fields = ["movie pad", "work finished", "NMI publication", "platform and bus opportunities"]
phase = "per cut"

