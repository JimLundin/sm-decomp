# The domain free run's floors (verify::harness::free, MODEL §4 "The primary proof is a free
# run"), one line per domain and cached row:
#   `<domain> <row> <held> <null-held> <compared> <masked> <out-of-scope> <unreached> <folded>`
# held is a floor: a row's held frames never fall below it; raise it with the change that raised
# it. The rest hold exactly: null-held, the compared frames the null model's free run (a step
# that does nothing, carried from the same seeds) holds; then how the run accounts for each of
# the row's records after its seed: compared (held or diverged), of them masked (compared on the
# fields no other writer moved), out of scope (a frame the domain doesn't run in or another
# domain owns), unreached (a frame the domain answers for and doesn't compare: its model doesn't
# take it yet, or the harness can't decode it) and folded (a record the domain folds into the
# frame before it). A domain's scope on a row is its compared and unreached frames. Per row,
# `uncompared <row> <frames>` holds exactly the frames after its seed no model domain (all but
# game-time, the clock) compares. A cached row with no line prints the line to add; the first
# run over CI's cache sets them.
