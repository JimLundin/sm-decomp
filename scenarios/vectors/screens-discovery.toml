# One cut per vector. Recorded values are observations at its end. The row and cut identify
# its source. A recorded vector whose drawing depends on
# the room's own art or timing has a corresponding constructed case with invented content.
#
# The constructed cases restore before, apply inputs, then compare only the supplied after
# fields. Missing before fields default to absent actors, zero ages and velocities, no pulse
# picture (age -1), empty cohorts and Hidden. Supplying an active baby defaults its anchor to
# the sample home. Omitted input centre is (180, 147) whole pixels. finished defaults to true.
# All positions, displacements, and velocities in the tables are in eighths of a pixel or
# eighths of a pixel per frame. "closed" is the waiting phase. x and y are the baby's place.
# A particle lists bit (its identity in the sample cohort), x, y, applied flight steps (age)
# while in flight, and splash age (-1 for flight). A splash drops its flight age.
# A rising baby defaults to droplets still to shed (drops_shed = false). An observation
# may compare a selected subset of fields.
# cue is true when ReadyForPageThree is sent. sound lists sound identities in offer order.
# Sound offers in the sample have a queue allowance of six.
#
# Content is invented. Each fragment is [x, y, drift, vertical displacements]. Each droplet
# is [drift, vertical displacements], starting at the baby's whole-pixel place on release.

[scene]
home = [720, 1232]
closed = "QuietShell"
spent = "EmptyShell"
hatch = [["Shake", 2], ["Crack", 3], ["Open", 2]]
burst_at = 2
rise_at = 2
baby = [["Small", 2], ["Tall", 1], ["Wide", 2]]
fragment = [
  [800, 1338, -2, [-2, 8]],
  [808, 1232, 2, [3]],
  [816, 1343, 4, [1]],
  [824, 1300, -1, [1, 2, 3]],
  [832, 1290, 5, [-2, 9]],
  [840, 1270, 0, [-2, 8]],
]
drop = [
  [-2, [-9, 8, 16]],
  [-4, [-2, 4, 12]],
  [4, [-5, 8, 8]],
  [8, [-1, 5, 9]],
]
splash = [["Wet", 2], ["Drying", 1]]
shatter = "ShellBreak"
cry = "BabyCry"

