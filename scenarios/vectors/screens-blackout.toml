# The state starts in Shaft at full brightness. All unstated fixture values
# are invented. Room represents one new pass, Interrupt an unfinished cut,
# VblankEnded the safe display interval for the handoff and SaveFinished the
# cartridge completion. Publish is the finishing display opportunity. NewWork offers
# a fresh dispatch. The timer picture uses invented sprite identities.
# Only listed fields are asserted. After snapshots use phase names from the
# receiving contract. Timer content here is represented by centiseconds.

