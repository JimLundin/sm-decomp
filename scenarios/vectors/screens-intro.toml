# Test vectors for docs/behaviours/screens-intro.md.
#
# Format
# - Each [[vector]] is one frame of the intro, from its state as the frame begins to its state as
#   the frame ends: id; source ("recorded" or "constructed"); entries (the spec's behaviours it
#   exercises); rules (optional); before; inputs (optional); after; output (optional); gone
#   (optional). A vector with phase = "setup" stops where its room start has been applied
#   and the room and scripts still await their turn. A vector with continues names that setup
#   vector and completes the same turn from its saved result and content, consuming one
#   checkpoint. It supplies no new before State or inputs. absent_output lists unexpected
#   output fields.
# - rules (optional): the reference rules this vector overrides: rhythm, frames (PictureDarkens's
#   d). A vector without rules runs the reference one: rhythm 1.
# - before and after hold only the parts the vector needs; a part absent from before is not
#   there (no baby, no page, no eyes, no caret, no glows, no colours) or at its rest value (the
#   dissolve's count 0, the height 0, the click turn off, level 15 Shown, the fade's count 0),
#   and a part absent from after is not checked. The parts: stage ("ToScene", "Scene",
#   "ToPageFive", "ToText", "Text", "WaitingForPress", "FadingOut", "Done"); dissolve, the
#   dissolve's count; wait, the stage's wait, frames; colours, a table by colour index of [[red, green, blue] levels,
#   [red, green, blue] steps], in 256ths; height, the picture's height, px, signed;
#   pan, the horizontal offset in px, 0 to 32 (default 0);
#   baby = { x, y, script, step, hold, count } (x defaults to 112); page and eyes = { script, step, hold, count };
#   caret = { x, y, script, step, hold, count }; step is the index of the script's current step
#   (-1 when placed and not yet run) and count the count left of a repeat (absent for none);
#   glows, a list of [column, row, the set it takes next, frames left]; click, the click turn;
#   level, 0 to 15; screen, "Blanked" or "Shown"; count, the fade's count. The opening's and page
#   1's stages: "Begins", "OpeningLoads", "OpeningBrightens", "OpeningPause", "FirstTune",
#   "SecondTuneLoads", "SecondTune", "OpeningDarkens", "PageOneMadeReady", "PageOneLoads",
#   "PageOneBrightens", "PageOneWaits". The flashback stages are "IntoFight", "Fight",
#   "PageTwoPending", "OutOfFight" and "PageTwoWaits". fight_visible defaults to false.
# - inputs (optional): press, bool (absent means false); track_waits, whether a track waits in
#   the line of tunes still to load (absent means false); return_to_text, the encounter's
#   reply after room play (absent means false); scene, the scene's content: scripts, a
#   table by name of step lists, each step one of { picture, hold }, { letter, column, row, hold }
#   (a letter " " is a space), { hold } (shows nothing), { back = k },
#   { repeat = k, times = n }, { signal } ("page5", "wait", "fight", "blink", "finish" or "wait_discovery") or
#   { end = true }; a page is placed with "page1", "page2", "page5" or "page6", the eyes' page 6 script is
#   "eyes_six", the caret's are "caret_steady" and "caret_blink"; sets = { to_scene = { dims,
#   brightens }, to_text = { dims, brightens }, into_fight = { dims, brightens },
#   out_of_fight = { dims, brightens }, text }, colour indices, text the colours page 5
#   starts black; full, a table by colour index of [red, green, blue] full levels, 0 to 31;
#   caret_colours, a table by colour index of 15-bit colours in hex; caret_home, [x, y] in
#   pixels (the fixture uses [0, 0] when omitted).
# - output (optional): shown, a table by colour index of the colours shown in hex; typed, the
#   letters typed as [{ letter, column, row }]; clicks, the number of clicks asked; cleared, the
#   text cleared; caret_shown, whether the caret shows;
#   equipment_returned, the equipment returned; equipment_lent, the equipment lent; music, the
#   music's requests in order, each "stop", "load first", "load second", "load pages" or
#   "play N" (play the loaded tune N frames after; a stop or a load is asked with the delay of
#   8 frames); encounter, "start" for StartZebesFight or "end" for HideFightSamusAndShots;
#   picture, "blend", "fight" or "text"; fight_lights and text_updates, boolean events.
#   gone (optional): the parts no longer there.
# - Discovery and delivery stages include "IntoDiscovery", "Discovery", "PageThreePending",
#   "OutOfDiscovery", "PageThreeWaits", "IntoDelivery", "Delivery", "PageFourPending",
#   "OutOfDelivery" and "PageFourWaits". discovery_ready is the encounter's page 3 cue, bool,
#   default false. New scripts are "page3", "page4" and "delivery", with signals "wait_delivery",
#   "wait_examination" and "page4". The new output fields are discovery ("start" or "finish")
#   and scene_selected ("discovery", "delivery" or "examination"). A layout can be "scene".
# - Content is invented: no script, picture, letter, colour index, set, full colour or place of
#   the scene is the game's. The recorded cases (named by row and cut elsewhere) keep the State
#   as recorded, each colour's levels and steps under an invented index, and give the scene
#   invented content with the holds recorded.

