# The title sequence, one frame end at a time: the State before it, how the frame ended, and
# the State after it.
#
# State: `stage` ("begun" for the game as the power-on hands it over, then "loading",
# "skip-dimming", "preparing", "brightening", "title-screen", "leaving"), `screen` (["blank" or
# "lit", level 0 to 15]), `countdown` (only while "title-screen" and "leaving") and `next_dim`
# (frames to the next dim, only while "leaving").
# Input: `finished`, how many frames of work finished since the last frame end (0, 1 or 2), and
# `pressed`, one list per finished frame of the buttons just pressed as it began (none when
# absent).
# `after` lists the fields the vector checks, and `requests`, the tunes asked for in the frame
# end, oldest first (none when absent). `stage` in `after` may be a way out: "opening-plays",
# "demo-begins" or "file-select-begins". `unsupported = true` in `after` means the frame end
# belongs to the piece after a way out.
# `rules` overrides the reference rules for the vector: `fast_step` (levels per frame,
# reference 2), `demo_wait` (frames, reference 900) and `leave_pace` (frames per level,
# reference 2).

[[vector]]
id = "R-begins"
source = "recorded"
entries = ["TitleBegins"]
before = { stage = "begun", screen = ["blank", 15] }
finished = 1
after = { stage = "loading", screen = ["blank", 15] }

