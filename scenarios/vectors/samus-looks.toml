# Test vectors for docs/behaviours/samus-looks.md.
#
# Format
# - [paces]: the run's paces (spec §1.4), invented: plain, a hold for each shown step of the
#   running clip; boosted, five lists, one per boost stage 0 to 4.
# - [clips.NAME]: an invented clip (spec §1.4): steps, in order from step 0, each "N" (a shown
#   step held N frames), "rest", "again S", "breathe", "end", "end-unless-jump" or
#   "branch X Y Z"; kick, fast_fall and rising (optional): the step each marks.
# - Each [[vector]] is one frame, from the State before it to the State after it: id; source
#   ("constructed", or "ROW:FRAME", the record the frame starts from); entries (the spec's
#   behaviours it exercises); before; inputs; after.
# - before and after: step, left (the time left), stage and laps (the laps left), each default 0
#   in before; after states all four. after also holds end (default "None"; "End" or "EndUnlessJump": the end her clip reaches this
#   frame, known from the frame's start), turned_far (default false) and
#   sounds (default none), in the order asked: "PlainSpin", "SpaceJump", "ScrewAttack", "Boosting".
# - inputs (spec §1.3): pose, "BODY ACTION FACING AIM", then "Drawn" for the gun drawn,
#   "Striding" for the legs, and "ScrewAttack", "SpaceJump" or "OtherSuit" for the sprite
#   (default the gun stowed, legs together, the plain sprite); an action with a turn or a landing
#   is written "Turning(Ground)", "Landing(Jump)" and the like. clip: the clip of her pose.
#   pose_after and clip_after (optional, default the same): the pose she ends the frame in and
#   its clip. energy (default 99); items (default none): "SpeedBooster", "SpaceJump",
#   "ScrewAttack"; submerged, run_held, handed_over, dashing, dash_began, dash_lost,
#   standing_restarts, wall_jump_readied, heading_down (each default false; dashing is true
#   whenever dash_began is); slowdown, start_slowdown, down_speed, sounds_waiting (each default 0).
# - Every vector holds RAM values and invented content only: no clip or pace of the game. The
#   constructed vectors (C) work each rule on the invented clips. The recorded vectors (R) are
#   frames the oracle recorded on which no clip is read: the time runs down without the clip
#   moving on, or a restart, a dash's beginning or its loss sets the State; they carry the
#   record's step, time left, stage and laps, with an invented clip the frame never reads.
#   Recorded frames that read a clip are the harness's
#   cases.

[paces]
plain = [11, 4, 10, 7, 13]
boosted = [[14, 11, 13, 12, 9], [10, 13, 9, 12, 6], [8, 12, 7, 10, 11], [7, 5, 4, 6, 9], [4, 7, 6, 5, 8]]

[clips.stand]
steps = ["7", "5", "breathe", "9", "6", "again 3"]

[clips.run]
steps = ["6", "8", "5", "9", "12", "again 0"]

[clips.spin]
steps = ["6", "9", "7", "5", "10", "again 1"]
kick = 2

[clips.tumble]
steps = ["8", "6", "9", "11", "5", "13", "7", "again 0"]

[clips.twirl]
steps = ["5", "11", "6", "9", "8", "again 1"]
kick = 1

[clips.walljump]
steps = ["8", "branch 2 5 8", "7", "6", "again 2", "9", "5", "again 5", "4", "13", "again 8"]
kick = 4

[clips.fall]
steps = ["9", "6", "11", "8", "13", "again 0"]
fast_fall = 2

[clips.jump]
steps = ["5", "8", "12", "6", "10", "again 2"]
rising = 1

[clips.turn]
steps = ["7", "5", "9", "6", "end-unless-jump"]

[clips.fold]
steps = ["11", "9", "6", "13", "end"]

[clips.aimed]
steps = ["5", "13", "8", "11", "9", "again 1"]

[clips.blink]
steps = ["9", "rest", "6", "10", "7", "again 0"]

[clips.ball]
steps = ["7", "4", "9", "12", "6", "10", "8", "again 0"]

[clips.stride]
steps = ["13", "10", "4", "12", "7", "again 2"]

[clips.pause]
steps = ["12", "rest", "7", "13", "5", "again 0"]

[clips.long]
steps = ["9", "12", "7", "10", "13", "6", "11", "8", "14", "5", "4", "again 0"]

# the time runs down by 1, the step stays
[[vector]]
id = "C-count"
source = "constructed"
entries = ["ClipPlays"]
before = { step = 1, left = 5 }
inputs = { pose = "Upright Still Right Forward", clip = "stand" }
after = { step = 1, left = 4, stage = 0, laps = 0 }

# the last frame of step 2 runs out: step 3, held its 6
[[vector]]
id = "C-next"
source = "constructed"
entries = ["ClipPlays"]
before = { step = 2, left = 1 }
inputs = { pose = "Upright Jumping Right Forward", clip = "jump", heading_down = true }
after = { step = 3, left = 6, stage = 0, laps = 0 }

# on a rest with no time left, the clip moves on the next frame: step 2, held 6
[[vector]]
id = "C-after-rest"
source = "constructed"
entries = ["ClipPlays", "ClipControls"]
before = { step = 1, left = 0 }
inputs = { pose = "Upright Falling Right Forward", clip = "blink" }
after = { step = 2, left = 6, stage = 0, laps = 0 }

# a slowdown of 3 lengthens the next hold: 6 + 3
[[vector]]
id = "C-slow-show"
source = "constructed"
entries = ["ClipPlays"]
before = { step = 2, left = 1 }
inputs = { pose = "Upright Jumping Right Forward", clip = "jump", slowdown = 3, heading_down = true }
after = { step = 3, left = 9, stage = 0, laps = 0 }

# moving on to "again 1" goes on from step 1, held 9
[[vector]]
id = "C-again"
source = "constructed"
entries = ["ClipControls"]
before = { step = 4, left = 1 }
inputs = { pose = "Upright Spinning Right Forward", clip = "spin" }
after = { step = 1, left = 9, stage = 0, laps = 0 }

# the same with a slowdown of 2: 9 + 2
[[vector]]
id = "C-slow-again"
source = "constructed"
entries = ["ClipControls"]
before = { step = 4, left = 1 }
inputs = { pose = "Upright Spinning Right Forward", clip = "spin", slowdown = 2 }
after = { step = 1, left = 11, stage = 0, laps = 0 }

# moving on to a rest: she rests on step 1 with 0 left, whatever the slowdown
[[vector]]
id = "C-rest"
source = "constructed"
entries = ["ClipControls"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright Falling Right Forward", clip = "blink", slowdown = 3 }
after = { step = 1, left = 0, stage = 0, laps = 0 }

# energy 30: back to step 0, held 7
[[vector]]
id = "C-breathe-loop"
source = "constructed"
entries = ["Breathing"]
before = { step = 1, left = 1 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", energy = 30 }
after = { step = 0, left = 7, stage = 0, laps = 0 }

# energy 29, slowdown 1: on to step 3, held 9 + 1
[[vector]]
id = "C-breathe-on"
source = "constructed"
entries = ["Breathing"]
before = { step = 1, left = 1 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", energy = 29, slowdown = 1 }
after = { step = 3, left = 10, stage = 0, laps = 0 }

# the crouch-down ends: ended, and the pose it hands over starts on step 0 of its clip, held 7
[[vector]]
id = "C-end"
source = "constructed"
entries = ["ClipEnds", "StartingClip"]
before = { step = 3, left = 1 }
inputs = { pose = "Crouched Crouching Right Forward", clip = "fold", pose_after = "Crouched Still Right Forward", clip_after = "stand", handed_over = true }
after = { step = 0, left = 7, stage = 0, laps = 0, end = "End" }

# a turn reaches an end unless a jump; samus-motion takes the standing pose it hands over: step 0, held 7
[[vector]]
id = "C-end-unless-jump"
source = "constructed"
entries = ["ClipEnds", "StartingClip"]
before = { step = 3, left = 1 }
inputs = { pose = "Upright Turning(Ground) Left Forward", clip = "turn", pose_after = "Upright Still Left Forward", clip_after = "stand", handed_over = true }
after = { step = 0, left = 7, stage = 0, laps = 0, end = "EndUnlessJump" }

# a turn reaches an end unless a jump, and the pad's jump is taken (no hand-over): the jump starts on step 0
[[vector]]
id = "C-end-gives-way"
source = "constructed"
entries = ["ClipEnds", "StartingClip"]
before = { step = 3, left = 1 }
inputs = { pose = "Upright Turning(Ground) Left Forward", clip = "turn", pose_after = "Upright TakingOff Left Forward", clip_after = "jump", slowdown = 2, start_slowdown = 2 }
after = { step = 0, left = 7, stage = 0, laps = 0, end = "EndUnlessJump" }

# the step before the end with 4 left: no end this frame, 3 left
[[vector]]
id = "C-end-later"
source = "constructed"
entries = ["ClipEnds"]
before = { step = 3, left = 4 }
inputs = { pose = "Crouched Crouching Right Forward", clip = "fold" }
after = { step = 3, left = 3, stage = 0, laps = 0 }

# no item: the spin's steps from 2, held 7, asking for PlainSpin
[[vector]]
id = "C-branch-spin"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump" }
after = { step = 2, left = 7, stage = 0, laps = 0, sounds = ["PlainSpin"] }

# the space jump: its steps from 5, held 9, asking for SpaceJump
[[vector]]
id = "C-branch-space"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump", items = ["SpaceJump"] }
after = { step = 5, left = 9, stage = 0, laps = 0, turned_far = true, sounds = ["SpaceJump"] }

# the screw attack: its steps from 8, held 4, asking for ScrewAttack
[[vector]]
id = "C-branch-screw"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump", items = ["ScrewAttack"] }
after = { step = 8, left = 4, stage = 0, laps = 0, turned_far = true, sounds = ["ScrewAttack"] }

# both items: the screw attack's
[[vector]]
