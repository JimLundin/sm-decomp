# submerged with the screw attack: the spin's, asking for PlainSpin; held 7 + 1 slowdown
[[vector]]
id = "C-branch-submerged"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump", items = ["ScrewAttack"], submerged = true, slowdown = 1 }
after = { step = 2, left = 8, stage = 0, laps = 0, sounds = ["PlainSpin"] }

# a clip ends under water: the next pose's first hold is 7 + 3 (the start's) + 3
[[vector]]
