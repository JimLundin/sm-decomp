# The options menu, one frame end at a time: the State before it, how the frame ended, and the
# State after it.
#
# State: `stage` ("loading", "brightening", "choosing", "special", "dissolving-out",
# "dissolving-in", "leaving", "returning"), `load_step` (0 or 1, only while "loading"), `screen`
# (["blank" or "lit", level 0 to 15]), `cursor` (on the options: "start-game", "english",
# "japanese", "controls", "special"; on the special settings: "weapon-reset", "moonwalk", "end";
# while dissolving, "start-game" towards the options, "special" or "controls" towards those),
# `mosaic` (the dissolve's block size, 0 to 15; absent when off), `begins` (how the chosen file
# begins, only while "leaving": "intro" or "ceres-escape"), and the settings `japanese`,
# `moonwalk` and `weapon_reset` (true or false).
# Input: `finished`, 1 when the game had its work done by the frame end, 0 when still busy;
# `pressed`, one list per finished frame of the buttons just pressed as it began (none when
# absent); `input.begins`, how the chosen file begins: "intro" (a new file), "ceres-escape" or
# "play" ("intro" when absent).
# `after` lists the fields the vector checks, and `requests`, the sounds asked for, oldest first
# (none when absent): "cursor-moved", "selected". `stage` in `after` may be a way out:
# "intro-begins", "escape-begins", "play-continues", "file-select-again" or "controls-begin".
# `unsupported = true` means the frame end belongs to the piece after a way out.

[[vector]]
id = "R-load-first"
source = "recorded"
entries = ["OptionsLoad"]
before = { stage = "loading", screen = ["blank", 0], japanese = false, moonwalk = false, weapon_reset = false }
finished = 1
after = { stage = "loading", load_step = 1, screen = ["blank", 0] }

