# Test vectors for docs/behaviours/samus-motion.md.
#
# Format
# - Each [[vector]] is a short run of frames ending in the frame it checks: id; source ("<row>:<frame>"
#   for the record holding the last frame's result, or "constructed"); entries (the spec's
#   behaviours it exercises); rules (optional: speed_cap = "Wordwise", the default, or "Exact");
#   equipment (optional: hi_jump, space_jump, default false; screw_attack, spring_ball and
#   other_suit change only the sprite, spec §2, and no vector sets them); world; before; lead_in (optional);
#   pose; next_pose (optional); pad; jump_pressed; pressed (optional); animation_ends (optional);
#   after.
# - A P.S quantity is "PPPP.SSSS": the pixel part and the subpixel part, both hex. A signed one
#   starts with "+" or "-": speed_x is rightward positive, speed_y downward positive.
# - world: a stand-in for the room. Anything not listed is air.
#   - floor_top: the y of a solid floor's top face, a multiple of 16; every row from it down is solid.
#   - wall_right: the x of a solid wall's left face, a multiple of 16; every column from it
#     rightward is solid.
#   - ceiling_bottom: the y of a solid ceiling's bottom face, a multiple of 16; every row above it is
#     solid.
#   - slope_floor: one sloped floor block, or a list of them, each: block = [x, y], its top-left
#     corner (multiples of 16);
#     surface = 16 numbers, one per column of pixels from the left, the row (0 to 15) of the surface's
#     top pixel in the block: that pixel and every one below it in the block are solid, those above
#     are air; 16 means the column has no solid pixel in the block and its surface lies just past the
#     block's far edge; 17 means it has none and its surface lies further past (spec `SlopesCarry`, a
#     column far past: it never meets her). factor (optional, default
#     "1.00"): the shape's walk factor in hex, a pixel and 1/256ths (spec `SlopesSlowTheWalk`).
#   - slope_ceiling: one sloped ceiling block, as slope_floor, but each number is the row of the
#     surface's bottom pixel: that pixel and every one above it in the block are solid. 16 and 17 mean the
#     column holds none of the surface, as for slope_floor (spec `SlopesCarry`). Its factor,
#     when given, is the shape's and never applies to her moves.
#   - solid_block: [x, y], the top-left corner of one solid 16 px block.
#   - stepped: one stepped block: block = [x, y], its top-left corner; quarters = two strings, its
#     upper 8 px row of quarters then its lower one, each two characters from the left: "#" a solid
#     8 px quarter, "." air.
#   - enemy: one solid enemy: centre = [x, y] in px; radius = [x, y], its half-width and half-height
#     in px (its box is centre - radius to centre + radius, measured as her body's box is, spec §8).
#   - elevator_moving: true when she stands on an elevator that is moving (spec §1.3).
#   - cells: the other kinds of cell (spec `OtherBlockKinds`), a list of { block = [x, y], kind }, the
#     block's top-left corner and its kind: "DoorToRoom", "DoorToNowhere", "Spikes",
#     "AirWithSpikes", "BreaksToShots", "HoldsGrapple", "AirShotsActOn", "BreaksToBombs",
#     "AirBombsActOn", "ReactingBlock", "ReactingAir" or "StandIn". A "BreaksToBombs" or
#     "ReactingBlock" also gives answer = "Solid" or "Air", the world's answer for every touch
#     this frame (default "Solid"). A "StandIn" gives names = [x, y], the top-left corner of the
#     cell it stands for.
#   A recorded vector's world answers its frames as the room did: open air where she met nothing,
#   the floor she stood on where she was on flat ground, and the wall she stood flush against
#   where she was against the wall (a solid_block beside her feet stands for a wall on her left).
# - before: what the player can tell about Samus at the start (spec §1): position = [x, y],
#   speed_x, dash, speed_y, bounces; falling (optional, default false): true when, in a pose on
#   the ground, she is falling at the start's vertical speed of 0 (spec §1.2, falling at 0 on the
#   ground: only a push beyond this spec hands her back so). A missing quantity is 0. The start is
#   always a moment where she remembers nothing the quantities don't show (spec §1.2), with one
#   exception: falling, which no lead-in in scope reaches.
# - lead_in: the frames before the checked one, oldest first, when the checked frame depends on
#   something she remembers. Each gives the pose at its start (as pose below), the pad,
#   jump_pressed, pressed and animation_ends (optional, as below). A lead-in frame's pose is the one the next frame
#   starts in, so where the pose changes, the change happens in the frame before. Nothing is
#   compared during the lead-in.
# - pose: the pose at the checked frame's start (spec §2): body, action, facing, radius = [x, y]
#   in px; aim (optional, default Forward: Forward, Up, UpForward, DownForward, Down); gun
#   (optional, default "Stowed": "Drawn" or "Stowed"); and turn (optional, `Turning` only,
#   default "Ground": "Fall", "Ground", "Jump" or "MoonwalkJump", the turn she is in, spec §2);
#   landed_from (`Landing` only: "Jump" or "Spin"); and legs (optional, default "Together":
#   "Striding" or "Together"). These lists of values are alphabetical; their order means nothing.
#   A recorded pose gives the aim, gun and turn the record shows. next_pose: the pose chosen
#   during it, when it changes; its radius is her body's size after the change.
# - frame (optional): "Even" or "Odd", the parity of the checked frame (spec §1.3); default "Even".
#   The lead-in's frames alternate back from it.
# - pad: the buttons held; jump_pressed: jump just pressed this frame; pressed (optional, default
#   none): the other buttons just pressed this frame (held now and not the frame before), named as
#   in pad. A recorded frame gives the record's presses, so a lead-in's first frame and a vector
#   with no lead-in carry presses too. Presses are given, never inferred from the pads: a button
#   held and not in pressed was already held the frame before.
# - animation_ends (optional, default false): true when the animation of her pose ends on this frame
#   (spec `AnimationEnds`; how far an animation has run is out of scope, so the vector says), false
#   when it doesn't. A lead-in frame gives it the same way, for that frame. A vector never infers it.
# - spin_turned_far (optional, default false): the input "spin turned far" (spec §1.3, `WallJump`)
#   on this frame, given as animation_ends is, by a lead-in frame too.
# - after: compared at the end of the checked frame; only the listed quantities are compared, and
#   position_x compares x alone. pose: the pose the frame ends in (as `pose` gives it),
#   given where pose fit refuses the change or makes her crouch instead (spec `PoseFitAfterMoves`), so
#   it differs from next_pose. reached: the cells her moves and looks reach this frame (spec
#   `TouchedCells`), in order, each { cell = [x, y], way }, the cell's top-left corner in px and the
#   move's direction ("Down", "Left", "Right" or "Up"), or "Look" for a cell a look reaches: the
#   near-wall test (spec `WallJump`), pose fit's block looks (spec `PoseFitAfterMoves`) or the
#   shrink's look (spec `ShrinkingLowersHer`); these values are listed alphabetically and their
#   order means nothing. A cell that stands for another is listed as the one it names.
#   inside: the cells she is inside this frame, in order, each [x, y], the cell's top-left corner.
#   wall_test: the frame's outcome of the near-wall test (spec `WallJump`'s output), one of
#   "Kicked", "Neither" or "Readied" (listed alphabetically; the order means nothing); compared
#   only where given. A kick also shows in next_pose, whose action is then `WallJumping`.
#   placed: the y a placement put her at this frame, a P.S quantity, or "none" where nothing placed
#   her (spec §1, `PoseFitAfterMoves` and `ShrinkingLowersHer`); compared only where given.
#   rising: whether she is rising at the frame's end, true or false (spec `RisingAndFalling`'s
#   output); compared only where given.
# - Recorded vectors: taken from oracle frames where her pose and body size didn't change (or she
#   landed), her horizontal move was her whole speed, and she met no slope. A lead-in's frames pass
#   the same test, and the only pose changes in one are a jump, a fall or a turn started from
#   standing, running or moonwalking, a take-off becoming a jump, (M1) a turn's end into a spin,
#   (RW1, MT1) a spin reversed, (MT1) a spin becoming a straight jump and that jump's turn, and
#   (JH1-JH4) a landing from a straight jump or a fall and (JH4) a turn in a fall and its end.
#   In RW1 the near-wall test writes her x subpixel after the move in its checked frame (spec
#   `WallJump`).
#   J1-J3, A1 and WK1 check a frame whose pose changes (a jump start, a take-off, an aim change, a
#   wall jump's kick) and give its next_pose; PF1 checks a crouch take-off, whose body grows; SH1-SH3 check the frame a
#   crouch or a morph begins, whose body shrinks. No recorded vector comes from a frame run by
#   a bomb jump or a grapple release. The W vectors (item-morph-ball, the integration gaps 10-16)
#   check frames the Tick met there. Most end in a pose other than the one they start in, or grow
#   her body, and there their
#   next_pose and radius are the record's, the radius being the chosen pose's own (spec §1.3);
#   W11 (a turn on the ground over air) and W20 (running on a solid enemy) change neither.
#   AS4, SL1-SL3, MT1, MT2 and BG2 check frames the domain harness met (the integration gaps 20,
#   24-30); BG2 starts the frame after a bomb jump handed her back, falling at 0 on the ground:
#   SL1-SL3 meet sloped floors, given as the room's blocks.

