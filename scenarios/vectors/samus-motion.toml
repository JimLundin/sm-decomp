# Test vectors for docs/behaviours/samus-motion.md, read by a `game` test.
#
# Format
# - Each [[vector]] is one frame: id; source ("<row>:<frame>" for the oracle record holding the
#   frame's result, or "constructed"); entries (the spec's behaviours it exercises); rules
#   (optional: speed_cap = "Wordwise", the default, or "Exact"); equipment (optional: hi_jump,
#   space_jump, default false); world; before; pose; next_pose (optional); pad; jump_pressed; after.
# - A P.S quantity is "PPPP.SSSS": the pixel part and the subpixel part, both hex. A signed one
#   starts with "+" or "-" (vertical_velocity: down positive).
# - world: a stand-in for the room. Anything not listed is air.
#   - floor_top: the y of a solid floor's top face, a multiple of 16; every row from it down is solid.
#   - wall_right: the x of a solid wall's left face, a multiple of 16; every column from it
#     rightward is solid.
#   A recorded vector's world is chosen so that it answers the frame as the room did: open air
#   where she met nothing, the floor she stood on where she was on flat ground.
# - before / after: Samus's State (spec §1): position = [x, y], run_speed, dash, dash_kept, drive
#   ("Driven", "Coasting", "Skidding" for Coasting(Behind)), vertical ("Rising", "Falling",
#   "Settled"), vertical_velocity, bounces (default 0). In `after`, only the listed fields are
#   compared; position_x compares x alone.
# - pose: the pose at the frame's start (spec §2): body, action, facing, radius = [x, y] in px.
#   next_pose: the pose chosen during the frame, when it changes (the pose chart is not in the spec
#   yet, so the vector gives it).
# - pad: the buttons held; jump_pressed: jump newly pressed this frame.
# - Recorded vectors: taken from oracle frames where her pose and body size didn't change (or she
#   landed), her horizontal move was her whole speed, and she met no slope.

# Constructed vectors: cases no record reaches, and the Exact variant.

