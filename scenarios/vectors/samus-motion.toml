# C-place-0: a placement of 0 px. The ball unmorphs in open air on the frame it starts to fall:
# her moves are 0, the body grows 9 px and the looks find nothing, so pose fit doesn't push her,
# and unmorphing lowers her 0 px. That is still a placement, at her y pixel with the frame's start
# subpixel, 0100.8000: her start y, which only a present placement tells from none.

[[vector]]
id = "C-place-0"
source = "constructed"
entries = ["ShrinkingLowersHer", "PoseFitAfterMoves", "PadChart", "RisingAndFalling"]
world = {}
before = { position = ["0100.0000", "0100.8000"], speed_y = "+0000.0000" }
pose = { body = "Ball", action = "Falling", facing = "Right", radius = [5, 7] }
next_pose = { body = "Crouched", action = "Unmorphing", facing = "Right", radius = [5, 16] }
pad = ["jump"]
jump_pressed = true
after = { position = ["0100.0000", "0100.8000"], speed_y = "+0000.1C00", placed = "0100.8000", rising = false }

# A spin lands in a tunnel: the landing's body grows 9 px, the looks find 8 px of room above and
# none below, so she takes crouched Still instead and rises 4 px, her feet on the floor (the spin's
# half-height 12 against the crouch's 16). The crouch taken instead skips the landing's effects:
# her horizontal speed (1.6000, drifting forward) and her vertical speed (3.0000 grown by the pull)
# stay as her moves left them, where a landing would stop both.

[[vector]]
id = "C-fit-land-tunnel"
source = "constructed"
entries = ["PoseFitAfterMoves", "Landing", "WhatHerMovesMet", "DriftInTheAir", "BlocksStopFlush"]
world = { floor_top = 288, ceiling_bottom = 256 }
before = { position = ["0100.0000", "0112.0000"], speed_x = "+0001.6000", speed_y = "+0003.0000" }
pose = { body = "Upright", action = "Spinning", facing = "Right", radius = [5, 12] }
next_pose = { body = "Upright", action = "Landing", facing = "Right", radius = [5, 21], landed_from = "Spin" }
pad = ["right"]
jump_pressed = false
after = { position = ["0101.6000", "0110.FFFF"], speed_x = "+0001.6000", dash = "0000.0000", speed_y = "+0003.1C00", placed = "0110.0000", pose = { body = "Crouched", action = "Still", facing = "Right", radius = [5, 16] } }

# Pose-chart steps (spec section 7): one frame each, from a record. The next pose is the output.
# - pose: the pose at the frame's start (body, action, facing, aim, and gun: "Drawn" or "Stowed",
#   default "Stowed"; and turn, `Turning` only, as a vector's pose gives it); pad: the
#   buttons held;
#   jump_pressed: jump just pressed; pressed: the other buttons just pressed this frame.
# - met: what this frame's moves met, listed alphabetically: "animation_end" (the animation of her pose
#   ends this frame), "floor" (a landing), "no_floor" (walking off a ledge), "nothing", "wall" (a
