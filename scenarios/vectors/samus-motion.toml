# The 8 px look (PoseFitAfterMoves): a ball unmorphing grows 9 px, so each look of 8 px or more is
# stopped by what a look of 8 px would stop. The stepped block's lower half is solid and its upper
# half air.
# - C-fit-step-ceiling: her top edge is against the solid lower half. The 8 px look up stops
#   there (room 0, her y subpixel written 0), so she is pushed down 9 px. A 9 px look alone would
#   reach the air upper half and find room: no push, y 00F7.8000. Her body lies within the column at 256, so
#   the looks' cells (TouchedCells) are the step (the 8 px look up stops on it), then row 256
#   four times: the look down's 8 px and 9 px looks, then the far-side look down of 9 px, which
#   is 8 px or more and so also comes after an 8 px look.
# - C-fit-step-floor: the ball rests on the solid lower half, with air under the step. The 8 px
#   look down stops on it (room 0), so she is pushed up 9 px and her feet stay on the step. A 9 px
#   look alone would reach the air under the step: no push, y 0111.FFFF.
# - C-fit-step-enemy: as C-fit-step-ceiling, with a solid enemy 1 px under her (her bottom side
#   254, its top side 255). A block above and an enemy below: the ball is refused. Her y subpixel
#   stays as the looks wrote it (0). A 9 px look alone would find room above, and the enemy would
#   push her up 8 px instead (9 less the 1 px gap), to 00EF.8000.

[[vector]]
id = "C-fit-step-ceiling"
source = "constructed"
entries = ["PoseFitAfterMoves", "BlocksStopFlush", "TouchedCells", "PadChart", "RisingAndFalling"]
