# Each step advances the encounter unless advance is false. The optional steps list
# replaces inputs with consecutive steps that carry State. The case checks the last
# step's State and output. A start with advance false admits pending_start and Y.
# State fields
# omitted from before take their absent or zero defaults. Inputs omitted take defaults:
# advance true, start false, start_offset 8 px, odd false, return_zero false,
# samus_x 155 px and shots empty. Shots are listed highest precedence first.
# expect.state and expect.output name the fields the case checks. "none" denotes absence.
# A ring's x and y count 1/65536 px. Draw entries are [name, x, y, picture, palette].
# Rank 0 is foremost. Clip step -1 denotes a burst waiting to show its first image.
# Rules override contact.limit (84 px), contact.hits (4), shake_travel (4 px)
# or shake_hold (128 beats). The other values retain their reference settings.

