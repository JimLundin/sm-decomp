# frame runs one sound group through successive frames from the declared sender progress,
# queue, request line, staged and handled requests and reply. Each frames entry is one frame:
# its queue offers (allowance three, sound enabled, outside demo and explosion suppression),
# its effect turns before and after the sender service, whether it runs a service, and its
# music turns (zero unless given). Each expect entry is the state at that frame's cut.
# progress is Ready, AwaitCue:<cue>, ClearDelay:<turns>, AwaitClear or ResetDelay:<turns>.
# Cues are typed; each cue's clip is one invented part of one 20-turn span at pitch 24,
# timbre 0. Other groups stay Ready with empty queues and Absent lines; all effect voices
# start free. A recorded vector's cadence and sender progress come from the frames its
# source names; its cue identity is invented.
[[frame]]
id = "F-two-frames"
group = "Contact"
progress = "Ready"
queue = ["Footstep"]
request = "Absent"
staged = "Absent"
handled = "Absent"
reply = "Absent"
frames = [
  { offers = [], before = 0, service = true, after = 1 },
  { offers = [], before = 0, service = true, after = 1 },
  { offers = [], before = 0, service = true, after = 1 },
  { offers = [], before = 0, service = true, after = 1 },
  { offers = [], before = 0, service = true, after = 1 },
  { offers = [], before = 0, service = true, after = 1 },
  { offers = [], before = 0, service = true, after = 1 },
]
expect = [
  { progress = "AwaitCue:Footstep", queue = [], request = "Footstep", staged = "Footstep", reply = "Absent" },
  { progress = "AwaitCue:Footstep", queue = [], request = "Footstep", staged = "Footstep", reply = "Footstep" },
  { progress = "ClearDelay:2", queue = [], request = "Footstep", staged = "Footstep", reply = "Footstep" },
  { progress = "ClearDelay:1", queue = [], request = "Footstep", staged = "Footstep", reply = "Footstep" },
  { progress = "AwaitClear", queue = [], request = "Absent", staged = "Absent", reply = "Footstep" },
  { progress = "AwaitClear", queue = [], request = "Absent", staged = "Absent", reply = "Absent" },
  { progress = "Ready", queue = [], request = "Absent", staged = "Absent", reply = "Absent" },
]

