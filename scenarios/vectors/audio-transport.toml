# Voice aliases 0/1 name first/second music voices; 2..7 name the six ordered
# effect-pool voices. Existing effect labels retain those identities.
# Existing constructed cases use invented resident reply alias zero; resident_reply
# cases supply an explicit immutable identity/encoding. This default is not a native seed.
# All graphs, scalars and cue aliases in this file are invented source-expected inputs.
# Track records contain the entire graph and saved state. Event kind names are typed
# choices; phrase/cursor indexes are zero based. Inactive repeat/ramp has no payload.
# Each family runs one turn unless its work array explicitly requests successive turns.
# Music work uses fixture_mix; other song families declare their own complete mix.
# TimbreId aliases 0 and 1 name resolved invented non-noise instruments; they
# are identities, not source instrument bytes. Echo delay is fixed at 2.
# Sender CueId aliases 7 and 9 carry identity only; they are not game command bytes.
# A -1 observation/presentation offset means no milestone; value 0 means Absent.
# Inactive-ramp uses completion_clock, declared cadence phases, no effects/inputs.
# Completion fixtures start at AudioInstant 0, timer phase 531 AudioCycles, zero
# unread overflows, and polling lattice origin 811/2 AudioCycles (eight-cycle steps).
# Profiles both/effects use effect phase 7; both/music use music phase 224; others 0.
# All accepted/handled/request/reply values start Absent; all effect slots are free.
# both/effects presents Action CueId 7 at 3217/2, a single invented pitch-24 span
# lasting 20 turns, with no release or controls. Other profiles have no presentations.
# Effect fixtures prepare one span per part: declared pitch/duration, zero auxiliary
# scalar fields, release array in physical part order; occupied lists physical slots.
# Allocation searches 7 down to 2. Slide speed/target creates ConnectedPitchSlide at
# span zero. E-loop repeats its identical spans after intro_parts using RepeatStart
# and RepeatForever. E-door-prenote starts two prepared slots 7/6 with remaining
# prepared_remaining, Hold connection, zero pitch/fraction/span cursor/slide progress.
# E-second-part starts dead slot 7 then live slot 6, releasing with release timer 1,
# span countdown one, span cursor zero, pitch/fraction zero; only slot 6 is owned.
# Clock fixtures start at 2048*overflows AudioCycles, zero previously cleared count,
# pending ObserveClock at that instant, and polling end now+1/2; phase is declared.
# Offer fixtures start Ready with no current cue or delay, and the declared queue.
# Staged fixtures start one live Footstep slot 7 at pitch 24, span cursor 1,
# instruction remaining 10, fraction 0, no release/slide or pending preparation.
# Other groups are Absent/free; protected selects Door ownership.
# Sample fixtures start at 0, first value already presented, second at 5; pair reads
# at 9/2 and 19/2. Publication anchor 0 survives retries; only Contact is tested.
# Invented sender, phrase and loudness cases. No imported game content.
# sender: one group service; phrase: finish one repeated phrase;
# ramp: start a ramp then advance one final-pass volume turn.
schema = "audio-transport-draft-v1"
completion_clock = { now = 0, timer_phase = 531, unread_overflows = 0, polling_origin_numerator = 811, polling_origin_denominator = 2 }
