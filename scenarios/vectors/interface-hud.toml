scope = "Model"
source = "recorded"
entries = ["EscapeCountdown"]
before = "Dormant"
expected = "Pass"
after = "Dormant"
[[countdown.frames]]
scene = "MaintainCountdown"
answer = "NoExpiry"
picture = "Absent"

