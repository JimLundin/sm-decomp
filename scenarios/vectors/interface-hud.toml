# Test vectors for docs/behaviours/interface-hud.md.
#
# Format
# - [pictures]: the HUD's pictures (spec §1.4), invented for these vectors in the format the
#   importer writes: blank, digits (digit d's picture is the d-th, from 0), full_tank,
#   empty_tank, reserve_sign (its three rows, top first, two cells each), icons (each item's
#   two rows, top first: three cells each for the missiles, two for the rest), map_blank and
#   diagonal. A picture is "PPP" (three hex digits, its number) then "h" when it is flipped left
#   to right and "v" when it is flipped top to bottom. Every vector uses this one set.
#   Its blank is flipped, though no rule reads the blank's flips (spec SelectionHighlight:
#   the blank cell is the blank's picture unflipped), and so are a digit, the empty tank and
#   the map's blank, which are drawn with their flips.
# - Each [[vector]] is one step of the HUD, from its state before the step to its state after:
#   id; source ("constructed": every vector is); entries (the spec's behaviours it exercises);
#   rules (optional); step (optional, default "Frame"); frame (the frame count mod 256 as the
#   frame begins, spec §1.3; a "Frame" step only); before; inputs; after.
# - rules (optional): the values of the adjustable rules this vector runs under; left out, the
#   game's own (the reference). Each key can be given alone; one left out is the game's:
#   - one_shot_flash: the frames each way of the one-shot item's flash (spec OneShotFlash; the
#     game's 16).
#   - her_blink: the frames each way of her cell's blink (spec HerBlink; the game's 8).
#   - boss_screens = { <boss> = [[across, down], ...] }: the screens a boss explores (spec
#     BossBlanksTheMap), the boss named as in boss below or "MotherBrain"; a boss not named
#     keeps the game's screens.
# - step: "Frame" is one whole frame of play: its after is State and outputs as the frame
#   ends. "BossEvent" is the door or the load flow meeting a boss, on entering its room while
#   it lives (spec `BossBlanksTheMap`): it has no `frame` key, and
#   its only inputs are mini_map's room (its cell) and boss; its after is compared after the
#   event alone. "OutOfPlay" is a step outside play (spec `OutOfPlay`): it has no `frame` key,
#   and its only inputs are mini_map's turned_on, new_area and dropped (without its when).
# - A cell is "PPP:c", then "h" and "v" for its flips as above: PPP its picture's number, c its
#   colour set (spec §1.4). A HUD row is one string of its 32 cells, left to right, separated
#   by spaces; hud is the three rows, top first. A map picture is a picture alone (its colour
#   set is the mini-map's to choose).
# - Every place is written column first, on the HUD and on her map alike: "column,row" as a
#   key and [column, row] as a value; a position is [x, y] and a size [across, down].
# - Items are "None", "Missiles", "SuperMissiles", "PowerBombs", "GrappleBeam", "XRayScope"
#   (spec §1.1: the HUD's order, left to right, after none).
# - before: hud (optional, default every cell the blank cell: the blank's picture in its
#   colours, unflipped, spec SelectionHighlight); shown = { energy,
#   missiles, super_missiles, power_bombs, selection } (optional, each default 0 or "None": the
#   values the HUD last showed, spec §1); selection (optional, default "None"); one_shot
#   (optional, default false): whether the selected item is the one-shot item, never true with
#   "None" selected; mini_map_off (optional, default false): the mini-map is off (spec §1);
#   explored (optional, default none): the explored cells, [column, row] on her map.
# - inputs (spec §1.3):
#   - energy = [now, capacity]; reserve (optional, default 0): the energy in the reserve tanks;
#     auto_reserve (optional, default false): the reserve tanks are set to refill on their own.
#   - missiles, super_missiles, power_bombs (optional, default [0, 0]): [count, capacity].
#   - equipped (optional, default none): "GrappleBeam", "XRayScope" when she has them on as the
#     frame begins (spec §1.3, her stock as the frame begins: only Select reads it).
#   - at_start (optional): { missiles, super_missiles, power_bombs }, each [count, capacity], her
#     stock as the frame begins, before this frame's shots and pickups (spec CyclingItems); a key
#     left out is the same as at the frame's end. missiles, super_missiles and power_bombs above
#     are the counts as the frame ends.
#   - select (optional): "Pressed" when item select goes down this frame; cancel (optional):
#     "Pressed" when item cancel goes down this frame, "Held" when it is held from before.
#   - can_switch (optional, default true): spec `CyclingItems`.
#   - muted_by (optional, default none): "SpinJump", "WallJump", "Grapple" or "TimeStopped", why a
#     switch makes no click (spec `SwitchClick`; listed alphabetically, the order means nothing).
#   - dropped (optional, default none): { what, when }, another domain drops the selection
#     (spec CancellingTheItem; the weapons' drop after a shot among them): what is "Selection"
#     (the selection becomes none, and with it the one-shot item) or "OneShot" (the one-shot item
#     alone); when (a "Frame" step only, default "BeforeStatusBar") is "BeforeStatusBar" or
#     "AfterStatusBar".
#   - new_area (an "OutOfPlay" step only, optional): { explored }, the step leads into another
#     area, and explored is the cells Progress keeps for it, [column, row] (spec OutOfPlay).
#   - collected (optional, default none): the item whose icon a pickup this frame draws.
#   - mini_map (optional, default: the mini-map has nothing to do): runs (default true);
#     turned_on (default false, a "Frame" or "OutOfPlay" step): the mini-map is turned on (spec
#     `MiniMapStill`); mother_brain_falls (default false, a "Frame" step only): her first form
#     falls this frame (spec `BossBlanksTheMap`); position = [x, y], her position in the room in
#     pixels; room = { cell = [column, row], her room's top-left cell on her map, the map's top
#     row counted as 0; blocks = [across, down], the room's size in 16 px blocks }; map = {
#     collected, pictures, charted, beyond }: whether she has collected the map; the pictures of
#     the map's cells, "column,row" = picture (a cell not listed shows the map_blank); the cells
#     the map charts, [column, row]; the beyond pictures (spec `LastColumnsShift`),
#     "column,row" = picture, column from 0 (a picture not listed is the map_blank); boss (a
#     "BossEvent" step only, required there): "Kraid", "Draygon", "Crocomire", "Phantoon",
#     "RidleyInNorfair" or "RidleyInCeres", the boss whose room the step enters.
# - after: compared at the end of the step: changed (optional, default none), the HUD's cells
#   that differ from before, "column,row" = cell, columns and rows from 0, every other cell as
#   before; shown, selection, one_shot, mini_map_off and explored, as in before (a field left
#   out is as before); events (default none), in the order raised: "Switched:<item>" (spec
#   `Switching`) and "Click" (spec `SwitchClick`); and, a "Frame" step only, controls = {
#   selection, one_shot }, the selection after the controls, before any drop (spec `Switching`):
#   left out, the selection and one_shot after the step, so a frame with a drop gives it.
# - Every vector holds RAM values and invented content only: no picture, map cell or room of the
#   game. The frames the oracle recorded are the harness's cases; each has a twin here, named
#   C-R and the case's number: its frame's counts, selection, frame count, position, room size and
#   explored cells, with the scene four map rows down and invented pictures. Their after, and
#   that of every other vector, is worked from the spec's rules.
# - The other constructed vectors (C): cases no record reaches (skipping an item she lacks, the
#   one-shot item and its flash, a shot's cancel, a drop, an icon appearing, a capacity of 0,
#   more than fourteen tanks, the clicks' other mutes, a mini-map that doesn't update, a
#   collected map, the diagonal picture, the map's first and last columns, cells outside the
#   map, spec §1.5, each boss, a step outside play, the stock Select reads as the frame begins
#   and the selection after the controls, the adjusted rules); each gives its case in
#   a comment.

# The HUD's pictures: invented, in the importer's format.
[pictures]
blank = "0B4v"
digits = ["097", "061", "0DB", "1F7", "1A1", "110", "070h", "195", "055", "1AB"]
full_tank = "0A1"
empty_tank = "0A2h"
reserve_sign = [["182", "1A5"], ["18F", "0FF"], ["0A3h", "0CA"]]
map_blank = "088h"
diagonal = "2E4"

[pictures.icons]
Missiles = [["082", "1F0", "082h"], ["0AC", "0E5", "0ACh"]]
SuperMissiles = [["106", "106h"], ["0A8", "0A8h"]]
PowerBombs = [["098", "09E"], ["074v", "18C"]]
GrappleBeam = [["040", "040h"], ["063", "063h"]]
