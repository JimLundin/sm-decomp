# [[countdown]] cases (spec §5.1): frames of play run through the escape countdown.
# scope = "Model" cases run the model; the "IntegrationAdmission" case checks only that the HUD
# refuses a scene whose choice isn't known (not model coverage). Each case:
# - before and after: the current countdown, "Dormant" or { time = [minutes, seconds,
#   hundredths], age = frames, place = [[x, x256ths], [y, y256ths]] }: its time left, its age
#   and its place in whole screen pixels and 1/256ths of a pixel (spec §5.1).
# - expected: "Pass", or "Unsupported" when the HUD refuses a frame before any effect; the
#   frames before it play, and after is the countdown as the refused frame finds it.
# - energy and protection_frames (optional): her energy and protection from hits beside it,
#   which no rule here reads.
# - [[countdown.frames]], in order, one per frame of play: scene, "MaintainCountdown" (the
#   scene runs the countdown), "PresentationOnly" (it only shows it) or "Unknown"; finished
#   (optional, default 0), the count of finished frames as the last frame left it (spec §5.1);
#   start (optional), [minutes, seconds], the countdown starts this frame at that time; and the
#   frame's outputs, absent on a refused frame: answer, "NoExpiry" or "Expired"; picture,
#   "Absent" or { place = [x, y] whole screen pixels, time = [minutes, seconds, hundredths] }.
# - The recorded cases (R) hold the records' values; the constructed ones (C) are worked from the spec's rules, each with its case in a comment.

