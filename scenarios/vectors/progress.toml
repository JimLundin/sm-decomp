[[vector]]
# every item and beam, and capacities that each round down: energy 999 / 100 = 9, reserve
# 250 / 100 = 2, missiles 101 / 5 = 20, super missiles 7 / 5 = 1, power bombs 23 / 5 = 4; with
# 11 items and 5 beams, 9 + 2 + 20 + 1 + 4 + 11 + 5 = 52
id = "C-percent-many"
source = "constructed"
entries = ["ItemPercentage"]
area = "Crateria"
before = { items = ["Bombs", "GrappleBeam", "GravitySuit", "HiJumpBoots", "MorphBall", "ScrewAttack", "SpaceJump", "SpeedBooster", "SpringBall", "VariaSuit", "XRayScope"], beams = ["Charge", "Ice", "Plasma", "Spazer", "Wave"], capacity = { energy = 999, reserve = 250, missiles = 101, super_missiles = 7, power_bombs = 23 } }
asks = { percentage = true }
answers = { percentage = 52 }

