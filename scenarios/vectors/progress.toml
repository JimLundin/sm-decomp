reports = [{ report = "Taken", item = "Plasma", location = 23 }]
after = { beams = ["Plasma", "Spazer"], beams_equipped = ["Plasma", "Spazer"], emptied = [23] }

[[vector]]
# two beams taken in one frame, spazer then plasma (no frame of the game does this: each beam
# holds the game in its message box; spec §7): they apply in order, so plasma, the later, stays on
id = "C-beams-in-order"
source = "constructed"
entries = ["TakingBeams"]
area = "Norfair"
before = { beams = ["Wave"], beams_equipped = ["Wave"] }
reports = [{ report = "Taken", item = "Spazer", location = 31 }, { report = "Taken", item = "Plasma", location = 32 }]
after = { beams = ["Plasma", "Spazer", "Wave"], beams_equipped = ["Plasma", "Wave"], emptied = [31, 32] }

[[vector]]
# the same two beams in the other order: plasma is taken first, and spazer, taken later,
# stays on
id = "C-beams-in-order-reversed"
source = "constructed"
entries = ["TakingBeams"]
area = "Norfair"
before = { beams = ["Wave"], beams_equipped = ["Wave"] }
reports = [{ report = "Taken", item = "Plasma", location = 32 }, { report = "Taken", item = "Spazer", location = 31 }]
after = { beams = ["Plasma", "Spazer", "Wave"], beams_equipped = ["Spazer", "Wave"], emptied = [31, 32] }

[[vector]]
# Tourian's map given on arrival and her leaving Tourian in one frame (no frame of the game does
# this: the map on arrival comes some 30 to 40 frames after a door's frame, and a door's names
# the area she leaves; spec §7), in that order: given, then left, so it counts as downloaded
id = "C-arrival-then-leaving"
source = "constructed"
entries = ["MapOnArrival"]
area = "Tourian"
before = {  }
reports = [{ report = "MapOnArrival" }, { report = "LeftArea" }]
after = { maps = { Tourian = "Downloaded" } }

[[vector]]
# the same two in the other order: left (no map on arrival yet, nothing changes), then given
id = "C-leaving-then-arrival"
source = "constructed"
entries = ["MapOnArrival"]
area = "Tourian"
before = {  }
reports = [{ report = "LeftArea" }, { report = "MapOnArrival" }]
after = { maps = { Tourian = "OnArrival" } }

[[vector]]
# an adjusted game's divisors: energy 50, reserve 200, missiles 10, super missiles 2, power
# bombs 3. By hand: energy 299 / 50 = 5, reserve 400 / 200 = 2, missiles 45 / 10 = 4, super
# missiles 7 / 2 = 3, power bombs 10 / 3 = 3; with 2 items and 1 beam, 5 + 2 + 4 + 3 + 3 + 2 + 1
# = 20. The game's divisors give 21 (2 + 4 + 9 + 1 + 2 + 3), and swapping any two divisors
# gives another sum
id = "C-percent-adjusted"
source = "constructed"
entries = ["ItemPercentage"]
rules = { divisors = { energy = 50, reserve = 200, missiles = 10, super_missiles = 2, power_bombs = 3 } }
area = "Crateria"
before = { items = ["Bombs", "MorphBall"], beams = ["Charge"], capacity = { energy = 299, reserve = 400, missiles = 45, super_missiles = 7, power_bombs = 10 } }
asks = { percentage = true }
answers = { percentage = 20 }

