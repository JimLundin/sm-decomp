[[vector]]
# the rainbow beam switches on Charge, Plasma and Wave, and Plasma isn't hers: the percentage
# counts her 4 beams (Charge, Ice, Spazer, Wave), not the 3 switched on or the 5 of both.
# By hand: energy 99 / 100 = 0, the other capacities 0, no items, 4 beams; 0 + 0 + 4 = 4.
id = "C-percent-rainbow"
source = "constructed"
entries = ["ItemPercentage"]
area = "Tourian"
before = { beams = ["Charge", "Ice", "Spazer", "Wave"], beams_equipped = ["Charge", "Plasma", "Wave"] }
asks = { percentage = true }
answers = { percentage = 4 }

[[vector]]
# an adjusted game in which taking ice switches charge and wave off, and nothing else switches a
# beam off: she takes ice with charge and wave on, and both go off, hers still. Read the other
# way (taking charge or wave switching ice off), nothing would go off here
id = "C-switches-off-adjusted"
source = "constructed"
entries = ["TakingBeams"]
rules = { switches_off = { Ice = ["Charge", "Wave"] } }
area = "Brinstar"
before = { beams = ["Charge", "Wave"], beams_equipped = ["Charge", "Wave"] }
reports = [{ report = "Taken", item = "Ice", location = 21 }]
after = { beams = ["Charge", "Ice", "Wave"], beams_equipped = ["Ice"], emptied = [21] }

[[vector]]
# the same adjusted game: she takes wave with ice on. Wave's row holds nothing, so ice stays on;
# read the other way (wave's taking switching off the beams whose rows hold it), ice would go off
id = "C-switches-off-adjusted-other"
source = "constructed"
entries = ["TakingBeams"]
rules = { switches_off = { Ice = ["Charge", "Wave"] } }
area = "Brinstar"
before = { beams = ["Ice"], beams_equipped = ["Ice"] }
reports = [{ report = "Taken", item = "Wave", location = 22 }]
after = { beams = ["Ice", "Wave"], beams_equipped = ["Ice", "Wave"], emptied = [22] }

[[vector]]
# the same adjusted game: plasma's row holds nothing there, so taking plasma leaves spazer on,
# which the game's own table would switch off
id = "C-switches-off-adjusted-pair"
source = "constructed"
entries = ["TakingBeams"]
rules = { switches_off = { Ice = ["Charge", "Wave"] } }
area = "Norfair"
