source = "constructed"
entries = ["RoomStates"]
area = "Crateria"
before = { events = ["ShaktoolPath"] }
asks = { room_states = [{ when = "Happened", event = "AnimalsFreed" }, { when = "Has", item = "SpaceJump" }, { when = "Happened", event = "ShaktoolPath" }, { when = "Always" }] }
answers = { room_state = 2 }

