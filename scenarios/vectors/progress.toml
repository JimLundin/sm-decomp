# Test vectors for docs/behaviours/progress.md.
#
# Format
# - Each [[vector]] is either one frame of reports (before, reports, after) or a question other
#   domains ask (before, asks, answers). Every vector has: id; source ("<row>:<frame>" for the
#   record it comes from, or "constructed"); entries (the spec's behaviours it exercises); area
#   (the area of the room she is in this frame, the new room's in a frame a door takes her into
#   another area: "Brinstar", "Ceres", "Crateria", "Maridia", "Norfair", "Tourian" or
#   "WreckedShip"; listed alphabetically, the order means nothing).
# - before: the progress at the frame's start (spec §1). A field left out is at its start-of-game
#   value (spec §1, The start of a run): no items, beams, events, defeats, locations, doors, maps
#   or stations; capacity energy 99 and the others 0; energy 99 and the other counts 0;
#   reserve_mode "None" (no reserve tank, the spec's `NoTank`); zebetites 0; items_placed 0.
#   - items, equipped: the items that are hers, and those switched on (spec §1.1, Items); listed
#     alphabetically. The key `equipped` means switched on.
#   - beams, beams_equipped: the beams that are hers, and those switched on (Beams).
#   - capacity = { energy, reserve, missiles, super_missiles, power_bombs }: the most each can
#     hold; energy, reserve_energy, missiles, super_missiles, power_bombs: what she holds now,
#     the key `reserve_energy` being the reserve.
#   - reserve_mode: "None" (no reserve tank yet, the spec's `NoTank`), "Automatic" or "Manual".
#   - events: the events that have happened (spec §1.1, Events); zebetites: how many of
#     Tourian's zebetites are destroyed, 0 to 4.
#   - defeated = { <area> = [kinds] }: the kinds of boss defeated in each area, "MainBoss",
#     "MiniBoss" or "Torizo" (BossesDefeated).
#   - emptied: the item locations whose item she has taken; opened: the doors that stay open. Both
#     are the ids the room's population gives them, whole numbers from 0.
#   - maps = { <area> = "Downloaded" or "OnArrival" }: the areas whose map she has (MapsByArea,
#     MapOnArrival); an area not named is `Unmapped`.
#   - stations = { <area> = [ids] }: the save stations she has saved at in each area, by
#     their id in it.
#   - items_placed: the count of items the game has placed in rooms (ItemsPlacedCount).
# - reports: what other domains tell progress this frame, in order (spec §1.3). A report that
#   concerns an area (Defeated, MapStation, MapOnArrival, LeftArea, Saved) may carry area, the
#   area it concerns, named as the vector's area is; left out, it is the frame's area.
#   - { report = "Happened", event }: an event happens;
#   - { report = "ZebetiteDestroyed" };
#   - { report = "Defeated", boss, area? }: a boss of that kind is defeated, in the area;
#   - { report = "Taken", item, location?, amount? }: she takes an item, a beam or a tank
#     ("EnergyTank", "MissileTank", "PowerBombTank", "ReserveTank", "SuperMissileTank", which carry
#     an amount); location is left out for an item placed without one;
#   - { report = "DoorOpened", door? }: a door that stays open is opened; door is left out for a
#     door placed without an id;
#   - { report = "MapStation", area? }: the map station of the area downloads;
#   - { report = "MapOnArrival", area? }: she enters the room that hands out the map of the area;
#   - { report = "LeftArea", area? }: a door takes her out of the area into another area;
#   - { report = "Saved", station, area? }: she saves at a station of the area;
#   - { report = "ItemsPlaced", count }: a room's loading places that many items.
# - after: the progress at the frame's end, in before's layout; compared whole.
# - asks: the questions; answers: what progress answers, compared whole.
#   - room_states = [conditions], entered_by (optional): a room's states in its order, the last
#     "Always", the default state the room loads in when no condition before it holds, and the
#     entrance she came in by; answers room_state, the index of the state it
#     loads, from 0 (RoomStates). A condition is { when = "Always" }, { when = "Happened", event },
#     { when = "Defeated", bosses = [kinds] }, { when = "Has", item },
#     { when = "MorphBallAndMissiles" }, { when = "PowerBombs" } or
#     { when = "EnteredBy", entrance }. An entrance is the way she came into the room, a whole
#     number from 0 in a space of its own: it is never one of opened's door ids.
#   - percentage = true: answers percentage, the item percentage (ItemPercentage).
#   - emptied = [{ location? }], opened = [{ door? }]: answers a list of bools, one per question;
#     a question without an id is about an item or door placed without one.
#   - map_known = [areas]: answers a list of bools.
#   - zebetites = true: answers zebetites.
# - Recorded vectors (R): from the cached rows, holding only what the record shows of progress and
#   a report that carries none of the game's content (a boss's kind, the gunship's station); their
#   before is record N-1's progress and their after record N's. Row id r01 stands for a chain row.
# - Constructed vectors (C): their after and answers are worked from the spec's rules, each with
#   its case in a comment. Their content is invented: the location, door and station ids, the
#   tanks' amounts, the items a room places and the rooms' state lists are made up to tell the
#   rules apart, and none is the game's. The frames that need the game's own content are checked
#   by the domain's harness.

