# The before and after tables describe one scene step. Pose is [angle, zoom, x, y].
# Angle and zoom use 256ths. Coordinates use signed pixels and exact binary fractions.
# Sky is [large asteroid x, small asteroid x, alternating purple picture number].
# Burst lists are in front-to-back order. Each row is [picture identity, animation
# update number, x, y, displayed sample number]. Identity names group and occurrence.
# A negative update number counts toward zero during the delay. Picture zero means hidden.
# Unstated before fields default to Pending, blanked light (level 0), no fade wait,
# uninstalled view, zero pose, age and hold, and no drawings. Unstated after
# fields are unconstrained. Outputs are complete for the scene step.
# WaitingForMusic reads music_busy after audio service. Set it explicitly in those cases.
# The advance decision defaults to true and is independent of music_busy.
# Music is an ordered list of [request, delay frames]. flash has a style and screen center.
# Map writes are ordered pairs of source drawing and target region.
# rules.hold_frames belongs to SpaceHolds and defaults to 192.
# Recorded cases assert RAM-derived scene quantities. Picture numbers name
# animation positions, with no game drawing content in the fixture. The
# colours and graphics in constructed setup use invented content.

