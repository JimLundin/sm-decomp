# Test vectors for docs/behaviours/screens-arrival.md (her arrival at Ceres as a new game begins).
#
# Format
# - Each [[vector]] is one frame of the arrival, from its state as the frame begins to its state
#   as the frame ends: id; source ("recorded" or "constructed"); entries (the spec's behaviours it
#   exercises); rules (optional); before; inputs (optional); after; output (optional);
#   continues (optional), the id of the vector whose after is this one's before, the next frame.
# - rules (optional): the reference rules this vector overrides: rhythm, frames (PictureBrightens's
#   d). A vector without rules runs the reference one: rhythm 1.
# - before and after: stage, "Preparing", "FadingIn" or "Playing"; level, 0 to 15; screen,
#   "Blanked" or "Shown"; count, the fade's count in frames (spec §1.1).
# - inputs (optional; absent means the preparation is not done): start_ready, bool; arrival_x, her x
#   across the start room, 16-bit px in hex; suit, her suit's sixteen colours, in order;
#   colours, the screen's goal colours, given as default = { goal } for every colour not listed
#   and at = [{ index, goal }] for the listed ones. Colours are 15-bit, in hex. The colours as
#   they stand are not an input: the arrival sets every one of them.
# - output (optional; absent means none but the brightness, which is after's level and screen):
#   arrives = [x, y], her place as she arrives, 16-bit px in hex, standing still and facing the
#   screen; pad = [x, y], the place the arrival hands the pad (boss-ceres-ridley PadPlaced);
#   map_shown, bool; play_begins, bool;
#   colours (only where inputs has colours): now = [{ index, now }] for the listed colours and
#   others = "goal" or "kept", what every colour not listed shows now; goal = "kept", the goal
#   colours as they were.
# - Positions and colours are invented: no start's x and no colour is the game's. The recorded
#   cases (named by row and frame elsewhere) keep the stage, the brightness and
#   the count as recorded and move her x to an invented place.

# The preparation: the screen dark while the start is made ready.

[[vector]]
id = "R-setup"
source = "recorded"
entries = ["StartsInTheDark"]
before = { stage = "Preparing", level = 0, screen = "Blanked", count = 1 }
after = { stage = "Preparing", level = 0, screen = "Blanked", count = 1 }

[[vector]]
id = "C-setup-lit"
source = "constructed"
entries = ["StartsInTheDark"]
before = { stage = "Preparing", level = 9, screen = "Shown", count = 4 }
inputs = { start_ready = false, arrival_x = "0140" }
after = { stage = "Preparing", level = 9, screen = "Shown", count = 4 }

# The arrival.

[[vector]]
id = "R-arrival"
source = "recorded"
entries = ["ArrivesAtTheTop"]
before = { stage = "Preparing", level = 0, screen = "Blanked", count = 1 }
inputs = { start_ready = true, arrival_x = "0140" }
after = { stage = "FadingIn", level = 0, screen = "Blanked", count = 1 }
output = { arrives = ["0140", "0000"], pad = ["0140", "0000"], map_shown = true, play_begins = false }

[[vector]]
id = "C-arrival-adjusted"
source = "constructed"
entries = ["ArrivesAtTheTop"]
rules = { rhythm = 3 }
before = { stage = "Preparing", level = 0, screen = "Blanked", count = 0 }
