# Test vectors for docs/behaviours/camera.md.
#
# Format
# - Each [[vector]] is one frame of the camera, from its state at the frame's start to its state at
#   the end: id; source ("constructed": every vector here is); entries (the spec's behaviours it
#   exercises); room; lead (optional); time_stopped (optional); before; samus; after.
# - A P.S quantity is "PPPP.SSSS": the pixel part and the subpixel part, both hex (spec, Notation).
#   x grows rightward, y downward.
# - room: the room's screens and heights (spec §1.3), invented: no room's screens, size or heights
#   are the game's.
#   - screens: one string a row of screens, top row first; one character a screen, left to right:
#     "C" Closed, "O" Open, "S" Short (spec §1.3, Screen kinds). The room is as many screens across
#     as a row's length (w) and as many down as there are rows (h).
#   - below (optional, default none): one string, the run of screens the room's loading left after
#     the room's last screen, in the same characters (spec `BelowTheRoom`). It continues the room's
#     screens as one run: its first w screens are the row below the room's last row, left to right,
#     the next w the row below that, and so on, so only its end can fall short of a whole row. A
#     screen past its end is Closed. The screen right of a row's last column is the next in the
#     run: the first of the row below, or from the room's last row the run's first (spec
#     `ScreensRunOn`).
#   - heights: [while she isn't rising, while she rises], in px (spec `AimingHeight`).
# - lead (optional, default "Ahead"): the lead setting, "Ahead", "KeepLeft", "KeepRight" or "Near"
#   (spec `LeadingHer`; listed alphabetically, the order means nothing).
# - time_stopped (optional, default false): spec `TimeStopped`.
# - before: the camera at the frame's start (spec §1): camera = [x, y], the view's top-left corner
#   in the room; seen = [x, y], where it last saw her.
# - samus: what the camera reads of her this frame (spec §1.3): position = [x, y], after everything
#   that moved her this frame; facing, "Left", "Right" or "Screen"; backwards (optional, default
#   none): "Knockback", "Moonwalk" or "Skid", why she is going backwards (the spec's input is
#   the bool; each reason reads the same; listed alphabetically); rising (optional, default
#   false); placed (optional, default none): the y a placement put her at this frame, a P.S
#   quantity (spec §1.3 and `Remembering`); with none, the camera follows from where it last saw
#   her.
# - after: compared at the end of the frame: camera = [x, y] and seen = [x, y], as in before.
# - The vectors hold the camera's and her positions and invented rooms only. The cases no record
#   reaches (the lead settings other than Ahead, facing the screen, a placement and its pixel part,
#   a rise at 0, the frame that spends a rise, every ease out of a closed screen, the screen after
#   the last column, the back-offs short of a screen's edge, time stopped against a frame that would
#   ease, the creep, the look ahead while going down, the run below the room, a camera left below
#   the room going down, a camera outside the room or 8000 from what it compares with, a push that
#   carries) come first, each worked from the spec's rules. The cases the game's frames show follow
#   (from C-aim-above-top on): each is such a frame's positions, moved by whole screens into an
#   invented room whose screens the frame reads are of the kinds it read, with her y moved by the
#   change in the height she aims with; each gives its case in a comment.

