# Test vectors for docs/behaviours/camera.md.
#
# Format
# - Each [[vector]] is one frame of the camera, from its state at the frame's start to its state at
#   the end: id; source ("<row>:<frame>" for the record holding the frame's result, or
#   "constructed"); entries (the spec's behaviours it exercises); room; lead (optional);
#   time_stopped (optional); before; samus; after.
# - A P.S quantity is "PPPP.SSSS": the pixel part and the subpixel part, both hex (spec, Notation).
#   x grows rightward, y downward.
# - room: the room's screens and heights (spec §1.3).
#   - screens: one string a row of screens, top row first; one character a screen, left to right:
#     "C" Closed, "O" Open, "S" Short (spec §1.3, Screen kinds). The room is as many screens across
#     as a row's length (w) and as many down as there are rows (h).
#   - below (optional, default none): the rows the room's loading left below its last row, top
#     first, in the same characters (spec `BelowTheRoom`); a row may be shorter than w. A screen
#     below the room that these rows don't hold is Closed. The screen right of a row's last column
#     is the first of the row below it, or of the first below row (spec `ScreensRunOn`). A recorded
#     vector gives the rows the frame reads, and no more.
#   - heights: [while she isn't rising, while she rises], in px (spec `AimingHeight`).
# - lead (optional, default "Ahead"): the lead setting, "Ahead", "KeepLeft", "KeepRight" or "Near"
#   (spec `LeadingHer`; listed alphabetically, the order means nothing).
# - time_stopped (optional, default false): spec `TimeStopped`.
# - before: the camera at the frame's start (spec §1): camera = [x, y], the view's top-left corner
#   in the room; seen = [x, y], where it last saw her.
# - samus: what the camera reads of her this frame (spec §1.3): position = [x, y], after everything
#   that moved her this frame; facing, "Left", "Right" or "Screen"; backwards (optional, default
#   none): "Knockback", "Moonwalk" or "Skid", why she is going backwards (the spec's input is
#   the bool; each reason reads the same; listed alphabetically); rising (optional, default
#   false); camera_from (optional, default seen's y): her motion's `camera_from` this frame
#   (spec `Remembering`).
# - after: compared at the end of the frame: camera = [x, y] and seen = [x, y], as in before.
# - Recorded vectors (R): taken from oracle frames that ran one frame of gameplay in one room (the
#   game's frame count advanced by one), where nothing moved her after the camera's turn and no
#   other domain moved where the camera saw her (no grapple, no shinespark, no room or enemy
#   placing her: spec §5). Their before is record N's, their samus and after record N+1's. At most
#   two vectors show each outcome the frames reach, from different rows. Row ids r01-r11 stand
#   for the chain rows. R35, a rise at 0, comes from a shinespark's frame where nothing moved
#   where the camera saw her: the only rows with a rise at 0 at the camera's turn. The shinespark
#   is another domain's (outside samus-motion, masked in the harness), so R35's rising comes from
#   there.
# - Constructed vectors (C): cases no record reaches (the lead settings other than Ahead, facing
#   the screen, a placement and its pixel part, a rise at 0, the frame that spends a rise, every ease out of a closed screen,
#   the screen after the last column, the back-offs short of a screen's edge, time stopped against
#   a frame that would ease, the creep, the look ahead while going down, the rows below the
#   room); each gives its case in a comment. Their after is worked from the
#   spec's rules.

# Constructed vectors.

[[vector]]
# Near, she faces right: aimed 64 px right of the view's left edge; the camera reaches the aim
id = "C-lead-near-right"
source = "constructed"
entries = ["LeadingHer", "FollowingHer"]
room = { screens = ["OOOO"], heights = [112, 160] }
lead = "Near"
before = { camera = ["0140.0000", "0010.0000"], seen = ["0180.0000", "0110.0000"] }
samus = { position = ["0182.0000", "0110.0000"], facing = "Right" }
