# Test vectors for docs/behaviours/samus-motion.md (MODEL §5), read by a `game` test.
#
# Format
# - Each [[vector]] has: id; source ("item-morph-ball:<frame>" for an oracle record, or
#   "constructed"); entries (the spec's behaviour IDs it exercises); rules (optional:
#   speed_cap = "Wordwise", the default, or "Exact"); world; before; one or more [[vector.step]].
# - A P.S quantity is a string "PPPP.SSSS": the pixel word and the subpixel word, both hex.
#   Pixel coordinates are integers.
# - world: the flat stand-in for the collision domain (spec §5). Anything not listed is air.
#   - floor_top: the y of a solid floor's top face, a multiple of 16; every row from it down is solid.
#   - wall_right: the x of a solid wall's left face, a multiple of 16; every column from it
#     rightward is solid.
#   - wall_left: the x of a solid wall's right face, a multiple of 16; every column left of it is solid.
#   - ceiling_bottom: the y of a solid ceiling's bottom face, a multiple of 16; every row above it
#     is solid.
#   - ledge_right = { x = X, bottom = Y }: solid where x >= X and y < Y (an overhang on her
#     right; it answers the wall probe and horizontal moves like wall_right).
#   - slope_seat = N: every horizontal move that tests enemies answers with a slope seat of N
#     whole pixels on y (spec §6 `seat`; positive is down, under a sloped ceiling).
#   - solid_enemy_floor = true: a solid enemy under her, touching, stops every downward move with
#     distance 0 and sets y's subpixel to 0 (spec `EnemyTouchZeroesYSubpixel`); the vectors that
#     use it don't compare y or `vertical`.
#   - enemy_left = B: a solid enemy on her left, tall enough to span her rows, whose right edge
#     (its x + its x radius) is B: she touches it when x - rx = B. enemy_right = B: one on her
#     right whose left edge (its x - its x radius) is B: she touches it when x + rx = B. They answer
#     the solid-enemy test of a horizontal move or of the arm-pump's query (spec §9, the
#     solid-enemy test) and the wall probe (spec §6 `probe_wall`, `touching`), on that side
#     only, with pixel words: the target t is the pixel word of x
#     moved |d| on the heading, then one more pixel on the heading (right: unless x.sub and
#     |d|.sub are both 0; left: when x.sub != |d|.sub). Found when t - rx < B (left) or
#     t + rx > B (right). Then touching (x - rx = B, or x + rx = B): distance 0 and y's subpixel
#     set to 0; short of it: she moves to touching, subpixel unchanged; already past it: not
#     found. A vertical move never meets them (she doesn't overlap them horizontally).
#   The stand-in answers a move as the original's flat blocks do: the leading edge at the target is
#   x + d + rx - 1 (right) or x + d - rx (left), y + d + ry - 1 (down), from the pixel words; if it
#   is in a solid block, she stops flush against it (the edge on the block's near face), with the
#   subpixel FFFF moving right or down and 0 moving left (spec `FloorFlushSubpixel`). Horizontal
#   moves test the rows from her top edge to her bottom edge. The stand-in never tunnels;
#   where the original would (a step of 16 px or more), the vector doesn't compare y.
# - before: the State at the start (spec §1.1). Defaults: base_speed and extra_run "0000.0000",
#   momentum false, mode "Accelerating", vertical "None" ("Up", "Down"), vertical_speed
#   "0000.0000", bounce "None" ("First", "Second"). A mode or vertical other than the default
#   stands for what pose selection left when the pose started (spec §7).
# - [[vector.step]]: the inputs for one frame (spec §1.2):
#     locomotion: "FacingForward", "Standing", "StandingPlain", "Running", "BallAtRest",
#       "BallRolling", "SpringBallAtRest", "SpringBallRolling", "Crouching", "TurningOnGround",
#       "Transition", "Moonwalking", "RanIntoWall", "Jumping", "JumpTakeOff", "SpinJumping",
#       "Falling", "BallFalling", "SpringBallFalling", "SpringBallInAir", "WallJumping" or
#       "TurningInAir" (spec §2's fields spelled out);
#     facing: "Left", "Right" or "Forward"; radius = [x, y] in px;
#     pad: the buttons held, from run, shoot, jump, left, right, aim_down; jump_pressed = true
#       when jump is newly pressed;
#     new_running_pose, forced_pose, elevator_moving, on_slope, spin_ready, was_spinning,
#       hi_jump, space_jump: default false;
#       new_running_pose and forced_pose give the arm-pump's pose_request (spec §1.2):
#       forced_pose = true is Forced; else new_running_pose = true is Pose { running: true };
#       else None. The test runs `step`, then `arm_pump_step` with that request and the step's
#       wall_stop (spec §8), and compares the State after both;
#     pose_start, pose_command (spec §7): when present, the test runs `pose_writes` after
#       `arm_pump_step`. pose_start is "Turn", "BallReverse", "SpinReverse", "JumpOrFall",
#       "TakeOff", "TakeOffFromPlainCrouch", "SpinStart", "SpringLaunch" or "WallJumpStart";
#       pose_replaced = true marks a start that replaced the pose (a "Turn" always does), so the
#       command is skipped. pose_command is "Decelerate", "Stop", "KillXSpeed", "KillRunSpeed",
#       "AnimationEnd" (spec §7: the pose an animation's end hands over to) or "Vertical" (the
#       step's own vertical_result; a step with no locomotion gives it as
#       vertical_result = "..."). new_pose_falling and old_pose_falling (default false) feed
#       KillYIfStartedFalling. A step with no locomotion runs only `pose_writes`.
#     submerged and speed_booster are fixed false for the pilot and are not in the format.
# - [vector.step.after]: the State expected at the end of that frame. Only the listed fields
#   are compared; position = [x, y] compares both, position_x or position_y one.
#   [vector.step.contacts]: the expected Contacts (spec §1.3): wall_stop, ran_into_wall (from
#   `arm_pump_step`), wall_jump_armed, restart_standing_animation (bools); vertical_result =
#   "None", "Landed(<LandKind>)", "Falling(<FallKind>)", "HitCeiling" or "WallJump", after the
#   row's After. Left out: not checked.
# - Steps chain: the test carries the model's whole State from one step to the next.
# - The record pads are from item-morph-ball: frame N reads record N-1's pad. The radius of frame
#   N is record N's (spec §8).

# V1: running right, no pose change, so no arm-pump step.
[[vector]]
id = "V1"
source = "item-morph-ball:1230"
entries = ["ExtraRunSpeed", "BaseSpeed", "HorizontalStep"]
world = { solid_enemy_floor = true }
before = { position = ["047D.3FFF", "029B.0000"] }
[[vector.step]]
locomotion = "Running"
facing = "Right"
radius = [5, 0x15]
pad = ["run", "right"]
[vector.step.after]
position_x = "047D.7FFF"
base_speed = "0000.3000"
extra_run = "0000.1000"
momentum = true
[vector.step.contacts]
wall_stop = false

