# Vectors for samus-health.md. Each vector is one health opportunity.
# Before and after carry complete State, including remaining protection.
# Tail vectors also name the candidate impacts in order,
# current whole energy immediately before maintenance, and the live pair offered to Drawing.
# Each tail vector closes one active opportunity. An empty list supplies no eligible hit.
# The protected recorded actor check supplies no candidate because it skips overlap.
# The duplicate construction supplies two candidates within one opportunity.
# Energy and pending fractions are integer multiples of 1/65536 energy.
# inputs qualify a supported opportunity; wider values are IntegrationAdmission
# evidence only, never clean model inputs or catalogue credit.
# sound: None/Start/Stop, a request, not proof of audible playback.
# Optional rules overrides warning_threshold (reference 30).
# continues names a previous vector whose after equals this before; restoration
# must preserve all State quantities. Unsupported has no after or sound and
# requires no state mutation. Recorded source identity is resolved in decode.

