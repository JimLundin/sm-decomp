entries = ["PeriodicLoss", "LowEnergyWarning"]
before = { pending_fraction = 0, energy_fraction = 0, pending_whole = 0, energy_whole = 99, warning = "Off", protection = 0 }
after = { pending_fraction = 0, energy_fraction = 0, pending_whole = 0, energy_whole = 99, warning = "Off", protection = 0 }
sound = "None"
