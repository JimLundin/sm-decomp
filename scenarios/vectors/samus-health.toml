# Vectors for samus-health.md. Each vector is one whole admitted frame: Health's State as
# the frame starts (before) and as the frame leaves it (after), complete with remaining
# protection, and the frame's outputs.
# impact_worth is the frame's impact: an eligible hit worth that many whole energy, as its
# hitter gives it (15 for Ridley's tail, 0 for a steam puff); omitted, the impact is absent.
# The protected recorded frames have no impact because each hitter skips contact while
# protection is positive; C-tail-repeat, C-tail-last-frame and C-steam-protected construct
# an eligible impact during protection.
# protection_drawn is the frame's protection while drawn; where it is omitted it is not
# compared. The energy drawn is after's current energy.
# Energy and pending fractions are integer multiples of 1/65536 energy.
# inputs qualify a supported frame; wider values are IntegrationAdmission
# evidence only, never clean model inputs or catalogue credit.
# sound: None/Start/Stop, a request, not proof of audible playback.
# Optional rules overrides warning_threshold (reference 30).
# continues names a previous vector whose after equals this before; restoration
# must preserve all State quantities. Unsupported has no after or sound and
# requires no state mutation. Recorded source identity is resolved in decode.

