# R cases refer to lsnes observations. C cases use an invented format.
# A raw slot "words" list is already encoded and zero-padded to 814 words.
# A typed "run" encodes all the fields below, with zero for omitted words.
# Pairs are [sum, complement]. Each slot takes either words or a run.
# Complete synthetic image: mark, selection, retained bytes, spare words,
# then slots in menu order. Each slot is payload, primary pair, mirror pair.
# Serialize all words little-endian. Fill all 3,260 retained bytes with
# retained_fill. All four spare words hold spare_word. Both default to zero.
# The three marks are 12 repetitions of 3 for Completed, 4 for Incomplete,
# or 5 for Other. Default selection is [65535, 65535].
#
# This fixture puts these typed fields into consecutive words:
# energy, capacity, destination, area, station, kept_profile,
# placement_disabled, startup_word, event, boss, item_count, map, tail.
# Route codes are Intro = 0, CeresArrival = 7, ZebesFlight = 8. Unknown
# routes carry their raw code. Area codes are Crateria = 4 and Ceres = 9.
# In the fixture, an omitted area defaults to Crateria, and an omitted
# destination defaults to Intro. For an encoded zero payload area 0 remains
# opaque. The fixture keeps only byte 43 of Crateria's remembered map in
# its map word. Its working map replaces that area's remembered map when
# Crateria is current. The Ceres working map never enters that word.
# Typed flags occupy whole words. All unspecified encoded words are zero.
# Snapshot checks include typed fields and tail. Image digests cover all
# 8,192 encoded bytes. Preserve all bytes outside the expected changes.
[[vector]]
id = "R-boot"
entries = ["BootFiles", "ReadSlot"]
row = "any-power-on"
frames = [262, 263, 264, 265, 266, 267, 268, 269, 270, 271]

[[vector]]
id = "R-menu"
entries = ["MenuFiles", "ReadSlot"]
row = "any-power-on"
frames = [396, 400]
want = { present = [false, false, false], cursor = "A" }

