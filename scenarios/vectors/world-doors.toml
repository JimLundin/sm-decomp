# Test vectors for docs/behaviours/world-doors.md (part 1, the passage).
#
# Format
# - Each [[vector]] is one frame of the passage, from its state at the frame's start to its state
#   at the end: id; source ("constructed": every vector here is); entries (the spec's behaviours
#   it exercises); rules (optional); before; her; seen; camera; colours (optional); inputs
#   (optional); after.
# - rules (optional): the reference rules this vector overrides (spec, each Parameter entry's
#   params): steps (Fading's d); slide = { step (px), across, down_up (frames) } (Sliding);
#   speeds = { across, down_up } (Carrying, P.S a frame). A vector without rules runs the
#   reference ones: steps 12, slide { step = 4, across = 64, down_up = 57 }, speeds
#   { across = "0000.C800", down_up = "0001.8000" }; a rules table names only what it changes.
# - A P.S quantity is "PPPP.SSSS", the pixel part and the subpixel part, both hex; a pixel
#   quantity is "PPPP" (spec, Notation). x grows rightward, y downward.
# - before: phase, one of "Arriving", "BeforeTheSlide", "Brightening", "Darkening", "Landing",
#   "Music", "Play", "Quieting", "Squaring" (spec §1, Phases; listed alphabetically, the order
#   means nothing; "Play" is no passage), with its data: asked, for "Quieting"; t, 0 to 14, for
#   "Darkening" and "Brightening"; n, the frames of work since the view was squared, for
#   "BeforeTheSlide" (0 to 2), or since the slide ended, for "Landing" (0 to 1); started, for
#   "Music"; placed and fetching ("Contents", "Done" or "Tiles"), for "Arriving"; arrival
#   (absent before it is taken): { way, "Down", "Left", "Right" or "Up"; view = [x, y], the
#   view's place in the next room, px; speed (optional), her speed in the slide, P.S }; slide
#   (absent before it starts): the slide's frames so far.
# - her: [x, y], P.S, her position (samus-movement's) at the frame's start. seen: [x, y], px,
#   where the camera last saw her. camera: [x, y], P.S, the camera's position.
# - colours (optional): some of the screen's colours, each { now, the colour as it stands; goal,
#   the colour the fade heads for; group, "Icon", "Lit", "Other", "Timer" or "Visor" (spec
#   TheFades: the HUD's icon, always-lit and escape timer colours, her visor's, any other) },
#   each a 15-bit colour in hex.
# - inputs (optional; spec §1.3): touched (default false, she touched a door to a room this
#   frame); done (default true, T1: the work of the frame of work in progress is done by this
#   frame's end); sounds_sent (default true); music_ready (default true); timer, items_dark
#   (default false); doorway (for "Squaring" before the arrival is taken: the arrival the doorway
#   gives, as arrival above).
# - after, compared at the frame's end: the phase and its data, arrival and slide, as in before;
#   her, seen, camera; colours, each { now, goal }, in before's order; runs, what runs or is
#   drawn this frame, sorted ("blocks"; "drawn", she, her shots, the enemies and their shots
#   drawn, still, where they are; "enemies"; "projectiles", the enemies' shots run; "tiles", the animated
#   tiles; "timer", the escape's timer drawn); calls, the room's calls this frame (spec §1.5);
#   sounds, the room's sound requests ("held", sounds held off; "let through"; "silence");
#   her_sounds, the requests to her sounds ("at the door"; "spin again"); cost (absent when T1 is
#   asked nothing: the passage's own wait), the cost event of the frame's work ("BuildRoom",
#   "FadeStep", "FetchContents", "FetchTiles", "Other", or "Play" in play); finished (the frame is
#   a finished frame); restart (the HUD's frame count restarts this frame); screen (only on the
#   frames that restart it: "FrontAndSprites" or "Sprites", what is shown below the HUD);
#   minimap_on (true when it turns the mini-map on).
# - The vectors hold positions, colours and arrivals, all invented: no room's, doorway's or
#   colour's value is the game's. The cases the records show are each such a frame moved to
#   invented values (recorded cases R1 to R18). The rest (doors up and down, a
#   doorway's own speed, every adjusted rule) are worked from the spec's rules.

