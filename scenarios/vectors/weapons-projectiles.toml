# update operations call the ordinary full frame update; before contains state, input,
# content and ordered World response sequences; after contains complete state/events/contacts.
# heading_clips maps every Heading to ClipId; absent map assigns Power to every heading.
# offsets/moving_offsets maps every Heading to its offset; absent maps use the common flat
# offset/moving_offset shorthand. Impact is the common burst clip. Inactive appearance means
# None (channel unchanged); prior meaningful appearance is retained. None is no retained id.
# scenario/step links consecutive frames. Observation operations do not prescribe public APIs.
# Constructed RAM-quantity observations with wholly invented content.
# Each vector tests one named observation operation in isolation: spacing, spawn (availability
# through initial body, before contact/flight), origin, drift, probe (initial motion, no world
# response), flight, contact (world requests), diagonal (axis order and burst), trail, view,
# end, consume (later actor event), or clip. Entries identify the catalogue rules exercised.
# before/after use decimal quantities in the spec's units. Words are unsigned encodings of
# signed values; positions are 32-bit fixed-point integers. Frame/clip/picture identifiers
# here are invented. responses are ordered World answers: true Blocks, false Passes;
# absent responses are all Passes. visited lists the request ordinals, not content indices.
# Each expected result
# is calculated by hand from the cited rule. rules overrides acceleration or trail_interval
# for this vector only, in the same units as the reference values. No ROM content is present.

