# Cinematic missile cases use invented content. The origin displacement is [-9, -3].
# The flying picture Dart holds 6 updates with radii [3, 2], damage is 37, and it
# repeats. The impact pictures Star and Fade hold 2 and 5 updates with radii [6, 6]
# and [7, 7]. Exhaust offset is [-2, 1]. Exhaust pictures Air1 and Air2 hold for
# 3 and 2 presentation visits. A puff's age is elapsed visits since its first picture;
# -1 awaits the first picture. Initial shot defaults to a flying ordinary missile at [20, 27] pixels,
# x speed -256, trail countdown 2, Dart hold 4 and next frame 1. Initial Burst values
# are supplied in the case. Missing position fractions are zero. In shot tables x
# and y are fixed-point integers, speed is in 1/256 px per update and hold/trail
# are measured in gameplay updates. Unlisted expected fields are outside that case's
# check. All five slots start free unless listed, ammo defaults to 3, cannon mode to
# CannonAndShots, and width to one screen. contacts and candidates encode [slot, x, y]
# and [slot, whole_x] respectively, with coordinates in pixels. debit, protection and
# deselect stand for reports to inventory and incoming-shot protection. Pictures
# encode [picture, x, y] in screen pixels; the picture names here are invented.

