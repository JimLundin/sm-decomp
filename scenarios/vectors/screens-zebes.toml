# One finished frame per vector. Pose is [angle in 256ths of a turn, zoom in 256ths, x, y].
# Positions are signed screen pixels with fractions in 65,536ths. Pictures are indexed by a
# scene label and hold [x, y, upward speed in 256ths of a pixel per frame].
# before/after use stage, view, level (0 means blanked), block (pixels), beat (frames modulo 4),
# fade, age and hold (frames), pose and pictures. Omitted assertions are unconstrained.
# A before with omitted fields means MosaicPage, blanked, block 1, beat/fade/age/hold 0, zero
# pose and no pictures. Omitted content means the sample scene below. The names in pictures
# belong to that sample scene. output checks caption events, install (the E2 graphics references), palette_replace (the
# R4 effect reference and starting-palette policy), restore_full_energy and begin_landing_site_load
# (independent outputs published on the same cut), matrix (four signed values in 256ths) and
# scroll (two signed whole pixels). A per-vector last_field overrides the sample scene marker.
# subtitle defaults to false. rules.hold_frames defaults to 64 and belongs to PlanetHolds.
# All content here is invented. Recorded vectors compare RAM observations, with source cuts
# listed in the replay evidence. Where the recorded drawing needs original content,
# the same rule is checked independently by the recorded scene replay.

[scene]
places = { Planet = [112, 98], UpperLeft = [20, 33], UpperRight = [219, 31], LowerLeft = [27, 177], LowerRight = [213, 180] }
last_field = "LowerRight"
engine_accent = "AmberPulse"
graphics = { flat_map = "Grid", flat_tiles = "FlatTiles", ship_map = "Scout", ship_tiles = "ShipTiles", sprite_graphics = "NightSky" }
holds = [5, 2, 4, 3]
english = [100, 168]
japanese = [102, 181]

