# ================================================================ part 4a: Ceres Ridley wakes
#
# Format of the part-4a vectors (spec §13), ids F-: one run of him and the baby, in part 3's
# Ridley form (ridley, baby, random, ridley_after), with:
# - content (invented, every F- vector): eye_steps, the eye's steps in order, each the number of
#   the eye's colour set it names (0 up); body_sets, how many colour sets the body's fade has.
# - ridley.phase and ridley_after.phase also "Awake" (part 3's: no step shown), "EyeFading"
#   (steps: the eye's steps shown), "BodyFading" (sets: the body's sets shown; runs: the runs
#   since its last set), "ReadyToRoar" (wait), "Roaring" (wait; figure, 1 to 5; figure_runs, its
#   runs shown, absent for figure 5) and, in ridley_after only, "TakingOff" (no look: part 4c's).
# - look also "Open" or "Wide".
# - ridley_after also holds: tangible, moving, roaring, music (the fight's music asked for) and
#   roar (the roar's sound asked for, queue limit 6), bools; eye_colours, the number of the eye's
#   colour set shown, absent for none; body_colours, which of the body's sets is shown, 1 up,
#   absent for none. shown and solid are part 3's: he is shown and never stops her motion;
#   tangible says whether her touch and her shots meet him.
# - rules may hold pace (runs, BodyFadesIn). Without it: pace 2.
# - The content is invented: five eye steps naming sets 3, 2, 1, 1 and 0 (one step for the
#   one-step cases), and four body sets, where the game has 64 steps and 16 sets. The recorded
#   cases F1 to F21 (whose rows and frames the observer keeps) are moved onto it: a case at the
#   game's last step or set is the invented content's last. His place, the baby and the random
#   numbers are the records'.

