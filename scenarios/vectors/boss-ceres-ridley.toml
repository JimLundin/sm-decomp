# ================================================================ part 3: Ridley's room as she enters
#
# Format of the part-3 vectors (spec §10 to §12).
# - The door's and the walls' vectors (ids R-, W-) have the part-1 form, with:
#   - door.kind also "RidleyDoor" (facing "Right") or "GetawayWall" ("Left" or "Right");
#   - before.phase and after.phase also "Lingering", "Locked", "Slammed", "Slamming" (with step,
#     1 to 4), "Standing" or "Unseen"; figure.look also "Side";
#   - beaten (optional, default false): whether Ridley is beaten (spec §1.3);
#   - after.drawn_with_ridley (optional, default false, compared on every door vector, part 1's
#     included): whether Ridley's drawing draws the door;
#   - after.shake.layers (optional, default "Whole"): "Back" or "Whole";
#   - after.palette (placing only, optional, default "Doors"): "Doors" or "Own".
#   - rules may also hold slam (frames, SlamShut). Without it: slam 2.
# - Ridley's vectors (ids K-) have no door, before, her or after; instead:
#   - ridley_placing = true: the room places him; beaten (optional, default false).
#   - Otherwise one run of him and the baby: ridley = { phase, wait, look, position }: phase
#     "Holding", "Waiting" or "Awake"; wait, frames, "Waiting" only; look "Rest", absent for none;
#     position = [x, y], pixels, 16-bit, in decimal as in part 2. baby = { routine, step,
#     runs }: routine "New" (no step or runs), "Fidget" (step 0 to 7) or "Glow" (step 0 to 11);
#     runs, the runs it has shown its
#     figure, 1 up to the figure's length. passing (optional, default false): a door's passage
#     under way as he runs. random (optional, default "0000"): as the doors read it.
#   - ridley_after: present (placing only, bool); phase, wait, look, position as above; baby =
#     { routine, step, runs, look, position } (look "First", "Second" or "Third", absent with
#     the position for "New"); shown, solid (bools); placing only: boss (a boss encountered,
#     Ridley in Ceres), music_stops, shake_stops, stage_calm, room_colours (bools: each output
#     of RidleyPlaced); runs only: cry (bool), colours (the baby's colour set, "Glow1", "Glow2",
#     "Glow3" or "Rest", absent for none).
#   - rules may hold wake (frames, RidleyWaits). Without it: wake 512.
# - Positions of the door, the walls and her are invented: the recorded cases N1 to N16 and K1
#   to K10 (whose rows and frames the observer keeps) are moved with her offsets kept. Ridley's
#   place is the rule's (RidleyPlaced); the random numbers are the records'.

