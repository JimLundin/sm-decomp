# ================================================================ part 4b: his tail at rest and its hit
#
# Format of the part-4b vectors (spec §14), ids T-: one run of him and the baby in the part-4a
# form (content, ridley, baby, random, rules, ridley_after), or (T-placed) his placing in the
# part-3 form, with:
# - ridley.curl and ridley_after.curl: the tail's curl, 8 to 23 (TailCurls).
# - her (optional, absent: no her to reach): position = [x, y], her position as the frame starts
#   (where the last frame left her), 16-bit, in decimal; body = [half-width, half-height], px, of
#   the body she started the frame in; protection, frames, her protection as the frame starts
#   (samus-health).
# - ridley_after.tail = [x, y]: where the tail's tip and all seven of its segments are, absent
#   on a run that ends before he moves; ridley_after.hit = { side, push }: the frame's hit, side
#   "Left" or "Right", push how long the push lasts, in frames, absent for none.
# - rules may hold tail_reach (px, TailHits) and pace (part 4a). Without them: tail_reach 14,
#   pace 2.
# - The F- vectors carry none of these fields: the tail's outputs on their runs follow from the
#   rules here and are checked by the T- vectors.
# - Content is part 4a's invented content. The recorded cases T1 to T8 (whose rows and frames the
#   observer keeps) keep the records' places of him and her, her body and protection, the baby and
#   the random numbers where a rule reads them; a case at the game's last set or step is moved onto the invented
#   content's last. The rest are worked from the spec's rules.

