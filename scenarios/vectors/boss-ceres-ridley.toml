# ================================================================ part 5: the escape's steam
#
# Format of the part-5 vectors (spec §16), ids ST-: one run of the room's vents, or
# (steam_placing = true) one vent's placing. Every position is a 16-bit number written in
# decimal, x rightward and y downward, in pixels.
# - vents: the room's vents in its order, each { facing, position = [x, y], phase, and its
#   count }: facing "Down", "Left", "Right" or "Up"; phase "Placed" or "Waiting" with wait (1 to
#   32), "Puffing" with figure (1 to 7) and runs (1 to 3), or "Resting" with runs (1 to 255).
# - camera = [x, y]: the camera as the last frame left it.
# - her (optional, absent: no her to reach): position = [x, y], where she is as the frame starts,
#   before she moves; body = [half-width, half-height], px, of the body she started the frame
#   in; protection, frames, her protection as the frame starts.
# - vents_after: each vent at the run's end, in the same order: its phase and count as in vents,
#   and shown, whether its puff is drawn (its figure is the phase's, Puffing only).
# - hit = { side, push }: the frame's hit, the shared hit (spec §16.4): side "Left" or "Right",
#   push the push time, in frames; absent for none. Its worth, 0 whole energy, is PuffTouches'
#   to state and production's to hand to samus-health; no vector holds it.
# - placing: vent = { facing, position }, random, 16-bit hex, the number its placing draws;
#   vents_after holds the one vent placed.
# - rules may hold steam_rest (runs, VentRests). Without it: steam_rest 64.
# - The recorded cases ST1 to ST18 (whose rows and frames the observer keeps) are moved, with her
#   and the camera, 1,000 px right and 600 px down; their phases, her body and protection are the
#   records'. The rest are worked from the spec's rules.

# ---------------------------------------------------------------- the placing

[[vector]]
# a random number of 0: the least wait, 1
id = "ST-placed-least"
source = "constructed"
entries = ["VentPlaced"]
steam_placing = true
vent = { facing = "Up", position = [400, 300] }
random = "0000"
vents_after = [{ phase = "Placed", wait = 1, shown = false }]

[[vector]]
# 63 mod 32 = 31: the longest wait, 32
id = "ST-placed-most"
source = "constructed"
entries = ["VentPlaced"]
steam_placing = true
vent = { facing = "Down", position = [400, 300] }
random = "003F"
vents_after = [{ phase = "Placed", wait = 32, shown = false }]

[[vector]]
# FFE4h mod 32 = 4: wait 5; only the number's low five bits count
id = "ST-placed-high"
source = "constructed"
entries = ["VentPlaced"]
steam_placing = true
vent = { facing = "Left", position = [400, 300] }
random = "FFE4"
vents_after = [{ phase = "Placed", wait = 5, shown = false }]

