# ================================================================ part 4c-1a: his take-off and flight
#
# Format of the part-4c-1a vectors (spec §15), ids L-: one run of him in the part-4a form
# (content, ridley, random, ridley_after; no baby), with:
# - ridley.takeoff_figure, 1 to 5, and ridley.takeoff_runs, 1 to its length, absent for figure 5
#   (TakesOff); ridley.fraction = [x, y], his position's fractions, 0 to 255 (1/256 px);
#   ridley.speed = [x, y], 1/256 px per run, signed, in decimal; ridley.hover_runs, 0 to 123
#   (Hovers); ridley.curl as in part 4b. L-takeoff's ridley is in the part-4a form (Roaring).
# - energy: her energy as he runs (samus-health); hits_taken: the hits he has taken (§15.3).
# - ridley_after: the same fields after the run; tangible, moving, roaring, music and roar as in
#   part 4a (§15.4: true, true, false, false, false on every run of this part); held = [x, y],
#   where the baby is held (BabyHeld); bound (absent for none): "Bottom", "Left", "Right" or "Top"; shake (absent for
#   none): { pixels, frames }, the Back layers moving sideways. A run that gives up (phase
#   "Retreating" or "FakeRetreat") is the next part's: its ridley_after holds the phase alone.
# - The L- vectors carry no baby, tail or hit: the baby's routine is part 3's (checked by the K-
#   and F- vectors), and his tail in flight is part 4c-1b's.
# - The recorded cases L0 to L13 (whose rows and frames the observer keeps) keep the records'
#   places, speeds, energy, hits and random numbers. The rest are worked from the spec's rules.

