# ================================================================ part 4c-1b: his tail in flight
#
# Format of part 4c-1b (§17), ids FT-. The ridley, random, energy and hits_taken fields
# use the L- form. Her is the same table as in the T- vectors, as the frame starts.
# Optional rules.tail_reach overrides TailHits' reach, in px.
# flight_tail is absent for take-off, which supplies its own starting shape. The
# flight_tail and flight_tail_after tables hold pace, an optional mark, swish (runs),
# and seven segments, ordered from base to tip. Angles count 256ths of a turn, lengths
# count 1/256 px, places are unsigned whole px and offsets are signed whole px.
# lag is a count or "Passed". Directions are "Ahead" and "Back".
# ridley_after.whip is the swish request, and ridley_after.hit is the shared tail hit.
# W1-W21 identify recorded cases. The others are constructed.

