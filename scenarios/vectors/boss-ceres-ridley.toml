# ================================================================ part 2: the shaft as she arrives
#
# Format of the part-2 vectors (spec §7 to §9). They have no door, before, her, random, shaking or
# after; instead:
# - Every position, height and count in part 2 is a 16-bit number written in decimal.
# - arrival (placing vectors): [x, y], her position in pixels when the arrival places the pad.
# - pad (optional, absent when gone): wait, frames; position = [x, y], pixels; look, "First"
#   or "Second", absent for none (spec §7, `PadLook`). cover (optional, absent when gone):
#   [x, y], pixels. her_y: her y, px, when they run (spec §7.3).
# - shaft_after: her_y, held (bool), pad and cover as above, after one step of the pad and the
#   cover: one run of the pad and then the cover, or the placing. drawn (optional, compared when
#   present): the figures that step reports (spec §7.4): pad = { look, position } as above, and
#   cover = [x, y], each absent for none.
# - lights: one step of the beacon and the platform, on a frame the shaft's overlay runs (spec
#   §7.3): count, the count of finished frames; fade_steps (optional, default 0), the steps a
#   door's fade has taken when the overlay runs, 0 to 14; stage (optional, default "Calm"),
#   "Calm", "Getaway" or "Escape" (spec §1.3, §7.3).
# - lights_after: step, 0 to 7, the beacon's step, absent for none; platform, "First" or
#   "Second", absent for none (spec §7, `PlatformLook`).
# - rules (optional): wait (frames, PadWaits), floor (px, PadCarries), rhythm (frames a step,
#   BeaconCycles). Without rules: wait 60, floor 72, rhythm 8.
# - Positions are invented: the recorded cases (A1 to A7, B1, P1, P2, whose rows and frames the
#   observer keeps) are moved to x = 320 with their heights kept, since the heights are the
#   rule's. Frame counts are the records' (B1, B3, B4, P1, P2) or invented.

