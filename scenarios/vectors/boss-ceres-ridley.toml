# Test vectors for docs/behaviours/boss-ceres-ridley.md (part 1, the Ceres doors).
#
# Format
# - Each [[vector]] is one run of one door, from its state at the run's start to its state at the
#   end, or (placing = true, no before, her or random) the room placing it: id; placing (optional); source ("constructed": every vector here is); entries (the spec's behaviours it
#   exercises); rules (optional); door; before; her; stage (optional); random (optional);
#   shaking (optional); after.
# - rules (optional): the reference rules this vector overrides (spec, each Parameter entry's
#   params): reach (px, SheIsNear), poll (frames, Polling), hold (frames, Opening and Closing),
#   strong_below (EscapeShakes' chance c, out of 4,096), small and strong (EscapeShakes' two
#   shakes, each { pixels, frames }). A vector without rules runs the reference ones: reach 48,
#   poll 2, hold 5, strong_below 128, small { pixels = 1, frames = 2 }, strong { pixels = 3,
#   frames = 4 }.
# - door: kind, "Door" or "ShaftDoor"; facing, "Left" or "Right"; position = [x, y], each a
#   16-bit position in pixels, in hex (spec, Notation), the centre of its box.
# - before: phase, one of "Closed", "Closing", "Open", "Opening", "Placed", "Starting", "Wall"
#   (spec §1, Phases; listed alphabetically, the order means nothing); step, 1 to 4, for "Closing"
#   and "Opening" only (the n of Closing(n) and Opening(n)); wait, frames, 1 to 5.
# - her: [x, y], where she was at the end of the last frame, 16-bit positions in pixels, in hex (spec
#   §1.3).
# - stage (optional, default "Calm"): "Calm", "Escape" or "Getaway" (spec §1.3).
# - random (optional, default "0000"): the random number as the door reads it, 16-bit hex.
# - shaking (optional, default 0): the shake's frames left when the door runs.
# - after, compared at the end of the run: phase, step (as in before) and wait; figure, the
#   figure its phase holds, { look, facing } with look one of "Ajar1", "Ajar2", "Ajar3", "Closed",
#   "Open", or absent for none (spec §1, Figures); shown and solid, bools; sound, whether it asked for the doors' opening sound (queue limit 6);
#   shake (absent for none): { pixels, frames }; colours (placing only): which of the doors'
#   two colour sets the doors' palette takes, "Calm" or "Escape" (spec §1.4).
# - The vectors hold the doors' and her positions, invented: no door's position is the game's.
#   The cases the records show are each such a run moved, with her, to an invented place; the
#   comment gives its recorded case by its id (R1 to R18), whose row and frame the observer keeps. The rest (every edge of the reach, wrapping, the getaway, the
#   shaft's wall, every adjusted rule) are worked from the spec's rules.

