# A vector is one frame of the room's quake: its State before, the frame's inputs, what Drawing's
# query gives, what the frame's update publishes, and its State after.
#
# State: `remaining` (frames), `phase`, and `kind` exactly while remaining is over 0:
#   kind = { reach = "Whole" | "Back" | "Front" | "Scenery", size = 1..3,
#            direction = "Diagonal" | "Sideways" | "UpAndDown" }.
# Inputs, each optional:
#   `start = { kind = {...}, frames = 0..65535 }`, or `stop = true`: another part of the game
#     starts or stops a shake before the frame's update (spec, Order that matters);
#   `opportunity = "Absent"`: the scheduler skips the update (a passage); default ordinary;
#   `time = "Held"`: time is stopped this frame; default running.
# `drawn = { x, y }`: Drawing's query for an actor's projectile, after the inputs and before
#   the update; omitted where a recorded vector cannot observe it.
# `effects`: what the update publishes, `front` and `back` offsets `{ x, y }` and `actors`
#   (every actor the room runs is asked to shake); omitted when there is no opportunity.
# An independent start uses its own full State. A continuation (`continues`) starts from the
# full result of the vector it names, carried through a fresh restoration.
# The admission case exercises the production boundary.

[[vector]]
id = "R-quiet-frame"
source = "recorded"
entries = ["QuietQuakePhase"]
before = { remaining = 0, phase = 402 }
effects = { front = { x = 0, y = 0 }, back = { x = 0, y = 0 }, actors = false }
after = { remaining = 0, phase = 403 }

