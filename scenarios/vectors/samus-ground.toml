# Test vectors for docs/behaviours/samus-ground.md (MODEL §5), read by a `game` test.
#
# Format
# - Each [[vector]] has: id; source ("item-morph-ball:<frame>" for an oracle record, or
#   "constructed"); entries (the spec's behaviour IDs it exercises); rules (optional:
#   speed_cap = "Wordwise", the default, or "Exact"); world; before; one or more [[vector.step]].
# - A P.S quantity is a string "PPPP.SSSS": the pixel word and the subpixel word, both hex.
#   Pixel coordinates are integers.
# - world: floor_top = the y of a flat solid floor's top surface, a multiple of 16; every block
#   row from it down is solid. wall_right = the x of a solid wall's left face, a multiple of 16;
#   every block column from it rightward is solid. solid_enemy_floor = true: a solid enemy under
#   her stops every downward step and leaves y unchanged (the enemy domain; these vectors don't
#   compare y). Anything not listed is air.
# - before: the State at the start (spec §1.1). Defaults: base_speed and extra_run "0000.0000",
#   momentum false, mode "Accelerating", on_square_slope false.
# - [[vector.step]]: the inputs for one frame (spec §1.2):
#     locomotion: "FacingForward", "Standing", "Running", "BallAtRest", "BallRolling",
#       "SpringBallAtRest", "SpringBallRolling", "Crouching", "TurningOnGround", "Transition",
#       "Moonwalking" or "RanIntoWall" (spec §2; Ball { spring, at_rest } spelled out);
#     facing: "Left" or "Right"; radius = [x, y] in px;
#     pad: the buttons held, from run, shoot, jump, left, right, aim_down;
#     new_running_pose, airborne, submerged, gravity_suit, speed_booster, elevator_moving:
#       default false; frame_parity: "Even" (default) or "Odd".
# - [vector.step.after]: the State expected at the end of that frame. Only the listed fields
#   are compared; position = [x, y] compares both, position_x or position_y one. The State
#   names are spec §1.1's. [vector.step.contacts]: the expected Contacts (wall_stop; vertical = "None",
#   "Landed", "Falling" or "HitCeiling"), after the row's After. Left out: not checked.
# - Steps chain: the test carries the model's whole State from one step to the next.
# - The record pads are from item-morph-ball: frame N reads record N-1's pad.

# V1: running right, no pose change, so no arm-pump step.
[[vector]]
id = "V1"
source = "item-morph-ball:1230"
entries = ["ExtraRunSpeed", "BaseSpeedAccelerate", "HorizontalStep"]
world = { solid_enemy_floor = true }
before = { position = ["047D.3FFF", "029B.0000"] }
[[vector.step]]
locomotion = "Running"
facing = "Right"
radius = [5, 0x15]
pad = ["run", "right"]
[vector.step.after]
position_x = "047D.7FFF"
base_speed = "0000.3000"
extra_run = "0000.1000"
momentum = true
[vector.step.contacts]
wall_stop = false

# V2: running right, the aim changes, so the arm-pump step adds 1.0.
[[vector]]
