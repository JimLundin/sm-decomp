# Test vectors for docs/behaviours/samus-ground.md (MODEL §5), read by a `game` test.
#
# Format
# - Each [[vector]] has: id; source ("item-morph-ball:<frame>" for an oracle record, or
#   "constructed"); entries (the spec's behaviour IDs it exercises); rules (optional:
#   speed_cap = "Wordwise", the default, or "Exact"); world; before; one or more [[vector.step]].
# - A P.S quantity is a string "PPPP.SSSS": the pixel word and the subpixel word, both hex.
#   Pixel coordinates are integers.
# - world: the flat stand-in for the collision domain (spec §5). Anything not listed is air.
#   - floor_top: the y of a solid floor's top face, a multiple of 16; every row from it down is solid.
#   - wall_right: the x of a solid wall's left face, a multiple of 16; every column from it
#     rightward is solid.
#   - wall_left: the x of a solid wall's right face, a multiple of 16; every column left of it is solid.
#   - ceiling_bottom: the y of a solid ceiling's bottom face, a multiple of 16; every row above it
#     is solid.
#   - solid_enemy_floor = true: a solid enemy under her stops every downward move and leaves y
#     unchanged; the vectors that use it don't compare y or `vertical`.
#   The stand-in answers a move as the original's flat blocks do: the leading edge at the target is
#   x + d + rx - 1 (right) or x + d - rx (left), y + d + ry - 1 (down), from the pixel words; if it
#   is in a solid block, she stops flush against it (the edge on the block's near face), with the
#   subpixel FFFF moving right or down and 0 moving left (spec `FloorFlushSubpixel`). Horizontal
#   moves test the rows from her top edge to her bottom edge. The stand-in never tunnels;
#   where the original would (a step of 16 px or more), the vector doesn't compare y.
# - before: the State at the start (spec §1.1). Defaults: base_speed and extra_run "0000.0000",
#   momentum false, mode "Accelerating". A mode other than Accelerating stands for the mode pose
#   selection left when the pose started (spec §1.1).
# - [[vector.step]]: the inputs for one frame (spec §1.2):
#     locomotion: "FacingForward", "Standing", "StandingPlain", "Running", "BallAtRest",
#       "BallRolling", "SpringBallAtRest", "SpringBallRolling", "Crouching", "TurningOnGround",
#       "Transition", "Moonwalking" or "RanIntoWall" (spec §2: Standing { plain } and
#       Ball { spring, at_rest } spelled out);
#     facing: "Left", "Right" or "Forward"; radius = [x, y] in px;
#     pad: the buttons held, from run, shoot, jump, left, right, aim_down;
#     new_running_pose, airborne, elevator_moving, on_slope: default false;
#     air_vertical: the air domain's result when airborne (a `vertical` value), default "None".
#     submerged and speed_booster are fixed false for the pilot and are not in the format.
# - [vector.step.after]: the State expected at the end of that frame. Only the listed fields
#   are compared; position = [x, y] compares both, position_x or position_y one.
#   [vector.step.contacts]: the expected Contacts (spec §1.3): wall_stop, ran_into_wall,
#   end_vertical_motion, restart_standing_animation (bools); vertical = "None", "Landed",
#   "Falling(Airborne)", "Falling(MorphBall)", "Falling(SpringBall)", "Falling(NoChange)" or
#   "HitCeiling", after the row's After. Left out: not checked.
# - Steps chain: the test carries the model's whole State from one step to the next.
# - The record pads are from item-morph-ball: frame N reads record N-1's pad. The radius of frame
#   N is record N's (spec §8).

# V1: running right, no pose change, so no arm-pump step.
