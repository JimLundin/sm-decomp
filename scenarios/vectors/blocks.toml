# Test vectors for docs/behaviours/blocks.md.
#
# Format
# - [reaction.<name>]: a reaction in the format the importer writes (spec §2), invented for these
#   vectors: none is the game's, whose reactions the importer gives the harness at test time.
#   Each has its family; look (the whole look, absent for a shot block that keeps its own);
#   first_wait; its scripts, each a list of steps: { sound, queue_limit }, { show = [[dx, dy,
#   becomes, look], ...], frames }, { regrow = true }, { end = true }. A pattern cell's becomes is
#   "Air", "Itself", "StandInAcross" or "StandInDown". The names are the vectors' own; the model
#   reads them only as the marks that name them. The set covers every family, step, pattern cell,
#   first wait of 1, 2 and 3, a whole look and none, and growing back by a step, by a show and
#   not at all.
# - Each [[vector]] is one frame: id; source ("<row>:<frame>" for the record holding the frame's
#   result, or "constructed"); entries (the spec's behaviours it exercises); before; frame; after.
# - A cell: at = [x, y] in cells; kind ("Air", "Block", "ReactingAir", "Solid", "StandInAcross",
#   "StandInDown"); look ("310", the picture's index in hex, ":x", ":y" or ":xy" when flipped); mark (a
#   reaction's name, "scroll" or "nothing", with met_as = "Bomb", "Crumble" or "Shot" for "nothing")
#   or reach (a stand-in's, in cells). A cell's mark is given wherever it is known, the kinds that
#   don't read it included; the model must keep it.
# - places: the running reactions, each { place, reaction, script, cell, next (the index of its
#   next step in the script, from 0), wait (the frames it still waits), remembers (what it grows
#   back as: "Block" or "ReactingAir"; given only where a Regrow step is still ahead) }, or a scroll
#   reaction { place, scroll = [{ screen = [x, y], becomes }], cell }. Places not listed are free.
# - held: places held by reactions of other parts of the domain (doors' caps, items, ...) or, in
#   vectors where no scroll cell is touched, by scroll reactions: they take places and do nothing
#   else here.
# - held_until_run: places held until the next run that isn't paused (a scroll cell's or a cell
#   marked Nothing's touch, BlocksMarkedNothing, TheScriptsRun).
# - screens (optional): the room's screens, one string a row, "C" Closed, "O" Open, "S" Short, as
#   in scenarios/vectors/camera.toml; given where a scroll cell is involved.
# - frame (optional): she = { dashing, shinesparking, screw_attacking } (absent is false);
#   inside = [{ cell, point }] ("Bottom", "Centre", "Top"), in order; touches = [{ cell, way }]
#   ("Down", "Left", "Right", "Up", "Look"), in order; hits = [{ cell, by }] ("Beam", "Missile",
#   "SuperMissile", "Bomb", "PowerBomb"), in order; paused = true (the run is paused this frame,
#   TheScriptsRun); placements (a room's start, RoomStart): in
#   order, { scroll = [...], cell }, { stand_in = "Across" | "Down", reach, cell } or { other }.
# - after: the same fields at the end of the frame; constructed vectors also give answers (one per
#   touch, in order: "Air" or "Solid"), redrawn (cells in order) and sounds ({ sound, queue_limit }
#   in order).
# - Recorded vectors (R): from oracle frames that ran one frame of gameplay in one room (the game's
#   frame count advanced by one between two frames' commits, the reactions running), on which no
#   reaction's script decides the outcome: the scroll cells' touches. Their before is the first
#   commit's, their after the next one's. Their touches and inside cells are the scroll touches
#   the oracle saw happen in the frame, in order; a touch's cell is the scroll cell nearest her and
#   its way "Down" (a scroll cell reads none). Their answers, redraws and sounds are not recorded.
#   The recorded frames whose outcome a game's script decides are checked by the harness, with
#   the game's reactions from the importer. Row ids r01-r11 stand for the chain rows.
# - Constructed vectors (C): cases no record reaches, and the rules the harness cases show, over
#   the invented reactions; each gives its case in a comment. Their after is worked from the
#   spec's rules.

# The reactions the vectors use: invented, in the importer's format (spec §2).

[reaction.bomb]
family = "Bomb"
look = "340"
first_wait = 1
touched = [
  { sound = "Shatter", queue_limit = 5 },
  { show = [[0, 0, "Air", "341"]], frames = 3 },
  { regrow = true },
  { end = true },
]
broken = [
  { sound = "Crack", queue_limit = 2 },
  { show = [[0, 0, "Air", "342"]], frames = 4 },
  { regrow = true },
  { end = true },
]

[reaction.crumble]
family = "Crumble"
look = "310"
first_wait = 3
broken = [
  { sound = "Crack", queue_limit = 2 },
  { show = [[0, 0, "Air", "311"]], frames = 5 },
  { show = [[0, 0, "Air", "312:x"]], frames = 2 },
  { regrow = true },
  { end = true },
]
revealed = [
  { show = [[0, 0, "Itself", "310"]], frames = 1 },
  { end = true },
]

[reaction.crumble-wide]
family = "Crumble"
look = "320"
first_wait = 2
broken = [
  { sound = "Crack", queue_limit = 2 },
  { show = [[0, 0, "Air", "321"], [1, 0, "Air", "321:x"]], frames = 4 },
  { show = [[0, 0, "Itself", "320"], [1, 0, "StandInAcross", "320:x"]], frames = 6 },
  { end = true },
]
revealed = [
  { show = [[0, 0, "Itself", "320"], [1, 0, "StandInAcross", "320:x"]], frames = 1 },
  { end = true },
]

[reaction.power-bomb]
family = "PowerBomb"
look = "370"
first_wait = 2
broken = [
  { sound = "Crack", queue_limit = 2 },
  { show = [[0, 0, "Air", "371"], [0, 1, "Air", "371:y"]], frames = 2 },
  { end = true },
]
revealed = [
  { show = [[0, 0, "Itself", "370"], [0, 1, "StandInDown", "370:y"]], frames = 1 },
  { end = true },
]

[reaction.shot]
family = "Shot"
first_wait = 2
broken = [
  { sound = "Pop", queue_limit = 4 },
  { show = [[0, 0, "Air", "351"]], frames = 2 },
  { show = [[0, 0, "Air", "3FF"]], frames = 1 },
  { end = true },
]

[reaction.shot-back]
family = "Shot"
look = "35C"
first_wait = 1
broken = [
  { sound = "Pop", queue_limit = 4 },
  { show = [[0, 0, "Air", "35D"]], frames = 6 },
  { regrow = true },
  { end = true },
]

[reaction.speed]
family = "Speed"
look = "330"
first_wait = 1
broken = [
  { sound = "Shatter", queue_limit = 5 },
  { show = [[0, 0, "Air", "331"]], frames = 2 },
  { show = [[0, 0, "Air", "3FF"]], frames = 7 },
  { regrow = true },
  { end = true },
]
revealed = [
  { show = [[0, 0, "Itself", "330"]], frames = 1 },
  { end = true },
]

[reaction.super]
family = "SuperMissile"
look = "360"
first_wait = 1
broken = [
  { sound = "Pop", queue_limit = 4 },
  { show = [[0, 0, "Air", "361"]], frames = 3 },
  { regrow = true },
  { end = true },
]
revealed = [
  { show = [[0, 0, "Itself", "360"]], frames = 1 },
  { end = true },
]

