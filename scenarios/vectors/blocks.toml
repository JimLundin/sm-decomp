# Test vectors for docs/behaviours/blocks.md.
#
# Every vector is constructed, over the invented reactions below. The frames the oracle recorded
# are checked by the domain harness with the game's own reactions, which the importer gives it at
# test time; none of the game's content is in this file.
#
# Format
# - [reaction.<name>]: a reaction in the format the importer writes (spec §2), invented for these
#   vectors: none is the game's. Each has its family; look (the whole look: a picture's index
#   in hex, never flipped, so a reader refuses a flip; absent for a shot block that keeps its
#   own); first_wait (frames, 1 to 32,767); its scripts, each a list of steps: { sound,
#   queue_limit }, { show = [[dx, dy, becomes, look], ...], frames (1 to 32,767) },
#   { regrow = true },
#   { end = true }; regrow and end are always true, and a reader refuses false. A pattern cell's
#   becomes is "Air", "Block" (a reacting block, whatever the cell was), "StandInAcross" or
#   "StandInDown". The names are the vectors'
#   own; the model reads them only as the marks that name them, and every reaction a cell or a
#   place names is one of these tables (a reader refuses any other name, as the room's loading
#   refuses a mark that names no reaction). The set covers every family, step, pattern cell,
#   first wait of 1, 2 and 3, a whole look and none, growing back by a step, by a show and not at
#   all, and a bomb block's broken script with a leading sound and without one.
# - Each [[vector]] is one frame: id; source ("constructed"); entries (the spec's behaviours it
#   exercises); before; frame; after. A comment gives its case.
# - A cell: at = [x, y] in cells; kind ("Air", "Block", "ReactingAir", "Solid", "StandInAcross",
#   "StandInDown"); look ("310", the picture's index in hex, ":x", ":y" or ":xy" when flipped);
#   reaction (a reaction's name, one of the [reaction.*] tables above), mark ("Nothing", "Scroll",
#   "Inert" or "Other", for a mark that isn't a reaction; with met_as = "Bomb", "Crumble" or
#   "Shot" for "Nothing", and met_as = "Crumble" for an "Other" a blast meets as crumble blocks) or
#   reach (a stand-in's, in cells); inside = "HoldsPlace" for a cell whose mark holds a place
#   when she is inside it: it holds one only while the cell is reacting air, and a cell that is
#   a block keeps the key. A cell's mark is given wherever it is known, the kinds that don't
#   read it included; the model must keep it.
# - places: the running reactions, each { place, reaction, script, cell, next (the index of its
#   next step in the script, from 0), wait (the frames it still waits, 1 to 32,767), remembers
#   (what it grows back as: "Block" or "ReactingAir"; given for every running reaction whose
#   script has a Regrow step, before and after that step, and for no other) }, or a scroll
#   reaction { place, scroll = [{ screen = [x, y], becomes }], cell, touched (true while a touch
#   waits for the run) }. Places not listed are free.
# - other_parts: places held by reactions of the domain's other parts (the doors' caps, ...) and
#   by W3's items: they take places and do nothing else here.
# - held_until_run: places held until the next run that isn't paused (a scroll cell's or a cell
#   marked Nothing's request, BlocksMarkedNothing, TheScriptsRun).
# - screens (optional): the room's screens, one string a row, "C" Closed, "O" Open, "S" Short, as
#   in scenarios/vectors/camera.toml; given where a scroll cell is involved.
# - frame (optional): she = { dashing, shinesparking, screw_attacking } (absent is false);
#   requests, in the order the frame makes them, each one of { inside = [x, y], point } (point
#   "Top", "Centre" or "Bottom"), { touch = [x, y], way } (way "Down", "Left", "Look", "Right" or
#   "Up"), { hit = [x, y], by } (by "Beam", "Bomb", "Grapple", "Missile", "PowerBomb" or
#   "SuperMissile") or { other = true } (another part's start; the comment says whose);
#   paused = true (the run is paused this frame, TheScriptsRun); placements (a room's start,
#   RoomStart): in order, { scroll = [...], cell }, { stand_in = "Across" | "Down", reach, cell }
#   or { other = true } (another part's). other is always true, and a reader refuses false.
#   Each form is told by the key only it has (inside, touch, hit, other; scroll, stand_in, other;
#   sound, show, regrow, end), so a reader refuses an unknown key.
# - A reader refuses:
#   - a duplicate vector id;
#   - screens rows of unequal length;
#   - a wait, a first_wait or a show's frames outside 1 to 32,767;
#   - a remembers missing from a running reaction whose script has a Regrow step, or given on
#     one whose script has none.
# - after: the same fields at the end of the frame, and answers (one per touch, in order: "Air",
#   "Solid", or "Other" for a cell marked Other, which its part answers), written (each cell a
#   step wrote, in order, whether or not its look changed; a start's own change is not one) and
#   sounds ({ sound, queue_limit } in order).

# The reactions the vectors use: invented, in the importer's format (spec §2).

[reaction.bomb]
family = "Bomb"
look = "340"
first_wait = 1
touched = [
  { sound = "Shatter", queue_limit = 5 },
  { show = [[0, 0, "Air", "341"]], frames = 3 },
  { regrow = true },
  { end = true },
]
broken = [
  { sound = "Crack", queue_limit = 2 },
  { show = [[0, 0, "Air", "342"]], frames = 4 },
  { regrow = true },
  { end = true },
]

