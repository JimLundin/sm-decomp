# File select, one frame end at a time: the State before it, how the frame ended, and the State
# after it.
#
# State: `stage` ("loading", "brightening", "choosing", "confirming", "leaving"), `load_step`
# (the load's finished frame ends so far, 0 to 4, only while "loading"), `screen` (["blank" or
# "lit", level 0 to 15]), `cursor` ("slot-a", "slot-b", "slot-c", "copy", "clear", "exit") and
# `offered` (some slot holds a file, so copy and clear are offered), both from the load's fourth
# finished frame end, `fade_wait` (finished frames before the next level, from the load's fourth
# finished frame end), `chosen` (the slot chosen) and `turn_left` (frames of work left of the
# helmet's turn), both only while "confirming".
# Input: `finished`, 1 when the game had its work, or a part of it, done by the frame end, 0 when
# still busy; `pressed`, one list per finished frame of the buttons just pressed as it began (none
# when absent); `input`, save memory's answers at the load's fourth finished frame end:
# `last_slot` (the slot chosen last, absent when save memory holds none valid) and `files` (the
# slots that hold a file).
# `after` lists the fields the vector checks, and `requests`, the sounds asked for, oldest first
# (none when absent): "menu-opens", "cursor-moved", "choice-made"; and `frame_goes_on = true`
# where the frame of work goes on through the frame end (false when absent). `stage` in `after`
# may be a way out: "options-begin", "title-returns", "copy-begins" or "clear-begins".
# `unsupported = true` means the frame end belongs to the piece after a way out. `rules`
# overrides `menu_pace` (finished frames per level, reference 2) and `helmet_turn` (frames of
# work, reference 57).

[[vector]]
id = "R-load-first"
source = "recorded"
entries = ["MenuLoads"]
before = { stage = "loading", load_step = 0, screen = ["blank", 0] }
finished = 1
after = { stage = "loading", load_step = 1, screen = ["blank", 0], frame_goes_on = true }

