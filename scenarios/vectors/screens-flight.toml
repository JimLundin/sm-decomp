# Test vectors for docs/behaviours/screens-flight.md (the gunship's flight to Ceres).
#
# Format
# - Each [[vector]] is one frame of the flight, from its state as the frame begins to its state
#   as the frame ends: id; source ("recorded" or "constructed"); entries (the spec's behaviours it
#   exercises); rules (optional); before; inputs (optional); after; output (optional).
# - rules (optional): the reference rules this vector overrides: rhythm, frames (PictureDarkens's
#   d). A vector without rules runs the reference one: rhythm 1.
# - before and after: stage, "Starting", "WaitingForMusic", "RushingIn", "FlyingAway", "Label",
#   "FadingOut" or "Done"; angle, 256ths of a turn in hex; zoom, 256ths, 0 to 32,767; plane, the
#   plane's position [[x, "xf"], [y, "yf"]]: signed whole px and the fraction in 65,536ths in
#   hex, added to it (so [-76, "8000"] is -75.5 px); sprites, a table by kind: RushingStars =
#   [x, "xf", y, "yf", speed], the speed in 256ths of a px per frame; any other kind =
#   [x, "xf", y, "yf", drift, wraps], the drift in 65,536ths of a px per frame and wraps a bool;
#   absent kinds not placed; flash, [r, g, b], 0 to 31; label, { step, hold }: the index of the
#   label's current step (0 the first) and its hold left in frames, absent outside the label;
#   level, 0 to 15; screen, "Blanked" or "Shown"; count, the fade's count in frames.
# - inputs (optional): track_waits, bool (absent means false); scene, the scene's content:
#   ready = { angle, zoom, plane = [x, y], stars = [x, y], speed }, turn = { angle,
#   plane = [x, y], sprites = { Kind = [x, y, drift, wraps] } }, label = the label's steps in
#   order, each { letter, column, row, hold }, letter absent for a step that types none.
# - output (optional): transform, [a, b, c, d]; scroll, [x, y]; typed, the letters typed this
#   frame as [{ letter, column, row }]; done, bool; music, the requests this frame in order,
#   each { request, delay }, with delay in frames. An absent music field expects no requests.
#   Other absent fields are not checked.
# - Content is invented: no place, angle, zoom, speed, drift, letter or hold of a scene is the
#   game's. The recorded cases (named by row and cut elsewhere) keep the State as recorded and
#   give the scene invented content, the label with the holds recorded.

# In the dark, then the gunship appears.

[[vector]]
id = "R-setup"
source = "recorded"
entries = ["FlightIsMadeReady", "PlaneTransforms"]
before = { stage = "Starting", angle = "00", zoom = 0, plane = [[0, "0000"], [0, "0000"]], sprites = {}, flash = [0, 0, 0], level = 0, screen = "Blanked", count = 0 }
inputs = { scene = { ready = { angle = "C0", zoom = 400, plane = [-50, -90], stars = [100, 70], speed = -900 } } }
after = { stage = "WaitingForMusic", angle = "C0", zoom = 400, plane = [[-50, "0000"], [-90, "0000"]], sprites = { RushingStars = [100, "0000", 70, "0000", -900] }, flash = [0, 0, 0], level = 0, screen = "Blanked", count = 0 }
output = { transform = [0, -400, 400, 0], scroll = [-50, -90], music = [{ request = "LoadCeresFlightTune", delay = 8 }, { request = "PlayCeresFlightTune", delay = 14 }] }

