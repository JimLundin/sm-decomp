# Test vectors for docs/behaviours/samus-appearance.md.
#
# Format
# - [paces]: the run's paces (spec §1.4), invented: plain, a hold for each shown step of the
#   running clip; boosted, five lists, one per boost stage 0 to 4.
# - [clips.NAME]: an invented clip (spec §1.4): steps, in order from step 0, each "N" (a shown
#   step held N frames), "rest", "again S", "breathe", "end", "end-unless-jump" or
#   "branch X Y Z"; kick, fast_fall and rising (optional): the step each marks; contacts
#   (optional, default none): its contact steps (spec §9.1).
# - [initialization]: her appearance State as initialization leaves it (spec §1.6): the four
#   animation quantities, her kept action, the cannon delay and the three colour-sequence
#   quantities.
# - Each [[vector]] is one frame, from the State before it to the State after it: id; source
#   ("constructed", or "ROW:FRAME", the record the frame starts from); entries (the spec's
#   behaviours it exercises); rules (optional); before; ahead (optional); inputs; after.
# - rules: the vector's own values of the spec's parameters, for an adjusted game; a parameter
#   it doesn't name has the game's value: breathing_threshold, the energy at which she still
#   breathes in a loop (Breathing; 30); restart_frames, the frames step 0 shows after a
#   restart, the restart's own frame the first (StandingRestart; 15); fast_fall_speed, the size of
#   her vertical speed at which her fall jumps on, "PPPP.SSSS" in hex (FastFall; "0005.0000");
#   fast_fall_frames, the frames the fast fall step shows, its first frame included (FastFall; 7);
#   rising_frames, the frames the rising step shows again each time she is still rising on its
#   last frame, that frame included (RisingHold; 3); laps_per_stage, the laps each boost stage 0
#   to 4 lasts (BoostStages; [1, 1, 1, 1, 2]). A frames rule's value is the time left the frame
#   ends with.
# - before and after: her appearance State's animation part and kept action: step, left (the
#   time left), stage and laps (the laps left), each default 0 in before, and kept (her kept
#   action, spec §9.1: an action, default "Still" in before, and in after the same as before);
#   after states all four animation quantities, and sounds (default none), each asked for this
#   frame, in the order asked: "PlainSpin", "SpaceJump", "ScrewAttack", "Boosting".
# - ahead: what is known from the frame's start alone, from before and the clip of her pose:
#   end (default "None"; "End" or "EndUnlessJump"), the end her clip reaches this frame
#   (ClipEnds), and turned_far (default false), whether her spin has turned far (SpinTurnedFar).
# - inputs (spec §1.3): the frame's inputs, one name for each fact in every kind of case below.
#   pose, "BODY ACTION FACING AIM", then "Drawn" for the gun drawn,
#   "Striding" for the legs, and "ScrewAttack", "SpaceJump" or "OtherSuit" for the sprite
#   (default the gun stowed, legs together, the plain sprite); an action with a turn or a landing
#   is written "Turning(Ground)", "Landing(Jump)" and the like. clip: the clip of her pose.
#   pose_after and clip_after (optional, default the same): the pose she ends the frame in and
#   its clip. energy (default 99); items (default none): "SpeedBooster", "SpaceJump",
#   "ScrewAttack"; dash (default "Off"), the dash this frame (spec §1.3): "Off", "On", "Began",
#   "Lost", "BeganAndLost" or "Stopped"; submerged, run_held, handed_over, standing_restarts,
#   wall_jump_readied, heading_down (each default false); step_slowdown (the slowdown of each step
#   her clip moves on to), start_slowdown (the slowdown of the first step of the pose she takes),
#   each default 0; sounds_waiting (default 0 in this file only: the caller supplies it on every
#   frame);
#   vertical_speed (default "+0000.0000"): her vertical speed, a signed P.S quantity "+PPPP.SSSS"
#   or "-PPPP.SSSS", the pixel part and the subpixel part both hex, downward positive;
#   cinematic, boss, special_colours, shoot_held (each default false); charge (default 0);
#   prepared (default false): the frame's work is prepared (spec §1.3's parts). A [[vector]]
#   frame has her moves, with none of the other parts.
# - Every vector holds RAM values and invented content only: no clip or pace of the game. The
#   constructed vectors (C) work each rule on the invented clips. The recorded vectors (R) are
#   frames the oracle recorded on which no clip is read: the time runs down without the clip
#   moving on, or a restart, a dash's beginning or its loss sets the State; they carry the
#   record's step, time left, stage and laps, with an invented clip the frame never reads.
#   Recorded frames that read a clip are the harness's
#   cases.

[initialization]
step = 0
left = 0
stage = 0
laps = 0
kept = "Still"
cannon_delay = 2
visor_delay = 1
visor_step = 3
charge_glow_position = 0

[paces]
plain = [11, 4, 10, 7, 13]
boosted = [[14, 11, 13, 12, 9], [10, 13, 9, 12, 6], [8, 12, 7, 10, 11], [7, 5, 4, 6, 9], [4, 7, 6, 5, 8]]

[clips.stand]
steps = ["7", "5", "breathe", "9", "6", "again 3"]

[clips.run]
steps = ["6", "8", "5", "9", "12", "again 0"]

[clips.spin]
steps = ["6", "9", "7", "5", "10", "again 1"]
kick = 2

[clips.tumble]
steps = ["8", "6", "9", "11", "5", "13", "7", "again 0"]

[clips.twirl]
steps = ["5", "11", "6", "9", "8", "again 1"]
kick = 1

[clips.walljump]
steps = ["8", "branch 2 5 8", "7", "6", "again 2", "9", "5", "again 5", "4", "13", "again 8"]
kick = 4

[clips.fall]
steps = ["9", "6", "11", "8", "13", "again 0"]
fast_fall = 2

[clips.jump]
steps = ["5", "8", "12", "6", "10", "again 2"]
rising = 1

[clips.turn]
steps = ["7", "5", "9", "6", "end-unless-jump"]

[clips.fold]
steps = ["11", "9", "6", "13", "end"]

[clips.aimed]
steps = ["5", "13", "8", "11", "9", "again 1"]

[clips.blink]
steps = ["9", "rest", "6", "10", "7", "again 0"]

[clips.ball]
steps = ["7", "4", "9", "12", "6", "10", "8", "again 0"]

[clips.stride]
steps = ["13", "10", "4", "12", "7", "again 2"]

[clips.pause]
steps = ["12", "rest", "7", "13", "5", "again 0"]

[clips.long]
steps = ["9", "12", "7", "10", "13", "6", "11", "8", "14", "5", "4", "again 0"]

# the time runs down by 1, the step stays
[[vector]]
id = "C-count"
source = "constructed"
entries = ["ClipPlays"]
before = { step = 1, left = 5 }
inputs = { pose = "Upright Still Right Forward", clip = "stand" }
after = { step = 1, left = 4, stage = 0, laps = 0 }

# the last frame of step 2 runs out: step 3, held its 6
[[vector]]
id = "C-next"
source = "constructed"
entries = ["ClipPlays"]
before = { step = 2, left = 1 }
inputs = { pose = "Upright Jumping Right Forward", clip = "jump", heading_down = true }
after = { step = 3, left = 6, stage = 0, laps = 0 }

# on a rest with no time left, the clip moves on the next frame: step 2, held 6
[[vector]]
id = "C-after-rest"
source = "constructed"
entries = ["ClipPlays", "ClipControls"]
before = { step = 1, left = 0 }
inputs = { pose = "Upright Falling Right Forward", clip = "blink" }
after = { step = 2, left = 6, stage = 0, laps = 0 }

# a slowdown of 3 lengthens the next hold: 6 + 3
[[vector]]
id = "C-slow-show"
source = "constructed"
entries = ["ClipPlays"]
before = { step = 2, left = 1 }
inputs = { pose = "Upright Jumping Right Forward", clip = "jump", step_slowdown = 3, heading_down = true }
after = { step = 3, left = 9, stage = 0, laps = 0 }

# moving on to "again 1" goes on from step 1, held 9
[[vector]]
id = "C-again"
source = "constructed"
entries = ["ClipControls"]
before = { step = 4, left = 1 }
ahead = { turned_far = true }
inputs = { pose = "Upright Spinning Right Forward", clip = "spin" }
after = { step = 1, left = 9, stage = 0, laps = 0 }

# the same with a slowdown of 2: 9 + 2
[[vector]]
id = "C-slow-again"
source = "constructed"
entries = ["ClipControls"]
before = { step = 4, left = 1 }
ahead = { turned_far = true }
inputs = { pose = "Upright Spinning Right Forward", clip = "spin", step_slowdown = 2 }
after = { step = 1, left = 11, stage = 0, laps = 0 }

# moving on to a rest: she rests on step 1 with 0 left, whatever the slowdown
[[vector]]
id = "C-rest"
source = "constructed"
entries = ["ClipControls"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright Falling Right Forward", clip = "blink", step_slowdown = 3 }
after = { step = 1, left = 0, stage = 0, laps = 0 }

# energy 30: back to step 0, held 7
[[vector]]
id = "C-breathe-loop"
source = "constructed"
entries = ["Breathing"]
before = { step = 1, left = 1 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", energy = 30 }
after = { step = 0, left = 7, stage = 0, laps = 0 }

# energy 29, slowdown 1: on to step 3, held 9 + 1
[[vector]]
id = "C-breathe-on"
source = "constructed"
entries = ["Breathing"]
before = { step = 1, left = 1 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", energy = 29, step_slowdown = 1 }
after = { step = 3, left = 10, stage = 0, laps = 0 }

# an adjusted game whose threshold is 50: energy 40, below it: on to step 3, held 9
[[vector]]
id = "C-breathe-adjusted"
source = "constructed"
entries = ["Breathing"]
rules = { breathing_threshold = 50 }
before = { step = 1, left = 1 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", energy = 40 }
after = { step = 3, left = 9, stage = 0, laps = 0 }

# the crouch-down ends: ended, and the pose it hands over starts on step 0 of its clip, held 7
[[vector]]
id = "C-end"
source = "constructed"
entries = ["ClipEnds", "StartingClip"]
before = { step = 3, left = 1 }
ahead = { end = "End" }
inputs = { pose = "Crouched Crouching Right Forward", clip = "fold", pose_after = "Crouched Still Right Forward", clip_after = "stand", handed_over = true }
after = { step = 0, left = 7, stage = 0, laps = 0 }

# a turn reaches an end unless a jump; samus-movement takes the standing pose it hands over: step 0, held 7
[[vector]]
id = "C-end-unless-jump"
source = "constructed"
entries = ["ClipEnds", "StartingClip"]
before = { step = 3, left = 1 }
ahead = { end = "EndUnlessJump" }
inputs = { pose = "Upright Turning(Ground) Left Forward", clip = "turn", pose_after = "Upright Still Left Forward", clip_after = "stand", handed_over = true }
after = { step = 0, left = 7, stage = 0, laps = 0 }

# a turn reaches an end unless a jump, and the pad's jump is taken (no hand-over): the jump starts on step 0
[[vector]]
id = "C-end-gives-way"
source = "constructed"
entries = ["ClipEnds", "StartingClip"]
before = { step = 3, left = 1 }
ahead = { end = "EndUnlessJump" }
inputs = { pose = "Upright Turning(Ground) Left Forward", clip = "turn", pose_after = "Upright TakingOff Left Forward", clip_after = "jump", step_slowdown = 2, start_slowdown = 2 }
after = { step = 0, left = 7, stage = 0, laps = 0 }

# the step before the end with 2 left: no end this frame, 1 left
[[vector]]
id = "C-end-later"
source = "constructed"
entries = ["ClipEnds"]
before = { step = 3, left = 2 }
inputs = { pose = "Crouched Crouching Right Forward", clip = "fold" }
after = { step = 3, left = 1, stage = 0, laps = 0 }

# no item: the spin's steps from 2, held 7, asking for PlainSpin
[[vector]]
id = "C-branch-spin"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump" }
after = { step = 2, left = 7, stage = 0, laps = 0, sounds = ["PlainSpin"] }

# the space jump: its steps from 5, held 9, asking for SpaceJump
[[vector]]
id = "C-branch-space"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump", items = ["SpaceJump"] }
after = { step = 5, left = 9, stage = 0, laps = 0, sounds = ["SpaceJump"] }

# the screw attack: its steps from 8, held 4, asking for ScrewAttack
[[vector]]
id = "C-branch-screw"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump", items = ["ScrewAttack"] }
after = { step = 8, left = 4, stage = 0, laps = 0, sounds = ["ScrewAttack"] }

# both items: the screw attack's
[[vector]]
id = "C-branch-screw-and-space"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump", items = ["SpaceJump", "ScrewAttack"] }
after = { step = 8, left = 4, stage = 0, laps = 0, sounds = ["ScrewAttack"] }

# submerged with the screw attack: the spin's, asking for PlainSpin; held 7 + 1 slowdown
[[vector]]
id = "C-branch-submerged"
source = "constructed"
entries = ["WallJumpBranch"]
before = { step = 0, left = 1 }
inputs = { pose = "Upright WallJumping Right Forward", clip = "walljump", items = ["ScrewAttack"], submerged = true, step_slowdown = 1 }
after = { step = 2, left = 8, stage = 0, laps = 0, sounds = ["PlainSpin"] }

# a clip ends under water: the next pose's first hold is 7 + 3 (the start's) + 3
[[vector]]
id = "C-slow-handover"
source = "constructed"
entries = ["HandOverSlowdown", "ClipEnds", "StartingClip"]
before = { step = 3, left = 1 }
ahead = { end = "End" }
inputs = { pose = "Crouched Crouching Right Forward", clip = "fold", pose_after = "Crouched Still Right Forward", clip_after = "stand", step_slowdown = 3, start_slowdown = 3, handed_over = true }
after = { step = 0, left = 13, stage = 0, laps = 0 }

# another pose that no end brought, under water: 5 + 3, once
[[vector]]
id = "C-slow-start"
source = "constructed"
entries = ["HandOverSlowdown", "StartingClip"]
before = { step = 1, left = 4 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", pose_after = "Upright TakingOff Right Forward", clip_after = "jump", step_slowdown = 3, start_slowdown = 3 }
after = { step = 0, left = 8, stage = 0, laps = 0 }

# under water with the gravity suit: the clip slows by 3, the start by 0, so the take-off holds 5
[[vector]]
id = "C-slow-gravity-start"
source = "constructed"
entries = ["StartingClip"]
before = { step = 1, left = 4 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", pose_after = "Upright TakingOff Right Forward", clip_after = "jump", step_slowdown = 3, start_slowdown = 0 }
after = { step = 0, left = 5, stage = 0, laps = 0 }

# the same handed over by an end: 7 + 0 + 3
[[vector]]
id = "C-slow-gravity-handover"
source = "constructed"
entries = ["HandOverSlowdown", "StartingClip"]
before = { step = 3, left = 1 }
ahead = { end = "End" }
inputs = { pose = "Crouched Crouching Right Forward", clip = "fold", pose_after = "Crouched Still Right Forward", clip_after = "stand", step_slowdown = 3, start_slowdown = 0, handed_over = true }
after = { step = 0, left = 10, stage = 0, laps = 0 }

# at a surface: the pose she takes has its feet under it (3) while the one she leaves did not slow her (0): 5 + 3
[[vector]]
id = "C-slow-surface"
source = "constructed"
entries = ["StartingClip"]
before = { step = 1, left = 4 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", pose_after = "Upright TakingOff Right Forward", clip_after = "jump", step_slowdown = 0, start_slowdown = 3 }
after = { step = 0, left = 8, stage = 0, laps = 0 }

# standing to a take-off: the jump's clip from step 0, held 5
[[vector]]
id = "C-start"
source = "constructed"
entries = ["StartingClip"]
before = { step = 1, left = 4 }
inputs = { pose = "Upright Still Right Forward", clip = "stand", pose_after = "Upright TakingOff Right Forward", clip_after = "jump" }
after = { step = 0, left = 5, stage = 0, laps = 0 }

# the old clip ran down without moving on, then she took another pose: step 0 of the new clip, held 9
[[vector]]
id = "C-start-after-count"
source = "constructed"
entries = ["StartingClip", "ClipPlays"]
before = { step = 3, left = 6 }
inputs = { pose = "Upright Jumping Right Forward Striding", clip = "jump", pose_after = "Upright Falling Right Forward", clip_after = "fall", heading_down = true }
after = { step = 0, left = 9, stage = 0, laps = 0 }

# running to running aimed up-forward: step 2 and the time left kept, after the time ran down
[[vector]]
id = "C-kept-run"
source = "constructed"
entries = ["StartingClip"]
before = { step = 2, left = 3 }
inputs = { pose = "Upright Running Right Forward", clip = "run", pose_after = "Upright Running Right UpForward", clip_after = "ball" }
after = { step = 2, left = 2, stage = 0, laps = 0 }

# the ball still to the ball rolling: kept, after the clip moved on
[[vector]]
id = "C-kept-ball"
source = "constructed"
entries = ["StartingClip"]
before = { step = 1, left = 1 }
inputs = { pose = "Ball Still Right Forward", clip = "ball", pose_after = "Ball Rolling Left Forward", clip_after = "run" }
after = { step = 2, left = 9, stage = 0, laps = 0 }

# the spring ball rolling to its hop: kept
[[vector]]
id = "C-kept-spring"
source = "constructed"
entries = ["StartingClip"]
before = { step = 2, left = 2 }
inputs = { pose = "SpringBall Rolling Right Forward", clip = "ball", pose_after = "SpringBall Jumping Right Forward", clip_after = "run" }
after = { step = 2, left = 1, stage = 0, laps = 0 }

# morphing to the ball still: not a row of the ball's, so step 0
