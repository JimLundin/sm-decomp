# crouched still aimed up from crouching down aimed up: from step 1
[[vector]]
id = "C-crouch-up-from-crouching"
source = "constructed"
entries = ["StartingClip"]
before = { step = 0, left = 3 }
inputs = { pose = "Crouched Crouching Right Up", clip = "aimed", pose_after = "Crouched Still Right Up", clip_after = "aimed" }
