# standing aimed up, from a fall aimed forward: step 0, held 5
[[vector]]
id = "C-stand-up-from-forward"
source = "constructed"
entries = ["StartingClip"]
before = { step = 0, left = 3 }
inputs = { pose = "Upright Falling Right Forward", clip = "fall", pose_after = "Upright Still Right Up", clip_after = "aimed" }
after = { step = 0, left = 5, stage = 0, laps = 0 }

# a jump aimed up from a take-off aimed up: from step 1
[[vector]]
id = "C-jump-up-from-takeoff"
source = "constructed"
entries = ["StartingClip"]
before = { step = 0, left = 3 }
inputs = { pose = "Upright TakingOff Right Up", clip = "aimed", pose_after = "Upright Jumping Right Up", clip_after = "aimed" }
