# Each [[opportunity]] checks one rule of the frame's sounds (spec section 9): kind Contact (the
# stride), PoseSelected (the pose she takes), NormalDraw or PassageEntry; inputs are named as in
# a [[vector]] (pose_after defaults to pose), expected lists the frame's semantic sounds and
# graphical contact, and after is her State as the whole frame leaves it, compared whole.
# A Contact or PoseSelected case is a frame with her movement and none of the other parts:
# inputs name the clip of her pose and, where the pose she takes has its own, clip_after; the
# stride and the spin start come with her clip playing and the clip of the pose she takes
# starting, so after shows the animation's effect (spec section 6) beside the rule's sounds.
# Contact reads her step, time left and stage as the frame starts from before (stage 4 is
# boosting), and her action and contact steps from her pose and its clip. A NormalDraw case is
# a frame with drawing alone, and with prepared, her preparation too: it reads her kept action
# from before, her preparation keeps her pose's action first, and after shows the kept action
