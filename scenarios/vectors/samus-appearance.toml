# Hurt colours (spec section 12). Each [[hurt_colours]] is one frame of HurtColours:
# before.count, the hurt count as the frame starts (0 to 59); energy_fell, whether her energy as
# the frame leaves Health is below the frame before's; push_started, samus-movement's PushStarts
# this frame; cinematic (default false); pose_after (default upright Running) and items (default
# none), as the histories above give them; grapple (default "Dormant"). Colours are invented: the row's colours before the
# frame are fixture "before"; her hurt colours fixture "hurt", her Power suit's "suit", the
# cinematic's grey colours "grey", each 16 distinguishable colours. after.count; after.row, the
# fixture her row of the current colours holds after the frame ("before" when left as it is);
# the target colours are unchanged in every case; after.sounds, the requests in order.
