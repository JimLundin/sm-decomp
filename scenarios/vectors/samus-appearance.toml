before = { step = 3, left = 1 }
ahead = { end = "EndUnlessJump" }
inputs = { pose = "Upright Turning(Jump) Left Up", clip = "turn", pose_after = "Upright Jumping Right Up", clip_after = "aimed", handed_over = true }
