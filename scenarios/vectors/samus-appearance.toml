# An [[appearance_work]] is one whole frame that combines rules checked alone above: parts
# lists the parts it has (spec §1.3: "initialization", "movement", "preparation", "drawing"),
# and before and inputs are as in a [[vector]], one set of inputs every rule reads. before and
# after may also give the cannon delay and the colour-sequence quantities, named as in
# [initialization]; unnamed, before has the initialization's values and after the same as
# before. sounds lists the frame's requests in the order of spec section 9.2; contact and the
# State in after are its other expected outputs.
# her initialization from a State far from it, every quantity changed: she is as
# [initialization] gives her, whatever came before (spec §1.6)
[[appearance_work]]
id = "C-initialize"
source = "constructed"
entries = ["CannonReadinessReset"]
parts = ["initialization"]
before = { step = 4, left = 9, stage = 3, laps = 1, kept = "Spinning", cannon_delay = 0, visor_delay = 7, visor_step = 5, charge_glow_position = 2 }
inputs = { pose = "Upright Spinning Right Forward", clip = "spin" }
sounds = []
contact = false
after = { step = 0, left = 0, stage = 0, laps = 0, kept = "Still", cannon_delay = 2, visor_delay = 1, visor_step = 3, charge_glow_position = 0 }

