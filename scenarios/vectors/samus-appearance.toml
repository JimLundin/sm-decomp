# in acid with the gravity suit: the clip slows by 2, the start by 0, so a hand-over holds 7 + 0 + 2
[[vector]]
id = "C-slow-acid-gravity"
source = "constructed"
entries = ["HandOverSlowdown", "StartingClip"]
before = { step = 3, left = 1 }
ahead = { end = "End" }
inputs = { pose = "Crouched Crouching Right Forward", clip = "fold", pose_after = "Crouched Still Right Forward", clip_after = "stand", slowdown = 2, start_slowdown = 0, handed_over = true }
