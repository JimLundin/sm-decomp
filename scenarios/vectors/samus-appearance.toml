# Ordinary dry palette histories (spec section 11). Each history is one frame's palette
# opportunity, from the three sequence quantities and both ordered colour banks before it.
# Each invented fixture names a red level. Slot i (0 through 255) has RGB components
# [red, i % 32, i // 32]. All slots within a bank and all fixtures are distinguishable.
# A recorded witness observes both complete banks privately; substitute the invented patterns
# for the unexported colours and the supplied valid pose for geometry.
# The recorded admission and sequence quantities are checked at the frame's opportunity.
# A history reads two of the frame's inputs (spec §1.3): pose_after, her pose as the frame
# ends, whose action is the recorded one, and items (default none: the screw attack switched
# off). The shared observations are the palette opportunity's own, for a Power suit in
# standard room colours, with absent surfaces, a dormant tether and no active colour effects.
# Its optional "observed" table replaces named shared observations (each key already present).
# palettes names the banks' fixtures before the frame. Each optional palette_updates item is a
# change another producer makes to one bank in the same frame; after the frame each bank holds
# its latest colours.
# Compare after the frame: the three quantities (after), both banks, no requests, and
# applications, 1 when the frame applied the reset (even if before equals after), 0 when it
# refused. Animation and cannon are unchanged.
# Each [[boundary]] starts from its based_on history, observed table included. Its
# "replacements" are independent cases, each changing shared observations or the inputs
# pose_after and items of that frame. outcome: "Refused", the reset not admitted, an ordinary
# result of the frame; "Unrecognized", a fact the rule can't read ("Unavailable"). Either
# applies nothing.

[ordinary_dry_colours.observations]
suit = "Power"
room_colours = "Standard"
water_present = false
lava_present = false
grapple = "Dormant"
stored_glow = false
weapon_charging = false
override_colours = false
special_colours = false
speed_glow = false
hit_colour_pulse = false

[ordinary_dry_colours.invented_palettes]
current = 1
target = 2
different_current = 3
different_target = 4

