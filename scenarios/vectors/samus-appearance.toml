# crouched still aimed up from a crouched turn aimed up: not crouching down, so step 0, held 5
[[vector]]
id = "C-crouch-up-from-turn"
source = "constructed"
entries = ["StartingClip"]
before = { step = 3, left = 1 }
ahead = { end = "EndUnlessJump" }
inputs = { pose = "Crouched Turning(Ground) Left Up", clip = "turn", pose_after = "Crouched Still Right Up", clip_after = "aimed", handed_over = true }
