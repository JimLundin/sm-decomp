id = "C-not-kept-morph"
source = "constructed"
entries = ["StartingClip"]
before = { step = 2, left = 2 }
inputs = { pose = "Ball Morphing Right Forward", clip = "ball", pose_after = "Ball Still Right Forward", clip_after = "run" }
