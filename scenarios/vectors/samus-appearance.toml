# Cannon readiness histories (appearance spec section 10).
# initial_delay and expected_delay are 0..2 frames of eligible item controls left.
# Each steps element is one of: controls, a frame's item controls, with the before/after
# selected item identities those controls start from and leave, independently of one-shot mode
# and switched; skip, a frame whose controls don't run; initialize; outside_selection, a
# selection change outside item controls; unrelated; draw, the picture of her gun reading the
# readiness as the frame leaves it. Every step compares the delay (expected_delay) and whether
# the cannon may follow (expected_may_follow).
# The R histories use RAM observations only; no game content or source encoding.

[[cannon_readiness]]
id = "C-cannon-change"
source = "constructed"
entries = ["CannonItemDelay"]
initial_delay = 0
steps = [
