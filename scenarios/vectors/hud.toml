# Test vectors for docs/behaviours/hud.md.
#
# Format
# - [pictures]: the HUD's pictures (spec §1.4), invented for these vectors in the format the
#   importer writes: blank, digits (digit d's picture is the d-th, from 0), full_tank,
#   empty_tank, reserve_sign (its three rows, top first, two cells each), icons (each item's
#   two rows, top first: three cells each for the missiles, two for the rest), map_blank and
#   diagonal. A picture is "PPP" (three hex digits, its number) then "h" when it is flipped left
#   to right and "v" when it is flipped top to bottom. Every vector uses this one set.
# - Each [[vector]] is one step of the HUD, from its state before the step to its state after:
#   id; source ("constructed": every vector is); entries (the spec's behaviours it exercises);
#   step (optional, default "Frame"); frame (the frame count mod 256 as the frame begins, spec
#   §1.3; a "Frame" step only); before; inputs; after.
# - step: "Frame" is one frame of play. "BossEvent" is the door or the load flow meeting a boss,
#   on entering its room while it lives (spec `BossBlanksTheMap`): it has no `frame` key, and
#   its only inputs are mini_map's room (its cell) and boss; its after is compared after the
#   event alone. The mini-map stays off from then: that is the input `off` of the frames that
#   follow, so the after doesn't list it.
# - A cell is "PPP:c", then "h" and "v" for its flips as above: PPP its picture's number, c its
#   colour set (spec §1.4). A HUD row is one string of its 32 cells, left to right, separated
#   by spaces; hud is the three rows, top first. A map picture is a picture alone (its colour
#   set is the mini-map's to choose).
# - Items are "None", "Missiles", "SuperMissiles", "PowerBombs", "GrappleBeam", "XRayScope"
#   (spec §1.1: the HUD's order, left to right, after none).
# - before: hud (optional, default every cell the blank in its colours); shown = { energy,
#   missiles, super_missiles, power_bombs, selection } (optional, each default 0 or "None": the
#   values the HUD last showed, spec §1); selection (optional, default "None"); one_shot
#   (optional, default false): whether the selected item is the one-shot item, never true with
#   "None" selected; explored (optional, default none): the explored cells, [column, row] on her
#   map.
# - inputs (spec §1.3):
#   - energy = [now, capacity]; reserve (optional, default 0): the energy in the reserve tanks;
#     auto_reserve (optional, default false): the reserve tanks are set to refill on their own.
#   - missiles, super_missiles, power_bombs (optional, default [0, 0]): [count, capacity].
#   - equipped (optional, default none): "GrappleBeam", "XRayScope" when she has them on.
#   - select (optional): "Pressed" when item select goes down this frame; cancel (optional):
#     "Pressed" when item cancel goes down this frame, "Held" when it is held from before.
#   - can_switch (optional, default true): spec `CyclingItems`.
#   - shot_cancels (optional, default false): the weapons cancelled the selection this frame.
#   - muted_by (optional, default none): "SpinJump", "WallJump", "Grapple" or "TimeStopped", why a
#     switch makes no click (spec `SwitchClick`; listed alphabetically, the order means nothing).
#   - collected (optional, default none): the item whose icon a pickup this frame draws.
#   - mini_map (optional, default: the mini-map has nothing to do): runs (default true), off
#     (default false), mother_brain_falls (default false, a "Frame" step only): her first form
#     falls this frame (spec `BossBlanksTheMap`); position = [x, y], her position in the room in
#     pixels; room = { cell = [column, row], her room's top-left cell on her map, the map's top
#     row counted as 0; blocks = [across, down], the room's size in 16 px blocks }; map = {
#     collected, pictures, charted, beyond }: whether she has collected the map; the pictures of
#     the map's cells, "column,row" = picture (a cell not listed shows the map_blank); the cells
#     the map charts, [column, row]; the beyond pictures (spec `LastColumnsShift`),
#     "column,row" = picture, column from 0 (a picture not listed is the map_blank); boss (a
#     "BossEvent" step only, required there): "Kraid", "Draygon", "Crocomire", "Phantoon",
#     "RidleyInNorfair" or "RidleyInCeres", the boss whose room the step enters.
# - after: compared at the end of the step: changed (optional, default none), the HUD's cells
#   that differ from before, "row,column" = cell, rows and columns from 0, every other cell as
#   before; shown, selection, one_shot and explored, as in before (a field left out is as
#   before); and events (default none), in the order raised: "Switched:<item>" (spec
#   `Switching`) and "Click" (spec `SwitchClick`).
# - Every vector holds RAM values and invented content only: no picture, map cell or room of the
#   game. The frames the oracle recorded are the harness's cases; each has a twin here, named
#   C-R and the case's number: its frame's counts, selection, frame count, position, room size and
#   explored cells, with the scene four map rows down and invented pictures. Their after, and
#   that of every other vector, is worked from the spec's rules.
# - The other constructed vectors (C): cases no record reaches (skipping an item she lacks, the
#   one-shot item and its flash, a shot's cancel, an icon appearing, a capacity of 0, more than
#   fourteen tanks, the clicks' other mutes, a mini-map that doesn't update, a collected map, the
#   diagonal picture, the map's first and last columns, cells outside the map, spec §1.5, each
#   boss); each gives its case in a comment.

# The HUD's pictures: invented, in the importer's format.
[pictures]
blank = "1A0"
digits = ["1B0", "1B1", "1B2", "1B3", "1B4", "1B5", "1B6", "1B7", "1B8", "1B9"]
full_tank = "1C1"
empty_tank = "1C0"
reserve_sign = [["1D0", "1D1"], ["1D2", "1D3"], ["1D4h", "1D5"]]
map_blank = "0F0"
diagonal = "0A5"

[pictures.icons]
Missiles = [["1E0", "1E1", "1E0h"], ["1E2", "1E3", "1E2h"]]
SuperMissiles = [["1E4", "1E4h"], ["1E5", "1E5h"]]
PowerBombs = [["1E6", "1E7"], ["1E8v", "1E9"]]
GrappleBeam = [["1EA", "1EAh"], ["1EB", "1EBh"]]
XRayScope = [["1EC", "1ED"], ["1EE", "1EF"]]


