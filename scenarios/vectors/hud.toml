# Test vectors for docs/behaviours/hud.md.
#
# Format
# - Each [[vector]] is one step of the HUD, from its state before the step to its state after:
#   id; source ("<row>:<frame>" for the record holding the frame's result, or "constructed");
#   entries (the spec's behaviours it exercises); step (optional, default "Frame"); frame (the
#   frame count mod 256 as the frame begins, spec §1.3; a "Frame" step only); before; inputs;
#   after.
# - step (added for the boss's event, which can come outside a frame): "Frame" is one frame of
#   play. "BossEvent" is a boss turning the mini-map off outside a frame of play (spec
#   `BossBlanksTheMap`): it has no `frame` key and no other inputs than mini_map's room (its
#   cell) and boss_blanks, and its after is compared after the event alone. The mini-map stays
#   off from then: that is the input `off` of the frames that follow, so the after doesn't list
#   it.
# - A cell is "PPP:c", then "h" when it is flipped left to right and "v" when it is flipped top to
#   bottom: PPP its picture (three hex digits), c its colour set (spec §1.4). A HUD row is one
#   string of its 32 cells, left to right, separated by spaces; hud is the three rows, top first.
#   A map picture is "PPP" with the same flip letters (its colour set is the mini-map's to choose).
# - Items are "None", "Missiles", "SuperMissiles", "PowerBombs", "GrappleBeam", "XRayScope"
#   (spec §1.1: the HUD's order, left to right, after none).
# - before: hud (optional, default every cell "00F:3"); shown = { energy, missiles,
#   super_missiles, power_bombs, selection } (optional, each default 0 or "None": the values the
#   HUD last showed, spec §1.1); selection and one_shot (optional, default "None"); explored
#   (optional, default none): the explored cells, [column, row] on her map. A recorded
#   vector lists only the explored cells the frame can read or mark, before and after alike.
# - inputs (spec §1.3):
#   - energy = [now, capacity]; reserve (optional, default 0): the energy in the reserve tanks;
#     auto_reserve (optional, default false): the reserve tanks are set to refill on their own.
#   - missiles, super_missiles, power_bombs (optional, default [0, 0]): [count, capacity].
#   - equipped (optional, default none): "GrappleBeam", "XRayScope" when she has them on.
#   - select (optional): "Pressed" when item select goes down this frame; cancel (optional):
#     "Pressed" when item cancel goes down this frame, "Held" when it is held from before.
#   - can_switch (optional, default true): spec `CyclingItems`.
#   - shot_cancels (optional, default false): the weapons cancelled the selection this frame.
#   - muted_by (optional, default none): "SpinJump", "WallJump", "Grapple" or "TimeStopped", why a
#     switch makes no click (spec `SwitchClick`; listed alphabetically, the order means nothing).
#   - collected (optional, default none): the item whose icon a pickup this frame draws.
#   - mini_map (optional, default: the mini-map has nothing to do): runs (default true), off
#     (default false), position = [x, y], her position in the room in pixels; room = { cell =
#     [column, row], her room's top-left cell on her map, the map's top row counted as 0;
#     blocks = [across, down], the room's size in 16 px blocks }; map = { collected, pictures,
#     charted, beyond }: whether she has collected the map; the pictures of the map's cells,
#     "column,row" = picture (a cell not listed shows "01F"); the cells the map charts, [column,
#     row]; the beyond pictures (spec `LastColumnsShift`), "column,row" = picture, column from
#     0 (a picture not listed is "01F"); boss_blanks: absent, no boss turned the mini-map off; present
#     (possibly empty), a boss did, and these are the screens of its room it names (none when
#     empty); required in a "BossEvent" step; [across, down] from
#     the room's top-left (spec `BossBlanksTheMap`). A recorded vector lists only the cells the
#     frame reads.
# - after: compared at the end of the frame: changed (optional, default none), the HUD's cells that
#   differ from before, "row,column" = cell, rows and columns from 0, every other cell as before;
#   shown, selection, one_shot and explored, as in before (a field left out is as before); and
#   events (default none), in the order raised: "Switched:<item>" (spec `Switching`) and "Click"
#   (spec `SwitchClick`).
# - Recorded vectors (R): taken from oracle frames that ran one frame of gameplay in one room (the
#   game's frame count advanced by one), using up no ammunition (spec `CancellingTheItem`: the
#   weapons cancel the selection) and her pose unchanged (spec §5: a pose change can move her after the
#   mini-map has read her). Their before is record N's, their inputs and after record N+1's, the
#   frame count and the pad record N's. Row ids r01-r12 stand for rows whose names carry a
#   room's address or a lexicon word. A recorded frame doesn't show the events (the sound
#   domain's queue decides when a request reaches the sound chip): a recorded vector's events
#   are the spec's rules'. At most two vectors show each outcome the frames reach, from
#   different rows.
# - Constructed vectors (C): cases no record reaches (skipping an item she lacks, the one-shot
#   item and its flash, a shot's cancel, an icon appearing, a capacity of 0, more than fourteen
#   tanks, the clicks' other mutes, a mini-map that doesn't update, a collected map, the diagonal
#   picture, the map's first and last columns, cells outside the map, spec §1.5, the boss's event
#   alone); each gives its case in a comment. Their after is worked from the spec's rules.


