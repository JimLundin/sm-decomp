# The power-on sequence, one frame end at a time: the State before it, how the frame ended, and
# the State after it.
#
# State: `stage` ("before-logo", "brightening", "held", "dimming", "sound-loading",
# "settling"), `hold_left` (frames of the hold still to show, only while "held"), `screen`
# (["blank" or "lit", level 0 to 15]) and `frames` (the count of finished frames).
# Input: `finished`, whether the frame's work finished, and `upload_ended`, whether the boot's
# driver upload ended within the frame (false when absent).
# `rules` overrides the reference rules for the vector: `fade_step` (levels per frame, reference
# 1) and `hold` (frames, reference 120). `unsupported = true` in `after` means the frame end
# belongs to the title, which this spec leaves to it.

[[vector]]
id = "R-before-logo"
source = "recorded"
entries = ["QuietUntilTheLogo"]
before = { stage = "before-logo", screen = ["blank", 15], frames = 0 }
finished = false
after = { stage = "before-logo", screen = ["blank", 15], frames = 0 }

[[vector]]
id = "R-first-light"
source = "recorded"
entries = ["LogoBrightens", "FramesCounted"]
before = { stage = "before-logo", screen = ["blank", 15], frames = 0 }
finished = true
after = { stage = "brightening", screen = ["lit", 1], frames = 1 }

