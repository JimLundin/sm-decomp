[package]
name = "sm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Super Metroid in Rust, with the original ROM as a per-frame differential oracle"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sm"
path = "src/main.rs"
required-features = ["frontend"]

# Cargo tracks the Windows verifier host and its included source files too.
[[example]]
name = "sm_verify"
path = "src/verify_dll.rs"
crate-type = ["cdylib"]
test = false

# Direct CI compilation checks actual projectile, animation and palette composition.
[[example]]
name = "player_detached"
path = "src/verification/player_detached/main.rs"
test = false

[dependencies]
gl = { version = "0.14.0", optional = true }
sdl2-sys = { version = "0.38.0", optional = true }

[features]
default = ["frontend"]
frontend = ["dep:sdl2-sys", "dep:gl"]

[lints.rust]
warnings = { level = "deny", priority = -1 }
# tools/verify_dll.py selects the headless host with this rustc configuration.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sm_verify_dll)"] }
