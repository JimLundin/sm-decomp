[project]
name = "sm-tools"
version = "0.1.0"
description = "The repository's tools: the lane, CI, oracle, clean-room and fault tools"
requires-python = ">=3.15"
dependencies = [
    "ordered",
    "tree-sitter==0.27.0",
    "tree-sitter-rust==0.24.2",
]

[project.scripts]
adjusted-vectors-run = "sm_tools.cleanroom.shell.adjusted_vectors_run:main"
box-relay = "sm_tools.cleanroom.shell.box_relay:main"
changes = "sm_tools.lane.shell.changes:main"
check-mutants = "sm_tools.faults.shell.check_mutants:main"
check-replay-transition = "sm_tools.ci.shell.check_replay_transition:main"
gate = "sm_tools.lane.shell.gate:main"
land = "sm_tools.lane.shell.land:main"
movie-inputs = "sm_tools.oracle.shell.movie_inputs:main"
played = "sm_tools.lane.shell.played:main"
prereview = "sm_tools.lane.shell.prereview:main"
record-caches = "sm_tools.oracle.shell.record_caches:main"
relock = "sm_tools.oracle.shell.relock:main"
replay = "sm_tools.ci.shell.replay:main"
replay-data = "sm_tools.ci.shell.replay_data:main"
required-witnesses = "sm_tools.ci.shell.required_witnesses:main"
run-tests = "sm_tools.ci.shell.run_tests:main"
worktree = "sm_tools.lane.shell.worktree:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff", "basedpyright", "vulture", "import-linter",
    "pytest", "coverage", "hypothesis",
    "mutmut; sys_platform != 'win32'",
]

[tool.uv]
required-version = ">=0.13"

[tool.uv.sources]
ordered = { git = "https://github.com/JimLundin/standards", subdirectory = "python/ordered", rev = "462b13bc8f1997bd5ebb801b90c607fd0a39121b" }

[tool.importlinter]
root_package = "sm_tools"

[[tool.importlinter.contracts]]
name = "core is the bottom layer"
type = "layers"
containers = ["sm_tools.ci", "sm_tools.cleanroom", "sm_tools.faults", "sm_tools.lane", "sm_tools.oracle"]
layers = ["(__main__)", "shell", "core"]
exhaustive = true

[tool.pytest]
strict = true
testpaths = ["."]
addopts = ["--hypothesis-profile=fast", "-m", "not slow"]
markers = ["slow: runs only in the full profile"]

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args = ["--hypothesis-profile=mutation"]

[tool.coverage.run]
branch = true
source = ["src"]
