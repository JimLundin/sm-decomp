# Production wiring faults must fail at the recorded cut and field.
# Each supported replay responsibility has a distinct semantic fault.

# CI deals each case's faults to one worker, costliest first, by rebuild cost (tools/check_mutants.py).

rules = [
    "samus-appearance/ProtectionFlicker",
    "boss-ceres-ridley/WarningArt",
    "boss-ceres-ridley/WarningGlow",
    "boss-ceres-ridley/WarningEnds",
    "samus-movement/GetawayArms",
    "samus-movement/GetawayStarts",
    "samus-movement/GetawayTravels",
    "boss-ceres-ridley/GetawayPass",
    "boss-ceres-ridley/GetawayPicture",
    "samus-movement/PadChart",
    "boss-ceres-ridley/FliesOutOfReach",
    "boss-ceres-ridley/GetawayBackdrop",
    "boss-ceres-ridley/TailHits",
    "boss-ceres-ridley/TailSwishes",
    "boss-ceres-ridley/VentPlaced",
    "boss-ceres-ridley/VentInView",
