        types::MovementWork::Motion(request) => Some(request),
        types::MovementWork::Support(_) | types::MovementWork::BodyFit(_) => None,
    }) {
        if let Some(search) = &mut request.enemy_search {
            search.candidates.pop();
        }
    }
    Ok(outcome)'''
