[[check]]
step = "CHECK 29"
tools = ["Grep"]
pattern = '(^| )path=/( |$)'
found_nothing = true

[[check]]
step = "CHECK 30"
tools = ["Grep"]
pattern = '(^| )path={home}/?( |$)'
found_nothing = true

[[check]]
step = "CHECK 31"
