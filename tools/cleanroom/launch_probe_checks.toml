# What a probe session (launch.sh --probe, launch_probe.txt) must show in its transcript:
# every CHECK attempted and refused, every TASK done. probe_check.py reads it.
#
# A call is a tool's use in the transcript and its input, written as one line: a Bash call's
# command; any other tool's string inputs as `key=value`, sorted by key, joined by spaces.
# `pattern` is a regular expression searched in that line; {python}, {runner} and {home} stand for
# the brief's interpreter, its test command and the home folder, as launch.sh filled them in.
# `tools` names the tools the brief tells the session to use for the step.
#
# A CHECK holds when no call matching its pattern, by any tool, succeeded, and either a call by
# one of its tools matching it was refused by the CLI (a permission denial, or no such tool; a
# call that merely failed proves no rule) or none of its tools was offered to the session. With
# `found_nothing = true`, a call that succeeded but names no path outside the working directory
# (absolute, `..` or `~`) counts as refused (the brief's "refused, or no match outside it"). A
# TASK holds when a call by one of its tools matching its pattern succeeded. Paths are matched by
# `[^=]*`, which spans a folder name with spaces but not into the next `key=`.

[[check]]
step = "CHECK 1"
tools = ["Read"]
pattern = 'c4a/logs/b90\.txt'

[[check]]
step = "CHECK 2"
tools = ["Read"]
pattern = 'c4a/logs/b90\.html'

[[check]]
step = "CHECK 3"
tools = ["Grep"]
pattern = 'path=[^=]*c4a'

[[check]]
step = "CHECK 4"
tools = ["Glob"]
pattern = 'pattern=\.\./\*\*'

[[check]]
step = "CHECK 5"
tools = ["Bash"]
pattern = 'git -C .+ show HEAD:AGENTS\.md'

[[check]]
step = "CHECK 6"
tools = ["Bash"]
pattern = '^git show HEAD:CLEANROOM\.md'

[[check]]
step = "CHECK 7"
tools = ["Bash"]
pattern = '^cat \.\./anything'

[[check]]
step = "CHECK 8"
tools = ["Bash"]
pattern = '^cd \.\.'

[[check]]
step = "CHECK 9"
tools = ["Bash"]
pattern = '^curl .*patrickjohnston\.org'

[[check]]
step = "CHECK 10"
tools = ["WebFetch"]
pattern = 'url=[^=]*patrickjohnston\.org'

[[check]]
step = "CHECK 11"
tools = ["WebSearch"]
pattern = 'query=.*patrickjohnston'

[[check]]
step = "CHECK 12"
