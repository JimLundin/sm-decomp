pattern = '^"?{python}"? -c'

[[check]]
step = "CHECK 20"
tools = ["Bash"]
pattern = '^{runner} --help'

[[check]]
step = "CHECK 21"
tools = ["Bash"]
pattern = '^"?{python}"? -I other\.py'

[[check]]
step = "CHECK 22"
