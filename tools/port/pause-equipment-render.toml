# Bounded pause equipment renderer fixtures, original bank-82 ROM assets.
# Every pair compares all 128 KiB WRAM and raw return; no masks or C stubs.
# Direct DrawPauseScreenSpriteAnim uses the separate exact-three-argument gate;
# selector cases below also execute its real C implementation as a dependency.
family = "pause-equipment-render"
bank = "sm_82.c"
c_support = ["sm_81.c", "sm_rtl.c"]
rust_module = "crates/port/src/pause_equipment_render.rs"
domain = "Original ROM; bounded menu sprites with OAM cursor 0..511; used pause selector frames 0..13; all four category rows; reserve capacities/amounts 0..500 with amount <= capacity; rounding/flicker; equipped-items wireframe bits; seven-byte queue within 0xD0..0x330. All-WRAM/raw-return comparison. Live replay remains pending."

[rom]
file = "/home/jim/sm-decomp/rom/sm.sfc"
sha256 = "12b77c4bc9c1832cee8881244659065ee1d84c70c3d29e6eaf92e6798cc2ca72"

[[routines]]
symbol = "DrawMenuSpritemap"
args = 2
return = "void"
arg_types = ["uint32", "uint32"]
packed_u16_args = 4
live_eligible = false
live_limitation = "Offline full-WRAM/raw-return fixtures; live pause scheduling and hardware acceptance remain pending."

