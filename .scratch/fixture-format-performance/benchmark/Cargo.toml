[package]
name = "fixture-format-study"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "production-migrate"
path = "src/production_migrate.rs"

[[bin]]
name = "apply-corpus"
path = "src/apply_corpus.rs"

[[bin]]
name = "final-audit"
path = "src/final_audit.rs"

[[bin]]
name = "retain-fixture-evidence"
path = "src/retain.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.23"
sha2 = "=0.10.9"
libc = "0.2"
zstd = { version = "=0.13.3", default-features = false }

[profile.release]
debug = false
codegen-units = 1

