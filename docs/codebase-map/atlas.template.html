function scopeDetails(fs,g){const ids=fs.map(f=>f.id),incoming=allEdges().filter(e=>ids.includes(e.target)&&!ids.includes(e.source)),outgoing=allEdges().filter(e=>ids.includes(e.source)&&!ids.includes(e.target));$('details').innerHTML=`<span class="badge">${g?'Game responsibility':'Folder'}</span><h2>${esc(g?.title||state.id.split('/').pop())}</h2><div class="path">${esc(g?.description||state.id)}</div><div class="stats"><div><b>${fs.length}</b><small>files</small></div><div><b>${new Set(incoming.map(e=>e.source)).size}</b><small>external users</small></div><div><b>${new Set(outgoing.map(e=>e.target)).size}</b><small>dependencies</small></div></div><p>Open a file to see exact reference directions and source evidence. Folder tiles describe containment, not dependencies.</p>${state.tensions?tensionCards(relatedTensions(ids)):''}${limitation()}`}
function fileDetails(f,inc,out){$('details').innerHTML=`<span class="badge">${f.production?statusNames[f.status]+' / ':''}${esc(groups.get(f.group).title)}</span><h2>${esc(fileLabel(f))}</h2><div class="path">${esc(f.path)}</div>${f.summary?`<p class="lead">${esc(f.summary)}</p>`:''}<a href="${github(f.path)}" target="_blank" rel="noopener" data-testid="source-link">Open source at ${DATA.commit.slice(0,8)} ↗</a><div class="stats"><div><b>${f.lines??'—'}</b><small>lines</small></div><div><b>${inc.length}</b><small>incoming files</small></div><div><b>${out.length}</b><small>outgoing files</small></div></div><div class="section-title">Observed in this file</div>${f.markers.map(m=>`<a class="pill ${m.kind==='unsafe'||m.kind==='WRAM'?'attention':''}" href="${github(f.path,m.line)}" target="_blank" rel="noopener">${esc(m.kind)} · ${m.count}</a>`).join('')||'<p>No tracked markers. This is not a safety assessment.</p>'}${state.tensions?tensionCards(relatedTensions([f.id])):''}${limitation()}`}
function edgeDetails(key){const [source,target,kind]=key.split('|'),e=DATA.edges.find(e=>e.source===source&&e.target===target&&e.kind===kind);if(!e){const es=allEdges().filter(x=>files.get(x.source)?.group===source&&files.get(x.target)?.group===target&&x.kind===kind);$('details').innerHTML=`<span class="badge">Cross-region ${esc(kind)} links</span><h2>${esc(groups.get(source)?.title)} &rarr; ${esc(groups.get(target)?.title)}</h2><p>${es.length} extracted file relationships. Select a file to explore it, or a line to inspect the source.</p>${es.map(x=>`<div class="tension-card"><button data-file="${esc(x.source)}">${esc(x.source)}</button><p>&rarr; ${esc(x.target)}</p><a href="${github(x.source,x.line)}" target="_blank" rel="noopener">Source line ${x.line} &#8599;</a></div>`).join('')}${limitation()}`;addDrawerClose();$('layout').classList.add('show-detail');return}$('details').innerHTML=`<span class="badge">${kind==='module'?'Module declaration':'Source reference'}</span><h2>Why these files are connected</h2><div class="section-title">From</div><button class="neighbor" data-file="${esc(source)}">${esc(source)}</button><div class="section-title">To</div><button class="neighbor" data-file="${esc(target)}">${esc(target)}</button><p>${kind==='module'?'The source declares a module resolved to this file.':'A qualified Rust source path resolves to the target module. This can be an import, type or function reference; it is not necessarily a runtime call.'}</p><a href="${github(source,e.line)}" target="_blank" rel="noopener">Inspect the first source occurrence · line ${e.line} ↗</a>${limitation()}`;addDrawerClose();$('layout').classList.add('show-detail')}
function render(){if((state.type==='group'&&!groups.has(state.id))||(state.type==='responsibility'&&!responsibilities.has(state.id))){state.type='overview';state.id=''}const overviewMode=state.type==='overview';$('layout').classList.toggle('overview-mode',overviewMode);document.querySelector('.graph-wrap').hidden=overviewMode;document.querySelector('.legend').hidden=overviewMode;$('details-toggle').hidden=overviewMode;$('edge-kind').parentElement.hidden=overviewMode;$('tensions').parentElement.hidden=overviewMode;breadcrumbs();$('view-badge').textContent=state.type==='file'?'Source neighborhood':state.type==='scope'?'Repository folder':'Current codebase';$('direction-label').hidden=state.type!=='file';if(state.type==='overview')overview();else if(state.type==='file')fileView();else scope();document.querySelectorAll('.tree .current').forEach(e=>e.classList.remove('current'));document.querySelectorAll('.tree [data-file]').forEach(e=>{if(e.dataset.file===state.id)e.classList.add('current')});addDrawerClose();$('main').scrollTop=0}
function searchMatches(query){const q=query.trim().toLowerCase();if(!q)return [];const aliases=Object.entries(DATA.aliases).filter(([term])=>term.includes(q)||q.includes(term)).flatMap(([,paths])=>paths);return visibleFiles().map(f=>{let score=f.name.toLowerCase()===q?8:f.path.toLowerCase().includes(q)?2:0;aliases.forEach((path,i)=>{if(f.path===path)score=Math.max(score,20-i);else if(path.endsWith('/')&&f.path.startsWith(path))score=Math.max(score,3)});return {f,score}}).filter(r=>r.score).sort((a,b)=>b.score-a.score||a.f.path.localeCompare(b.f.path)).map(r=>r.f)}
function search(){const q=$('search').value.trim(),matches=searchMatches(q);$('navigation').hidden=!!q;$('search-results').innerHTML=q?`<div class="nav-title">Matches <span>${matches.length}</span></div>`+matches.slice(0,100).map(f=>`<button class="search-result" data-file="${esc(f.id)}" data-testid="search-result"><strong>${esc(fileLabel(f))}</strong><small>${esc(f.path)}</small></button>`).join(''):''}

document.addEventListener('click',e=>{if(e.target.closest('[data-about]')){showAbout();return}if(e.target.closest('[data-close-about]')){$('map-about').close();return}const close=e.target.closest('[data-close]');if(close){$('layout').classList.remove(close.dataset.close);return}const file=e.target.closest('[data-file]'),scope=e.target.closest('[data-scope]'),home=e.target.closest('[data-home]'),node=e.target.closest('[data-type]'),edge=e.target.closest('[data-edge]');if(file)navigate('file',file.dataset.file);else if(scope){if(scope.tagName!=='SUMMARY')e.preventDefault();navigate('scope',scope.dataset.scope)}else if(home)navigate('overview');else if(node)navigate(node.dataset.type,node.dataset.id);else if(edge)edgeDetails(edge.dataset.edge)});
$('graph').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-type],[data-edge]');if(n){e.preventDefault();n.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}});
$('search').addEventListener('input',search);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=searchMatches($('search').value)[0];if(f){e.preventDefault();navigate('file',f.id)}}});$('show-extras').onchange=e=>{state.extras=e.target.checked;tree();search();if(state.type==='file'&&!visible(files.get(state.id)))navigate('overview');else render();updateHash()};$('reset').onclick=()=>navigate('overview');$('edge-kind').onchange=e=>{state.kind=e.target.value;render();updateHash()};$('direction').onchange=e=>{state.direction=e.target.value;render();updateHash()};$('tensions').onchange=e=>{state.tensions=e.target.checked;render();updateHash()};$('tree-toggle').onclick=()=>$('layout').classList.toggle('show-tree');$('details-toggle').onclick=()=>$('layout').classList.toggle('show-detail');
function zoom(factor){const [x,y,w,h]=viewbox,nw=w*factor,nh=h*factor;viewbox=[x+(w-nw)/2,y+(h-nh)/2,nw,nh];$('graph').setAttribute('viewBox',viewbox.join(' '))}$('zoom-in').onclick=()=>zoom(.8);$('zoom-out').onclick=()=>zoom(1.25);$('zoom-fit').onclick=()=>{viewbox=[...initialBox];$('graph').setAttribute('viewBox',viewbox.join(' '))};let drag=null;$('graph').addEventListener('pointerdown',e=>{if(window.innerWidth<700||e.target.closest('[data-type],[data-edge]'))return;drag={x:e.clientX,y:e.clientY,box:[...viewbox]};$('graph').setPointerCapture(e.pointerId)});$('graph').addEventListener('pointermove',e=>{if(!drag)return;const r=$('graph').getBoundingClientRect();viewbox=[drag.box[0]-(e.clientX-drag.x)*drag.box[2]/r.width,drag.box[1]-(e.clientY-drag.y)*drag.box[3]/r.height,drag.box[2],drag.box[3]];$('graph').setAttribute('viewBox',viewbox.join(' '))});$('graph').addEventListener('pointerup',()=>drag=null);$('graph').addEventListener('pointercancel',()=>drag=null);$('graph').addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoom(e.deltaY>0?1.1:.9)}},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='/'&&e.target.tagName!=='INPUT'){e.preventDefault();$('layout').classList.add('show-tree');$('search').focus()}if(e.key==='Escape')$('layout').classList.remove('show-tree','show-detail')});
$('snapshot').innerHTML=`Current source<br><a href="https://github.com/JimLundin/sm-decomp/tree/${DATA.commit}" target="_blank" rel="noopener">${DATA.commit.slice(0,8)} ↗</a> · offline snapshot`;$('file-count').textContent=visibleFiles().length+' game files';const hash=new URLSearchParams(location.hash.slice(1));if(['file','scope','group','responsibility'].includes(hash.get('view'))){state.type=hash.get('view');state.id=hash.get('id')||''}if(['all','reference','module'].includes(hash.get('links')))state.kind=hash.get('links');if(['both','incoming','outgoing'].includes(hash.get('direction')))state.direction=hash.get('direction');state.tensions=hash.get('tensions')!=='0';state.extras=hash.get('extras')==='1'||(state.type==='file'&&!files.get(state.id)?.gameplay);$('show-extras').checked=state.extras;tree();$('edge-kind').value=state.kind;$('direction').value=state.direction;$('tensions').checked=state.tensions;render();
let wasCompact=window.innerWidth<700;window.addEventListener('resize',()=>{const compact=window.innerWidth<700;if(compact!==wasCompact){wasCompact=compact;$('layout').classList.remove('show-tree','show-detail');render()}});window.atlas={navigate,back,getState:()=>({...state}),data:DATA,render,searchMatches,partition};
</script></body></html>
