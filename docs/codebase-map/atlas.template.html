function guides(){return `<section class="guided"><div class="section-title">Good places to start</div><div class="guide-grid">${startingPoints.map((g,i)=>`<button class="guide" data-file="${g[2]}"><span class="number">0${i+1}</span><span><strong>${g[0]}</strong><small>${g[1]}</small></span></button>`).join('')}</div></section>`}
function scopedFiles(){return DATA.files.filter(f=>state.type==='group'?f.group===state.id:f.path.startsWith(state.id+'/'))}
function scope(){const compact=window.innerWidth<700,limit=compact?8:24;const fs=scopedFiles(),group=state.type==='group'?groups.get(state.id):null;let prefix=state.id+'/';if(group){const paths=fs.map(f=>f.path.split('/'));let common=paths[0]?.slice(0,-1)||[];while(common.length&&!paths.every(p=>common.every((v,i)=>p[i]===v)))common.pop();prefix=common.length?common.join('/')+'/':''}const buckets=new Map();for(const f of fs){const rest=f.path.slice(prefix.length),first=rest.split('/')[0],isFolder=rest.includes('/'),key=isFolder?prefix+first:f.id;if(!buckets.has(key))buckets.set(key,{id:key,type:isFolder?'scope':'file',files:[]});buckets.get(key).files.push(f)}const entries=[...buckets.values()].sort((a,b)=>(a.type===b.type?0:a.type==='scope'?-1:1)||a.id.localeCompare(b.id)),shown=entries.slice(0,limit);let h='';for(let i=0;i<shown.length;i++){const n=shown[i],f=n.files[0],x=compact?20:35+(i%3)*320,y=50+(compact?i:Math.floor(i/3))*105;h+=svgNode(n.id,x,y,292,85,n.id.split('/').pop(),n.type==='scope'?n.files.length+' files · open folder':(f.summary||f.path),n.type==='file'?f.ext.slice(1).toUpperCase()+' · '+(f.lines??'—')+' lines':'Folder',colors[f.group],false,hasTension(n.files.map(f=>f.id)),n.type)}setGraph(h,Math.max(240,(compact?shown.length:Math.ceil(shown.length/3))*105+75),compact?332:1000);$('graph-caption').textContent='Containment view · select a file to trace references';$('view-title').textContent=group?.title||state.id.split('/').pop();$('view-subtitle').textContent=group?.description||state.id;$('status').textContent=fs.length+' tracked files';$('extra').innerHTML=`<section class="inventory"><div class="section-title">${entries.length>limit?'All children · '+entries.length:'Files in this region · '+fs.length}</div><div class="file-list">${(entries.length>limit?entries.map(n=>({id:n.id,name:n.id.split('/').pop(),type:n.type,path:n.id,ext:n.type==='scope'?'dir':n.files[0].ext,lines:n.type==='scope'?n.files.length:n.files[0].lines})):fs).map(fileRow).join('')}</div></section>`;scopeDetails(fs,group)}
function fileRow(f){return `<button class="file-row" ${f.type==='scope'?'data-scope':'data-file'}="${esc(f.id)}"><span class="kind">${esc((f.ext||'').replace('.','').slice(0,5))}</span><span class="filename">${esc(f.name)}<small>${esc(f.path)}</small></span><span class="stat">${f.lines??'—'} ${f.type==='scope'?'files':'lines'}</span></button>`}
function fileView(){const f=files.get(state.id);if(!f){navigate('overview');return}const {inc,out}=neighbors(f.id),left=state.direction==='outgoing'?[]:inc.slice(0,10),right=state.direction==='incoming'?[]:out.slice(0,10),height=Math.max(390,Math.max(left.length,right.length)*79+90),cy=height/2-55;let h='<text class="direction-tag" x="35" y="35">REFERENCED BY</text><text class="direction-tag" x="745" y="35">REFERENCES</text>';for(let i=0;i<left.length;i++){const e=left[i],n=files.get(e.source),y=55+i*79;h+=edgePath(e,295,y+32,390,cy+52);h+=svgNode(n.id,25,y,270,65,n.name,n.path,'',colors[n.group],false,hasTension([n.id]))}for(let i=0;i<right.length;i++){const e=right[i],n=files.get(e.target),y=55+i*79;h+=edgePath(e,680,cy+52,770,y+32);h+=svgNode(n.id,770,y,270,65,n.name,n.path,'',colors[n.group],false,hasTension([n.id]))}h+=svgNode(f.id,390,cy,290,106,f.name,groups.get(f.group).title,(f.lines??'—')+' lines · '+f.ext.slice(1).toUpperCase(),colors[f.group],true,hasTension([f.id]));if(!left.length)h+=`<text fill="#526d79" font-size="12" x="35" y="85">${state.direction==='outgoing'?'Incoming links hidden':'No incoming links extracted'}</text>`;if(!right.length)h+=`<text fill="#526d79" font-size="12" x="770" y="85">${state.direction==='incoming'?'Outgoing links hidden':'No outgoing links extracted'}</text>`;if(window.innerWidth<700)mobileFileGraph(f,inc,out);else setGraph(h,height,1070);$('graph-caption').textContent='One-hop neighborhood · select a neighbor to follow it';$('view-title').textContent=f.name;$('view-subtitle').textContent=f.path;$('status').textContent=inc.length+' in · '+out.length+' out';$('extra').innerHTML=`<section class="inventory"><div class="section-title">${inc.length>(window.innerWidth<700?3:10)||out.length>(window.innerWidth<700?3:10)?'First '+(window.innerWidth<700?3:10)+' neighbors per side shown above. All resolved neighbors below.':'Resolved neighbors'}</div><div class="guide-grid"><div><div class="section-title">Referenced by · ${inc.length}</div><div class="file-list">${inc.map(e=>fileRow(files.get(e.source))).join('')||'<div class="empty">No extracted links</div>'}</div></div><div><div class="section-title">References · ${out.length}</div><div class="file-list">${out.map(e=>fileRow(files.get(e.target))).join('')||'<div class="empty">No extracted links</div>'}</div></div></div></section>`;fileDetails(f,inc,out)}
function mobileSideEdge(e,x1,y1,x2,y2,lane){return `<path class="edge" d="M ${x1} ${y1} C ${lane} ${y1}, ${lane} ${y2}, ${x2} ${y2}" ${e.kind==='module'?'stroke-dasharray="5 4"':''} marker-end="url(#arrow)" data-edge="${esc(e.source+'|'+e.target+'|'+e.kind)}" tabindex="0" role="button" aria-label="${esc(e.kind)} from ${esc(e.source)} to ${esc(e.target)}"><title>${esc(e.source)} &rarr; ${esc(e.target)}</title></path>`}
function mobileFileGraph(f,inc,out){const up=state.direction==='outgoing'?[]:inc.slice(0,3),down=state.direction==='incoming'?[]:out.slice(0,3),selectedY=65+up.length*83,downStart=selectedY+160;let edges='',nodes='<text class="direction-tag" x="35" y="32">REFERENCED BY'+(inc.length>3?' / FIRST 3':'')+'</text>';for(let i=0;i<up.length;i++){const e=up[i],n=files.get(e.source),y=50+i*83;edges+=mobileSideEdge(e,33,y+32,28,selectedY+31+i*17,8+i*5);nodes+=svgNode(n.id,35,y,280,65,n.name,n.path,'',colors[n.group],false,hasTension([n.id]))}nodes+=svgNode(f.id,35,selectedY,280,106,f.name,'Selected file',(f.lines??'-')+' lines',colors[f.group],true,hasTension([f.id]));nodes+=`<text class="direction-tag" x="35" y="${downStart-15}">REFERENCES${out.length>3?' / FIRST 3':''}</text>`;for(let i=0;i<down.length;i++){const e=down[i],n=files.get(e.target),y=downStart+i*83;edges+=mobileSideEdge(e,317,selectedY+31+i*17,322,y+32,342-i*5);nodes+=svgNode(n.id,35,y,280,65,n.name,n.path,'',colors[n.group],false,hasTension([n.id]))}if(!up.length)nodes+='<text x="35" y="53" font-size="11" fill="#526873">'+(state.direction==='outgoing'?'Incoming links hidden':'No incoming links extracted')+'</text>';if(!down.length)nodes+=`<text x="35" y="${downStart+12}" font-size="11" fill="#526873">${state.direction==='incoming'?'Outgoing links hidden':'No outgoing links extracted'}</text>`;setGraph(edges+nodes,downStart+Math.max(1,down.length)*83+30,350)}
function addDrawerClose(){if(!$('details').querySelector('[data-close]'))$('details').insertAdjacentHTML('afterbegin','<button class="drawer-close" data-close="show-detail" aria-label="Close details">Close</button>')}
function tensionCards(ts){return ts.map(t=>`<div class="tension-card"><button data-file="${esc(t.files[0])}">${esc(t.title)}</button><p>${esc(t.description)}</p>${t.evidence.map(e=>`<a href="${github(e.path,e.line)}" target="_blank" rel="noopener">${esc(e.path.split('/').pop())}:${e.line}</a>`).join(' · ')}</div>`).join('')}
function limitation(){return '<div class="notice"><b>What the links mean</b><br>Resolved lexical Rust paths and module declarations, primarily in the library and application. Trait dispatch, macros, runtime callbacks, detached-crate paths and non-Rust dependencies are incomplete. No extracted link does not mean independence. Markers are source observations, not safety or completion scores.</div>'}
function overviewDetails(){$('details').innerHTML=`<span class="badge">You are here</span><h2>The current implementation</h2><p class="lead">One Cargo package, with gameplay, compatibility state, an emulated backend and verification still connected.</p><div class="stats"><div><b>${DATA.files.length}</b><small>tracked files</small></div><div><b>${DATA.files.filter(f=>f.ext==='.rs').length}</b><small>Rust files</small></div><div><b>1</b><small>workspace package</small></div></div><div class="section-title">Where the tension is</div>${state.tensions?tensionCards(DATA.tensions):'<p>Tension overlay is hidden.</p>'}<div class="notice"><b>Destination ≠ current structure</b><br>The owned game/data/runtime/app/tools architecture and Map Rando integration are targets. This view does not claim those packages already exist.<p><a href="${github('docs/target-architecture/README.md')}" target="_blank" rel="noopener">Read the target architecture ↗</a></p></div>${limitation()}`}
function scopeDetails(fs,g){const ids=fs.map(f=>f.id),incoming=allEdges().filter(e=>ids.includes(e.target)&&!ids.includes(e.source)),outgoing=allEdges().filter(e=>ids.includes(e.source)&&!ids.includes(e.target));$('details').innerHTML=`<span class="badge">${g?'Responsibility view - 10 strongest cross-region links':'Folder'}</span><h2>${esc(g?.title||state.id.split('/').pop())}</h2><div class="path">${esc(g?.description||state.id)}</div><div class="stats"><div><b>${fs.length}</b><small>files</small></div><div><b>${new Set(incoming.map(e=>e.source)).size}</b><small>external users</small></div><div><b>${new Set(outgoing.map(e=>e.target)).size}</b><small>dependencies</small></div></div><p>Open a file to see exact reference directions and source evidence. Folder tiles describe containment, not dependencies.</p>${state.tensions?tensionCards(relatedTensions(ids)):''}${limitation()}`}
function fileDetails(f,inc,out){$('details').innerHTML=`<span class="badge">${esc(groups.get(f.group).title)}</span><h2>${esc(f.name)}</h2><div class="path">${esc(f.path)}</div>${f.summary?`<p class="lead">${esc(f.summary)}</p>`:''}<a href="${github(f.path)}" target="_blank" rel="noopener" data-testid="source-link">Open source at ${DATA.commit.slice(0,8)} ↗</a><div class="stats"><div><b>${f.lines??'—'}</b><small>lines</small></div><div><b>${inc.length}</b><small>incoming files</small></div><div><b>${out.length}</b><small>outgoing files</small></div></div><div class="section-title">Observed in this file</div>${f.markers.map(m=>`<a class="pill ${m.kind==='unsafe'||m.kind==='WRAM'?'attention':''}" href="${github(f.path,m.line)}" target="_blank" rel="noopener">${esc(m.kind)} · ${m.count}</a>`).join('')||'<p>No tracked markers. This is not a safety assessment.</p>'}${state.tensions?tensionCards(relatedTensions([f.id])):''}${limitation()}`}
function edgeDetails(key){const [source,target,kind]=key.split('|'),e=DATA.edges.find(e=>e.source===source&&e.target===target&&e.kind===kind);if(!e){const es=allEdges().filter(x=>files.get(x.source)?.group===source&&files.get(x.target)?.group===target&&x.kind===kind);$('details').innerHTML=`<span class="badge">Cross-region ${esc(kind)} links</span><h2>${esc(groups.get(source)?.title)} &rarr; ${esc(groups.get(target)?.title)}</h2><p>${es.length} extracted file relationships. Select a file to explore it, or a line to inspect the source.</p>${es.map(x=>`<div class="tension-card"><button data-file="${esc(x.source)}">${esc(x.source)}</button><p>&rarr; ${esc(x.target)}</p><a href="${github(x.source,x.line)}" target="_blank" rel="noopener">Source line ${x.line} &#8599;</a></div>`).join('')}${limitation()}`;addDrawerClose();$('layout').classList.add('show-detail');return}$('details').innerHTML=`<span class="badge">${kind==='module'?'Module declaration':'Source reference'}</span><h2>Why these files are connected</h2><div class="section-title">From</div><button class="neighbor" data-file="${esc(source)}">${esc(source)}</button><div class="section-title">To</div><button class="neighbor" data-file="${esc(target)}">${esc(target)}</button><p>${kind==='module'?'The source declares a module resolved to this file.':'A qualified Rust source path resolves to the target module. This can be an import, type or function reference; it is not necessarily a runtime call.'}</p><a href="${github(source,e.line)}" target="_blank" rel="noopener">Inspect the first source occurrence · line ${e.line} ↗</a>${limitation()}`;addDrawerClose();$('layout').classList.add('show-detail')}
function render(){if(state.type==='group'&&!groups.has(state.id)){state.type='overview';state.id=''}breadcrumbs();$('view-badge').textContent=state.type==='file'?'Source neighborhood':state.type==='scope'?'Repository folder':'Current codebase';$('direction-label').hidden=state.type!=='file';if(state.type==='overview')overview();else if(state.type==='file')fileView();else scope();document.querySelectorAll('.tree .current').forEach(e=>e.classList.remove('current'));document.querySelectorAll('.tree [data-file]').forEach(e=>{if(e.dataset.file===state.id)e.classList.add('current')});addDrawerClose();$('main').scrollTop=0}
function search(){const q=$('search').value.trim().toLowerCase(),matches=DATA.files.filter(f=>f.path.toLowerCase().includes(q));$('navigation').hidden=!!q;$('search-results').innerHTML=q?`<div class="nav-title">Matches <span>${matches.length}</span></div>`+matches.slice(0,100).map(f=>`<button class="search-result" data-file="${esc(f.id)}" data-testid="search-result"><strong>${esc(f.name)}</strong><small>${esc(f.path)}</small></button>`).join(''):''}
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){$('layout').classList.remove(close.dataset.close);return}const file=e.target.closest('[data-file]'),scope=e.target.closest('[data-scope]'),home=e.target.closest('[data-home]'),node=e.target.closest('[data-type]'),edge=e.target.closest('[data-edge]');if(file)navigate('file',file.dataset.file);else if(scope){e.preventDefault();navigate('scope',scope.dataset.scope)}else if(home)navigate('overview');else if(node)navigate(node.dataset.type,node.dataset.id);else if(edge)edgeDetails(edge.dataset.edge)});
$('graph').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-type],[data-edge]');if(n){e.preventDefault();n.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}});
$('search').addEventListener('input',search);$('reset').onclick=()=>navigate('overview');$('edge-kind').onchange=e=>{state.kind=e.target.value;render();updateHash()};$('direction').onchange=e=>{state.direction=e.target.value;render();updateHash()};$('tensions').onchange=e=>{state.tensions=e.target.checked;render();updateHash()};$('tree-toggle').onclick=()=>$('layout').classList.toggle('show-tree');$('details-toggle').onclick=()=>$('layout').classList.toggle('show-detail');
function zoom(factor){const [x,y,w,h]=viewbox,nw=w*factor,nh=h*factor;viewbox=[x+(w-nw)/2,y+(h-nh)/2,nw,nh];$('graph').setAttribute('viewBox',viewbox.join(' '))}$('zoom-in').onclick=()=>zoom(.8);$('zoom-out').onclick=()=>zoom(1.25);$('zoom-fit').onclick=()=>{viewbox=[...initialBox];$('graph').setAttribute('viewBox',viewbox.join(' '))};let drag=null;$('graph').addEventListener('pointerdown',e=>{if(e.target.closest('[data-type],[data-edge]'))return;drag={x:e.clientX,y:e.clientY,box:[...viewbox]};$('graph').setPointerCapture(e.pointerId)});$('graph').addEventListener('pointermove',e=>{if(!drag)return;const r=$('graph').getBoundingClientRect();viewbox=[drag.box[0]-(e.clientX-drag.x)*drag.box[2]/r.width,drag.box[1]-(e.clientY-drag.y)*drag.box[3]/r.height,drag.box[2],drag.box[3]];$('graph').setAttribute('viewBox',viewbox.join(' '))});$('graph').addEventListener('pointerup',()=>drag=null);$('graph').addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoom(e.deltaY>0?1.1:.9)}},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='/'&&e.target.tagName!=='INPUT'){e.preventDefault();$('layout').classList.add('show-tree');$('search').focus()}if(e.key==='Escape')$('layout').classList.remove('show-tree','show-detail')});
$('snapshot').innerHTML=`Current source<br><a href="https://github.com/JimLundin/sm-decomp/tree/${DATA.commit}" target="_blank" rel="noopener">${DATA.commit.slice(0,8)} ↗</a> · offline snapshot`;$('file-count').textContent=DATA.files.length+' files';tree();const hash=new URLSearchParams(location.hash.slice(1));if(['file','scope','group'].includes(hash.get('view'))){state.type=hash.get('view');state.id=hash.get('id')||''}if(['all','reference','module'].includes(hash.get('links')))state.kind=hash.get('links');if(['both','incoming','outgoing'].includes(hash.get('direction')))state.direction=hash.get('direction');state.tensions=hash.get('tensions')!=='0';$('edge-kind').value=state.kind;$('direction').value=state.direction;$('tensions').checked=state.tensions;render();
let wasCompact=window.innerWidth<700;window.addEventListener('resize',()=>{const compact=window.innerWidth<700;if(compact!==wasCompact){wasCompact=compact;$('layout').classList.remove('show-tree','show-detail');render()}});window.atlas={navigate,back,getState:()=>({...state}),data:DATA,render};
</script></body></html>
