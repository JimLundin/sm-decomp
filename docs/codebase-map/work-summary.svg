<svg xmlns="http://www.w3.org/2000/svg" width="640" height="214" viewBox="0 0 640 214" role="img" aria-labelledby="title description">
<title id="title">Now, next, and the engine we are building</title>
<desc id="description">Now: extend the 9,266 aligned recorded steps after correcting door timing and expand the 24 of 44 adopted gameplay checks. Collision bank sm_94 is retired; normal input, scripted playback and attract setup share the player transition owner. Bank sm_91 has 685 lines left. Next are full-game checks and the complete suit sequence. These tracks lead to safe owned state and deletion of duplicate RAM code, then independent video and audio from boot to credits. Target: a Map Rando engine below 100,000 production lines, with custom sprites, reordered rooms and doors, and opt-in quality-of-life mechanics. Future boxes are goals, not completed work.</desc>
