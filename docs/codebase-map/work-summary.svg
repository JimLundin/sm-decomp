<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#17343e} .tag{font-size:18px;font-weight:650}.name{font-size:22px;font-weight:650}.note{font-size:20px}.small{font-size:18px}.now{fill:#e4f0e9;stroke:#428266}.done{fill:#bde8c7;stroke:#237343}.later{fill:#f3f6f7;stroke:#9aafb5}rect{stroke-width:1.5}path.link{fill:none;stroke:#59747b;stroke-width:1.5;marker-end:url(#arrow)}</style>
