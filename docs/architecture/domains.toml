# The headline milestone (MODEL §1 decision 14): the engine replays the any% movie from
# power-on to the frame of its seed any-opening:7, after the flight to Zebes and before the
# Landing Site loads (Jim, 2026-11-12), with nothing fed back. The plan items its stretch
# touches, each for what lsnes showed the stretch running (domains.md §4, with the frames);
# Ceres's own enemies and enemy projectiles are B8's.

[milestone]
name = "Power-on through Ceres"
movie = "any"
ends = "any-opening:7"
needs = [
    "S1", "S2", "S4", "S5", "CAM", "H1", "H2", "P1", "P2", "W1", "W2", "C1", "B8", "R1", "R3",
    "R4", "F2", "F4", "U1", "E1", "E2", "E3", "E4", "A1", "A2", "R2", "T1", "V2",
]

# The ladder toward the milestone (domains.md §4): shorter stretches of the same movie, each
# played alone from its first seed, so the README shows a number that can move before the whole
# stretch is reachable. Each rung's needs are a first estimate from domains.md §4's table; a
# session's planning corrects them from what the stretch's rows show.

