# The whole-game plan of domains.md (§3 the domains, §4 the waves) as data, for the status that
# `verify::report` writes into README.md. The root changes it in the commit that lands a round:
# the model's `rounds` by one, and a domain's `status` when its work starts or its queue empties.
#
# [[model]]: a clean-room model crate, `crates/clean_model/<name>`, with the rounds landed on
# main. Every model of `verify::report::DOMAINS` has one, and only those.
#
# [[domain]]: a clean-room domain of the plan. `rounds` is the plan's estimate of its rounds;
# `model` the model crate that holds it, once one does; `status` is "not-started" (the default),
# "in-progress" or "done", and a domain past "not-started" names its model.
#
# [[platform]]: platform work outside the clean room (hardware formats, assets, timing, tools),
# in lanes, not rounds.

[[model]]
name = "samus-motion"
rounds = 19

[[model]]
name = "camera"
rounds = 6

[[model]]
name = "progress"
rounds = 7

[[model]]
name = "hud"
rounds = 5

[[model]]
name = "blocks"
rounds = 4

[[model]]
name = "samus-looks"
rounds = 3

