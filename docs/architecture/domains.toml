# The whole-game plan of domains.md (§3 the domains, §4 the waves) as data, for the status that
# `verify::report` writes into README.md and its domain graph. The root changes it in the commit that lands a round:
# the model's `rounds` by one, and a domain's `status` when its work starts or its queue empties.
#
# [[model]]: a clean-room model crate, `crates/clean/<crate>` (its name with dashes as
# underscores), with the rounds landed on main. Every model of `verify::report::DOMAINS` has one,
# and only those.
#
# [[domain]]: a clean-room domain of the plan. `area` is the part of the game it belongs to:
# samus, weapons, world, enemy, boss, interface, run, screens or audio, and the first word of
# its model's name; `rounds` is the plan's estimate of its rounds; `model` the model crate that
# holds it, once one does; `status` is "not-started" (the default), "in-progress" or "done", and
# a domain past "not-started" names its model.
#
# A domain's `reads` are the ids of the domains whose exports it reads: the domain graph, which
# the report draws in docs/REPORT.md with an arrow from each exporter to its reader. Most are
# stated in domains.md §3 (its Reads / exports column, a scope that names the other domain's
# output, or the bosses' paragraph); a read the plan only implies, by a scope that needs the
# other domain's output or a Depends entry, has an `# Inferred:` comment above it saying why.
# Audio is one convention, not edges: any domain may send U1 a sound request, so none reads U1
# for one and U1 reads none for them; U1 reads R1 for the room's track. The report's tests hold
# the code to the graph: a clean crate, and its engine bridge `crates/game/src/<crate>_bridge`,
# uses only `types` and the clean crates of its own domains and of the domains they read.
#
# [[platform]]: platform work outside the clean room (hardware formats, assets, timing, tools),
# in lanes, not rounds.

