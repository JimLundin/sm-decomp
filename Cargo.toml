[workspace]
resolver = "3"
members = [
    # The old game and its compatibility crates, deleted as the new engine covers them.
    "sm", "crates/sm_app", "crates/sm_host", "crates/sm_data", "crates/sm_game", "crates/sm_runtime", "crates/sm_tools",
    # The rebuild (docs/architecture/ARCHITECTURE.md §4, crates/README.md).
    "crates/app", "crates/canonical", "crates/data", "crates/game", "crates/oracle", "crates/runtime", "crates/tools", "crates/verify",
]

# The new crates' lint set (PRINCIPLES K5, K7, K8), taken by each with `[lints] workspace = true`;
# the old crates keep their own tables. Sites are never silenced with `allow` or `expect`.
# Tests may unwrap, expect, panic and index through clippy.toml's `allow-*-in-tests`.
# `game` adds `float_arithmetic` in its crate root: the original has no floats.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
allow_attributes = "deny"

[profile.release]
debug = "line-tables-only"
# Reuse unchanged code during verification; retain the usual release partitioning.
incremental = true
codegen-units = 16
