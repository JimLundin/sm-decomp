[workspace]
resolver = "2"
members = [
    "crates/runtime",
    "crates/recomp",
    "crates/game",
    "crates/diff",
    "crates/fuzz",
    "crates/movie",
    "crates/trace",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
runtime = { path = "crates/runtime" }
recomp = { path = "crates/recomp" }
