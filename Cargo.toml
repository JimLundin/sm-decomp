[workspace]
resolver = "3"
members = [
    # The rebuild (docs/architecture/ARCHITECTURE.md §4, crates/README.md).
    "crates/app", "crates/canonical", "crates/canonical_derive", "crates/clean_model/camera", "crates/clean_model/samus-motion", "crates/clean_types", "crates/data", "crates/game", "crates/oracle", "crates/oracle_record", "crates/runtime", "crates/tools", "crates/verify",
]

# The new crates' lint set (PRINCIPLES K5, K7, K8), taken by each with `[lints] workspace = true`.
# Sites are never silenced with `allow` or `expect`.
# Tests may unwrap, expect, panic and index through clippy.toml's `allow-*-in-tests`.
# `game` adds `float_arithmetic` in its crate root: the original has no floats.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
unreachable = "deny"
# Off until a clippy.toml sets its threshold: the clean crates' (tools/cleanroom/clippy.toml, G5).
excessive_nesting = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
debug = "line-tables-only"
# Reuse unchanged code during verification; retain the usual release partitioning.
incremental = true
codegen-units = 16
