[workspace]
resolver = "3"
exclude = ["vendor"]
members = [
    # The rebuild (docs/architecture/ARCHITECTURE.md §4, crates/README.md).
    "crates/app", "crates/canonical", "crates/canonical_derive", "crates/clean_model/blocks", "crates/clean_model/camera", "crates/clean_model/hud", "crates/clean_model/progress", "crates/clean_model/samus-motion", "crates/clean_types", "crates/data", "crates/game", "crates/oracle", "crates/oracle_record", "crates/runtime", "crates/tools", "crates/verify",
]

# The new crates' lint set (PRINCIPLES K5, K7, K8), taken by each with `[lints] workspace = true`.
# Sites are never silenced with `allow` or `expect`.
# Tests may unwrap, expect, panic and index through clippy.toml's `allow-*-in-tests`.
# `game` adds `float_arithmetic` in its crate root: the original has no floats.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
unreachable = "deny"
# Off until a clippy.toml sets its threshold: the clean crates' (tools/cleanroom/clippy.toml, G5).
excessive_nesting = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The shipped game: `cargo build --release -p app`. One code generation unit and whole-program
# link-time optimisation, the slowest build and the fastest engine.
[profile.release]
lto = "fat"
codegen-units = 1

# The verifiers, their tests and the benchmarks: `--profile verify`, built into target/verify/.
# Rebuilt on nearly every change, so it reuses unchanged code (incremental) and keeps the usual
# partitioning; `lto = false` undoes what it would inherit from the shipped build.
[profile.verify]
inherits = "release"
debug = "line-tables-only"
incremental = true
codegen-units = 16
lto = false

# The registry crates whose build scripts the development machine can't run (Defender blocks a
# freshly built executable): each is its published copy with the script's output baked in, by
# tools/vendor_nobuild.sh; CI's tools/vendor_nobuild_check.sh holds it to the real script.
[patch.crates-io]
proc-macro2 = { path = "vendor/proc-macro2-1.0.107" }
quote = { path = "vendor/quote-1.0.47" }
serde = { path = "vendor/serde-1.0.229" }
serde_core = { path = "vendor/serde_core-1.0.229" }
